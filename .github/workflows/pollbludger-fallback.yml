# Poll Bludger fallback — the last-resort poll agent. BludgerTrack's poll-data
# feed (pollbludger.net/fed2028/bludgertrack/xml/current.xml) mirrors every
# federal poll; .build/extract-pollbludger.mjs files a wave from it, as a
# PROVISIONAL row in data/polls.json's fallbackPolls array, once the wave has
# sat in the feed and missing from polls[] for its grace period (18h) — so
# every house's own extractor gets its release window, follow-ups and next-
# day sweeps first, and a provisional row leaves the page the moment the
# house's real row lands (gen-data shadows it; the next run here prunes it).
#
# Four sweeps a day: the feed updates about daily (root date ~01:00 UTC),
# and a wave's grace expires at an arbitrary hour. Each no-op is a checkout
# and a 600KB fetch. No tune-schedules block: the cadence here is the
# feed's, not any house's.

name: pollbludger-fallback

on:
  schedule:
    - cron: '35 2,8,14,20 * * *' # 12:35 / 18:35 / 00:35 / 06:35 AEST (off Resolve's Sunday comb)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: pollbludger
      wrapper: .build/pollbludger-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
