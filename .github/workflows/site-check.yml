# Deployed-site watchdog — runs .build/check-site.mjs against
# auspoltracker.com (spec: .build/site-check-spec.md) and classifies:
#
#   class 0  deployed bytes == committed bytes, assets resolve → green
#   class 1  inconclusive (host unreachable or answering wrong while a
#             deploy may be in flight) → GREEN, once: a run of them that
#             lasts 12h goes red (.build/transient-streak.sh). This
#             watchdog crashed on every run for 19 days (6–25 Sep 2026) and
#             the crash read as inconclusive, so nobody knew it was blind.
#   class 2  defect (content mismatch after the grace window, a
#             referenced asset missing, a served file missing from the
#             commit, the checker's own crash, or — on the scheduled
#             backstop, where nothing is deploying — the site unreachable
#             or answering wrong) → the job fails (email)
#
# "Served" is the root four files plus every page the committed sitemap
# lists: the satellites share the main page's shell assets.
#
# Two triggers for two failures:
#   * workflow_run of "pages-build-deployment" — checks the commit the
#     deploy actually built (head_sha, NOT main, which may have moved on),
#     with a 5-minute grace window because Pages is asynchronous
#   * a daily backstop against main's head — TLS/DNS breakage, Pages
#     reverting, a stale object long after a green deploy

name: site-check

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  schedule:
    - cron: '0 23 * * *' # 09:00 AEST daily
  workflow_dispatch:

# a new push supersedes an in-flight check of the previous deploy
concurrency:
  group: site-check
  cancel-in-progress: true

# read-only: compares deployed bytes to committed bytes, touches nothing
permissions:
  contents: read
  actions: read # the inconclusive-streak check reads this workflow's earlier runs

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      # the comparison is only meaningful against the commit Pages built
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # a failed Pages run leaves the PREVIOUS deploy serving; there is
      # nothing valid to compare, and inconclusive is not an alarm
      - name: Note a failed Pages run and stop
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          {
            echo "### site-check — inconclusive"
            echo "Pages deployment of ${{ github.event.workflow_run.head_sha }} concluded '${{ github.event.workflow_run.conclusion }}'; nothing to compare."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run the site check
        if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
        id: check
        run: |
          set +e
          OUT="$(node .build/check-site.mjs 2>&1)"
          CODE=$?
          echo "$OUT"
          echo "verdict=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### site-check — class $CODE"
              echo '```'
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # only class 2 (defect) goes red here; class 1 is judged below
          [ "$CODE" -ne 2 ]

      # Its name is load-bearing: transient-streak.sh finds the earlier
      # inconclusive runs by this step having run green. Many deploys a day,
      # so it walks further back than the updaters' check does.
      - name: Note an inconclusive verdict
        if: steps.check.outputs.verdict == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          STREAK_KIND: inconclusive
          STREAK_RAN: '^Run the site check$'
          STREAK_MIN: '3'
          STREAK_HOURS: '12'
          STREAK_MAX_RUNS: '60'
        run: bash .build/transient-streak.sh
