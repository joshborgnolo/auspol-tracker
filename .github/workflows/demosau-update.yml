# DemosAU poll updater. Irregular ~monthly cadence; cheap daily sweep. The
# hourly cron exists for the Capital Brief gap: CB publishes the poll article
# hours-to-a-day before DemosAU posts the methodology PDF, so after an exit-3
# hand-entry the `pending` gate below lets the updater sweep hourly until the
# PDF lands and the row is reconciled. Outside that window the gate makes the
# hourly run a no-op (checkout + one local script — no fetches).

name: demosau-update

on:
  schedule:
    - cron: '5 21 * * *' # 07:05 AEST daily
    - cron: '18 * * * *' # hourly sweep, gated on a pending Capital Brief wave
    # Daily checks bracketing the hours DemosAU has recently filed at, generated
    # by .build/tune-schedules.mjs (the house keeps no weekday, so they run
    # every day; routine runs fetch only the index page).
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # DemosAU: no weekday (calendar-month rhythm); files 00:00–20:30 eastern (last 8 timed releases, newest 2026-09-17T08:30)
    - cron: '50 18 * * *' # daily 04:50 — release hours (no weekday habit)
    - cron: '30 22 * * *' # daily 08:30 — release hours (no weekday habit)
    - cron: '0 0 * * *'   # daily 10:00 — release hours (no weekday habit)
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  pending:
    # Cheap gate: exit 0 while a Capital Brief hand-entry awaits its DemosAU
    # PDF (recent DemosAU row with no methodUrl — clears at reconciliation).
    # No node setup needed: demosau-pending.mjs has no dependencies and
    # ubuntu-latest ships node.
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)
      - id: check
        run: |
          if node .build/demosau-pending.mjs; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: pending
    # Only the hourly sweep is gated on a pending wave; every other trigger
    # (the daily sweep, the tuned release-hour checks, a dispatch) runs.
    if: needs.pending.outputs.active == 'true' || github.event.schedule != '18 * * * *'
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: demosau
      wrapper: .build/demosau-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
