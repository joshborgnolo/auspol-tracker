# Ipsos Issues Monitor. Ipsos publishes no voting intention: its monthly
# report feeds only the Snapshot's issues panel. It goes up on no fixed
# weekday, in office hours (2026's first uploads: 11:43–16:34 Sydney, all
# weekdays). Until 2026-10-06 one evening cron line fetched it, which GitHub
# ran 4–9 hours late; now the dispatch clock combs the weekday hours every
# 20 minutes (the block below, from .build/tune-schedules.mjs, which also
# feeds .build/dispatch-clock/schedule.json). Each dispatched run first asks
# the Ipsos pages whether anything is new (poll-agent.yml's `probe`) and ends
# in seconds when nothing is. The hand-authored evening line after the block
# is the daily full run (no probe), and the weekly crosstabs run fetches
# Ipsos too, as the backstop and the alarm.

# schedule-tune: weekly only — its hours are declared, so a wave moves nothing.

name: ipsos-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+11 at generation.
    # Ipsos: no weekday habit; files 11:43–16:34 eastern (declared in tune-schedules TARGETS)
    - cron: '20,40 0 * * 1,2,3,4,5'   # Mon/Tue/Wed/Thu/Fri 11:20–11:40 — weekday release hours, every 20 min
    - cron: '0,20,40 1 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 12:00–12:40 — weekday release hours, every 20 min
    - cron: '0,20,40 2 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 13:00–13:40 — weekday release hours, every 20 min
    - cron: '0,20,40 3 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 14:00–14:40 — weekday release hours, every 20 min
    - cron: '0,20,40 4 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 15:00–15:40 — weekday release hours, every 20 min
    - cron: '0,20,40 5 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 16:00–16:40 — weekday release hours, every 20 min
    - cron: '0 6 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 17:00 — weekday release hours, every 20 min
    - cron: '0 7 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 18:00 — follow-up
    - cron: '0 8 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 19:00 — follow-up
    - cron: '30 11 * * 1,2,3,4,5'     # Mon/Tue/Wed/Thu/Fri 22:30 — late backstop
    # tune-schedules:end
    - cron: '10 10 * * *' # 20:10 AEST / 21:10 AEDT daily — the daily full run
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: ipsos
      wrapper: .build/ipsos-updater.sh
      probe: .build/extract-ipsos.mjs
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
