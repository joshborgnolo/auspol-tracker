# Ipsos Issues Monitor, daily. Ipsos publishes no voting intention: its
# monthly report feeds only the Snapshot's issues panel. It goes up on no
# fixed weekday, in the afternoon or early evening (the latest in 2025–26 at
# 19:08 Sydney), so one check each evening lands it the day it goes up. The
# wrapper (.build/ipsos-updater.sh) is a no-op in seconds when nothing is
# new. The weekly crosstabs run fetches Ipsos too, as the backstop and the
# alarm.
#
# No dispatch-clock slot: a run GitHub starts hours late, or drops, only
# moves the pickup to the next run, and nothing is lost.

name: ipsos-update

on:
  schedule:
    - cron: '10 10 * * *' # 20:10 AEST / 21:10 AEDT daily
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: ipsos
      wrapper: .build/ipsos-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
