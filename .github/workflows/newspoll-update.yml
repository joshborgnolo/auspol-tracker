# Newspoll updater. Newspoll publishes roughly every three weeks on Sunday
# evening AEST (canonical rows show published ~20:00 Sun), but the extractor
# reads FREE SECONDARY COVERAGE, which lags the release by hours to days — the
# 2026-08-28 wave sat as a candidate for four days. So the cadence is a Sunday
# evening sweep plus weekday mornings, not a dense burst at the embargo.
#
# Chrome-dependent rungs are intentionally absent here: the wrapper leaves
# NEWSIE_CHROME unset (as it already did under launchd), so this is a lift with
# no behaviour change. Rung B enrichment and the topic-page discovery rung stay
# a local, manual pass. `newspoll-watch.yml` separately detects a published wave
# from the anonymous Infogram slug and is the early warning this job can't be.
#
# The local launchd job stays installed as a backup — newspoll-updater.sh now
# fast-forwards to origin/main and skips its slot if main moved underneath it.
#
# The cron block between the tune-schedules markers is generated by
# .build/tune-schedules.mjs from Newspoll's recorded release times — sparse
# mode, for the reason above.

name: newspoll-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Newspoll: Sun habit (11/12 recent dated releases); files 20:00–21:00 eastern (last 8 timed releases, newest 2026-09-20T21:00)
    - cron: '10 20 * * *' # daily 06:10 — daily sweep
    - cron: '52 9 * * 0'  # Sun 19:52 — release window (sparse: the extractor lags the release)
    - cron: '32 12 * * 0' # Sun 22:32 — release window (sparse: the extractor lags the release)
    - cron: '12 20 * * 0' # Mon 06:12 — next-day
    - cron: '2 9 * * 1'   # Mon 19:02 — next-day
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: newspoll
      wrapper: .build/newspoll-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
