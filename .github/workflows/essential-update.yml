# Essential Report updater. Essential files Wednesdays around 01:00 AEST
# (Tuesday 15:00 UTC), so Tuesday evenings get two extra checks on top of the
# daily sweep.

name: essential-update

on:
  schedule:
    - cron: '10 21 * * *' # 07:10 AEST daily catch-up
    - cron: '5 15 * * 2'  # Wed 01:05 AEST release window
    - cron: '5 16 * * 2'  # Wed 02:05 AEST release window follow-up
    # 05:02 AEST daily skip-confirm sweep: a passed slot with no new report at
    # the publisher gets verified-absent and rolled in pollsterRules. (Under
    # AEDT this fires at 06:02 instead — harmless, the confirm gate needs
    # 05:00 Sydney so overshooting is fine.)
    - cron: '2 19 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: essential
      wrapper: .build/essential-updater.sh
      repair_prompt: .build/essential-repair-prompt.md
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
