# Essential Report updater. Essential files Wednesdays around 01:00 eastern;
# the release-window checks between the tune-schedules markers are generated
# by .build/tune-schedules.mjs from its recorded release times (coarse comb:
# each run is a ~10-minute full crawl). The skip-confirm slot below the end
# marker is hand-authored.

name: essential-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Essential: Wed habit (11/12 recent dated releases); files 01:00–04:36 eastern (last 8 timed releases, newest 2026-09-02T01:00)
    - cron: '10 21 * * *'    # daily 07:10 — daily sweep
    - cron: '50 14 * * 2'    # Wed 00:50 — release window, every 30 min
    - cron: '20,50 15 * * 2' # Wed 01:20–01:50 — release window, every 30 min
    - cron: '0 16 * * 2'     # Wed 02:00 — follow-up
    - cron: '0 17 * * 2'     # Wed 03:00 — follow-up
    - cron: '0 18 * * 2'     # Wed 04:00 — follow-up
    - cron: '30 12 * * 3'    # Wed 22:30 — late backstop
    - cron: '0 9 * * 4'      # Thu 19:00 — next-day
    # tune-schedules:end
    # 05:02 AEST daily skip-confirm sweep: a passed slot with no new report at
    # the publisher gets verified-absent and rolled in pollsterRules. (Under
    # AEDT this fires at 06:02 instead — harmless, the confirm gate needs
    # 05:00 Sydney so overshooting is fine.)
    - cron: '2 19 * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: essential
      wrapper: .build/essential-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
