# Coverage watchdog — the only scheduled job whose failure IS the message.
# It compares data/polls.json against Wikipedia's poll table and exits
# non-zero when a wave exists there that no agent has landed. Runs after the
# morning data-agent sweeps; a failed run arrives as a GitHub notification
# email, replacing the local macOS notification.

name: coverage-check

on:
  schedule:
    - cron: '30 22 * * *' # 08:30 AEST daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check poll coverage against Wikipedia
        run: bash .build/coverage-updater.sh

      # The wrappers send every step's output to .build/logs/<house>.log and
      # nothing to stdout, so a run used to be opaque in BOTH directions: a
      # failure's diagnosis died with the runner, and a green run never said
      # what it actually saw. .build/logs/ is gitignored, so anything matching
      # here was written by THIS run — no marker file needed. The step summary
      # (what the notification email links to) is reserved for failures.
      - name: Show the updater log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          shopt -s nullglob
          logs=(.build/logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No .build/logs/*.log was written this run."
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "::group::$f (last 200 lines)"
            tail -n 200 "$f"
            echo "::endgroup::"
            if [ "$JOB_STATUS" = "failure" ]; then
              {
                echo "### $f (tail)"
                echo '```'
                tail -n 40 "$f"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
