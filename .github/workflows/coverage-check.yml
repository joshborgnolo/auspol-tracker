# Coverage watchdog — now routed through .build/coverage-doctor.mjs, which
# runs check-coverage.mjs in-process and classifies the result:
#
#   class 0  clean            → green
#   class 1  monitoring-outage → GREEN (the watchdog's standing rule:
#             inconclusive is not an alarm), noted in the run summary —
#             until it has lasted 40h: then the `blind` job goes red
#             (email, no repair agent), because in Sep 2026 a reshaped
#             Wikipedia table read as inconclusive for twelve green days
#   class 2  defect           → the job fails (email) AND the central
#             agent-repair workflow fires — only class backed by witness
#             evidence of a missed wave
#   class 4  report-only      → GREEN, noted in the run summary; genuine
#             silence with no confirmed absence never fires a repair
#
# Silence a skip-confirm agent has verified (pollsterRules.skippedSlots /
# skippedMonths), or a house declared stopped, is classified clean before
# either of the noisy classes is considered.
#
# The heartbeat job (2026-09-07) covers the failure the doctor cannot see:
# automation that runs "green" while doing nothing — the gitignored-
# .build/locks outage ran every writer as an instant no-op for two days. It
# probes that the writers lock is actually acquirable, pages if no
# automated commit has landed for 60h, and (2026-09-25) pages if the
# dispatch clock has stopped starting the release windows on time.

name: coverage-check

on:
  schedule:
    - cron: '30 22 * * *' # 08:30 AEST daily
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write   # class-3 (provisionally covered) ci-alert issues
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.doctor.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Run the coverage doctor
        id: doctor
        run: |
          set +e
          OUT="$(node .build/coverage-doctor.mjs 2>&1)"
          CODE=$?
          echo "$OUT"
          echo "verdict=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -ne 0 ]; then
            {
              echo "### coverage doctor — class $CODE"
              echo '```'
              echo "$OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # only class 2 (defect) goes red; 1 is inconclusive-is-not-an-alarm,
          # 4 is report-only by design, 3 (the fallback has the wave on the
          # page; the house extractor is still broken) warns here and files
          # an issue below instead of spending a repair session every morning
          # class 1 is green by policy, but twelve green "inconclusive" days
          # (Sep 2026: Wikipedia's table changed shape) is a blind watchdog —
          # annotate so a streak shows in the Actions list
          if [ "$CODE" -eq 1 ]; then
            echo "::warning::coverage class 1 — the witness check was inconclusive; if this repeats daily the watchdog is blind (check-coverage.mjs parse)"
          fi
          if [ "$CODE" -eq 3 ]; then
            echo "::warning::coverage class 3 — wave(s) on the page only via the Poll Bludger fallback; the house extractor needs a look (see the ci-alert issue)"
            echo "$OUT" | grep -E '^  ' | head -n 20 > doctor-detail.txt || true
          fi
          [ "$CODE" -ne 2 ]

      - name: File a ci-alert issue for provisionally covered waves
        if: steps.doctor.outputs.verdict == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DETAIL="$(cat doctor-detail.txt 2>/dev/null || true)"
          BODY="The coverage doctor found wave(s) the house's own extractor has not landed; the Poll Bludger fallback has them on the page provisionally (fallbackPolls). The extractor needs a look — the provisional row is replaced automatically once the real one lands. [workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          BODY="${BODY}"$'\n\n'"${DETAIL}"
          bash .build/alert-issue.sh \
            "Coverage: wave(s) on the page only via the Poll Bludger fallback" \
            "$BODY" || echo "::warning::could not file the ci-alert issue"

  # A blind watchdog. Class 1 is not an alarm, but an unbroken run of it is
  # a parser or a witness that stopped working (Sep 2026: Wikipedia's table
  # changed shape and check-coverage read it as inconclusive for twelve
  # days, all green). transient-streak.sh turns the third straight
  # inconclusive day red. Its own job so that red is an email, not repair
  # work: agent-repair's gate hands only a failed check or thinness job to
  # an agent, whose prompt is for missed waves, not the parser.
  blind:
    needs: check
    if: always() && needs.check.outputs.verdict == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # this workflow's earlier runs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Its name is load-bearing: the streak is counted from earlier runs
      # in which this step ran green.
      - name: Note an inconclusive verdict
        env:
          GH_TOKEN: ${{ github.token }}
          STREAK_KIND: inconclusive
          STREAK_RAN: '^Run the coverage doctor$'
          STREAK_MIN: '2'
          STREAK_HOURS: '40'
        run: bash .build/transient-streak.sh

  # Heartbeat — the "everything ran, nothing happened" detector the doctor
  # cannot provide. Two checks, both born of the 2026-09-05..07 lock outage:
  #   probe     attempts the real writers-lock acquisition in this pristine
  #             checkout; refusal here is impossible for a healthy pipeline
  #             (gitignored .build/locks parent meant mkdir ENODIR in EVERY
  #             fresh clone — every writer slot exited 0 doing nothing).
  #   commit    no github-actions[bot] commit on main in 60h ⇒ schedulers or
  #             workflows are dead. NOT 48h: one dropped run of the daily
  #             next-polls score already produced a 47.6h gap in normal
  #             operation; 60h tolerates one fully missed day plus jitter.
  # Goes red independently, like thinness; a failed job emails. Deliberately
  # no repair agent — a dead-writers signal is not a worklist of waves, and
  # the honest fix is usually the workflow or the lock, not data. (Enforced
  # in agent-repair.yml's gate, which since 2026-09-25 hands only a failed
  # check or thinness job to an agent.)
  heartbeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the dispatch clock's runs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 100 # the commit scan has to see past a few quiet days
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Probe the writers lock
        run: bash .build/probe-writers-lock.sh

      - name: Automation commit heartbeat
        run: node .build/check-writer-heartbeat.mjs

      # The clock (.build/dispatch-clock/) starts the release windows on
      # time, and nothing else would notice it stopping: the cron backup
      # keeps the updaters going, hours late. Every slot schedule.json listed
      # in the last 24h should have a dispatched run; under half is red. Its
      # GitHub token is a fine-grained PAT, so it will expire one day.
      - name: Dispatch clock heartbeat
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node .build/dispatch-clock/served.mjs heartbeat
          code=$?
          [ "$code" -ne 1 ] || echo "::warning::dispatch-clock heartbeat inconclusive: the run list could not be read"
          [ "$code" -ne 3 ]

  # Separate job, not another step: a missed wave and a thin wave are different
  # failures and must be able to go red independently of each other.
  thinness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Check landed waves for missing derived rows
        run: node .build/check-poll-thinness.mjs

  # Once a day, close the ci-alert issues whose workflow has run green since
  # they were last updated (.build/resolve-alerts.sh) — before Sep 2026
  # nothing ever closed one, so open alerts stopped meaning anything. Never
  # red: a hiccup here must not page anyone (and agent-repair's gate treats
  # only the check/thinness jobs as repair work anyway).
  alerts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read  # each workflow's newest run
      issues: write  # close the resolved ones
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Close alerts whose workflow has run green since
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .build/resolve-alerts.sh || echo "::warning::resolve-alerts.sh failed; alerts left as they were"
