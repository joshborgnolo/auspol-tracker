# Test wiring — the repo's hand-written suites run here and only here.
# Advisory by design: writers push straight to main, so a red run here is an
# email, not a merge gate.
#
# `npm test` is the single home for the suite list (package.json): validate ->
# build (test-np-score and both sims read the freshly built assets) -> the six
# fixture suites (their caches under .build/*-src are tracked) -> sim-next-polls
# and sim-oppr-labels -> deff-backtest, whose A0 parity gate asserts the
# estimator replica still reproduces the committed headline from the committed
# data. That gate is what turns an estimator regression into a red run.
#
# Node comes from .nvmrc, puppeteer-core from package-lock.json — every
# workflow draws the same runtime, so a GitHub image bump can't fail all
# pipelines at once.

name: tests

on:
  push:
    branches: [main]
    paths:
      - ".build/**"
      - "data/**"
      - ".github/workflows/**"
      - "package*.json"
  workflow_dispatch:

# Read-only: never races the main-writers group and needs no write perms.
concurrency:
  group: tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the one dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate, build, run every suite
        run: npm test
