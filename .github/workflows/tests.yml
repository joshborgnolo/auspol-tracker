# Test wiring — the repo's hand-written suites run here and only here.
# Advisory by design: writers push straight to main, so a red run here is an
# email, not a merge gate.
#
# `npm test` is the single home for the suite list (package.json): validate ->
# build (test-np-score and both sims read the freshly built assets) -> the six
# fixture suites (their caches under .build/*-src are tracked) -> sim-next-polls
# and sim-oppr-labels -> deff-backtest, whose A0 parity gate asserts the
# estimator replica still reproduces the committed headline from the committed
# data. That gate is what turns an estimator regression into a red run.
#
# Node comes from .nvmrc, puppeteer-core from package-lock.json — every
# workflow draws the same runtime, so a GitHub image bump can't fail all
# pipelines at once.

name: tests

on:
  push:
    branches: [main]
    paths:
      - ".build/**"
      - "data/**"
      - ".github/workflows/**"
      - "package*.json"
  # The updaters push with GITHUB_TOKEN, and those pushes never fire `push`
  # — so until Sep 2026 the suite only ran on a human's push, and a data
  # commit that broke the estimator's parity gate went untested for as
  # long as no human pushed. A daily run bounds that to a day. Read-only,
  # outside the writers queue, at a quiet hour.
  schedule:
    - cron: '30 15 * * *' # 01:30 AEST daily
  workflow_dispatch:

# Read-only: races no writer and needs no write perms.
concurrency:
  group: tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the one dependency
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate, build, run every suite
        run: npm test
