# Next-polls calibration scoreboard. Once a day, appends any changed live
# projection tuples to data/np-calibration.jsonl and regenerates
# data/np-report.md — the hit-rate record of the "Next expected polls" panel,
# kept honest by appending only when a prediction's identity moves (a wave
# landed, a skip confirmed, an estimate re-measured), not on the daily tick.
# Deterministic, so no repair job: a red run here is a plain failure and
# emails like the coverage watchdog.

name: np-score

on:
  schedule:
    - cron: '15 21 * * *' # 07:15 AEST daily
  workflow_dispatch:

# Its OWN group, not main-writers. A concurrency group holds one running job
# and ONE pending one — a newer pending run cancels the older — and GitHub
# fires this cron late (~23:00Z), right when the 09:00 AEST updater slots
# queue on main-writers: 12 of 14 runs to 2026-09-22 were cancelled before
# starting, and every missed day lost that day's bets from the ledger. It
# needs no lock: it writes only the two calibration files (no other writer
# touches them) and pushes through push_main's rebase retry.
concurrency:
  group: np-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The bets come from the built data asset, which is committed — and a
      # commit can land polls.json without it (2026-09-23 06:55: a YouGov
      # wave sat in polls.json while the committed asset still projected the
      # slot it filled). Regenerate it from the polls.json being scored
      # against, so claims and resolutions read the same data; then put the
      # tracked files back, since this job commits only the ledger.
      - name: Log the live tuples, then resolve the ledger
        run: |
          node .build/newtracker/gen-data.mjs > /dev/null
          node .build/newtracker/np-score.mjs
          node .build/newtracker/np-score.mjs --report
          git checkout -- .build/newtracker/assets/

      - name: Commit whatever moved
        run: |
          git add data/np-calibration.jsonl data/np-report.md
          if git diff --cached --quiet; then
            echo "no calibration changes today"
            exit 0
          fi
          node .build/newtracker/validate.mjs
          git commit -m "Score the next-polls projection"
          # Shared helper like the updater wrappers: push with one
          # rebase+amend retry instead of a bare pull --rebase + push.
          LOG=/dev/null
          log() { echo "$*"; }
          . .build/git-push-main.sh
          push_main "Score the next-polls projection" data/np-calibration.jsonl data/np-report.md
