# Next-polls calibration scoreboard. Once a day, appends any changed live
# projection tuples to data/np-calibration.jsonl and regenerates
# data/np-report.md — the hit-rate record of the "Next expected polls" panel,
# kept honest by appending only when a prediction's identity moves (a wave
# landed, a skip confirmed, an estimate re-measured), not on the daily tick.
# Deterministic, so no repair job: a red run here is a plain failure and
# emails like the coverage watchdog. A dropped day loses that day's bets, so
# the dispatch clock (.build/dispatch-clock/) also starts this at 07:15
# Sydney. The later of the two runs finds nothing new and commits nothing.

name: np-score

on:
  schedule:
    - cron: '15 21 * * *' # 07:15 AEST daily
  workflow_dispatch:

# Its OWN group. A concurrency group holds one running job and ONE pending
# one — a newer pending run cancels the older — and in the old shared
# main-writers group 12 of 14 runs to 2026-09-22 were cancelled before
# starting, each losing that day's bets from the ledger (every writer has
# since left that group). It needs no lock: it writes only the two
# calibration files (no other writer touches them) and pushes through
# push_main's rebase retry.
concurrency:
  group: np-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The bets come from the built data asset, which is committed — and a
      # commit can land polls.json without it (2026-09-23 06:55: a YouGov
      # wave sat in polls.json while the committed asset still projected the
      # slot it filled). Regenerate it from the polls.json being scored
      # against, so claims and resolutions read the same data; then put the
      # tracked files back, since this job commits only the ledger.
      - name: Log the live tuples, then resolve the ledger
        run: |
          node .build/newtracker/gen-data.mjs > /dev/null
          node .build/newtracker/np-score.mjs
          node .build/newtracker/np-score.mjs --report
          git checkout -- .build/newtracker/assets/

      - name: Commit whatever moved
        run: |
          git add data/np-calibration.jsonl data/np-report.md
          # The report stamps "Last run: <time>" on every run, so it always
          # differs. A commit carrying only that stamp scores nothing, and
          # with two triggers a day (the clock and the cron) there were two
          # such commits, each a Pages deploy. Commit when the ledger or the
          # report's body moved.
          if git diff --cached --quiet -- data/np-calibration.jsonl &&
             git diff --cached --quiet -I '^Last run: ' -- data/np-report.md; then
            echo "no calibration changes today (only the report's run stamp moved)"
            exit 0
          fi
          node .build/newtracker/validate.mjs
          git commit -m "Score the next-polls projection"
          # Shared helper like the updater wrappers: push with one
          # rebase+amend retry instead of a bare pull --rebase + push.
          LOG=/dev/null
          log() { echo "$*"; }
          . .build/git-push-main.sh
          push_main "Score the next-polls projection" data/np-calibration.jsonl data/np-report.md
