# YouGov "Public Data" / News24 Pulse updater — the fortnightly Wednesday
# ~05:00 eastern release. Until Sep 2026 this house ran on the laptop's
# launchd job alone (its Chrome leg reads news24.com.au through the user's
# logged-in profile); with the laptop shut a wave only reached the site via
# the Poll Bludger fallback, provisionally. Here the wrapper leaves the
# Chrome leg off (no user Chrome on a runner): YouGov's own releases parse in
# full from yougov.com, and a News24-only wave lands as a VI row from the
# Wikipedia table with `published` empty, which the next local run with
# Chrome upgrades in place. The launchd job stays installed as the backup.
#
# The cron block between the tune-schedules markers is generated by
# .build/tune-schedules.mjs from the house's recorded release times.

name: news24-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # YouGov: Wed habit (11/12 recent dated releases); files 05:00–06:00 eastern (last 8 timed releases, newest 2026-09-09T05:00)
    - cron: '20 20 * * *'               # daily 06:20 — daily sweep
    - cron: '53 18 * * 2'               # Wed 04:53 — release window, every 10 min
    - cron: '3,13,23,33,43,53 19 * * 2' # Wed 05:03–05:53 — release window, every 10 min
    - cron: '3,13,23 20 * * 2'          # Wed 06:03–06:23 — release window, every 10 min
    - cron: '3 21 * * 2'                # Wed 07:03 — follow-up
    - cron: '3 22 * * 2'                # Wed 08:03 — follow-up
    - cron: '3 23 * * 2'                # Wed 09:03 — follow-up
    - cron: '33 12 * * 3'               # Wed 22:33 — late backstop
    - cron: '3 9 * * 4'                 # Thu 19:03 — next-day
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: news24
      wrapper: .build/news24-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
