# Reusable poll-agent pipeline. Every house's caller workflow (Roy Morgan's
# included, since 2026-09-25) supplies its own schedule and names the wrapper
# to run; this file owns the update job (checkout -> wrapper, which
# extracts/validates/builds/commits/pushes). Repair of a failed run is
# centralised in agent-repair.yml (workflow_run trigger) — this file
# intentionally has no repair job.
#
# Concurrency is PER HOUSE (writers-<house>), not one shared group. GitHub
# keeps a single pending run per group and cancels the older one, so the
# shared main-writers group (2026-09-04..25) threw away 29 scheduled runs in
# three weeks — RedBridge's morning sweep on 7 of 11 days — whenever one long
# holder had two runs waiting behind it. Within a house the newest pending
# run does the same work as the one it replaced. Across houses nothing
# queues: push_main (.build/git-push-main.sh) resolves the push race itself —
# generated files are rebuilt rather than merged, and a data conflict re-runs
# the wrapper once on the fresh base (.build/test-push-main.mjs pins it).
#
# Transient failures are not repair work. When the wrapper fails because the
# pollster was down or walled, or because it lost a push race twice, the
# updater step's .build/classify-failure.mjs verdict ends the run GREEN with a
# warning; .build/transient-streak.sh turns it red only once the house has
# failed that way for 12h+, and agent-repair takes it from there.
#
# The wrappers are idempotent no-ops when there's nothing new upstream, so
# dense schedules are safe. All wrappers fast-forward to origin/main first, so
# the laptop's launchd copies of the same jobs can stay installed as backups.
#
# The dispatch clock (.build/dispatch-clock/, live since 2026-09-24) starts
# each tuned slot on the minute; the caller's cron block fires the same slot
# again when GitHub gets round to it, 2–5h later. The `clock` job lets that
# backup run's update go ahead only when the clock did not already serve its
# slot (.build/dispatch-clock/served.mjs; any doubt runs it).

name: poll-agent (reusable)

on:
  workflow_call:
    inputs:
      house:
        description: 'House name, e.g. resolve (used in job names/concurrency)'
        required: true
        type: string
      wrapper:
        description: 'Path to the updater shell script'
        required: true
        type: string
      apt_packages:
        description: 'Extra apt packages the extractor needs (e.g. poppler-utils)'
        required: false
        type: string
        default: ''
      simulate_failure:
        description: "Force update to fail (exercises the repair job); set to 'true' only via workflow_dispatch"
        required: false
        type: string
        default: 'false'

jobs:
  # Only a cron-triggered run can be a backup. A slot the clock started (and
  # that ran or went green) is a duplicate: a second fetch of the pollster's
  # site for nothing — Essential walled GitHub's runners for four days in Sep
  # 2026 — and a second run in every list. Slots the clock never carries
  # (Essential's skip-confirm, DemosAU's hourly gate), a failed dispatched
  # run, a cron line on last week's UTC offset, or an API error: all run.
  clock:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read # this workflow's dispatched runs
    outputs:
      served: ${{ steps.gate.outputs.served }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .build/dispatch-clock
      # the image's own node: served.mjs has no dependencies
      - name: Did the dispatch clock already serve this slot?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CRON: ${{ github.event.schedule }}
        run: node .build/dispatch-clock/served.mjs backup

  update:
    needs: clock
    # Runs unless the clock job positively found the slot served: a skipped
    # clock job (any trigger but cron) and a failed one both run it.
    if: ${{ !cancelled() && needs.clock.outputs.served != 'true' }}
    # Pinned, not ubuntu-latest: the label moves to Ubuntu 26 from
    # 2026-10-19, and these jobs lean on the image's apt, poppler and
    # /usr/bin/google-chrome. Move deliberately, all workflows at once.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: writers-${{ inputs.house }}
      cancel-in-progress: false
    # Every caller's top-level `permissions:` must grant at least these —
    # a reusable workflow can never exceed its caller, and a job that asks
    # for more makes EVERY caller an invalid workflow (0c3a2ba).
    permissions:
      contents: write
      actions: read # transient-streak.sh reads this workflow's earlier runs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24; v6+ moves the persisted credential out of .git/config — see agent-repair.yml)

      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install apt packages
        if: inputs.apt_packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt_packages }}
        run: |
          # The input travels via env, never run: interpolation (which would
          # make shell metacharacters executable), and every token must look
          # like a plain apt package name before apt sees it.
          for pkg in $APT_PACKAGES; do
            case "$pkg" in
              *[!a-zA-Z0-9.+=:~-]*|'') echo "::error::refusing apt package name: $pkg"; exit 1 ;;
            esac
          done
          # shellcheck disable=SC2086 # split on purpose: one argument per package
          sudo apt-get update -qq && sudo apt-get install -y -qq $APT_PACKAGES

      - name: Install puppeteer-core (best effort, for the share-card redraw)
        # Version lives in package-lock.json; render-card.mjs resolves it from
        # repo node_modules. --ignore-scripts: nothing here needs postinstall.
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      # A transient verdict (see the header) exits 0 with `transient=true`;
      # every other failure keeps the wrapper's own exit code.
      - name: Run the ${{ inputs.house }} updater
        id: updater
        env:
          CHROME: /usr/bin/google-chrome
          WRAPPER: ${{ inputs.wrapper }}
          SIMULATE: ${{ inputs.simulate_failure }}
        run: |
          if [ "$SIMULATE" = "true" ]; then
            echo "simulate_failure requested; failing to exercise the repair job"
            exit 1
          fi
          # the wrappers stamp log lines with this same clock and format
          since="$(date '+%Y-%m-%d %H:%M:%S')"
          code=0
          bash "$WRAPPER" || code=$?
          [ "$code" -eq 0 ] && exit 0
          # a classifier that breaks must not mask the wrapper's own exit code
          verdict="$(node .build/classify-failure.mjs --exit "$code" --since "$since" || true)"
          echo "$verdict"
          case "$verdict" in
            *'"class":"transient"'*)
              echo "transient=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          exit "$code"

      # Its name is load-bearing: transient-streak.sh finds earlier transient
      # runs by this step having run green.
      - name: Note a transient upstream failure
        if: steps.updater.outputs.transient == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .build/transient-streak.sh

      # The wrappers send every step's output to .build/logs/<house>.log and
      # nothing to stdout, so a run used to be opaque in BOTH directions: a
      # failure's diagnosis died with the runner, and a green run never said
      # what it actually saw. .build/logs/ is gitignored, so anything matching
      # here was written by THIS run — no marker file needed. The step summary
      # (what the notification email links to) carries the tail for a failed
      # or transient run only.
      - name: Show the updater log
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TRANSIENT: ${{ steps.updater.outputs.transient }}
        run: |
          shopt -s nullglob
          logs=(.build/logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No .build/logs/*.log was written this run."
            exit 0
          fi
          for f in "${logs[@]}"; do
            echo "::group::$f (last 200 lines)"
            tail -n 200 "$f"
            echo "::endgroup::"
            if [ "$JOB_STATUS" = "failure" ] || [ "$TRANSIENT" = "true" ]; then
              {
                echo "### $f (tail)"
                echo '```'
                tail -n 40 "$f"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
