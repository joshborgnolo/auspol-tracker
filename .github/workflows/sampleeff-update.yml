# Effective-sample-size updater. Statements post with releases and stay put,
# and a missed week only delays a weight refinement, so a weekly sweep is
# plenty. The wrapper no-ops when nothing new was stamped.

name: sampleeff-update

on:
  schedule:
    - cron: '25 21 * * 0' # 07:25 AEST Monday (np-score holds 07:15)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: sampleeff
      wrapper: .build/sampleeff-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
