# Newspoll release watchdog — like coverage-check, its FAILURE is the message.
#
# The Newspoll extractor itself can't run here (The Australian is paywalled and
# bot-walled, and rung B needs the user's Chrome), but rung A addresses the live
# Infogram project by a stable slug: no article, no cookies, no Chrome. So CI
# can detect that a wave has been published days before free secondary coverage
# clusters — the 2026-08-28 wave sat as a candidate for four days and landed
# manually. This job DETECTS ONLY; figures still land via the extractor.
#
# Escalation (2026-09-05): once a `release` verdict has sat unlanded past
# ESCALATE_AFTER_DAYS (see check-newspoll-release.mjs), the watch JSON starts
# carrying escalate:true. The file-missing job below re-checks the verdict and,
# only then, hands the wave to the headless filing agent
# (.build/newspoll-file-missing-prompt.md) — the LLM last resort, never part
# of the deterministic chain it stands in for.
#
# Review-gated (2026-09-05): the filing agent works a repair/ branch with no
# git credentials; the workflow pushes the branch and files a ci-alert issue
# with the link to open the PR (Actions may not open PRs in this repo).
# Nothing the agent files reaches main or the site until a human merges it.

name: newspoll-watch

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Newspoll: Sun habit (11/12 recent dated releases); files 20:00–21:00 eastern (last 8 timed releases, newest 2026-09-20T21:00)
    - cron: '4,24,44 10 * * 0' # Sun 20:04–20:44 — watch: the habitual hour, every 20 min
    - cron: '4,24 11 * * 0'    # Sun 21:04–21:24 — watch: the habitual hour, every 20 min
    # tune-schedules:end
    - cron: '30 21 * * *' # 07:30 AEST daily — catch-all for off-pattern releases
  workflow_dispatch:

# read-only by default; the filer job declares what it needs
permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Check for an unlanded Newspoll release
        run: node .build/check-newspoll-release.mjs

  # The watch job's failure IS its message, so its outputs can't be trusted
  # from a failed job — this gate re-runs the (anonymous, seconds-cheap)
  # watchdog and reads the NP_WATCH verdict line for itself. escalate only
  # ever appears on a release verdict, so a quiet run ends here. It is its
  # own job so that the filer below joins its concurrency group ONLY when
  # there is something to file: until 2026-09-25 the filer ran on every watch
  # run and queued in the shared writers group each time, where GitHub's
  # one-pending rule cancelled real updater runs behind it.
  escalation:
    needs: watch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      escalate: ${{ steps.gate.outputs.escalate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Gate on the escalated watch verdict
        id: gate
        run: |
          node .build/check-newspoll-release.mjs 2>&1 | tee "$RUNNER_TEMP/npwatch.log" || true
          json=$(grep '^NP_WATCH ' "$RUNNER_TEMP/npwatch.log" | tail -n 1 | sed 's/^NP_WATCH //') || true
          esc=$(printf '%s' "$json" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const o=JSON.parse(s);process.stdout.write(o.fired===true&&o.escalate===true?"true":"false")}catch{process.stdout.write("false")}})')
          echo "gate verdict: escalate=$esc"
          echo "escalate=$esc" >> "$GITHUB_OUTPUT"

  file-missing:
    needs: escalation
    if: needs.escalation.outputs.escalate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # The filer pushes a repair/ BRANCH, never main, so it only has to keep
    # from racing itself.
    concurrency:
      group: newspoll-file
      cancel-in-progress: false
    permissions:
      contents: write        # push the repair branch (and only the branch)
      issues: write          # the review request + circuit-breaker alerts
      actions: read          # the breaker counts earlier file-missing jobs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (the branch step below strips the persisted credential; v6+ moves it)

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the gated share-card redraw)
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      # A daily escalated watch would otherwise re-file (and re-spend) on the
      # same wave forever. The breaker counts this job's own runs in 24h.
      - name: Circuit breaker
        id: breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .build/repair-gate.sh newspoll-file newspoll-watch.yml file-missing

      - name: Alert when the circuit breaker is tripped
        if: steps.breaker.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .build/alert-issue.sh \
            "Repair circuit breaker: newspoll-file" \
            "Three filing-agent sessions in 24h and the unlanded Newspoll wave still isn't in polls.json — [run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). No further agent sessions this window; this needs a human."

      - name: Prepare a credential-free repair branch
        id: branch
        if: steps.breaker.outputs.allowed == 'true'
        run: |
          BRANCH="repair/newspoll-file-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config --unset-all http.https://github.com/.extraheader || true
          git config --unset-all url."https://github.com/".insteadOf || true
          git config --unset-all url."git@github.com:".insteadOf || true

      # Pin the agent CLI: a floating @latest install means a tag move
      # (compromised or accidental) changes the code that runs with
      # contents:write and MATILDA_API_KEY (same rationale as poll-agent.yml).
      - name: Install Matilda CLI
        if: steps.breaker.outputs.allowed == 'true'
        run: npm i -g @maincode-ai/matilda-code@0.21.4

      # Deliberately NO GITHUB_TOKEN here: the workflow owns every remote op.
      - name: Run the missing-wave filing agent
        if: steps.breaker.outputs.allowed == 'true'
        env:
          MATILDA_API_KEY: ${{ secrets.MATILDA_API_KEY }}
          CHROME: /usr/bin/google-chrome
          GIT_TERMINAL_PROMPT: "0"
          AUSPOL_PR_GATE: "1" # push_main in the wrappers leaves commits local
        run: |
          if [ -z "$MATILDA_API_KEY" ]; then
            echo "::warning::MATILDA_API_KEY secret not set; skipping missing-wave filing. Add it in repo Settings > Secrets."
            exit 0
          fi
          matilda -p "$(cat .build/newspoll-file-missing-prompt.md)" --yolo --output-format text --max-wall-time 25m --max-tool-calls 80

      # This repo does not let GitHub Actions open pull requests (Settings →
      # Actions → "Allow GitHub Actions to create and approve pull requests"
      # is off), so `gh pr create` here could only ever fail after the push.
      # The branch goes up, and a ci-alert issue carries the one-click link
      # to open the PR as a human — which is the review this gate exists for.
      - name: Push the repair branch and ask for a review
        if: steps.breaker.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! git log --oneline origin/main..HEAD | grep -q .; then
            echo "the agent left no commits; nothing to review (its report is in the log above)"
            exit 0
          fi
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:${BRANCH}"
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          BODY="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "The filing agent pushed \`${BRANCH}\` for the unlanded Newspoll wave the watch job escalated — [run](${RUN_URL})." \
            "**[Open the pull request](${COMPARE})** to review it. Nothing here has touched main or the live site; merging deploys it." \
            "Expected shape of an honest filing: one polls.json Newspoll row with a source URL whose figures match the row, plus the built artifacts from the normal validate+build path. No workflow or permissions changes. Reject anything else." \
            "Delete the branch once it is merged or rejected.")"
          bash .build/alert-issue.sh "Newspoll filing ready for review" "$BODY"
          echo "review link: $COMPARE" | tee -a "$GITHUB_STEP_SUMMARY"
