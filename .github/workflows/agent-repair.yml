# Central repair agent for the repo. A failing run of a watched workflow on
# main fires this: a breaker-gated headless-Matilda session diagnoses the
# failure from the failed run's log, reproduces it, and commits a minimal fix
# on LOCAL main; a separate publish job gates those commits and pushes them.
#
# Three jobs, three trust levels (2026-09-25):
#   gate     reads the failed run, decides whether it is repair work at all,
#            and runs the circuit breaker (.build/repair-gate.sh: 3 agent
#            sessions per workflow per 24h).
#   repair   the agent. READ-ONLY token, git credentials stripped, no
#            concurrency group: it holds nothing while it thinks. Its commits
#            leave the job as a git bundle artifact — nothing else does.
#   publish  a FRESH runner (no process the agent started can still be
#            alive to watch for a credential) checks the bundle against the
#            deterministic gate — forbidden paths, syntax, validate.mjs —
#            then throws away whatever generated files the agent's pipeline
#            runs produced, rebuilds the site from the repaired sources
#            itself, and pushes through push_main (.build/git-push-main.sh).
# Before this split the gate refused any commit touching index.html/assets,
# while the prompt told the agent to let the pipeline commit its data — which
# always carries the rebuilt site — so a correct repair was thrown away
# (sampleeff, 2026-09-21, issue #2). Generated files are now never taken
# from the agent, so they no longer need forbidding.
#
# Not watched, on purpose: tests (a red run is usually a human mid-edit —
# an agent pushing to main underneath them is worse than the email),
# site-check (Pages, not code), newspoll-watch (its failure IS the message,
# and it has its own filer), citation-check (a dead citation is a human's
# rewrite), schedule-tune (.github/ is forbidden to agents; a secret is a
# human's job). NOT self-triggering: a red agent-repair run emails normally
# instead of spawning repairs of repairs.

name: agent-repair

on:
  workflow_run:
    workflows:
      - resolve-update
      - demosau-update
      - essential-update
      - redbridge-update
      - spectre-update
      - foxhedgehog-update
      - newspoll-update
      - news24-update
      - sampleeff-update
      - crosstabs-update
      - ipsos-update
      - roymorgan-update
      - pollbludger-fallback
      - coverage-check
      - prediction-refresh
      - np-score
    types: [completed]
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: 'Run ID of the failed workflow run to repair'
        required: true
        type: string
      workflow_name:
        description: 'Name of the failed workflow (drives the house-prompt map)'
        required: true
        type: string

run-name: "agent-repair: ${{ github.event.workflow_run.name || inputs.workflow_name }}"

# every job declares its own
permissions: {}

jobs:
  gate:
    # Only failures on main are repair work. Green runs, cancelled runs and
    # branch runs exit here without spending a cent.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the failed run's jobs; the breaker's session count
      issues: write # breaker alert issues
    outputs:
      allowed: ${{ steps.scope.outputs.repairable == 'true' && steps.breaker.outputs.allowed == 'true' }}
      failed_run_id: ${{ steps.ctx.outputs.failed_run_id }}
      workflow_name: ${{ steps.ctx.outputs.workflow_name }}
      house_prompt: ${{ steps.ctx.outputs.house_prompt }}
      run_url: ${{ steps.ctx.outputs.run_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (see the credential note at the repair job)

      - name: Resolve run context and house-prompt map
        id: ctx
        env:
          DISPATCH_RUN: ${{ inputs.failed_run_id || '' }}
          DISPATCH_WF: ${{ inputs.workflow_name || '' }}
          EVENT_WF: ${{ github.event.workflow_run.name || '' }}
          EVENT_RUN: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -eu
          if [ -n "$DISPATCH_RUN" ]; then
            RUN_ID="$DISPATCH_RUN"; WF="$DISPATCH_WF"
          else
            RUN_ID="$EVENT_RUN"; WF="$EVENT_WF"
          fi
          case "$WF" in
            essential-update)   HP=.build/essential-repair-prompt.md ;;
            resolve-update)     HP=.build/resolve-repair-prompt.md ;;
            demosau-update)     HP=.build/demosau-repair-prompt.md ;;
            redbridge-update)   HP=.build/redbridge-repair-prompt.md ;;
            spectre-update)     HP=.build/spectre-repair-prompt.md ;;
            foxhedgehog-update) HP=.build/foxhedgehog-repair-prompt.md ;;
            newspoll-update)    HP=.build/newspoll-repair-prompt.md ;;
            news24-update)      HP=.build/news24-repair-prompt.md ;;
            sampleeff-update)   HP=.build/sampleeff-repair-prompt.md ;;
            crosstabs-update)   HP=.build/crosstabs-repair-prompt.md ;;
            ipsos-update)       HP=.build/ipsos-repair-prompt.md ;;
            roymorgan-update)   HP=.build/roymorgan-repair-prompt.md ;;
            pollbludger-fallback) HP=.build/pollbludger-repair-prompt.md ;;
            coverage-check)     HP=.build/coverage-doctor-repair-prompt.md ;;
            prediction-refresh) HP=.build/prediction-repair-prompt.md ;;
            *)                  HP="" ;;
          esac
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          {
            echo "failed_run_id=$RUN_ID"
            echo "workflow_name=$WF"
            echo "house_prompt=$HP"
            echo "run_url=$RUN_URL"
          } >> "$GITHUB_OUTPUT"
          echo "failed run: $RUN_URL (workflow '$WF', house prompt: ${HP:-none — generic repair})"

      # coverage-check's heartbeat job pages on dead writers — a workflow or
      # lock problem, never a worklist of waves (its own header says so). Only
      # its check (class 2) and thinness jobs are repair work.
      - name: Is this failure repair work?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.ctx.outputs.failed_run_id }}
          WF: ${{ steps.ctx.outputs.workflow_name }}
        run: |
          repairable=true
          if [ "$WF" = "coverage-check" ]; then
            failed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(",")')" || failed=""
            echo "failed jobs: ${failed:-none found}"
            case ",$failed," in
              *,check,*|*,thinness,*) ;;
              *) repairable=false; echo "only the heartbeat failed — the red run's email is the message; no agent" ;;
            esac
          fi
          echo "repairable=$repairable" >> "$GITHUB_OUTPUT"

      # A persistent breakage fires a repair on every failed slot — Roy Morgan
      # alone has a dozen slots a Monday. The breaker counts the agent sessions
      # actually spent on this workflow in the trailing 24h and closes at 3.
      - name: Circuit breaker
        id: breaker
        if: steps.scope.outputs.repairable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ steps.ctx.outputs.workflow_name }}
        run: bash .build/repair-gate.sh "$WF"

      - name: Alert when the circuit breaker is tripped
        if: steps.scope.outputs.repairable == 'true' && steps.breaker.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          WF: ${{ steps.ctx.outputs.workflow_name }}
          RUN_URL: ${{ steps.ctx.outputs.run_url }}
        run: |
          bash .build/alert-issue.sh \
            "Repair circuit breaker: ${WF}" \
            "Three agent-repair sessions in 24h and ${WF} is still failing — [failed run](${RUN_URL}). No further agent sessions this window; this needs a human."

  repair:
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # 25m agent wall-clock + setup/bundle headroom
    # Read-only: whatever the agent does, this job's token cannot write.
    # No concurrency group — nothing here touches origin.
    permissions:
      contents: read
      actions: read # fetch the failed run's log
    outputs:
      base: ${{ steps.base.outputs.sha }}
      commits: ${{ steps.bundle.outputs.commits }}
      offmain: ${{ steps.bundle.outputs.offmain }}
    steps:
      # checkout v5 still persists its credential as an extraheader in
      # .git/config, which the strip step below removes. v6+ moved it to a
      # separate file — revisit that step before bumping this pin.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # prediction's model scripts read git show origin/main:...

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record the base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Parity with the failing jobs' environments: pdf houses need
      # poppler, wrappers may redraw the share card through puppeteer-core.
      - name: Install pdf tooling (poppler)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Install puppeteer-core (best effort, for the share-card redraw)
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      # The failed steps' log first — a whole-run log blew the agent's
      # context on 2026-09-17 ("Context is too large to send safely") — and
      # never more than its tail.
      - name: Fetch the failed run's job log
        continue-on-error: true # a log-fetch hiccup must not block repair; the prompt tells the agent to reproduce locally instead
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.gate.outputs.failed_run_id }}
        run: |
          mkdir -p .build/logs
          raw="$RUNNER_TEMP/failed-run-raw.log"
          gh run view "$RUN_ID" --log-failed > "$raw" 2>&1 || true
          [ -s "$raw" ] || gh run view "$RUN_ID" --log > "$raw" 2>&1 || true
          tail -n 2500 "$raw" > .build/logs/failed-run.log
          wc -l < .build/logs/failed-run.log

      # The agent phase gets NO git credentials (and the token is read-only
      # anyway). Prompts off so a stray credential prompt fails fast.
      - name: Strip git credentials for the agent phase
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
          git config --unset-all url."https://github.com/".insteadOf || true
          git config --unset-all url."git@github.com:".insteadOf || true

      # Pin the repair-agent CLI: a floating @latest install means a tag
      # move (compromised or accidental) changes the code that runs with
      # MATILDA_API_KEY. Bump deliberately after verifying the new release
      # (other pin site: newspoll-watch.yml — grep `matilda-code@`).
      - name: Install Matilda CLI
        run: npm i -g @maincode-ai/matilda-code@0.21.4

      - name: Assemble the repair prompt
        env:
          WF: ${{ needs.gate.outputs.workflow_name }}
          RUN_URL: ${{ needs.gate.outputs.run_url }}
          HOUSE_PROMPT: ${{ needs.gate.outputs.house_prompt }}
        run: |
          {
            echo "FAILING_WORKFLOW: $WF"
            echo "FAILED_RUN_URL: $RUN_URL"
            echo "HOUSE_PROMPT: ${HOUSE_PROMPT:-none}"
            echo
            cat .build/agent-repair-prompt.md
          } > .build/agent-repair-run.md

      - name: Run the repair agent
        env:
          MATILDA_API_KEY: ${{ secrets.MATILDA_API_KEY }}
          CHROME: /usr/bin/google-chrome
          GIT_TERMINAL_PROMPT: "0"
          AUSPOL_PR_GATE: "1" # wrappers self-skip their own push; their data commits stay local for the gate
        run: |
          if [ -z "$MATILDA_API_KEY" ]; then
            echo "::warning::MATILDA_API_KEY secret not set; skipping repair. Add it in repo Settings > Secrets."
            exit 0
          fi
          matilda -p "$(cat .build/agent-repair-run.md)" --yolo --output-format text --max-wall-time 25m --max-tool-calls 80

      # an out-of-budget agent may still have left good commits
      - name: Bundle the repair commits for the publish job
        id: bundle
        if: always()
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          if [ "$(git symbolic-ref --short -q HEAD)" != "main" ]; then
            echo "::error::the agent left HEAD off main; nothing will be published"
            echo "offmain=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n="$(git rev-list --count "$BASE..HEAD")"
          echo "commits=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "no repair commits; nothing to publish (the agent's report is in the log above)"
            exit 0
          fi
          git log --oneline "$BASE..HEAD"
          git bundle create "$RUNNER_TEMP/repair.bundle" "$BASE..main"

      - name: Upload the repair bundle
        if: always() && steps.bundle.outputs.commits != '' && steps.bundle.outputs.commits != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repair-bundle
          path: ${{ runner.temp }}/repair.bundle
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [gate, repair]
    if: always() && needs.gate.outputs.allowed == 'true' && ((needs.repair.outputs.commits != '' && needs.repair.outputs.commits != '0') || needs.repair.outputs.offmain == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: repair-publish-${{ needs.gate.outputs.workflow_name }}
      cancel-in-progress: false
    permissions:
      contents: write # push the repaired main
      issues: write   # gate-block alert issues
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the bundle's prerequisite is the repair job's base

      - name: Pin Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the share-card redraw)
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Download the repair bundle
        if: needs.repair.outputs.offmain != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: repair-bundle
          path: ${{ runner.temp }}/bundle

      - name: Gate the repair commits, rebuild the site, push main
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.repair.outputs.base }}
          OFFMAIN: ${{ needs.repair.outputs.offmain }}
          WF: ${{ needs.gate.outputs.workflow_name }}
          CHROME: /usr/bin/google-chrome
        run: |
          set -u
          BUNDLE="$RUNNER_TEMP/bundle/repair.bundle"
          # The push and alert machinery comes from main as checked out, not
          # from the agent's tree: block() must not run a script the gate is
          # busy refusing, and the push must follow the helper main trusts.
          TRUSTED="$RUNNER_TEMP/trusted"
          mkdir -p "$TRUSTED"
          cp .build/alert-issue.sh .build/git-push-main.sh "$TRUSTED/"
          block() {
            echo "::error::$1"
            bash "$TRUSTED/alert-issue.sh" \
              "Repair gate blocked: ${WF}" \
              "An agent-repair session for ${WF} left commits the deterministic gate refused to push: $1 — [workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). The commits are in the run's repair-bundle artifact for 7 days; main is untouched." || true
            exit 1
          }
          [ "$OFFMAIN" != "true" ] || block "the agent left HEAD off main"
          git bundle verify "$BUNDLE" > /dev/null 2>&1 || block "the repair bundle does not verify against main's history"
          git fetch -q "$BUNDLE" "refs/heads/main:refs/repair/head" || block "could not read the repair bundle"
          git merge-base --is-ancestor "$BASE" refs/repair/head || block "the repair commits do not descend from the base the agent was given"
          git checkout -q -B main refs/repair/head

          git log --oneline "$BASE..HEAD"
          CHANGED="$(git diff --name-only "$BASE..HEAD")"
          echo "$CHANGED"

          # 1. Off-limits in code: CI, dependency manifests, the domain, the
          #    clock and laptop installers, and the repair machinery itself —
          #    an agent must not edit its own breaker, gate or prompts.
          if echo "$CHANGED" | grep -E '^(\.github/|CNAME$|package\.json$|package-lock\.json$|\.nvmrc$|\.build/dispatch-clock/|\.build/launchd/|\.build/install-launchd\.sh$|\.build/repair-gate\.sh$|\.build/alert-issue\.sh$|\.build/resolve-alerts\.sh$|\.build/classify-failure\.mjs$|\.build/transient-streak\.sh$|\.build/[a-z0-9-]*repair-prompt\.md$|\.build/newspoll-file-missing-prompt\.md$)' | grep -q .; then
            block "repair commits touch forbidden paths"
          fi
          if echo "$CHANGED" | grep -q '^\.build/logs/'; then
            block "repair commits include .build/logs scratch"
          fi

          # 2. Syntax checks on everything the agent touched, then the same
          #    data validator the wrappers run.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.mjs) node --check "$f" || block "node --check failed on $f" ;;
              *.sh)  bash -n "$f"       || block "bash -n failed on $f" ;;
            esac
          done <<< "$CHANGED"
          node .build/newtracker/validate.mjs || block "validate.mjs failed against the repaired tree"

          # 3. Generated files are never taken from the agent: put them back
          #    as they were at the base (dropping any the agent's commits
          #    added), then rebuild them from the repaired sources here.
          GEN="index.html feed.xml sitemap.xml robots.txt assets .build/newtracker/assets"
          # shellcheck disable=SC2086 # fixed path list, split on purpose
          git checkout -q "$BASE" -- $GEN || block "could not restore the generated files"
          # shellcheck disable=SC2086
          git diff --name-only --diff-filter=A "$BASE" HEAD -- $GEN | while IFS= read -r f; do git rm -q -- "$f"; done
          LOG="$RUNNER_TEMP/publish.log"
          log() { echo "$(date '+%Y-%m-%d %H:%M:%S') $*" | tee -a "$LOG"; }
          . "$TRUSTED/git-push-main.sh"
          refresh_site || { cat "$LOG"; block "rebuilding the site from the repaired sources failed"; }
          # shellcheck disable=SC2086
          git add -A -- $GEN
          if ! git diff --cached --quiet; then
            git commit -q -m "Rebuild the site from the repaired sources" \
              -m "agent-repair publish job: generated files rebuilt from the repair's sources, never taken from the agent."
          fi

          # 4. Push through the same helper every wrapper uses: a lost race
          #    rebases with generated files rebuilt; a data conflict blocks.
          # shellcheck disable=SC2086
          if ! push_main "agent-repair: $WF" $GEN; then
            cat "$LOG"
            block "the push to main failed after one rebase (see the log)"
          fi
          cat "$LOG" 2>/dev/null || true
          echo "pushed the repair for ${WF} to main"
