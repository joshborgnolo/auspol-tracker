# RedBridge/Accent updater (AFR monthly, usually lands late in the month).
# Morning + early-evening sweeps plus a Sunday-evening comb, generated between
# the tune-schedules markers by .build/tune-schedules.mjs from the house's
# recorded release times; the extractor drives Chrome via CDP itself —
# ubuntu runners ship google-chrome and CHROME is set by the reusable workflow.

name: redbridge-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # RedBridge/Accent: Sun habit (10/12 recent dated releases); files 18:00–20:00 eastern (last 8 timed releases, newest 2026-08-30T18:00)
    - cron: '20 21 * * *'              # daily 07:20 — daily sweep
    - cron: '15 8 * * *'               # daily 18:15 — daily sweep
    - cron: '55 7 * * 0'               # Sun 17:55 — release window, every 10 min
    - cron: '5,25,35,45,55 8 * * 0'    # Sun 18:05–18:55 — release window, every 10 min
    - cron: '5,15,25,35,45,55 9 * * 0' # Sun 19:05–19:55 — release window, every 10 min
    - cron: '5,15,25 10 * * 0'         # Sun 20:05–20:25 — release window, every 10 min
    - cron: '5 11 * * 0'               # Sun 21:05 — follow-up
    - cron: '5 12 * * 0'               # Sun 22:05 — follow-up
    - cron: '5 13 * * 0'               # Sun 23:05 — follow-up
    - cron: '25 21 * * 0'              # Mon 07:25 — next-day
    - cron: '5 9 * * 1'                # Mon 19:05 — next-day
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: redbridge
      wrapper: .build/redbridge-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
