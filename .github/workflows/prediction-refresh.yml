# /prediction/ daily refresh — runs .build/prediction-refresh.sh daily.
# The wrapper's --if-due gate makes an already-done day a cheap no-op (one
# record per Sydney date); on a new day it refreshes
# data/prediction-history.json + prediction/index.html, rebuilds the sitemap,
# and commits "Refresh re-election model read as at <date>".
#
# The generator's model scripts read `git show origin/main:data/polls.json`,
# so checkout needs fetch-depth 0 for the origin/main ref to exist.
#
# Failure path: when the deterministic update job fails (generator guard,
# build error, push failure), the repair job boots headless Matilda with
# MATILDA_API_KEY (repo secret) and the prompt in
# .build/prediction-repair-prompt.md.

name: prediction-refresh

on:
  schedule:
    - cron: '0 3 * * *' # 13:00 AEST daily — due-day no-ops are seconds
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Every push-capable workflow shares one concurrency group so two writers
# can never be mid-flight against main at the same time. Serialised, not
# cancelled: a queued run still gets its slot.
concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)
        with:
          fetch-depth: 0 # model scripts read git show origin/main:...

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the gated share-card redraw)
        # Version lives in package-lock.json; render-card.mjs resolves it from
        # repo node_modules. --ignore-scripts: nothing here needs postinstall.
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Run the prediction refresh
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "simulate_failure requested; failing to exercise the repair job"
            exit 1
          fi
          bash .build/prediction-refresh.sh

  # PR-gated like poll-agent.yml's repair job: the agent works a
  # repair/prediction-<run> branch with no git credentials; the workflow
  # pushes the branch and opens the PR. Nothing reaches main unreviewed.
  repair:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write        # push the repair branch (and only the branch)
      pull-requests: write   # open the PR
      issues: write          # circuit-breaker alert issues + labels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc

      - name: Install puppeteer-core (best effort, for the gated share-card redraw)
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      # A daily refresh of a persistent defect would otherwise spend an agent
      # session forever. Breaker counts repair PRs in 24h.
      - name: Circuit breaker
        id: breaker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .build/repair-gate.sh prediction

      - name: Alert when the circuit breaker is tripped
        if: steps.breaker.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .build/alert-issue.sh \
            "Repair circuit breaker: prediction" \
            "Three repair-agent PRs in 24h and the prediction refresh is still failing — [failed run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). No further agent sessions this window; this needs a human."

      - name: Prepare a credential-free repair branch
        id: branch
        if: steps.breaker.outputs.allowed == 'true'
        run: |
          BRANCH="repair/prediction-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config --unset-all http.https://github.com/.extraheader || true
          git config --unset-all url."https://github.com/".insteadOf || true
          git config --unset-all url."git@github.com:".insteadOf || true

      # Pinned for the same reason as poll-agent.yml — bump both together.
      - name: Install Matilda CLI
        if: steps.breaker.outputs.allowed == 'true'
        run: npm i -g @maincode-ai/matilda-code@0.21.4

      # Deliberately NO GITHUB_TOKEN here: the workflow owns every remote op.
      - name: Run the repair agent
        if: steps.breaker.outputs.allowed == 'true'
        env:
          MATILDA_API_KEY: ${{ secrets.MATILDA_API_KEY }}
          CHROME: /usr/bin/google-chrome
          GIT_TERMINAL_PROMPT: "0"
          AUSPOL_PR_GATE: "1" # push_main in the wrappers leaves commits local
        run: |
          if [ -z "$MATILDA_API_KEY" ]; then
            echo "::warning::MATILDA_API_KEY secret not set; skipping repair. Add it in repo Settings > Secrets."
            exit 0
          fi
          matilda -p "$(cat .build/prediction-repair-prompt.md)" --yolo --output-format text --max-wall-time 25m --max-tool-calls 80

      - name: Push the repair branch and open a PR
        if: steps.breaker.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! git log --oneline origin/main..HEAD | grep -q .; then
            echo "the agent left no commits; nothing to PR (its report is in the log above)"
            exit 0
          fi
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:${BRANCH}"
          gh label create repair-agent --force --description "Opened by a repair agent; human review required" --color 0E8A16 || true
          printf '%s\n\n%s\n\n%s\n' \
            "Automated repair attempt for the failing /prediction/ refresh pipeline — [run](${RUN_URL})." \
            "**Review before merging.** Nothing here has touched main or the live site; merging deploys it." \
            "Expected shape of an honest repair: generator fix only, guard checks intact, no data rows hand-edited, no workflow or permissions changes. Reject anything else." \
            > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --label repair-agent \
            --title "Repair: prediction pipeline (run ${GITHUB_RUN_ID})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          gh pr view --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"
