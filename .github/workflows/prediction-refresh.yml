# /prediction/ daily refresh — runs .build/prediction-refresh.sh daily.
# The wrapper's --if-due gate makes an already-done day a cheap no-op (one
# record per Sydney date); on a new day it refreshes
# data/prediction-history.json + prediction/index.html, rebuilds the sitemap,
# and commits "Refresh re-election model read as at <date>".
#
# The generator's model scripts read `git show origin/main:data/polls.json`,
# so checkout needs fetch-depth 0 for the origin/main ref to exist.
#
# Failure path: when the deterministic update job fails (generator guard,
# build error, push failure), the central agent-repair.yml (triggered by this
# run's failure event) boots headless Matilda straight onto main with the
# prompt in .build/prediction-repair-prompt.md.

name: prediction-refresh

on:
  schedule:
    - cron: '0 3 * * *' # 13:00 AEST daily — due-day no-ops are seconds
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Every push-capable workflow shares one concurrency group so two writers
# can never be mid-flight against main at the same time. Serialised, not
# cancelled: a queued run still gets its slot.
concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)
        with:
          fetch-depth: 0 # model scripts read git show origin/main:...

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the gated share-card redraw)
        # Version lives in package-lock.json; render-card.mjs resolves it from
        # repo node_modules. --ignore-scripts: nothing here needs postinstall.
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Run the prediction refresh
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "simulate_failure requested; failing to exercise the repair job"
            exit 1
          fi
          bash .build/prediction-refresh.sh
