# Fox & Hedgehog poll updater. Roughly monthly cadence (Daily Telegraph
# National Voter Sentiment Survey); cheap daily sweep of the news-den RSS.

name: foxhedgehog-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Fox & Hedgehog: declared stopped
    - cron: '35 20 * * *' # daily 06:35 — daily sweep
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: foxhedgehog
      wrapper: .build/foxhedgehog-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
