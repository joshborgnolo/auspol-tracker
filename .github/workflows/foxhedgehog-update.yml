# Fox & Hedgehog poll updater. Roughly monthly cadence (Daily Telegraph
# National Voter Sentiment Survey); cheap daily sweep of the news-den RSS.

name: foxhedgehog-update

on:
  schedule:
    - cron: '35 20 * * *' # 06:35 AEST daily
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: foxhedgehog
      wrapper: .build/foxhedgehog-updater.sh
      repair_prompt: .build/foxhedgehog-repair-prompt.md
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
