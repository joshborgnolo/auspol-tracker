# SEC Newgate Mood of the Nation. SEC Newgate publishes no voting
# intention: its bi-monthly tracking study feeds only the National-direction
# panel. A report goes up within days of its fieldwork closing, on no fixed
# weekday, in office hours (11:16–17:24 Sydney so far, Mon–Wed). Until
# 2026-10-06 one evening cron line fetched it, which GitHub ran 4–9 hours
# late; now the dispatch clock combs the weekday hours every 20 minutes (the
# block below, measured by .build/tune-schedules.mjs from the direction rows'
# upload stamps, which also feeds .build/dispatch-clock/schedule.json). Each
# dispatched run first asks the media API whether anything is new
# (poll-agent.yml's `probe`) and ends in seconds when nothing is. The
# hand-authored evening line after the block is the daily full run (no
# probe), and the weekly crosstabs run runs the extractor too, as the
# backstop and the quiet alarm.

# schedule-tune: weekly only — a wave every month or two; the weekly tune
# re-measures soon enough, and ~25 comb runs a weekday would each spawn a
# no-op tuner run.

name: secnewgate-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+11 at generation.
    # SEC Newgate: no weekday habit; files 11:16–17:24 eastern (last 7 timed releases, newest 2026-09-22T15:29)
    - cron: '0,20,40 0 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 11:00–11:40 — weekday release hours, every 20 min
    - cron: '0,20,40 1 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 12:00–12:40 — weekday release hours, every 20 min
    - cron: '0,20,40 2 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 13:00–13:40 — weekday release hours, every 20 min
    - cron: '0,20,40 3 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 14:00–14:40 — weekday release hours, every 20 min
    - cron: '0,20,40 4 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 15:00–15:40 — weekday release hours, every 20 min
    - cron: '0,20,40 5 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 16:00–16:40 — weekday release hours, every 20 min
    - cron: '0,20,40 6 * * 1,2,3,4,5' # Mon/Tue/Wed/Thu/Fri 17:00–17:40 — weekday release hours, every 20 min
    - cron: '0 7 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 18:00 — weekday release hours, every 20 min
    - cron: '0 8 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 19:00 — follow-up
    - cron: '0 9 * * 1,2,3,4,5'       # Mon/Tue/Wed/Thu/Fri 20:00 — follow-up
    - cron: '30 11 * * 1,2,3,4,5'     # Mon/Tue/Wed/Thu/Fri 22:30 — late backstop
    # tune-schedules:end
    - cron: '25 10 * * *' # 20:25 AEST / 21:25 AEDT daily — the daily full run
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: secnewgate
      wrapper: .build/secnewgate-updater.sh
      probe: .build/extract-secnewgate.mjs
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
