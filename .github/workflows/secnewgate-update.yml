# SEC Newgate Mood of the Nation, daily. SEC Newgate publishes no voting
# intention: its bi-monthly tracking study feeds only the National-direction
# panel. A report goes up within days of its fieldwork closing, on no fixed
# weekday, so one check each evening lands it soon after it goes up. The
# wrapper (.build/secnewgate-updater.sh) is a no-op in seconds when nothing
# is new. The weekly crosstabs run runs the extractor too, as the backstop
# and the quiet alarm.
#
# No dispatch-clock slot: a run GitHub starts hours late, or drops, only
# moves the pickup to the next run, and nothing is lost.

name: secnewgate-update

on:
  schedule:
    - cron: '25 10 * * *' # 20:25 AEST / 21:25 AEDT daily
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: secnewgate
      wrapper: .build/secnewgate-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
