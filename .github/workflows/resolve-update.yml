# Resolve Political Monitor updater (SMH interactive). Monthly waves, but a
# cheap daily no-op sweep means we never need to know which Sunday they pick;
# the Sunday-evening comb (Nine pushes wave payloads on release-night
# evenings — the 2026-09-13 wave landed 22:03 AEST) is generated between the
# tune-schedules markers by .build/tune-schedules.mjs from the house's own
# recorded release times.

name: resolve-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Resolve: Sun habit (11/12 recent dated releases); files 17:50–18:00 eastern (last 8 timed releases, newest 2026-09-13T18:00)
    - cron: '0 21 * * *'               # daily 07:00 — daily sweep
    - cron: '40,50 7 * * 0'            # Sun 17:40–17:50 — release window, every 10 min
    - cron: '0,10,20,30,40,50 8 * * 0' # Sun 18:00–18:50 — release window, every 10 min
    - cron: '0 9 * * 0'                # Sun 19:00 — release window, every 10 min
    - cron: '0 10 * * 0'               # Sun 20:00 — follow-up
    - cron: '0 11 * * 0'               # Sun 21:00 — follow-up
    - cron: '0 12 * * 0'               # Sun 22:00 — follow-up
    - cron: '30 12 * * 0'              # Sun 22:30 — late backstop
    - cron: '0 9 * * 1'                # Mon 19:00 — next-day
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: resolve
      wrapper: .build/resolve-rpm-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
