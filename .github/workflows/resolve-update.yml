# Resolve Political Monitor updater (SMH interactive). Monthly waves, but a
# cheap daily no-op sweep means we never need to know which Sunday they pick.

name: resolve-update

on:
  schedule:
    - cron: '0 21 * * *' # 07:00 AEST daily
    - cron: '0 13 * * *' # 23:00 AEST daily — Nine pushes wave payloads on
      # release-night evenings (2026-09-13 wave landed 22:03 AEST, after the
      # morning run and after the launchd backup's dirty-tree refusal)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: resolve
      wrapper: .build/resolve-rpm-updater.sh
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
