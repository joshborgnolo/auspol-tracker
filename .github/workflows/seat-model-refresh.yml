# /model/ daily run — runs .build/seat-model-refresh.sh.
# The election model re-runs only when the polls (or another of its inputs)
# have moved since the committed run: .build/model/refresh.mjs rebuilds the
# vote layer, compares it, and on a change runs the nowcast and the
# election-day forecast (20,000 simulated elections each), rebuilds the
# page's stores and bundle and checks the page still reproduces the engine;
# the wrapper then rebuilds the site (the More menu quotes the run) and
# commits "Election model: daily run on the polls to <date>".
#
# The dispatch clock (.build/dispatch-clock/, FIXED_SLOTS in
# tune-schedules.mjs) starts this at 06:30 Sydney, after the evening releases
# have been filed; this cron is the backup. The gate makes whichever run
# comes second a no-op unless a poll landed in between.
#
# Failure path: agent-repair.yml (triggered by this run's failure event)
# boots the repair agent with .build/seat-model-repair-prompt.md.

name: seat-model-refresh

on:
  schedule:
    # tune-fixed:begin — generated by .build/tune-schedules.mjs from FIXED_SLOTS; edit there.
    # The dispatch clock fires this same slot on the Sydney minute; this cron is the backup.
    - cron: '30 19 * * *' # daily 06:30 Sydney — twin of the dispatch-clock slot
    # tune-fixed:end
  workflow_dispatch:
    inputs:
      force:
        description: 'Run the model even if none of its inputs moved'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Its own group, like prediction-refresh: push_main resolves a race with
# another writer itself.
concurrency:
  group: seat-model-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Pin Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the gated share-card redraw)
        # refresh_site's card and favicon renders resolve it from node_modules
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Run the election model
        env:
          CHROME: /usr/bin/google-chrome
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            bash .build/seat-model-refresh.sh --force
          else
            bash .build/seat-model-refresh.sh
          fi

      - name: Show the log
        if: always()
        run: tail -n 40 .build/logs/seat-model.log 2>/dev/null || true
