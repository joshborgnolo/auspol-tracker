# Roy Morgan poll update pipeline — cloud-scheduled (replaces/supplements the
# local launchd job so the site updates while the laptop is shut).
#
# Roy Morgan normally releases its federal voting-intention poll on Monday
# afternoons (AEST), so Monday 16:00-18:00 AEST gets a dense 10-minute cadence
# until the wave is caught; the extractor is idempotent, so extra slots are
# no-ops once polls.json holds the wave. The local launchd job stays installed
# as a backup — roymorgan-updater.sh fast-forwards to origin/main and skips
# its slot if main moved underneath it, so the two can coexist.
#
# AEST = UTC+10 (no DST in Brisbane, but Melbourne/Sydney DST means AEDT slots
# run ~1h late — acceptable, the cadence still brackets the release window).
#
# Failure path: when the deterministic update job fails (guard trip, parse
# error, upstream format change), the repair job boots headless Matilda with
# MATILDA_API_KEY (repo secret) and the prompt in .build/roymorgan-repair-prompt.md.

name: roymorgan-update

on:
  schedule:
    # Mon 16:05-17:45 AEST, every ~10 min (06:05-07:45 UTC) — release window
    - cron: '5,15,25,35,45,55 6 * * 1'
    - cron: '5,15,25,35,45 7 * * 1'
    # Mon evening follow-ups AEST (08:00, 12:30 UTC)
    - cron: '0 8 * * 1'
    - cron: '30 12 * * 1'
    # Tue 06:00 & 19:00 AEST (20:00 Mon / 09:00 Tue UTC)
    - cron: '0 20 * * 1'
    - cron: '0 9 * * 2'
    # Nightly sweep 06:00 AEST Wed-Sun (20:00 UTC)
    - cron: '0 20 * * 2,3,4,5,6,0'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Every push-capable workflow shares one concurrency group so two writers
# can never be mid-flight against main at the same time. Serialised, not
# cancelled: a queued run still gets its slot.
concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the share-card redraw)
        # Version lives in package-lock.json; render-card.mjs resolves it
        # from repo node_modules. --ignore-scripts: no postinstall needed.
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Run the Roy Morgan updater
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "simulate_failure requested; failing to exercise the repair job"
            exit 1
          fi
          bash .build/roymorgan-updater.sh

  # PR-gated like poll-agent.yml's repair job: the agent works on a
  # repair/roymorgan-<run> branch with no git credentials; the workflow pushes
  # the branch and opens the PR. Nothing reaches main unreviewed.
  repair:
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write        # push the repair branch (and only the branch)
      pull-requests: write   # open the PR
      issues: write          # circuit-breaker alert issues + labels
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc

      # 12 Monday slots: a persistent upstream breakage would otherwise fire
      # a repair agent every 10 minutes. Breaker counts repair PRs in 24h.
      - name: Circuit breaker
        id: breaker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .build/repair-gate.sh roymorgan

      - name: Alert when the circuit breaker is tripped
        if: steps.breaker.outputs.allowed == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .build/alert-issue.sh \
            "Repair circuit breaker: roymorgan" \
            "Three repair-agent PRs in 24h and the Roy Morgan updater is still failing — [failed run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). No further agent sessions this window; this needs a human."

      - name: Prepare a credential-free repair branch
        id: branch
        if: steps.breaker.outputs.allowed == 'true'
        run: |
          BRANCH="repair/roymorgan-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git config --unset-all http.https://github.com/.extraheader || true
          git config --unset-all url."https://github.com/".insteadOf || true
          git config --unset-all url."git@github.com:".insteadOf || true

      # Pinned for the same reason as poll-agent.yml — bump both together.
      - name: Install Matilda CLI
        if: steps.breaker.outputs.allowed == 'true'
        run: npm i -g @maincode-ai/matilda-code@0.21.4

      # Deliberately NO GITHUB_TOKEN here: the workflow owns every remote op.
      - name: Run the repair agent
        if: steps.breaker.outputs.allowed == 'true'
        env:
          MATILDA_API_KEY: ${{ secrets.MATILDA_API_KEY }}
          CHROME: /usr/bin/google-chrome
          GIT_TERMINAL_PROMPT: "0"
          AUSPOL_PR_GATE: "1" # push_main in the wrappers leaves commits local
        run: |
          if [ -z "$MATILDA_API_KEY" ]; then
            echo "::warning::MATILDA_API_KEY secret not set; skipping repair. Add it in repo Settings > Secrets."
            exit 0
          fi
          matilda -p "$(cat .build/roymorgan-repair-prompt.md)" --yolo --output-format text --max-wall-time 25m --max-tool-calls 80

      - name: Push the repair branch and open a PR
        if: steps.breaker.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! git log --oneline origin/main..HEAD | grep -q .; then
            echo "the agent left no commits; nothing to PR (its report is in the log above)"
            exit 0
          fi
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "HEAD:${BRANCH}"
          gh label create repair-agent --force --description "Opened by a repair agent; human review required" --color 0E8A16 || true
          printf '%s\n\n%s\n\n%s\n' \
            "Automated repair attempt for the failing Roy Morgan update pipeline — [run](${RUN_URL})." \
            "**Review before merging.** Nothing here has touched main or the live site; merging deploys it." \
            "Expected shape of an honest repair: extractor/parser fix only, guard checks intact, no data rows hand-edited, no workflow or permissions changes. Reject anything else." \
            > "$RUNNER_TEMP/pr-body.md"
          gh pr create \
            --label repair-agent \
            --title "Repair: roymorgan pipeline (run ${GITHUB_RUN_ID})" \
            --body-file "$RUNNER_TEMP/pr-body.md"
          gh pr view --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"
