# Roy Morgan poll update pipeline — cloud-scheduled (replaces/supplements the
# local launchd job so the site updates while the laptop is shut).
#
# Roy Morgan normally releases its federal voting-intention poll on Monday
# afternoons (eastern), so the release window gets a dense 10-minute comb
# until the wave is caught; the extractor is idempotent, so extra slots are
# no-ops once polls.json holds the wave. The local launchd job stays installed
# as a backup — roymorgan-updater.sh fast-forwards to origin/main and skips
# its slot if main moved underneath it, so the two can coexist.
#
# The cron block between the tune-schedules markers is GENERATED by
# .build/tune-schedules.mjs (run by schedule-tune.yml whenever a wave lands
# and weekly for the DST offset) from the house's recorded `published` clock
# times — edit the recipe there, not the lines here.
#
# Failure path: when the deterministic update job fails (guard trip, parse
# error, upstream format change), the central agent-repair.yml (triggered by
# this run's failure event) boots headless Matilda straight onto main with
# the prompt in .build/roymorgan-repair-prompt.md.

name: roymorgan-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Roy Morgan: Mon habit (declared in pollsterRules); files 15:56–17:00 eastern (last 8 timed releases, newest 2026-09-21T15:56)
    - cron: '0 20 * * *'               # daily 06:00 — daily sweep
    - cron: '40,50 5 * * 1'            # Mon 15:40–15:50 — release window, every 10 min
    - cron: '0,10,20,30,40,50 6 * * 1' # Mon 16:00–16:50 — release window, every 10 min
    - cron: '0,10,20,30,40 7 * * 1'    # Mon 17:00–17:40 — release window, every 10 min
    - cron: '0 8 * * 1'                # Mon 18:00 — follow-up
    - cron: '0 9 * * 1'                # Mon 19:00 — follow-up
    - cron: '0 10 * * 1'               # Mon 20:00 — follow-up
    - cron: '30 12 * * 1'              # Mon 22:30 — late backstop
    - cron: '0 9 * * 2'                # Tue 19:00 — next-day
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Every push-capable workflow shares one concurrency group so two writers
# can never be mid-flight against main at the same time. Serialised, not
# cancelled: a queued run still gets its slot.
concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-09-05)

      - name: Pin Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-09-05)
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install puppeteer-core (best effort, for the share-card redraw)
        # Version lives in package-lock.json; render-card.mjs resolves it
        # from repo node_modules. --ignore-scripts: no postinstall needed.
        run: npm ci --ignore-scripts --no-audit --no-fund || true

      - name: Run the Roy Morgan updater
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          if [ "${{ inputs.simulate_failure }}" = "true" ]; then
            echo "simulate_failure requested; failing to exercise the repair job"
            exit 1
          fi
          bash .build/roymorgan-updater.sh
