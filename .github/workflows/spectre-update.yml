# Spectre Strategy poll updater. Roughly quarterly cadence (Australian
# Federal Political Update report); cheap daily sweep of the blog RSS.

name: spectre-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+10 at generation.
    # Spectre Strategy: no weekday habit; files 10:30–12:25 eastern (last 4 timed releases, newest 2026-07-27T10:33)
    - cron: '50 20 * * *'   # daily 06:50 — daily sweep
    - cron: '20,50 0 * * *' # daily 10:20–10:50 — release hours (no weekday habit)
    - cron: '30 3 * * *'    # daily 13:30 — release hours (no weekday habit)
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: spectre
      wrapper: .build/spectre-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
