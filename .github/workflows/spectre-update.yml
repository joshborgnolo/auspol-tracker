# Spectre Strategy poll updater. Roughly quarterly cadence (Australian
# Federal Political Update report); cheap daily sweep of the blog RSS.

name: spectre-update

on:
  schedule:
    # tune-schedules:begin — generated by .build/tune-schedules.mjs; edit the recipe there,
    # or add hand-authored slots after the end marker. Eastern UTC+11 at generation.
    # Spectre Strategy: no weekday habit; files 09:13–12:25 eastern (last 5 timed releases, newest 2026-11-09T09:13)
    - cron: '50 19 * * *' # daily 06:50 — daily sweep
    - cron: '0 22 * * *'  # daily 09:00 — release hours (no weekday habit)
    - cron: '30 23 * * *' # daily 10:30 — release hours (no weekday habit)
    - cron: '30 2 * * *'  # daily 13:30 — release hours (no weekday habit)
    # tune-schedules:end
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Force the update job to fail (tests the Matilda repair job)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# the ceiling for poll-agent.yml's update job: it may never ask for more
permissions:
  contents: write
  actions: read # poll-agent's transient-streak check reads earlier runs

jobs:
  run:
    uses: ./.github/workflows/poll-agent.yml
    with:
      house: spectre
      wrapper: .build/spectre-updater.sh
      apt_packages: poppler-utils
      simulate_failure: ${{ inputs.simulate_failure }}
    secrets: inherit
