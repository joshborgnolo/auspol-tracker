<!DOCTYPE html>

<head>

<style>
/* VOICE the morning paper's poll ledger: every poll this term, plainly, newest first
   IDEA the results column of a broadsheet: one line a poll, the figures as printed, a facet a page
   PICTURE each poll's figures in party colour with their margins; opened, the poll against the model that week
   COLOUR warm white ground, indigo ink, the parties' own colours for figures only
   TYPE Georgia for the head and the months, Commissioner for names and figures
   LAYOUT phone: two lines a poll; laptop: one row a poll in columns, the month bar carrying the column names */
@font-face{font-family:"Commissioner";font-style:normal;font-weight:400 700;font-display:swap;src:url("{{FONT}}") format("woff2")}
:root{color-scheme:light;--bg:#fbf6f1;--ink:#1d1b33;--ink2:#4a4660;--mute:#686477;--rule:#e8e0d7;--rule2:#c9bfb4;--alp:#cf3a2f;--lnp:#2a5cb4;--on:#dc6a16;--grn:#1d7a52;--oth:#8d8799;--pos:#1f7a78;--neg:#7a5340;--hi:#fff1d6;--navh:52px;--g:max(18px,env(safe-area-inset-left));--col:max(var(--g),calc((100vw - 1180px)/2));--serif:Georgia,"Times New Roman",serif;--sans:"Commissioner","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14132a;--ink:#f3eee8;--ink2:#cbc6d6;--mute:#a39fb3;--rule:#2a2843;--rule2:#4a4764;--alp:#e65548;--lnp:#5b88e4;--on:#d6762a;--grn:#23906a;--oth:#8f8aa3;--pos:#3aa7a4;--neg:#b7836a;--hi:#2c2a4a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14132a;--ink:#f3eee8;--ink2:#cbc6d6;--mute:#a39fb3;--rule:#2a2843;--rule2:#4a4764;--alp:#e65548;--lnp:#5b88e4;--on:#d6762a;--grn:#23906a;--oth:#8f8aa3;--pos:#3aa7a4;--neg:#b7836a;--hi:#2c2a4a}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--navh) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* nav, as the votes pages' */
.nav{position:sticky;top:0;z-index:20;height:calc(var(--navh) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(6px,env(safe-area-inset-right),calc((100vw - 1180px)/2 - 12px)) 0 var(--col);display:flex;align-items:center;gap:4px;background:var(--bg);box-shadow:0 1px 0 var(--rule)}
.links{display:flex;gap:20px;margin:0 6px 0 auto}
.links a,.mark{color:inherit;text-decoration:none}
.links a{font-size:15px;opacity:.7;padding:12px 0;position:relative}
.links a[aria-current]{opacity:1}
.links a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1.5px;border-radius:1px;background:currentColor}
.mark{font-weight:600;font-size:16px;letter-spacing:-.01em;padding:12px 0;white-space:nowrap}
.burger{width:44px;height:44px;flex:none;border:0;background:none;color:inherit;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:10px}
.burger b{display:grid;gap:5px}
.burger i{display:block;width:20px;height:1.6px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(6.6px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-6.6px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:15;background:#0b1433;color:#f3f0ff;padding:calc(var(--navh) + env(safe-area-inset-top) + 20px) var(--g) calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px;overflow:auto}
.menu[hidden]{display:none}
.menu ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.menu a,.menu .soon{font:400 clamp(30px,8.6vw,44px)/1.18 var(--serif);letter-spacing:-.015em;color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px}
.menu .soon{color:#8f95bd}
.menu .soon small{font:500 12.5px/1 var(--sans);letter-spacing:0;color:#9aa0c6;border:1px solid #39416d;border-radius:99px;padding:5px 9px}
.nav.open{color:#f3f0ff;background:transparent;box-shadow:none}
/* the page */
main{padding:0 max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) var(--g)}
.wrap{max-width:1180px;margin:0 auto}
.hd{padding:clamp(22px,4vh,44px) 0 6px}
h1{font:400 clamp(28px,7.3vw,46px)/1.06 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.dek{margin:8px 0 0;font-size:clamp(15px,3.9vw,17px);line-height:1.45;color:var(--ink2);max-width:62ch;text-wrap:pretty}
/* the polls pages' own switch: every poll on record, or the ones still to come */
.sub{display:flex;gap:20px;margin:0 0 12px}
.sub a{font-size:15px;color:inherit;text-decoration:none;opacity:.7;padding:4px 0;position:relative}
.sub a[aria-current]{opacity:1}
.sub a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;border-radius:1px;background:currentColor}
/* facets, search and filters */
.tabs{display:flex;gap:2px;margin:18px 0 0;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:500 14px/1 var(--sans);color:var(--ink2);background:none;border:0;border-radius:999px;padding:0 14px;height:34px;cursor:pointer;white-space:nowrap;flex:none}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgb(20 10 40/.08)}
.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:12px 0 10px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;font:400 15px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:999px;height:36px;padding:0 14px 0 34px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute)}
.search svg{position:absolute;left:12px;top:11px;width:14px;height:14px;color:var(--mute)}
.pick select{font:500 14px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:999px;height:36px;padding:0 32px 0 14px;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg button{font:500 13.5px/1 var(--sans);color:var(--ink2);background:none;border:0;border-radius:999px;padding:0 12px;height:30px;cursor:pointer;white-space:nowrap}
.seg button[aria-checked=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgb(20 10 40/.08)}
.count{font-size:13.5px;color:var(--mute);margin-left:auto}
.fopt[hidden]{display:none}
.fdek{font-size:14.5px;color:var(--ink2);margin:10px 0 0;max-width:70ch}
/* the ledger: each month a section, its bar sticky under the nav, carrying the column names */
.month{position:sticky;top:calc(var(--navh) + env(safe-area-inset-top));z-index:5;background:var(--bg);box-shadow:0 -3px 0 var(--bg),0 1px 0 var(--rule2);margin-top:12px}
.mrow{display:flex;align-items:baseline;gap:10px;padding:12px 0 7px}
.mrow h2{font:400 21px/1.2 var(--serif);margin:0}
.mrow span{font-size:13px;color:var(--mute)}
.cols{display:none}
ol{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--rule)}
.row>button{all:unset;box-sizing:border-box;display:grid;width:100%;cursor:pointer;padding:10px 4px;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"who fw n" "fig fig fig";row-gap:5px;column-gap:8px;border-radius:8px;transition:background-color .6s}
.row>button:focus-visible{outline:2px solid var(--ink2);outline-offset:-2px}
.row>button:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.who{grid-area:who;display:flex;align-items:baseline;gap:8px;min-width:0}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small,.fw small,.n small{display:none}
.fw{grid-area:fw;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:baseline}
.n{grid-area:n;font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;align-self:baseline;text-align:right}
.fig{grid-area:fig;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums;align-items:baseline}
.f{white-space:nowrap;font-size:14.5px}
.f>i{font-style:normal;color:var(--mute);font-size:12.5px;margin-right:4px}
.f b{font-weight:600;color:var(--c,var(--ink))}
.f em{font-style:normal;font-size:11.5px;color:var(--mute);margin-left:3px}
.f .lab{display:block;font-size:12px;color:var(--mute);font-weight:400}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--rule2);border-radius:99px;padding:1px 7px;white-space:nowrap}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;width:100%;min-width:90px;max-width:220px;margin-top:3px;background:var(--rule)}
.bar i{display:block;height:100%}
.f.wide{flex-basis:100%}
.row.flash>button{background:var(--hi)}
.empty{color:var(--mute);font-size:15px;padding:24px 4px}
.sigw{max-width:920px}
.sig-say{margin-bottom:10px}
.sig-row{display:grid;gap:10px}
.sig-tri{display:block;width:280px;max-width:100%;height:auto;overflow:visible}
.sig-text{font-size:13px;line-height:1.5}
.sig-text p+p{margin-top:8px}
.tri-kite{fill-opacity:.12;stroke:none}
.tri-grid{stroke:var(--mute);stroke-opacity:.18;stroke-width:.75}
.tri-edge{fill:none;stroke:var(--ink2);stroke-width:1}
.tri-med{stroke:var(--ink);stroke-width:1.25}
.tri-med.dash{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.tri-blob{fill-opacity:.62;stroke:none}
.tri-blobline{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1}
.tri-dot{fill:#fff;stroke:var(--ink);stroke-width:1.25}
.tri-v{font:600 13px var(--sans)}
@media (min-width:700px){.sig-row{grid-template-columns:280px minmax(0,1fr);gap:22px}}
/* a poll opened */
.det{padding:4px 4px 18px;display:grid;gap:12px;font-size:14px;color:var(--ink2)}
.det[hidden]{display:none}
.det p{margin:0;line-height:1.45}
.det h3{font:600 13px/1.2 var(--sans);color:var(--ink);margin:6px 0 0}
.det .nocaps{white-space:nowrap;text-transform:none}
.det a{color:var(--ink);text-underline-offset:2px}
.lk{display:flex;flex-wrap:wrap;gap:6px 16px}
.lk a.pend{color:var(--mute);text-decoration-style:dotted}
.vs{display:grid;grid-template-columns:5.6em minmax(0,1fr) 7.6em;align-items:center;column-gap:10px;row-gap:6px;max-width:560px}
.vs .nm{font-weight:500;color:var(--ink2);white-space:nowrap}
.vs .tr{position:relative;height:14px}
.vs .tr::before{content:"";position:absolute;left:0;right:0;top:6.5px;height:1px;background:var(--rule)}
.vs .tr s{position:absolute;top:1px;width:2px;height:12px;margin-left:-1px;background:var(--ink);opacity:.55}
.vs .tr i{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c)}
.vs .vl{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.vs .vl b{font-weight:600;color:var(--ink)}
.vs .vl span{color:var(--mute)}
.key{font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:9px;height:9px;border-radius:50%;background:var(--ink2);display:inline-block}
.key s{width:2px;height:11px;background:var(--ink);opacity:.55;display:inline-block}
.tb{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;max-width:100%}
.tb th,.tb td{padding:3px 12px 3px 0;text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;font-weight:500;color:var(--ink2)}
.tb thead th{font-weight:500;color:var(--mute);font-size:12.5px}
.scroll{overflow-x:auto}
.note{font-size:13.5px;color:var(--mute);margin:28px 0 0;line-height:1.5;max-width:72ch}
@media (min-width:900px){
.cols{display:grid;padding:2px 4px 7px;font-size:12.5px;color:var(--mute);align-items:end}
.cols span{text-align:right}.cols span:nth-child(-n+3){text-align:left}.cols span:nth-child(3){text-align:right}
.cols,.row>button{grid-template-areas:none;column-gap:12px;align-items:baseline}
.who,.fw,.n,.fig{grid-area:auto}
.who{display:block;grid-column:1}
.who small,.fw small,.n small{display:block;font-size:12.5px;color:var(--mute);font-weight:400;white-space:nowrap}
.fw{grid-column:2;display:block;overflow:visible}
.n{grid-column:3}
.fig{display:contents}
.f{text-align:right;font-size:15px}
.f>i{display:none}
.f .lab{text-align:right}
.f.wide{flex-basis:auto;text-align:left}
.row>button{padding:9px 4px}
body[data-f=primary] .cols,body[data-f=primary] .row>button{grid-template-columns:minmax(140px,1.3fr) minmax(118px,1fr) 7.4rem repeat(5,5.1rem) 5.6rem}
body[data-f=twopp] .cols,body[data-f=twopp] .row>button{grid-template-columns:minmax(140px,1.3fr) minmax(118px,1fr) 7.4rem 9.6rem 5rem 5rem minmax(0,1fr)}
body[data-f=leaders] .cols,body[data-f=leaders] .row>button{grid-template-columns:minmax(140px,1.3fr) minmax(118px,1fr) 7.4rem 12.5rem repeat(3,5.6rem) minmax(0,1fr)}
body[data-f=direction] .cols,body[data-f=direction] .row>button{grid-template-columns:minmax(140px,1.3fr) minmax(118px,1fr) 7.4rem repeat(3,5.4rem) 5.8rem minmax(140px,1fr)}
body[data-f=issues] .cols,body[data-f=issues] .row>button{grid-template-columns:minmax(130px,1.2fr) minmax(110px,1fr) 6.6rem repeat(6,minmax(5.6rem,1fr))}
body[data-f=demographics] .cols,body[data-f=demographics] .row>button{grid-template-columns:minmax(140px,1.3fr) minmax(118px,1fr) 7.4rem repeat(5,5.4rem) minmax(0,1fr)}
body[data-f=confidence] .cols,body[data-f=confidence] .row>button{grid-template-columns:minmax(150px,1.4fr) minmax(118px,1fr) 7.4rem 6rem 6rem minmax(0,1fr)}
body[data-f=issues] .f,body[data-f=direction] .f.wide{text-align:left}
}
@media (prefers-reduced-motion:reduce){.row>button{transition:none}}
/* the mark's sun: the hero in miniature, on its sky, beside the name once the hero has scrolled away */
:root{--lz:#0b1640;--lm:#23498f;--ll:#c98a8f;--lh:#f2b07f}
:root[data-sky=set]{--lz:#141a4c;--lm:#3b3a8c;--ll:#b4588f;--lh:#ff8a5a}
.mark{display:inline-flex;align-items:center}
.logo{display:block;width:0;height:26px;flex:none;opacity:0;transform:scale(.55);margin-right:0;border-radius:50%;transition:width .4s cubic-bezier(.3,.9,.3,1),margin-right .4s cubic-bezier(.3,.9,.3,1),opacity .3s,transform .4s cubic-bezier(.3,.9,.3,1)}
.nav .logo{width:26px;opacity:1;transform:none;margin-right:9px}
@media (prefers-reduced-motion:reduce){.logo{transition:none}}

</style>

<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const DATA=JSON.parse($('#polls-data').textContent);

{let pref='auto';try{pref=localStorage.getItem('apt-sky')||'auto'}catch(e){}const h=new Date().getHours();document.documentElement.dataset.sky=pref==='rise'||pref==='set'?pref:h>=4&&h<15?'rise':'set'}

/* ---------- each figure's ± at 95%: the site's rules (rd-allpolls.jsx) ----------
   a primary share: a Beta credible interval on a Jeffreys prior, var = κ·s(1−s)/n + step²/12, n the effective
   sample (the house's, else the raw over the design effect, shrunk by an excluded undecided share), κ the house's
   noise in the model; a share of everyone: p(1−p)/n; a difference of two shares from one sample (a net rating,
   right minus wrong, an issue lead): (a + b − (a−b)²)/n; a group gap: each group's estimated sample (the poll's
   effective sample times the group's share of adults) */
const nEff=p=>/ \(MRP\)$/.test(p.h)?0:(p.se||(p.n?p.n/DATA.deff:0));
const lg=x=>{const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,.1208650973866179e-2,-.5395239384953e-5];let y=x,t=x+5.5;t-=(x+.5)*Math.log(t);let a=1.000000000190015;for(let k=0;k<6;k++)a+=g[k]/++y;return -t+Math.log(2.5066282746310005*a/x)};
const bcf=(a,b,x)=>{const T=1e-30;let c=1,d=1-(a+b)*x/(a+1);if(Math.abs(d)<T)d=T;d=1/d;let h=d;for(let m=1;m<=200;m++){const m2=2*m;let aa=m*(b-m)*x/((a-1+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;h*=d*c;aa=-(a+m)*(a+b+m)*x/((a+m2)*(a+1+m2));d=1+aa*d;if(Math.abs(d)<T)d=T;c=1+aa/c;if(Math.abs(c)<T)c=T;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h};
const ib=(a,b,x)=>{if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lg(a+b)-lg(a)-lg(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*bcf(a,b,x)/a:1-bt*bcf(b,a,1-x)/b};
const bq=(a,b,q)=>{let lo=0,hi=1;for(let k=0;k<50;k++){const m=(lo+hi)/2;if(ib(a,b,m)<q)lo=m;else hi=m}return (lo+hi)/2};
const stepOf=p=>{const vs=Object.values(p.p||{}).filter(v=>typeof v==='number');if(!vs.length||vs.every(v=>Math.abs(v-Math.round(v))<1e-6))return 1;return vs.every(v=>Math.abs(v*2-Math.round(v*2))<1e-6)?.5:.1};
const ciMemo=new Map();
function primMoe(p,v,und){
  if(v==null)return null;let n=nEff(p);if(!n)return null;
  if(!und&&p.u&&p.u.label==='excluded'&&p.u.v>0)n*=1-p.u.v/100;
  const s=Math.max(0,Math.min(100,+v))/100;if(!(s>0))return null;
  const kap=!und&&DATA.kappa&&DATA.kappa[p.h]!=null?DATA.kappa[p.h]:1,step=stepOf(p)/100,key=s.toFixed(4)+'|'+Math.round(n)+'|'+kap+'|'+step;
  if(ciMemo.has(key))return ciMemo.get(key);
  const vr=kap*s*(1-s)/n+step*step/12,m=Math.max(1,s*(1-s)/vr),lo=bq(s*m+.5,(1-s)*m+.5,.025),hi=bq(s*m+.5,(1-s)*m+.5,.975),r=50*(hi-lo);
  ciMemo.set(key,r);return r;

const shareMoe=(p,v)=>{const n=nEff(p);if(v==null||!n)return null;const s=Math.max(0,Math.min(100,+v))/100;return 196*Math.sqrt(s*(1-s)/n)};

/*{{SIGTRIANGLE}}*/
const DEM_SHARE={Women:.51,Men:.49,'18–34':.30,'55+':.36,'65+':.22,'50+':.44,'Gen Z':.21,Boomers:.21,University:.26,School:.45,'Year 12 or less':.45,'High School':.45,'No tertiary':.74,'Inner metro':.30,Rural:.24,'Regional or rural':.40,'Capital cities':.67,'Regional/rural areas':.33,Renting:.31,'Renting and other':.33,'Own outright':.31};
const gapMoe=(p,pr,k)=>{const sa=DEM_SHARE[pr.a],sb=DEM_SHARE[pr.b],va=pr.A[k],vb=pr.B[k];let n=nEff(p);if(!sa||!sb||va==null||vb==null||!n)return null;if(p.u&&p.u.label==='excluded'&&p.u.v>0)n*=1-p.u.v/100;const x=va/100,y=vb/100;return 196*Math.sqrt(x*(1-x)/(n*sa)+y*(1-y)/(n*sb))};

const issLead=own=>{if(!own)return null;const ps=['alp','lnp','onp','grn'].filter(k=>own[k]!=null).map(k=>[k,+own[k]]).sort((a,b)=>b[1]-a[1]);if(!ps.length)return null;const lead=ps.length>1?ps[0][1]-ps[1][1]:null;return {who:ps[0][0],v:ps[0][1],b:ps[1]?ps[1][1]:null,lead,level:lead!=null&&lead<.5}};

  if(p.p&&Object.keys(p.p).length){
    let s='<h3>Primary vote, %</h3>';
    if(p.mw){const vals=ORDER.map(k=>p.p[k]).filter(v=>v!=null),mx=Math.max(45,...vals,...p.mw)+2,pc=v=>(v/mx*100).toFixed(2)+'%';
      s+='<div class="vs">'+ORDER.map(k=>{const j=PK.indexOf(k),v=p.p[k],m=p.mw[j];if(v==null)return '';return `<span class="nm">${NAME[k]}</span><span class="tr" style="--c:var(--${CV[k]})"><s style="left:${pc(m)}"></s><i style="left:${pc(v)}"></i></span><span class="vl"><b>${num(v)}</b> <span>v ${f1(m)}</span></span>`}).join('')+'</div><div class="key"><span><i></i>this poll</span><span><s></s>the model that week</span></div>'}
    else s+='<p>'+ORDER.map(k=>p.p[k]!=null?NAME[k]+' '+num(p.p[k]):'').filter(Boolean).join(', ')+'.</p>';
    const c=p.chg&&p.chg.d,ref=c&&p.chg.r&&(p.chg.r.pAlp||Object.values(p.chg.r)[0]);
    if(c&&['pAlp','pLnp','pGrn','pOnp','pOth'].some(k=>c[k]!=null))s+=`<p>Against ${esc(p.h)}’s poll before${ref?' ('+esc(fday(ref))+')':''}: `+[['alp','pAlp'],['onp','pOnp'],['lnp','pLnp'],['grn','pGrn'],['oth','pOth']].filter(([,ck])=>c[ck]!=null).map(([k,ck])=>ABBR[k]+' '+sg(c[ck])).join(', ')+'.</p>';
    if(p.u&&p.u.v!=null)s+=`<p>${num(p.u.v)}% undecided, ${p.u.label==='included'?'kept in the shares':'left out of the shares'}.</p>`;
    if(F==='primary')s+=sigMark(p,nEff(p));
    sec.push(['primary',s]);
  }
  const tp=[];if(p.i!=null)tp.push('Labor '+num(p.i)+' against the Coalition');if(p.io!=null)tp.push(num(p.io)+' against One Nation');
  if(tp.length||p.t!=null||p.to!=null){let s='<h3>Two-party preferred</h3><p>'+(tp.length?'Implied by the 2025 flows: '+tp.join(', ')+'.':'')+(p.t!=null?' Published: '+num(p.t)+'–'+num(Math.round((100-p.t)*10)/10)+' against the Coalition'+(p.b2?' ('+esc(p.b2)+')':'')+'.':'')+(p.to!=null?' Published against One Nation: '+num(p.to)+'.':'')+'</p>';
    const y=p.yd&&(p.yd.imp||p.yd.lnp);if(y&&p.i!=null&&p.yd.imp)s+=`<p>Against the line at its fieldwork, estimated without it (${f1(p.yd.imp[0])}): ${sg(Math.round((p.i-p.yd.imp[0])*10)/10)}; the house’s lean then ${p.yd.imp[1]!=null?sg(Math.round(p.yd.imp[1]*10)/10):'–'}.</p>`;
    sec.push(['twopp',s])}
  const pp=ppmOf(p),nets=LEAD.map(([k,nm])=>{const a=p.ap&&p.ap[k];return a&&a.app!=null?`${nm} ${num(a.app)} approve, ${num(a.dis)} disapprove (net ${sg(a.app-a.dis)})`:null}).filter(Boolean);
  if(pp||nets.length)sec.push(['leaders','<h3>Leaders</h3>'+(nets.length?`<p>${nets.join('; ')}.</p>`:'')+((p.ppms||[]).length?'<p>Better prime minister: '+p.ppms.map(st=>['alb','taylor','hanson'].filter(k=>st[k]!=null).map(k=>LEAD.find(l=>l[0]===k)[1]+' '+num(st[k])).join(', ')+(st.label?' ('+esc(st.label)+')':'')).join('; ')+'.</p>':pp?`<p>Better prime minister: ${pp.ks.map(k=>LEAD.find(l=>l[0]===k)[1]+' '+num(pp.s[k])).join(', ')}.</p>`:'')]);
  if(p.dir&&p.dir.right!=null)sec.push(['direction',`<h3>Direction</h3><p>Right direction ${num(p.dir.right)}, wrong track ${num(p.dir.wrong)}${p.dir.unsure!=null?', unsure '+num(p.dir.unsure):''}${p.dir.chg&&p.dir.ref?' (net '+sg(p.dir.chg.net)+' on '+esc(fday(p.dir.ref))+')':''}.</p>`+(p.dir.bg||[]).map(g=>`<p>${esc(g.head)} ${g.cuts.map(c=>esc(c.label)+' '+num(c.right)+'–'+num(c.wrong)).join(', ')}</p>`).join('')]);
  if(p.iss&&(p.iss.own||p.iss.bp)){const ids=Object.keys(p.iss.own||{});let s='<h3>Issues</h3>';
    if(ids.length)s+=`<div class="scroll"><table class="tb"><thead><tr><th>Best on${p.iss.q?' ('+esc(p.iss.q)+')':''}</th>${['alp','onp','lnp','grn'].map(k=>`<th>${ABBR[k]}</th>`).join('')}</tr></thead><tbody>${ids.map(id=>`<tr><td>${esc(ISSL[id]||(DATA.issL||{})[id]||id)}</td>${['alp','onp','lnp','grn'].map(k=>`<td>${num(p.iss.own[id][k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(p.iss.sal)s+='<p>What matters most: '+p.iss.sal.slice(0,6).map(([l,v])=>esc(l)+' '+num(v)).join(', ')+'.</p>';
    sec.push(['issues',s])}
  if(p.grp&&p.grp.d&&Object.keys(p.grp.d).length){const s='<h3>The vote by group</h3><div class="scroll"><table class="tb"><thead><tr><th></th>'+ORDER.map(k=>`<th>${ABBR[k]}</th>`).join('')+'</tr></thead><tbody>'+Object.values(p.grp.d).map(rows=>rows.map(([lab,v])=>`<tr><td>${esc(lab)}</td>${ORDER.map(k=>`<td>${num(v[PK.indexOf(k)])}</td>`).join('')}</tr>`).join('')).join('<tr><td colspan="6" style="height:6px"></td></tr>')+'</tbody></table></div>';sec.push(['demographics',s])}
  sec.sort((x,y)=>(x[0]===F?-1:y[0]===F?1:0));
  return b.concat(sec.map(x=>x[1])).join('');
}
function toggle(li,open){
  const btn=$('button',li),d=$('.det',li),pool=F==='confidence'?CONF:POLLS,p=pool.find(r=>'p-'+r.k===li.id);if(!p)return;
  const on=open==null?btn.getAttribute('aria-expanded')!=='true':open;
  if(on)d.innerHTML=detail(p);
  d.hidden=!on;btn.setAttribute('aria-expanded',String(on));
}
$('#list').addEventListener('click',e=>{const b=e.target.closest('.row>button');if(b)toggle(b.parentElement)});
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.f===F)return;F=b.dataset.f;$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x===b)));fillHouses();render();history.replaceState(null,'',F==='primary'?location.pathname:'?facet='+F)});
sel.addEventListener('change',render);
let qt=0;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(render,120)});
splitSel.addEventListener('change',()=>{SPLIT=splitSel.value;fillHouses();render()});
$$('.seg[data-for=twopp] button').forEach(b=>b.addEventListener('click',()=>{const g=b.parentElement;$$('button',g).forEach(x=>x.setAttribute('aria-checked',String(x===b)));if(b.dataset.c)CONTEST=b.dataset.c;if(b.dataset.b)BASIS=b.dataset.b;fillHouses();render()}));
/* arriving from a chart's dot: open that poll, bring it into view, and mark it a moment */
function arrive(){
  const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('p-'))return;
  let li=document.getElementById(id);
  if(!li&&(sel.value||q.value||F!=='primary')){sel.value='';q.value='';if(F!=='primary'){F='primary';$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f==='primary')));fillHouses()}render();li=document.getElementById(id)}
  if(!li){F='twopp';$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f==='twopp')));fillHouses();render();li=document.getElementById(id)}
  if(!li)return;
  toggle(li,true);
  li.scrollIntoView({block:'center',behavior:'instant'});
  li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),1600);
}
const want=new URLSearchParams(location.search).get('facet');
if(want&&FACETS[want]){F=want;$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f===F)))}
fillHouses();render();arrive();addEventListener('hashchange',arrive);
$('#note').textContent='Figures are as each pollster printed them, each with its 95% margin: for the primaries the model’s own account of a poll’s noise on its effective sample, for the rest the sampling margin on that sample. n is the sample: D counts decided voters only, D+L decided voters and those leaning, A every respondent, F a forced choice with no undecided option; “eff.” is the effective sample, the house’s own where it files one, “~” where the site estimates it from the design effect. The 2PP is each poll’s primary votes run through the 2025 election’s preference flows (against One Nation, the site’s own) unless set to the pollster’s published figure; lean is the poll less the model’s line at its fieldwork, estimated without it.';
/* the menu */
const burger=$('#burger'),menu=$('#menu'),nav=$('#nav');
const setMenu=o=>{menu.hidden=!o;burger.setAttribute('aria-expanded',String(o));nav.classList.toggle('open',o);document.documentElement.style.overflow=o?'hidden':''};
burger.addEventListener('click',()=>setMenu(menu.hidden));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);burger.focus()}});
}
</script>
