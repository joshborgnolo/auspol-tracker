<style>
/* VOICE the morning paper's poll ledger: every poll this term, plainly, newest first
   IDEA the results column of a broadsheet: one line a poll, the figures as printed, a facet a page
   PICTURE each poll's figures in party colour with their margins; opened, the poll against the model that week
   COLOUR warm white ground, indigo ink, the parties' own colours for figures only
   TYPE Georgia for the head and the months, Commissioner for names and figures
   LAYOUT phone: two lines a poll; laptop: one row a poll in columns, the month bar carrying the column names */
@font-face{font-family:"Commissioner";font-style:normal;font-weight:400 700;font-display:swap;src:url("{{FONT}}") format("woff2")}
:root{color-scheme:light;--bg:#fbf6f1;--ink:#1d1b33;--ink2:#4a4660;--mute:#686477;--rule:#e8e0d7;--rule2:#c9bfb4;--alp:#cf3a2f;--lnp:#2a5cb4;--on:#dc6a16;--grn:#1d7a52;--oth:#8d8799;--pos:#1f7a78;--neg:#7a5340;--hi:#fff1d6;--navh:52px;--g:max(18px,env(safe-area-inset-left));--col:max(var(--g),calc((100vw - 1180px)/2));--serif:Georgia,"Times New Roman",serif;--sans:"Commissioner","Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#14132a;--ink:#f3eee8;--ink2:#cbc6d6;--mute:#a39fb3;--rule:#2a2843;--rule2:#4a4764;--alp:#e65548;--lnp:#5b88e4;--on:#d6762a;--grn:#23906a;--oth:#8f8aa3;--pos:#3aa7a4;--neg:#b7836a;--hi:#2c2a4a}}
:root[data-theme=dark]{color-scheme:dark;--bg:#14132a;--ink:#f3eee8;--ink2:#cbc6d6;--mute:#a39fb3;--rule:#2a2843;--rule2:#4a4764;--alp:#e65548;--lnp:#5b88e4;--on:#d6762a;--grn:#23906a;--oth:#8f8aa3;--pos:#3aa7a4;--neg:#b7836a;--hi:#2c2a4a}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--navh) + 70px)}
body{margin:0;touch-action:manipulation;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);overflow-x:clip;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* nav, as the votes pages' */
.nav{position:sticky;top:0;z-index:20;height:calc(var(--navh) + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(6px,env(safe-area-inset-right),calc((100vw - 1180px)/2 - 12px)) 0 var(--col);display:flex;align-items:center;gap:4px;background:var(--bg);box-shadow:0 1px 0 var(--rule)}
.links{display:flex;gap:20px;margin:0 6px 0 auto}
.links a,.mark{color:inherit;text-decoration:none}
.links a{font-size:15px;opacity:.7;padding:12px 0;position:relative}
.links a[aria-current]{opacity:1}
.links a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:9px;height:1.5px;border-radius:1px;background:currentColor}
.mark{font-weight:600;font-size:16px;letter-spacing:-.01em;padding:12px 0;white-space:nowrap}
.burger{width:44px;height:44px;flex:none;border:0;background:none;color:inherit;display:grid;place-items:center;cursor:pointer;padding:0;border-radius:10px}
.burger b{display:grid;gap:5px}
.burger i{display:block;width:20px;height:1.6px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(6.6px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-6.6px) rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:15;background:#0b1433;color:#f3f0ff;padding:calc(var(--navh) + env(safe-area-inset-top) + 20px) var(--g) calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:24px;overflow:auto}
.menu[hidden]{display:none}
.menu ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.menu a,.menu .soon{font:400 clamp(30px,8.6vw,44px)/1.18 var(--serif);letter-spacing:-.015em;color:inherit;text-decoration:none;display:flex;align-items:center;gap:12px}
.menu .soon{color:#8f95bd}
.menu .soon small{font:500 12.5px/1 var(--sans);letter-spacing:0;color:#9aa0c6;border:1px solid #39416d;border-radius:99px;padding:5px 9px}
.nav.open{color:#f3f0ff;background:transparent;box-shadow:none}
/* the page */
main{padding:0 max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) var(--g)}
.wrap{max-width:1180px;margin:0 auto}
.hd{padding:clamp(22px,4vh,44px) 0 6px}
h1{font:400 clamp(28px,7.3vw,46px)/1.06 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
.dek{margin:8px 0 0;font-size:clamp(15px,3.9vw,17px);line-height:1.45;color:var(--ink2);max-width:62ch;text-wrap:pretty}
/* the polls pages' own switch: every poll on record, or the ones still to come */
.sub{display:flex;gap:20px;margin:0 0 12px}
.sub a{font-size:15px;color:inherit;text-decoration:none;opacity:.7;padding:4px 0;position:relative}
.sub a[aria-current]{opacity:1}
.sub a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;border-radius:1px;background:currentColor}
/* facets, search and filters */
.tabs{display:flex;gap:2px;margin:18px 0 0;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent);width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:500 14px/1 var(--sans);color:var(--ink2);background:none;border:0;border-radius:999px;padding:0 14px;height:34px;cursor:pointer;white-space:nowrap;flex:none}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgb(20 10 40/.08)}
.ctl{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;margin:12px 0 10px}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;font:400 15px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:999px;height:36px;padding:0 14px 0 34px;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute)}
/* iPhone Safari zooms the page into any field set under 16px, and leaves it zoomed */
@media (pointer:coarse){.search input{font-size:16px}}
.search svg{position:absolute;left:12px;top:11px;width:14px;height:14px;color:var(--mute)}
.pick select{font:500 14px/1 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:999px;height:36px;padding:0 32px 0 14px;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;max-width:100%}
.pick{position:relative;display:inline-flex;align-items:center}
.pick .pl{color:var(--mute);font-weight:500;font-size:13.5px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:color-mix(in srgb,var(--ink) 7%,transparent)}
.seg button{font:500 13.5px/1 var(--sans);color:var(--ink2);background:none;border:0;border-radius:999px;padding:0 12px;height:30px;cursor:pointer;white-space:nowrap}
.seg button[aria-checked=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule),0 1px 2px rgb(20 10 40/.08)}
.count{font-size:13.5px;color:var(--mute);margin-left:auto}
.vote-flip{all:unset;display:inline-flex;align-items:center;gap:6px;min-height:32px;cursor:pointer;font:500 13.5px/1 var(--sans);color:var(--ink)}
.vote-flip span[aria-hidden]{color:var(--mute);font-weight:400}
.vote-flip:hover .vote-label{text-decoration:underline;text-underline-offset:3px}
.vote-flip:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:3px}
.fopt[hidden],#vote-mode[hidden]{display:none}
.fdek{font-size:14.5px;color:var(--ink2);margin:10px 0 0;max-width:70ch}
.f{white-space:nowrap;font-size:14.5px}
.f>i{font-style:normal;color:var(--mute);font-size:12.5px;margin-right:4px}
.f b{font-weight:600;color:var(--c,var(--ink))}
.f em{font-style:normal;font-size:11.5px;color:var(--mute);margin-left:3px}
.f .lab{display:block;font-size:12px;color:var(--mute);font-weight:400}
.tag{font-size:12px;color:var(--mute);border:1px solid var(--rule2);border-radius:99px;padding:1px 7px;white-space:nowrap}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;width:100%;min-width:90px;max-width:220px;margin-top:3px;background:var(--rule)}
.bar i{display:block;height:100%}
.f.wide{flex-basis:100%}
.poll.flash{background:var(--hi)}
.empty{color:var(--mute);font-size:15px;padding:24px 4px}
.sigw{max-width:920px}
.sig-say{margin-bottom:10px}
.sig-row{display:grid;gap:10px}
.sig-tri{display:block;width:280px;max-width:100%;height:auto;overflow:visible}
.sig-text{font-size:13px;line-height:1.5}
.sig-text p+p{margin-top:8px}
.tri-kite{fill-opacity:.12;stroke:none}
.tri-grid{stroke:var(--mute);stroke-opacity:.18;stroke-width:.75}
.tri-edge{fill:none;stroke:var(--ink2);stroke-width:1}
.tri-med{stroke:var(--ink);stroke-width:1.25}
.tri-med.dash{stroke:var(--mute);stroke-width:1;stroke-dasharray:3 3}
.tri-blob{fill-opacity:.62;stroke:none}
.tri-blobline{fill:none;stroke:var(--ink);stroke-opacity:.55;stroke-width:1}
.tri-dot{fill:#fff;stroke:var(--ink);stroke-width:1.25}
.tri-v{font:600 13px var(--sans)}
@media (min-width:700px){.sig-row{grid-template-columns:280px minmax(0,1fr);gap:22px}}
/* a poll opened */
.det{padding:4px 4px 18px;display:grid;gap:12px;font-size:14px;color:var(--ink2)}
.det[hidden]{display:none}
.det p{margin:0;line-height:1.45}
.det h3{font:600 13px/1.2 var(--sans);color:var(--ink);margin:6px 0 0}
.det .nocaps{white-space:nowrap;text-transform:none}
.det a{color:var(--ink);text-underline-offset:2px}
.lk{display:flex;flex-wrap:wrap;gap:6px 16px}
.lk a.pend{color:var(--mute);text-decoration-style:dotted}
.vs{display:grid;grid-template-columns:5.6em minmax(0,1fr) 7.6em;align-items:center;column-gap:10px;row-gap:6px;max-width:560px}
.vs .nm{font-weight:500;color:var(--ink2);white-space:nowrap}
.vs .tr{position:relative;height:14px}
.vs .tr::before{content:"";position:absolute;left:0;right:0;top:6.5px;height:1px;background:var(--rule)}
.vs .tr s{position:absolute;top:1px;width:2px;height:12px;margin-left:-1px;background:var(--ink);opacity:.55}
.vs .tr i{position:absolute;top:2px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c)}
.vs .vl{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13.5px}
.vs .vl b{font-weight:600;color:var(--ink)}
.vs .vl span{color:var(--mute)}
.key{font-size:12.5px;color:var(--mute);display:flex;gap:14px;flex-wrap:wrap}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:9px;height:9px;border-radius:50%;background:var(--ink2);display:inline-block}
.key s{width:2px;height:11px;background:var(--ink);opacity:.55;display:inline-block}
.tb{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;max-width:100%}
.tb th,.tb td{padding:3px 12px 3px 0;text-align:right;white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;font-weight:500;color:var(--ink2)}
.tb thead th{font-weight:500;color:var(--mute);font-size:12.5px}
.demo-cols{display:grid;grid-template-columns:1fr;align-items:start;gap:20px}
@media (min-width:700px){.demo-cols[data-cols="2"]{grid-template-columns:repeat(2,minmax(0,1fr))}.demo-cols[data-cols="3"]{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.demo-cols[data-cols="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}}
.scroll{overflow-x:auto}
.note{font-size:13.5px;color:var(--mute);margin:28px 0 0;line-height:1.5;max-width:72ch}
.measure-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 15px;border-top:1px solid var(--rule2);padding:13px 0 9px;margin-top:17px}
.measure-line h2{font:500 16px/1.3 var(--sans);margin:0}
.measure-line .vote-flip{min-height:0;font:inherit}
#method-key,.interval-toggle{font-size:12px;color:var(--mute)}
.interval-toggle{display:inline-flex;align-items:center;gap:5px;margin-left:auto;cursor:pointer}
.interval-toggle[hidden]{display:none}
.interval-toggle input{accent-color:var(--ink);margin:0}

.ledger{width:100%;table-layout:fixed;border-spacing:0;border-collapse:separate;font-size:14.5px;line-height:1.35;font-variant-numeric:tabular-nums}
.ledger+.ledger{margin-top:18px}
.sample-base{font-variant-caps:all-small-caps;letter-spacing:.035em}
.rival-pick{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2)}
.poll-col{width:16%}.date-col{width:15%}.sample-col{width:10%}
.ledger>thead{position:sticky;top:calc(var(--navh) + env(safe-area-inset-top));z-index:4;background:var(--bg)}
.month-title th{text-align:left;font-weight:400;padding:12px 0 8px}
.month-title h2{display:inline;font:400 22px/1.2 var(--serif);letter-spacing:-.02em}
.month-title span{font:400 12px var(--sans);margin-left:10px;color:var(--mute)}
.headings th{text-align:right;font-size:12px;font-weight:500;color:var(--ink2);vertical-align:bottom;border-bottom:1px solid var(--rule2);padding:4px 6px 8px}
.headings th:nth-child(-n+2),.basis{text-align:left}
.headings th:first-child{padding-left:0}
.measure-head abbr,.short-date,.short-sample,.basis-label{display:none}
.poll>th,.poll>td{padding:10px 6px;vertical-align:top;border-bottom:1px solid var(--rule)}
.poll>th{padding-left:0;text-align:left;font-weight:400}
.poll{cursor:pointer}
.poll:hover,.poll.open{background:color-mix(in srgb,var(--ink) 3%,var(--bg))}
.expand{border:0;padding:0;background:none;font:600 15px/1.35 var(--sans);color:var(--ink);cursor:pointer;text-align:left}
.chev{display:inline-block;width:6px;height:6px;margin:0 8px 2px 2px;transform:rotate(-45deg);border:solid var(--mute);border-width:0 1px 1px 0}
.expand[aria-expanded=true] .chev{transform:rotate(45deg)}
.poll small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.poll th small{padding-left:16px}
.flag{display:block;color:var(--ink2);font-size:11.5px;padding-left:16px}
.sample,.value{text-align:right}.sample,.date,.basis{font-size:13px;color:var(--ink2)}
.poll .number{white-space:nowrap;color:color-mix(in srgb,var(--c) 77%,var(--ink));font-size:16px;font-weight:600}
.fraction{display:inline-block;width:1.45ch;text-align:left}
body[data-f=primary] .measure-head:not(:last-child){padding-right:calc(6px + 1.45ch)}
.value em,.basis em{white-space:nowrap;display:block;font:400 11.5px/1.3 var(--sans);color:var(--mute);margin-top:3px}
body[data-f=primary]:not(.intervals-on) .poll em{display:none}
.poll>.basis,body[data-f=primary] .headings th:last-child{text-align:left;padding-left:14px}
.ledger .other-cell .f{display:block;white-space:normal;text-align:inherit}
.other-cell .f>i{display:none}
.ledger .bar{min-width:0}
.extra>td{padding:0;border-bottom:1px solid var(--rule2)}
.extra[hidden]{display:none}
.extra .det{padding:20px clamp(12px,2vw,26px);border-left:2px solid var(--rule2);background:color-mix(in srgb,var(--ink) 2%,var(--bg))}
.det h3{font:400 20px/1.2 var(--serif)}
.det details{border-top:1px solid var(--rule);padding-top:9px}
.det summary{font-weight:500;cursor:pointer}
.det details>div{display:grid;gap:9px;margin-top:10px}
.det .lk>a:first-child{font-weight:600}
.det .vs{width:100%}
body[data-f=issues] .headings th:nth-child(n+4),body[data-f=issues] .other-cell{text-align:left}
@media (max-width:64em){
.ctl{display:flex;gap:6px 8px}.ctl .search{flex:1 1 9rem;min-width:7rem}.search input{font-size:16px}
.ctl .pick{max-width:100%}.ctl .count{flex-basis:100%;margin:0}
.measure-line{margin-top:10px;padding-top:10px;gap:5px 8px}
#method-key:not(:empty){order:3;flex-basis:100%}
.ledger{display:block}.ledger>colgroup{display:none}
.ledger>thead,.ledger>tbody,.ledger .extra,.extra>td,.month-title,.month-title th{display:block}
.ledger>thead{padding-top:2px}.month-title th{padding:9px 0 5px}
.ledger .extra[hidden]{display:none}
.headings{display:none}
.poll{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,7rem),1fr));gap:5px 10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.poll>th,.poll>td{border:0;padding:0}
.poll>th{grid-column:1/-1}.poll th small,.poll .sample,.poll .date{display:none}
.short-date{display:inline;color:var(--mute);font-size:12.5px;margin-left:10px}
.short-sample{display:inline;font-size:12px;color:var(--mute);margin-left:10px;white-space:nowrap}
.poll .other-cell{text-align:left}
.other-cell .f>i{display:block;margin:0;white-space:normal}
.other-cell:has(.wide){grid-column:1/-1}
.other-cell:has(.f:empty){display:none}
body[data-f=primary] .poll,body[data-f=primary] .headings{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));column-gap:6px}
body[data-f=primary] .headings{border-bottom:1px solid var(--rule2)}
body[data-f=primary] .headings th{display:none}
body[data-f=primary] .headings .measure-head:not(:last-child){display:block;text-align:right;padding:3px 1.45ch 5px 0;border:0}
.measure-head abbr{display:inline;text-decoration:none}.measure-head>span{display:none}
.poll>.basis{grid-column:1/-1;text-align:left;padding:0;color:var(--mute);font-size:12px}
.basis-label{display:inline}.basis em{display:inline;margin-left:5px}
.det .vs{grid-template-columns:minmax(4.7em,auto) minmax(10px,1fr) auto}
}
@media(max-width:40em){.ctl .search{flex:1 0 100%;max-width:none}.ctl .pick .pl{display:none}}
@media(max-width:19em){body[data-f=primary] .headings{display:none}body[data-f=primary] .poll{grid-template-columns:repeat(auto-fit,minmax(3.8em,1fr))}.poll .value[data-party]::before{content:attr(data-party);display:block;font-size:11px;color:var(--mute)}}
.rival-toggle{display:inline-flex;align-items:center;gap:7px;padding:5px 9px;border:1px solid currentColor;border-radius:999px;background:var(--bg);color:var(--lnp);font:500 13px/1.3 var(--sans);white-space:nowrap;cursor:pointer}
.rival-toggle::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.rival-toggle[data-r=on]{color:var(--on)}
.rival-toggle[data-r=lnp]{background:color-mix(in srgb,var(--lnp) 10%,var(--bg))}
.rival-toggle[data-r=on]{background:color-mix(in srgb,var(--on) 12%,var(--bg))}

/* the mark's sun: the hero in miniature, on its sky, beside the name once the hero has scrolled away */
:root{--lz:#0b1640;--lm:#23498f;--ll:#c98a8f;--lh:#f2b07f}
:root[data-sky=set]{--lz:#141a4c;--lm:#3b3a8c;--ll:#b4588f;--lh:#ff8a5a}
.mark{display:inline-flex;align-items:center}
.logo{display:block;width:0;height:26px;flex:none;opacity:0;transform:scale(.55);margin-right:0;border-radius:50%;transition:width .4s cubic-bezier(.3,.9,.3,1),margin-right .4s cubic-bezier(.3,.9,.3,1),opacity .3s,transform .4s cubic-bezier(.3,.9,.3,1)}

<script id="polls-data" type="application/json">{{POLLS}}</script>
<script>
{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const DATA=JSON.parse($('#polls-data').textContent);
/*{{FILTERSJS}}*/
/* the mark's sky follows the votes pages': sunrise by day, sunset in the evening, or the reader's choice */
{let pref='auto';try{pref=localStorage.getItem('apt-sky')||'auto'}catch(e){}const h=new Date().getHours();document.documentElement.dataset.sky=pref==='rise'||pref==='set'?pref:h>=4&&h<15?'rise':'set'}
const ORDER={{ORDER}};                     // parties by today's standing
const PK=['alp','lnp','grn','onp','oth'];  // the data's order
const ABBR={alp:'ALP',lnp:'L/NP',grn:'GRN',onp:'ON',oth:'OTH'},NAME={alp:'Labor',lnp:'Coalition',grn:'Greens',onp:'One Nation',oth:'Others'},CV={alp:'alp',lnp:'lnp',grn:'grn',onp:'on',oth:'oth'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fdate=iso=>{const [y,m,d]=iso.slice(0,10).split('-').map(Number);return d+' '+MON[m-1]+' '+y};
const fday=iso=>{const [,m,d]=iso.slice(0,10).split('-').map(Number);return d+' '+MON[m-1]};
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const num=v=>v==null?'–':Number.isInteger(+v)?String(v):f1(v);
const sg=v=>v==null?'–':(v>0?'+':v<0?'−':'')+(Math.abs(v)<10&&!Number.isInteger(Math.round(v*10)/10)?f1(Math.abs(v)):num(Math.abs(Math.round(v*10)/10)));
const pm=m=>m==null||!isFinite(m)||m<=0?'':`<em>±${m.toFixed(1)}</em>`;
const POLLS=DATA.polls,CONF=DATA.conf;

/* ---------- each figure's ± at 95%: the site's rules (rd-allpolls.jsx) ----------
   a primary share: a Beta credible interval on a Jeffreys prior, var = κ·s(1−s)/n + step²/12, n the effective
   sample (the house's, else the raw over the design effect, shrunk by an excluded undecided share), κ the house's
   noise in the model; a share of everyone: p(1−p)/n; a difference of two shares from one sample (a net rating,
   right minus wrong, an issue lead): (a + b − (a−b)²)/n; a group gap: each group's estimated sample (the poll's
   effective sample times the group's share of adults) */
const nEff=p=>/ \(MRP\)$/.test(p.h)?0:(p.se||(p.n?p.n/DATA.deff:0));
/*{{POLLINTERVALS}}*/
const stepOf=shares=>{const vs=Object.values(shares||{}).filter(v=>typeof v==='number');if(!vs.length||vs.every(v=>Math.abs(v-Math.round(v))<1e-6))return 1;return vs.every(v=>Math.abs(v*2-Math.round(v*2))<1e-6)?.5:.1};
function primaryPosterior(p,v,und=false){
  let n=nEff(p);
  if(v==null||!n)return null;
  if(!und&&p.u?.label==='excluded'&&p.u.v>0)n*=1-p.u.v/100;
  if(n<=0)return null;
  return sharePosterior(v,n,und?1:DATA.kappa[p.h]??1,stepOf(p.p));
}
const intervalCache=new Map();
function intervalText(p,v,und){
  return formatInterval(primaryPosterior(p,v,und));
}
function considerationInterval(p,v,shares){
  // The April RedBridge figures combine primary voters and a separate propensity question.
  if(!p.se||!nEff(p)||(p.h==='RedBridge/Accent'&&p.d==='2026-04-30'))return '';
  return formatInterval(sharePosterior(v,p.se,1,stepOf(shares)));
}
function formatInterval(shape){
  if(!shape)return '';
  const key=shape.join('|');
  if(!intervalCache.has(key)){
    intervalCache.set(key,credibleBounds(shape).map(f1).join('–'));
  }
  return intervalCache.get(key);
}
function intervalMarkup(p,v,und){
  const interval=intervalText(p,v,und);
  return interval?'<em>'+interval+'</em>':'';
}
function changeSummary(p){
  if(!p.chg?.d)return '';
  const byReference=new Map();
  for(const k of ORDER){
    const key='p'+k[0].toUpperCase()+k.slice(1),delta=p.chg.d[key];
    if(delta==null)continue;
    const ref=p.chg.r?.[key]||'';
    if(!byReference.has(ref))byReference.set(ref,[]);
    byReference.get(ref).push({k,delta});
  }
  return [...byReference].map(([ref,changes])=>{
    const prior=POLLS.find(row=>row.h===p.h&&row.d===ref&&row.p);
    const overlaps=prior&&p.fieldStart&&p.fieldStart<=prior.d;
    const significant=[],unknown=[];
    for(const {k} of changes){
      const status=prior&&!overlaps?significantChange(primaryPosterior(p,p.p[k]),primaryPosterior(prior,prior.p[k])):null;
      if(status===true)significant.push(ABBR[k]);
      if(status==null)unknown.push(ABBR[k]);
    }
    const verdict=[];
    if(significant.length)verdict.push(significant.join(', ')+' significant');
    else if(unknown.length<changes.length)verdict.push('none significant'+(unknown.length?' among those assessed':''));
    if(unknown.length)verdict.push(overlaps?'significance unavailable for overlapping fieldwork':'significance unavailable'+(unknown.length<changes.length?' for '+unknown.join(', '):''));
    const comparison=byReference.size===1?'last poll':'poll of '+(ref?fdate(ref):'unknown date');
    return '<p>Against '+esc(houseName(p.h))+'’s '+comparison+', '+changes.map(({k,delta})=>ABBR[k]+' '+sg(delta)).join(', ')+' ('+verdict.join('; ')+').</p>';
  }).join('');
}
const shareMoe=(p,v)=>{const n=nEff(p);if(v==null||!n)return null;const s=Math.max(0,Math.min(100,+v))/100;return 196*Math.sqrt(s*(1-s)/n)};
const diffMoe=(p,a,b)=>{const n=nEff(p);if(a==null||b==null||!n)return null;const x=+a/100,y=+b/100;return 196*Math.sqrt(Math.max(0,x+y-(x-y)*(x-y))/n)};
/*{{SIGTRIANGLE}}*/
const DEM_SHARE={Women:.51,Men:.49,'18–34':.30,'55+':.36,'65+':.22,'50+':.44,'Gen Z':.21,Boomers:.21,University:.26,School:.45,'Year 12 or less':.45,'High School':.45,'No tertiary':.74,'Inner metro':.30,Rural:.24,'Regional or rural':.40,'Capital cities':.67,'Regional/rural areas':.33,Renting:.31,'Renting and other':.33,'Own outright':.31};
const gapMoe=(p,pr,k)=>{const sa=DEM_SHARE[pr.a],sb=DEM_SHARE[pr.b],va=pr.A[k],vb=pr.B[k];let n=nEff(p);if(!sa||!sb||va==null||vb==null||!n)return null;if(p.u&&p.u.label==='excluded'&&p.u.v>0)n*=1-p.u.v/100;const x=va/100,y=vb/100;return 196*Math.sqrt(x*(1-x)/(n*sa)+y*(1-y)/(n*sb))};

/* ---------- the facets' readings: the site's rules ---------- */
/* the vote by group: two of a poll's own groups, tried in order (d1a1d215 DEM_SPLITS / demPairOf) */
const OFFCUTS=[
  ["birth", "Birth country", [["Vietnam", "Australia", "Vietnam-born v Australia-born"], ["Mainland China", "Australia", "China-born v Australia-born"], ["South Africa", "Australia", "South Africa-born v Australia-born"], ["United Kingdom", "Australia", "UK-born v Australia-born"]]],
  ["religion", "Religion", [["Christian", "No religion", "Christian v no religion"], ["Protestant", "No religion", "Protestant v no religion"]]],
  ["working", "Working status", [["Full time", "Retired", "Full time v retired"]]],
  ["children", "Children at home", [["Children under 18", "No children", "Children at home v none"]]],
  ["class", "Self-assessed class", [["Working class", "Well off", "Working class v well off"]]],
  ["electorate", "Tasmanian electorates", [["Braddon", "Clark", "Braddon v Clark"]]],
  ["occupation", "Occupation", [["Professional and managerial", "Blue collar", "Managerial v blue collar"]]],
  ["stress", "Financial stress", [["No stress at all", "A great deal of stress", "No stress v a great deal of stress"]]],
];
const SPLITS=[
  {id:'age',label:'Age',pairs:[['18–34','55+','18–34 v 55+'],['Gen Z','Boomers','Gen Z v boomers'],['18–34','65+','18–34 v 65+'],['18–34','50+','18–34 v 50+']]},
  {id:'gender',label:'Gender',pairs:[['Women','Men','Women v men']]},
  {id:'education',label:'Education',pairs:[['University','School','Uni v school'],['University','Year 12 or less','Uni v Year 12'],['University','No tertiary','Uni v no tertiary'],['University','High School','Uni v high school']]},
  {id:'place',label:'Place',pairs:[['Inner metro','Rural','Inner metro v rural'],['Inner metro','Regional or rural','Inner metro v regional'],['Capital cities','Regional/rural areas','Capital v regional/rural']]},
  {id:'home',label:'Home',pairs:[['Renting','Own outright','Renters v owners'],['Renting and other','Own outright','Renters v owners']]},
  {id:'income',label:'Income',pairs:[['$150k+','Under $50k','$150k+ v <$50k'],['$125k+','Under $45k','$125k+ v <$45k'],['$100k or more','Under $100k','$100k+ v <$100k'],['$3,000+ a week','Under $1,000 a week','$3k+ v <$1k a week']]},
  {id:'country',label:'Offcuts',pairs:OFFCUTS.flatMap(family=>family[2])},
];
const groupsOf=p=>{const g=p.grp;if(!g)return null;const m={};for(const rows of Object.values(g.d||{}))for(const [lab,v] of rows)m[lab]=Object.fromEntries(PK.map((k,i)=>[k,v[i]]));
  (g.v||[]).forEach((v,i)=>{const lab=DATA.groups[i];if(v&&!m[lab]&&!(g.ar||[]).includes(lab))m[lab]=Object.fromEntries(PK.map((k,j)=>[k,v[j]]))});return m};
const pairOf=(p,split)=>{const sp=SPLITS.find(s=>s.id===split),m=sp?groupsOf(p):null;if(!m)return null;const pairs=split==='country'&&offcutSel.value?OFFCUTS.find(([id])=>id===offcutSel.value)[2]:sp.pairs;for(const [a,b,lab] of pairs)if(m[a]&&m[b])return {a,b,lab,A:m[a],B:m[b],gap:Object.fromEntries(PK.map(k=>[k,m[a][k]!=null&&m[b][k]!=null?m[a][k]-m[b][k]:null]))};return null};
/* issues: who voters rate best on the six issues most waves ask (d1a1d215 ISS_MAP / issOwnOf / issLeadOf) */
const ISS=['col','housing','health','immigration','crime','economy'],ISSL={col:'Cost of living',housing:'Housing',health:'Health',immigration:'Immigration',crime:'Crime',economy:'Economy'};
const issOwn=(p,id)=>{const i=p.iss;if(!i)return null;if(i.own&&i.own[id])return i.own[id];if(id==='col'&&i.bp)return {alp:i.bp.alp,lnp:i.bp.lnp,onp:i.bp.onp,grn:i.bp.grn,oth:i.bp.rest};return null};
const issLead=own=>{if(!own)return null;const ps=['alp','lnp','onp','grn'].filter(k=>own[k]!=null).map(k=>[k,+own[k]]).sort((a,b)=>b[1]-a[1]);if(!ps.length)return null;const lead=ps.length>1?ps[0][1]-ps[1][1]:null;return {who:ps[0][0],v:ps[0][1],b:ps[1]?ps[1][1]:null,lead,level:lead!=null&&lead<.5}};
/* leaders: each net from its own approve and disapprove; better PM the first question the house asked */
const LEAD=[['alb','Albanese','alp'],['taylor','Taylor','lnp'],['hanson','Hanson','on']];
const netOf=(p,k)=>{const a=p.ap&&p.ap[k];return a&&a.app!=null&&a.dis!=null?{v:a.app-a.dis,m:diffMoe(p,a.app,a.dis),fav:p.ap.mb&&p.ap.mb[k]&&p.ap.mb[k]!=='approval'}:null};
const ppmOf=p=>{const s=(p.ppms&&p.ppms[0])||p.ppm;if(!s)return null;const ks=['alb','taylor','hanson'].filter(k=>s[k]!=null);return ks.length?{ks,s,lab:s.label||(ks.length>2?'three-way':ks.map(k=>LEAD.find(l=>l[0]===k)[1]).join(' v '))}:null};

/* ---------- facets ---------- */
let F='primary',CONTEST='lnp',BASIS='imp',SPLIT='age';
const tpKey=()=>CONTEST==='lnp'?(BASIS==='imp'?'i':'t'):(BASIS==='imp'?'io':'to');
const ydKey=()=>CONTEST==='lnp'?(BASIS==='imp'?'imp':'lnp'):(BASIS==='imp'?'onimp':'onp');
let consideration=false;
function ranges(p){
  if(!p.cons)return [];
  return [
    [p.consLoose,p.h==='Essential'?'Would consider (definitely or open)':'Would consider (≥4/10)'],
    [p.cons,p.consBasis||'Would consider'],
    [p.consNot,'Would not consider (≤3/10)'],
    [p.consNever,p.h==='Essential'?'Would never vote':'Would never vote (0/10)']
  ].filter(([shares])=>shares);
}
const FACETS={
  primary:{label:'Primary',rows:()=>POLLS.filter(p=>consideration?p.cons:p.p&&Object.keys(p.p).length),cols:()=>[...ORDER.map(k=>NAME[k]),consideration?'Response':'Undecided'],
    hay:p=>consideration&&p.cons?ranges(p).map(([shares,label])=>label+' '+Object.values(shares).join(' ')).join(' '):ORDER.map(k=>num(p.p[k])).join(' ')},
  twopp:{label:'2PP',rows:()=>POLLS.filter(p=>p[tpKey()]!=null),cols:()=>['Labor v '+(CONTEST==='lnp'?'Coalition':'One Nation'),'Lean','House lean'],
    fig:p=>{const v=p[tpKey()],y=p.yd&&p.yd[ydKey()],lean=y?v-y[0]:null,he=y?y[1]:null,rc=CONTEST==='lnp'?'lnp':'on',pub=BASIS==='imp'?p[CONTEST==='lnp'?'t':'to']:null;
      return [`<span class="f"><i>${CONTEST==='lnp'?'v L/NP':'v ON'}</i><b style="--c:var(--alp)">${num(v)}</b> – <b style="--c:var(--${rc})">${num(Math.round((100-v)*10)/10)}</b>${pub!=null?`<span class="lab">published ${num(pub)}–${num(Math.round((100-pub)*10)/10)}</span>`:''}</span>`
        ,`<span class="f"><i>lean</i><b style="--c:${lean==null||Math.abs(lean)<.05?'var(--ink2)':lean>0?'var(--alp)':'var(--'+rc+')'}">${lean==null?'–':sg(Math.round(lean*10)/10)}</b></span>`,`<span class="f"><i>house</i><b style="--c:var(--ink2)">${he==null?'–':sg(Math.round(he*10)/10)}</b></span>`]},
    hay:p=>num(p[tpKey()])},
  leaders:{label:'Leaders',rows:()=>POLLS.filter(p=>ppmOf(p)||LEAD.some(([k])=>netOf(p,k))),cols:()=>['Better PM','Alb','Tay','Han'],
    fig:p=>{const pp=ppmOf(p);const cells=[`<span class="f"><i>better PM</i>${pp?pp.ks.map((k,i)=>`${i?' – ':''}<b style="--c:var(--${LEAD.find(l=>l[0]===k)[2]})">${num(pp.s[k])}</b>`).join('')+`<span class="lab">${esc(pp.lab)}</span>`:'<b>–</b><span class="lab">not asked</span>'}</span>`];
      LEAD.forEach(([k,nm,c])=>{const n=netOf(p,k);cells.push(`<span class="f"><i>${nm}</i><b style="--c:var(--${c})">${n?sg(n.v):'–'}</b>${n?pm(n.m):''}${n&&n.fav?'<span class="lab">favourability</span>':''}</span>`)});return cells},
    hay:p=>LEAD.map(([k])=>{const n=netOf(p,k);return n?n.v:''}).join(' ')},
  direction:{label:'Direction',rows:()=>POLLS.filter(p=>p.dir&&p.dir.right!=null),cols:()=>['Right','Wrong','Unsure','Net','Right direction, unsure, wrong track'],
    fig:p=>{const d=p.dir;
      return [`<span class="f"><i>right</i><b style="--c:var(--pos)">${num(d.right)}</b>${pm(shareMoe(p,d.right))}</span>`,`<span class="f"><i>wrong</i><b style="--c:var(--neg)">${num(d.wrong)}</b>${pm(shareMoe(p,d.wrong))}</span>`,`<span class="f"><i>unsure</i><b style="--c:var(--ink2)">${num(d.unsure)}</b>${pm(shareMoe(p,d.unsure))}</span>`
        ,`<span class="f"><i>net</i><b>${sg(d.net!=null?d.net:d.right-d.wrong)}</b>${pm(diffMoe(p,d.right,d.wrong))}</span>`,`<span class="f wide"><span class="bar" aria-hidden="true"><i style="width:${d.right}%;background:var(--pos)"></i><i style="width:${d.unsure||0}%;background:var(--rule2)"></i><i style="width:${d.wrong}%;background:var(--neg)"></i></span></span>`]},
    hay:p=>[p.dir.right,p.dir.wrong,p.dir.unsure].join(' ')},
  issues:{label:'Issues',rows:()=>POLLS.filter(p=>ISS.some(id=>issOwn(p,id))),cols:()=>ISS.map(id=>ISSL[id]),
    fig:p=>ISS.map(id=>{const own=issOwn(p,id),L=issLead(own);if(!L)return `<span class="f"><i>${ISSL[id]}</i><b style="--c:var(--mute)">–</b></span>`;
      const c=CV[L.who],bars=['alp','onp','lnp','grn','oth'].filter(k=>own[k]!=null).map(k=>`<i style="width:${own[k]}%;background:var(--${CV[k]})"></i>`).join('');
      return `<span class="f"><i>${ISSL[id]}</i>${L.level?'<b style="--c:var(--ink2)">Level</b>':`<b style="--c:var(--${c})">${ABBR[L.who]} +${num(Math.round(L.lead*10)/10)}</b>`}${pm(diffMoe(p,L.v,L.b))}<span class="bar" aria-hidden="true" style="min-width:60px">${bars}</span></span>`}),
    hay:p=>ISS.map(id=>{const L=issLead(issOwn(p,id));return L?ABBR[L.who]:''}).join(' ')},
  demographics:{label:'Demographics',rows:()=>POLLS.filter(p=>pairOf(p,SPLIT)),cols:()=>[...ORDER.map(k=>ABBR[k]),'Groups'],
    fig:p=>{const pr=pairOf(p,SPLIT);return [...ORDER.map(k=>{const g=pr.gap[k];return `<span class="f" style="--c:var(--${CV[k]})"><i>${ABBR[k]}</i><b>${g==null?'–':sg(Math.round(g*10)/10)}</b>${g==null?'':pm(gapMoe(p,pr,k))}</span>`}),`<span class="f wide"><span class="lab" style="text-align:left">${esc(pr.lab)}, in points</span></span>`]},
    hay:p=>{const pr=pairOf(p,SPLIT);return pr?pr.lab:''}},
  confidence:{label:'Confidence',rows:()=>CONF,cols:()=>['Figure','Change','Series'],noun:'release',
    fig:p=>[`<span class="f"><i>figure</i><b>${num(p.conf.v)}</b></span>`,`<span class="f"><i>change</i><b style="--c:${p.conf.chg>0?'var(--pos)':p.conf.chg<0?'var(--neg)':'var(--ink2)'}">${p.conf.chg==null?'–':sg(p.conf.chg)}</b></span>`,`<span class="f wide"><span class="lab" style="text-align:left">${esc(p.conf.lab)}${p.conf.vs?' · neutral at '+p.conf.vs:''}</span></span>`],
    hay:p=>[p.conf.v,p.conf.lab].join(' ')},
};
const FDEK={issues:'The party voters rate best on each issue, and its lead on the runner-up; a lead inside the margin is level.',demographics:'Each poll’s own gap between two groups, party by party: the first group less the second.',confidence:'Each confidence or sentiment release, as the bank or pollster published it.'};
/* the sample: the count and what the shares are of, the house's published effective sample beneath or undisclosed */
function sampleMarkup(p){
  const basis=(F==='twopp'&&p.b2)||p.b;
  return p.n?Number(p.n).toLocaleString('en-AU')+(basis?' '+sampleBase(basis):''):'–';
}
const effTxt=p=>p.se != null?'eff. '+Number(p.se).toLocaleString('en-AU'):'eff. undisclosed';
const tabs=$('#tabs'),sel=$('#house'),q=$('#q'),splitSel=$('#split'),offcutSel=$('#offcut');
offcutSel.innerHTML='<option value="">All offcuts</option>'+OFFCUTS.map(([id,label])=>`<option value="${id}">${esc(label)}</option>`).join('');
tabs.innerHTML=Object.entries(FACETS).map(([id,f])=>`<button type="button" role="tab" aria-selected="${id===F}" data-f="${id}">${f.label}</button>`).join('');
splitSel.innerHTML=SPLITS.map(s=>`<option value="${s.id}">${s.id==='country'?'Offcuts':'Split by '+s.label.toLowerCase()}</option>`).join('');
function houses(rows){const c=new Map();rows.forEach(p=>c.set(p.h,(c.get(p.h)||0)+1));return [...c].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
function fillHouses(){const fa=FACETS[F],rows=fa.rows(),cur=sel.value;sel.innerHTML=`<option value="">all pollsters</option>`+houses(rows).map(([h])=>`<option value="${esc(h)}">${esc(houseName(h))}</option>`).join('');sel.value=houses(rows).some(([h])=>h===cur)?cur:''}
/* search: a pollster, its client, a date in any of the ways it is written, or a figure */
function hayOf(p){
  const dates=[fieldDate(p),p.pub].filter(Boolean).map(date=>[date,monthLabel(date.slice(0,7)),date.length>=10?fdate(date):''].join(' '));
  return [p.h,p.c||'',p.f||'',...dates,FACETS[F].hay(p)].join(' ').toLowerCase();
}
function undecided(p){
  if(p.u?.label==='not allowed'||p.b==='F')return p.h==='Resolve'?'0%, forced choice':'Forced choice';
  if(!p.u)return 'Unreported';
  const share=p.u.v==null?'Share unreported · ':num(p.u.v)+'% ';
  return share+p.u.label;
}
function resultCells(p){
  if(F==='primary'){
    const tier=consideration&&ranges(p)[0],shares=tier?tier[0]:p.p;
    const cells=ORDER.map(k=>{
      const v=shares[k],[whole,fraction]=num(v).split('.');
      const ci=tier?considerationInterval(p,v,shares):intervalText(p,v);
      return `<td class="value" data-party="${ABBR[k]}" style="--c:var(--${CV[k]})"><b class="number">${whole}<span class="fraction">${fraction?'.'+fraction:''}</span></b>${ci?'<em>'+ci+'</em>':''}</td>`;
    });
    if(consideration)cells.push('<td class="basis">'+esc(tier?tier[1]:'Voting intention')+'</td>');
    else cells.push(`<td class="basis"><span class="basis-label">Undecided · </span>${esc(undecided(p))}${p.u?.label==='not allowed'?'':intervalMarkup(p,p.u?.v,true)}</td>`);
    return cells.join('');
  }
  return FACETS[F].fig(p).map(cell=>'<td class="value other-cell">'+cell+'</td>').join('');
}
const facetTitle={consideration:'Voting consideration',primary:'Voting intention (%)',twopp:'Two-party preferred (%)',leaders:'Leadership',direction:'National direction',issues:'Issue ownership',demographics:'Demographic gaps (points)',confidence:'Confidence'};
const compact=matchMedia('(max-width:64em)'),intervalSwitch=$('#intervals');
let intervalPreference;
function setIntervals(){
  intervalSwitch.checked=intervalPreference??!compact.matches;
  document.body.classList.toggle('intervals-on',intervalSwitch.checked);
}
intervalSwitch.addEventListener('change',()=>{intervalPreference=intervalSwitch.checked;setIntervals()});
compact.addEventListener('change',setIntervals);setIntervals();

const sortSelect=$('#sort');
function fieldDate(p){return p.conf?p.fieldEnd||'':p.tbc?'':p.d}
function sortDate(p){return sortSelect.value==='publication'?p.pub||'':fieldDate(p)}
function monthLabel(ym){
  if(!ym)return sortSelect.value==='publication'?'Publication date unknown':'Fieldwork date unknown';
  return MONF[Number(ym.slice(5,7))-1]+' '+ym.slice(0,4);
}
function dateCells(p){
  const published=sortSelect.value==='publication',ym=sortDate(p).slice(0,7);
  const field=fieldDate(p),stamp=p.pub||'';
  const yearNeeded=iso=>iso&&iso.slice(0,4)!==ym.slice(0,4);
  const release=stamp?(yearNeeded(stamp)?fdate(stamp):fday(stamp)):'unknown';
  const fieldwork=field?(p.f||fday(field))+(yearNeeded(field)&&!(p.f||'').includes(field.slice(0,4))?' '+field.slice(0,4):''):'Unknown';
  return published?{main:stamp?release:'Unknown',sub:field?'Fieldwork '+fieldwork:'Fieldwork unknown',mobile:stamp?'Published '+release:'Publication date unknown'}
    :{main:fieldwork,sub:stamp?'Published '+release:'Publication date unknown',mobile:field?fieldwork:'Fieldwork unknown'};
}
function rowMarkup(p,colCount){
  const id=esc(p.k),house=esc(houseName(p.h)),dates=dateCells(p),sample=sampleMarkup(p);
  const flag=/Tasmanian voters only/i.test(p.na||'')?'Tasmania only':p.na?'Outside aggregate':'';
  const client=p.c&&!/^self.published$/i.test(p.c)?'<small>'+esc(p.c)+'</small>':'';
  return `<tr class="poll" id="p-${id}"><th scope="row"><button class="expand" type="button" aria-label="${house}, ${esc(dates.mobile)}, details" aria-controls="d-${id}" aria-expanded="false"><span class="chev" aria-hidden="true"></span>${house}</button><span class="short-date">${esc(dates.mobile)}</span><span class="short-sample">${p.n?'n '+sample:''}</span>${flag?'<span class="flag">'+flag+'</span>':''}${client}</th><td class="date">${esc(dates.main)}<small>${esc(dates.sub)}</small></td><td class="sample">${sample}<small>${esc(effTxt(p))}</small></td>${resultCells(p)}</tr>
    <tr class="extra" id="d-${id}" hidden><td colspan="${colCount}"><div class="det"></div></td></tr>`;
}
function render(){
  const fa=FACETS[F],all=fa.rows(),house=sel.value,terms=q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows=all.filter(p=>(!house||p.h===house)&&terms.every(term=>hayOf(p).includes(term)));
  rows.sort((a,b)=>sortDate(b).localeCompare(sortDate(a))||b.d.localeCompare(a.d)||a.h.localeCompare(b.h));
  document.body.dataset.f=F;
  $$('.fopt').forEach(e=>e.hidden=e.dataset.for!==F);
  $('#offcut-pick').hidden=F!=='demographics'||SPLIT!=='country';
  const fd=$('#fdek');fd.hidden=!FDEK[F];fd.textContent=FDEK[F]||'';
  const showingConsideration=consideration&&F==='primary';
  $('.interval-toggle').hidden=F!=='primary';
  const measure=showingConsideration?'Voting consideration (%)':facetTitle[F];
  $('#measure').textContent=measure;
  $('#measure-plain').textContent=facetTitle[F];
  $('#measure-plain').hidden=F==='primary';
  $('#method-key').innerHTML=showingConsideration?'Which parties voters <em>would consider</em> supporting':F==='primary'?'First preferences':F==='twopp'?(BASIS==='imp'?'Estimated from preference flows':'As published by each pollster'):'';
  const noun=fa.noun||'poll',count=house||terms.length?rows.length+' of '+all.length:rows.length;
  $('#count').textContent=count+' '+noun+(all.length===1?'':'s')+(F==='primary'&&!consideration?' with primary votes':'');
  const months=new Map();
  for(const p of rows){
    const month=sortDate(p).slice(0,7);
    if(!months.has(month))months.set(month,[]);
    months.get(month).push(p);
  }
  const labels=fa.cols(),colCount=3+labels.length,dateLabel=sortSelect.value==='publication'?'Published':'Fieldwork';
  const headers=labels.map((label,i)=>{
    const abbr=F==='primary'&&i<ORDER.length?`<abbr title="${esc(label)}">${ABBR[ORDER[i]]}</abbr>`:'';
    return `<th scope="col" class="measure-head"><span>${esc(label)}</span>${abbr}</th>`;
  }).join('');
  const tables=[];
  for(const [ym,list] of months){
    const month=monthLabel(ym);
    tables.push(`<table class="ledger" aria-label="${esc(measure+', '+month)}"><colgroup><col class="poll-col"><col class="date-col"><col class="sample-col">${labels.map(()=>'<col>').join('')}</colgroup><thead><tr class="month-title"><th colspan="${colCount}"><h2>${month}</h2><span>${list.length} ${noun}${list.length===1?'':'s'}</span></th></tr><tr class="headings"><th scope="col">Pollster</th><th scope="col">${dateLabel}</th><th scope="col">Sample</th>${headers}</tr></thead><tbody>${list.map(p=>rowMarkup(p,colCount)).join('')}</tbody></table>`);
  }
  $('#list').innerHTML=tables.join('')||'<p class="empty">No matches. Try another pollster or search term.</p>';
}
/* a poll opened: what it is and where it was published, every link it has, then what it says, facet by facet,
   the open facet first, and its primaries against the model's that week */
/*{{POLLHEADING}}*/
function detail(p){
  const b=[],sec=[];
  b.push('<p>'+pollHeading(p)+'</p>');
  if(p.links&&p.links.length)b.push('<div class="lk">'+p.links.map(l=>`<a href="${esc(l.href)}" target="_blank" rel="noopener"${l.pending?' class="pend"':''}${l.title?` title="${esc(l.title)}"`:''}>${esc(l.t)}${l.pending?'':' ↗'}</a>`).join('')+'</div>');
  if(p.na)b.push(`<p><b>Not counted.</b> ${esc(p.na)}</p>`);
  if(p.conf)sec.push(['confidence',`<h3>${esc(p.conf.lab)}</h3><p>${num(p.conf.v)}${p.conf.chg!=null?', '+sg(p.conf.chg)+' on the release before':''}${p.conf.vs?'; '+p.conf.vs+' is neutral':''}.</p>`]);
  if(p.p&&Object.keys(p.p).length){
    let s='<h3>First preferences (%)</h3>';
    if(p.mw){const vals=ORDER.map(k=>p.p[k]).filter(v=>v!=null),mx=Math.max(45,...vals,...p.mw)+2,pc=v=>(v/mx*100).toFixed(2)+'%';
      s+='<div class="key"><span><i></i>This poll</span><span><s></s>Tracker that week</span></div><div class="vs">'+ORDER.map(k=>{const j=PK.indexOf(k),v=p.p[k],m=p.mw[j];if(v==null)return '';return `<span class="nm">${NAME[k]}</span><span class="tr" style="--c:var(--${CV[k]})"><s style="left:${pc(m)}"></s><i style="left:${pc(v)}"></i></span><span class="vl"><b>${num(v)}</b> <span>v ${f1(m)}</span></span>`}).join('')+'</div>'}
    else s+='<p>'+ORDER.map(k=>p.p[k]!=null?NAME[k]+' '+num(p.p[k]):'').filter(Boolean).join(', ')+'.</p>';
    s+=changeSummary(p);
    s+='<p>Undecided · '+esc(undecided(p))+'.</p>';
    const intervals=ORDER.filter(k=>p.p[k]!=null).map(k=>{
      const ci=intervalText(p,p.p[k]);
      return ci?NAME[k]+' '+ci+'%':'';
    }).filter(Boolean);
    if(intervals.length)s+='<p>95% credible intervals: '+intervals.join(', ')+'.</p>';
    if(F==='primary'){
      const gaps=sigMark(p,nEff(p));
      if(gaps)s+='<details><summary>How certain are the gaps between parties?</summary><div>'+gaps+'</div></details>';
    }
    sec.push(['primary',s]);
  }
  const tp=[];if(p.i!=null)tp.push('Labor '+num(p.i)+' against the Coalition');if(p.io!=null)tp.push(num(p.io)+' against One Nation');
  if(tp.length||p.t!=null||p.to!=null){let s='<h3>Two-party preferred</h3><p>'+(tp.length?'Implied by the 2025 flows: '+tp.join(', ')+'.':'')+(p.t!=null?' Published: '+num(p.t)+'–'+num(Math.round((100-p.t)*10)/10)+' against the Coalition'+(p.b2?' ('+sampleBase(p.b2)+')':'')+'.':'')+(p.to!=null?' Published against One Nation: '+num(p.to)+'.':'')+'</p>';
    const y=p.yd&&(p.yd.imp||p.yd.lnp);if(y&&p.i!=null&&p.yd.imp)s+=`<p>Against the line at its fieldwork, estimated without it (${f1(p.yd.imp[0])}): ${sg(Math.round((p.i-p.yd.imp[0])*10)/10)}; the house’s lean then ${p.yd.imp[1]!=null?sg(Math.round(p.yd.imp[1]*10)/10):'–'}.</p>`;
    sec.push(['twopp',s])}
  const pp=ppmOf(p),nets=LEAD.map(([k,nm])=>{const a=p.ap&&p.ap[k];return a&&a.app!=null?`${nm} ${num(a.app)} approve, ${num(a.dis)} disapprove (net ${sg(a.app-a.dis)})`:null}).filter(Boolean);
  if(pp||nets.length)sec.push(['leaders','<h3>Leaders</h3>'+(nets.length?`<p>${nets.join('; ')}.</p>`:'')+((p.ppms||[]).length?'<p>Better prime minister: '+p.ppms.map(st=>['alb','taylor','hanson'].filter(k=>st[k]!=null).map(k=>LEAD.find(l=>l[0]===k)[1]+' '+num(st[k])).join(', ')+(st.label?' ('+esc(st.label)+')':'')).join('; ')+'.</p>':pp?`<p>Better prime minister: ${pp.ks.map(k=>LEAD.find(l=>l[0]===k)[1]+' '+num(pp.s[k])).join(', ')}.</p>`:'')]);
  if(p.dir&&p.dir.right!=null)sec.push(['direction',`<h3>Direction</h3><p>Right direction ${num(p.dir.right)}, wrong track ${num(p.dir.wrong)}${p.dir.unsure!=null?', unsure '+num(p.dir.unsure):''}${p.dir.chg&&p.dir.ref?' (net '+sg(p.dir.chg.net)+' on '+esc(fday(p.dir.ref))+')':''}.</p>`+(p.dir.bg||[]).map(g=>`<p>${esc(g.head)} ${g.cuts.map(c=>esc(c.label)+' '+num(c.right)+'–'+num(c.wrong)).join(', ')}</p>`).join('')]);
  if(p.iss&&(p.iss.own||p.iss.bp)){const ids=Object.keys(p.iss.own||{});let s='<h3>Issues</h3>';
    if(ids.length)s+=`<div class="scroll"><table class="tb"><thead><tr><th>Best on${p.iss.q?' ('+esc(p.iss.q)+')':''}</th>${['alp','onp','lnp','grn'].map(k=>`<th>${ABBR[k]}</th>`).join('')}</tr></thead><tbody>${ids.map(id=>`<tr><td>${esc(ISSL[id]||(DATA.issL||{})[id]||id)}</td>${['alp','onp','lnp','grn'].map(k=>`<td>${num(p.iss.own[id][k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(p.iss.sal)s+='<p>What matters most: '+p.iss.sal.slice(0,6).map(([l,v])=>esc(l)+' '+num(v)).join(', ')+'.</p>';
    sec.push(['issues',s])}
  if(p.grp&&p.grp.d&&Object.keys(p.grp.d).length){
    const parts=Object.values(p.grp.d),per=Math.ceil(parts.length/Math.min(3,parts.length));
    const columns=Array.from({length:Math.min(3,parts.length)},(_,i)=>parts.slice(i*per,(i+1)*per));
    const s='<h3>The vote by group</h3><div class="demo-cols" data-cols="'+columns.length+'">'+columns.map(groups=>'<div class="scroll"><table class="tb"><thead><tr><th></th>'+ORDER.map(k=>`<th>${ABBR[k]}</th>`).join('')+'</tr></thead><tbody>'+groups.map(rows=>rows.map(([lab,v])=>`<tr><td>${esc(lab)}</td>${ORDER.map(k=>`<td>${num(v[PK.indexOf(k)])}</td>`).join('')}</tr>`).join('')).join('<tr><td colspan="6" style="height:6px"></td></tr>')+'</tbody></table></div>').join('')+'</div>';
    sec.push(['demographics',s]);
  }
  sec.sort((x,y)=>(x[0]===F?-1:y[0]===F?1:0));
  if(p.cons){
    const names={...NAME,ind:'Independent',none:'None'};
    const readings=ranges(p).map(([shares,label])=>'<p><b>'+esc(label)+'</b> · '+Object.entries(shares).map(([k,v])=>{const ci=considerationInterval(p,v,shares);return esc(names[k]||k)+' '+num(v)+'%'+(ci?' ('+ci+'%)':'')}).join(', ')+'.</p>').join('');
    sec.splice(F==='primary'&&consideration?0:sec.length,0,['consideration','<h3>Voting consideration</h3>'+readings+'<p>'+ (considerationInterval(p,Object.values(p.cons)[0],p.cons)?'Parentheses show approximate 95% credible intervals for each response, using the effective sample size and allowing for rounding.':'95% credible intervals are unavailable for this wave.')+'</p>']);
  }
  const first=sec.shift();
  return (first?first[1]:'')+'<details><summary>Sources and fieldwork</summary><div>'+b.join('')+'</div></details>'+sec.map(([k,html])=>'<details><summary>'+esc(facetTitle[k])+'</summary><div>'+html+'</div></details>').join('');
}
function toggle(li,open){
  const btn=$('button',li),d=li.nextElementSibling,pool=F==='confidence'?CONF:POLLS,p=pool.find(r=>'p-'+r.k===li.id);if(!p)return;
  const on=open==null?btn.getAttribute('aria-expanded')!=='true':open;
  if(on&&!$('.det',d).hasChildNodes())$('.det',d).innerHTML=detail(p);
  li.classList.toggle('open',on);
  d.hidden=!on;btn.setAttribute('aria-expanded',String(on));
}
$('#list').addEventListener('click',e=>{const row=e.target.closest('tr.poll');if(row)toggle(row)});
tabs.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.f===F)return;F=b.dataset.f;$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x===b)));fillHouses();render();if(/^https?:$/.test(location.protocol))history.replaceState(null,'',F==='primary'?location.pathname:'?facet='+F)});
sel.addEventListener('change',render);
sortSelect.addEventListener('change',render);
$('#vote-mode').addEventListener('click',e=>{
  consideration=!consideration;
  e.currentTarget.title=consideration?'Switch to voting intention':'Switch to voting consideration';
  fillHouses();render();
});
$('#rival').addEventListener('click',e=>{
  const button=e.currentTarget;
  CONTEST=CONTEST==='lnp'?'on':'lnp';
  button.dataset.r=CONTEST;
  button.textContent=CONTEST==='lnp'?'Coalition':'One Nation';
  button.setAttribute('aria-checked',String(CONTEST==='on'));
  fillHouses();render();
});
let qt=0;q.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(render,120)});
offcutSel.addEventListener('change',()=>{fillHouses();render()});
splitSel.addEventListener('change',()=>{SPLIT=splitSel.value;fillHouses();render()});
$$('.seg[data-for=twopp] button').forEach(b=>b.addEventListener('click',()=>{const g=b.parentElement;$$('button',g).forEach(x=>x.setAttribute('aria-checked',String(x===b)));BASIS=b.dataset.b;fillHouses();render()}));
/* arriving from a chart's dot: open that poll, bring it into view, and mark it a moment */
function arrive(){
  const id=decodeURIComponent(location.hash.slice(1));if(!id.startsWith('p-'))return;
  let li=document.getElementById(id);
  if(!li&&(sel.value||q.value||F!=='primary')){sel.value='';q.value='';if(F!=='primary'){F='primary';$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f==='primary')));fillHouses()}render();li=document.getElementById(id)}
  if(!li){F='twopp';$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f==='twopp')));fillHouses();render();li=document.getElementById(id)}
  if(!li)return;
  toggle(li,true);
  li.scrollIntoView({block:'center',behavior:'instant'});
  li.classList.add('flash');setTimeout(()=>li.classList.remove('flash'),1600);
}
const want=new URLSearchParams(location.search).get('facet');
if(want&&FACETS[want]){F=want;$$('button',tabs).forEach(x=>x.setAttribute('aria-selected',String(x.dataset.f===F)))}
filterSelect({select:sel,label:"Pollster"});
filterSelect({select:sortSelect,label:"Sort by"});
filterSelect({select:offcutSel,label:"Offcut breakdown"});
filterSelect({select:splitSel,label:"Demographic split"});
fillHouses();render();arrive();addEventListener('hashchange',arrive);
$('#note').textContent='Primary vote shares are as published. Their 95% credible intervals account for effective sample size, pollster noise and rounding. A change from the same pollster’s last poll is significant when its 95% credible interval excludes zero, treating the two samples as independent. Where fieldwork overlaps, the comparison is left unclassified. Other measures marked ± show approximate 95% sampling uncertainty. n is the sample: D counts decided voters only, D+L decided voters and those leaning, A every respondent, F a forced choice with no undecided option; “eff.” is the house’s published effective sample, or “undisclosed” when it has not filed one. The 2PP is each poll’s primary votes run through the 2025 election’s preference flows (against One Nation, the site’s own) unless set to the pollster’s published figure; lean is the poll less the model’s line at its fieldwork, estimated without it.';
/* the menu */
const burger=$('#burger'),menu=$('#menu'),nav=$('#nav');
const setMenu=o=>{menu.hidden=!o;burger.setAttribute('aria-expanded',String(o));nav.classList.toggle('open',o);document.documentElement.style.overflow=o?'hidden':''};
burger.addEventListener('click',()=>setMenu(menu.hidden));
addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){setMenu(false);burger.focus()}});
}
</script>
