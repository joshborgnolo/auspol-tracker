  <style>/* ============================================================
   auspol tracker – design tokens & styles
   ============================================================ */
:root {
  /* surfaces – warm paper */
  --bg:        oklch(0.970 0.008 78);
  --surface:   oklch(0.992 0.004 85);
  --surface-2: oklch(0.980 0.006 80);

  /* ink – warm near-black */
  --ink:       oklch(0.27 0.012 55);
  --ink-2:     oklch(0.44 0.012 55);
  /* --ink-3 is the lightest ink that still carries TEXT (card subtitles, muted
     table cells). --ink-faint sits below the text threshold by design and is
     for rules, ticks and glyphs only.
     Pinned at 5.1:1 on --bg rather than exactly 4.5, because several of the
     things it labels sit on a TINTED pill rather than on paper (.vr-pill,
     .cyc-lead), which costs ~0.5 – at 0.54 those landed at 4.2-4.5. */
  --ink-3:     oklch(0.52 0.010 58);
  --ink-faint: oklch(0.70 0.008 65);

  /* hairlines */
  --line:   oklch(0.895 0.008 75);
  --line-2: oklch(0.935 0.006 78);

  /* party colours – muted, shared chroma family */
  --alp: oklch(0.55 0.150 27);   /* Labor red    */
  --lnp: oklch(0.50 0.095 250);  /* Coalition blue */
  --grn: oklch(0.60 0.120 150);  /* Greens       */
  --onp: oklch(0.66 0.130 58);   /* One Nation orange */
  --oth: oklch(0.64 0.018 70);   /* Others grey  */

  /* The party colours above are MARK colours – tuned for dots, lines and bars,
     where luminance carries no legibility burden. Set the same hue as 10px
     type and Greens lands at 3.5:1 and One Nation at 3.0:1 on paper. These are
     the same hues held to the text threshold, and every party colour that
     paints a GLYPH uses them (see inkOf() in the shared helpers). Labor and the
     Coalition are already dark enough, so they alias and nothing shifts. */
  --alp-text: var(--alp);
  --lnp-text: var(--lnp);
  --grn-text: oklch(0.52 0.120 150);
  --onp-text: oklch(0.52 0.130 58);

  --accent: oklch(0.50 0.070 205);

  /* backdrop the charts actually sit on – used as the halo behind reference
     labels. Card surface in panelled mode, page paper in editorial. */
  --chart-bg: var(--surface);

  /* national-mood colours – distinct from party palette.
     mood-neg is a muted brick/clay (darker + duller than One Nation's
     bright orange, browner than Labor red) so the right/wrong-track axis
     never reads as a party hue. */
  --mood-pos: oklch(0.52 0.085 200);
  --mood-neg: oklch(0.505 0.092 36);

  /* past-cycle overlay lines – neutral graphite so the metric (not the party)
     leads; the current cycle and any highlighted cycle override with party hue */

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 14px;
  --shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05), 0 6px 20px oklch(0.4 0.02 60 / 0.05);
  --maxw: 1200px;

  /* approval bar tints (theme-aware) */
  --appr-app-bg: oklch(0.62 0.10 150 / 0.22);
  --appr-dis-bg: oklch(0.60 0.13 28 / 0.18);
  --tip-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05), 0 6px 20px oklch(0.4 0.02 60 / 0.05);
  /* shared frosted-glass material – one recipe for every floating readout,
     pill toggle and the pinned nav, so translucency reads as one language.
     Only visible over content (charts, scrolled page); inert on flat paper. */
  --glass-bg: color-mix(in oklch, var(--surface) 58%, transparent);
  --glass-border: color-mix(in oklch, var(--line) 60%, transparent);
  --glass-blur: blur(9px) saturate(1.2);
}

/* cool paper (light) – accent tone shift, party colours untouched */
body.cool {
  --bg:        oklch(0.972 0.006 235);
  --surface:   oklch(0.993 0.003 235);
  --surface-2: oklch(0.982 0.005 235);
  --line:      oklch(0.892 0.009 235);
  --line-2:    oklch(0.934 0.006 235);
}

/* ============================================================
   DARK MODE – warm near-black "newsprint at night"
   ============================================================ */
body.dark {
  --bg:        oklch(0.215 0.010 65);
  --surface:   oklch(0.252 0.011 66);
  --surface-2: oklch(0.292 0.012 66);

  --ink:       oklch(0.940 0.008 80);
  --ink-2:     oklch(0.800 0.009 78);
  --ink-3:     oklch(0.670 0.009 72);
  --ink-faint: oklch(0.545 0.009 68);

  --line:   oklch(0.355 0.011 66);
  --line-2: oklch(0.312 0.010 66);

  /* party colours – lifted for luminance on dark, same hues */
  --alp: oklch(0.660 0.165 28);
  --lnp: oklch(0.680 0.130 252);
  --grn: oklch(0.720 0.135 152);
  --onp: oklch(0.760 0.135 64);
  --oth: oklch(0.700 0.018 72);

  /* On dark the marks are already lifted well past the text threshold, so the
     text variants alias straight through – the split still has to EXIST here
     or inkOf() would resolve to nothing in dark mode. */
  --alp-text: var(--alp);
  --lnp-text: var(--lnp);
  --grn-text: var(--grn);
  --onp-text: var(--onp);

  --accent: oklch(0.70 0.080 205);

  /* national-mood colours – lifted for dark (brick stays browner/duller than ON) */
  --mood-pos: oklch(0.70 0.105 200);
  --mood-neg: oklch(0.685 0.105 38);


  --shadow: 0 1px 2px oklch(0 0 0 / 0.30), 0 8px 28px oklch(0 0 0 / 0.40);
  --tip-shadow: 0 1px 2px oklch(0 0 0 / 0.35), 0 10px 30px oklch(0 0 0 / 0.50);
  --appr-app-bg: oklch(0.72 0.13 152 / 0.26);
  --appr-dis-bg: oklch(0.66 0.16 28 / 0.24);
  /* dark glass: a touch more opaque + more saturation so lines read through it */
  --glass-bg: color-mix(in oklch, var(--surface) 62%, transparent);
  --glass-border: color-mix(in oklch, var(--line) 65%, transparent);
  --glass-blur: blur(10px) saturate(1.35);
}

/* dark + cool – shift the warmth toward slate */
body.dark.cool {
  --bg:        oklch(0.210 0.012 248);
  --surface:   oklch(0.248 0.013 248);
  --surface-2: oklch(0.288 0.014 248);
  --line:      oklch(0.352 0.013 248);
  --line-2:    oklch(0.310 0.012 248);
}

/* editorial dark: paper tint already handled by body.dark vars */
body.dark.editorial { --bg: oklch(0.205 0.010 65); }
body.dark.editorial.cool { --bg: oklch(0.200 0.012 248); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  /* re-declare at body level so it resolves against the THEME's surface –
     custom properties substitute where they're defined, and .dark/.editorial
     live on body, not :root */
  --chart-bg: var(--surface);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  transition: background-color .35s ease, color .35s ease;
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.45;
}

/* ---------- pre-script / no-JS state ----------
   What the document shows before React mounts. This used to be an animated
   placeholder set to opacity:0 for 250ms while React mounted in ~160ms, i.e. a
   spinner nobody ever saw sitting where the content should have been. It is
   now the real headline aggregate as text (see buildStaticSummary in
   build.mjs), styled well enough to stand on its own for a reader whose script
   never ran, and cleared by createRoot() for everyone else. */
.static-summary {
  max-width: 680px; margin: 0 auto; padding: 40px 28px 24px;
  font-family: var(--sans); color: var(--ink);
}
.static-summary h1 {
  font-family: var(--serif); font-size: 34px; font-weight: 600;
  letter-spacing: -0.01em; margin: 0 0 6px;
}
.static-summary h2 {
  font-family: var(--serif); font-size: 20px; font-weight: 600;
  margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid var(--line);
}
.ss-sub { margin: 0 0 4px; font-size: 15px; line-height: 1.55; color: var(--ink-2); }
.ss-lead { font-size: 22px; margin: 0 0 8px; font-variant-numeric: tabular-nums; }
.static-summary p { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); }
.ss-primary { margin: 0; padding: 0; list-style: none; font-size: 15px; }
.ss-primary li {
  display: flex; justify-content: space-between; max-width: 320px;
  padding: 5px 0; border-bottom: 1px solid var(--line-2);
  font-variant-numeric: tabular-nums;
}
.ss-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ss-table caption { text-align: left; padding-bottom: 8px; font-size: 12.5px; color: var(--ink-3); }
.ss-table th, .ss-table td {
  text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line-2);
  font-variant-numeric: tabular-nums;
}
.ss-table thead th { font-size: 11px; color: var(--ink-3); }
.ss-table th[scope="row"], .ss-table thead th:first-child { text-align: left; font-weight: 600; }
.ss-table td:nth-child(2) { text-align: left; }
.ss-note { margin-top: 20px; font-size: 12.5px; color: var(--ink-3); }
.boot-noscript {
  max-width: 680px; margin: 0 auto 12vh; padding: 16px 26px;
  font-family: var(--sans); font-size: 14px; line-height: 1.5; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.boot-noscript strong { color: var(--ink); }
.legend-val, .appr-bar span, .tip-val { font-variant-numeric: tabular-nums; }

/* Insets, not guesses. viewport-fit=cover means the page now owns the notch
   strip and the home-indicator strip, so the padding has to give them back -
   including left/right, which are nonzero in landscape on a notched phone.
   env() falls back to 0px everywhere that has no insets. */
.page {
  max-width: var(--maxw); margin: 0 auto;
  padding: calc(28px + env(safe-area-inset-top, 0px))
           calc(28px + env(safe-area-inset-right, 0px))
           calc(64px + env(safe-area-inset-bottom, 0px))
           calc(28px + env(safe-area-inset-left, 0px));
}

/* ---------- header ---------- */
.site-head {
  position: relative;
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 28px; flex-wrap: wrap;
  padding-bottom: 16px; margin-bottom: 26px;
  border-bottom: 1px solid var(--line);
}
.wordmark {
  display: inline-flex; align-items: center; gap: 3px;
  font-weight: 800; font-size: 30px; letter-spacing: -0.025em; line-height: 1;
  margin: 0;
}
/* visually-hidden: the wordmark's expansion for screen readers / document
   outline, and the charts' live readout (see .chart-svg below) */
.wm-sr, .sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
/* 12px, not 7: the dial's nearest ink is the tallest graduation's tip, which
   reaches to within 0.9px of the box edge, so the clear space a reader sees is
   the gap plus almost nothing. 12px puts it at 12.9px - a third of the mark's
   own height, and it opens to 25px beside the letters themselves. */
.wordmark.stacked { flex-direction: row; align-items: center; gap: 12px; }
/* Both words at ONE size, told apart by weight alone. At 30px `auspol` at 800
   measures 93.6px and `tracker` at 400 measures 95px, so the block squares
   itself off on its own - no tracking, no size step, no indent to force it.
   The old second line bought that same width with 0.46em of letter-spacing,
   which is enough air to stop the word reading as a word; and the 0.23em
   indent it needed to re-centre pushed the T 2.8px right of the a, so the
   lockup had no shared left edge. Weight contrast also survives what the old
   grey/black split did not: small sizes, greyscale, and dark, where --ink-3
   on a dark ground reads as switched off rather than as secondary. */
.wm-textcol { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 1px; }
.wm-name {
  display: inline-flex; font-weight: 800; font-size: 30px;
  letter-spacing: -0.025em; line-height: 0.95; color: var(--ink);
}
.wordmark.stacked .wm-track {
  align-self: flex-start; margin-left: 0; padding-bottom: 0;
  display: inline-block; text-indent: 0;
  font-size: 30px; font-weight: 400; letter-spacing: -0.03em;
  text-transform: none; line-height: 0.95; color: var(--ink-3);
}
.wm-track {
  align-self: flex-end; margin-left: 9px; padding-bottom: 3px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.34em;
  text-transform: uppercase; color: var(--ink-3);
}
/* glyph = one dial: live primary-vote columns as radial graduations on a
   two-tone 2PP swing arc, needle from the shared pivot */
.wm-glyph {
  display: inline-flex; align-items: center; margin-left: 0; align-self: center;
  /* No vertical nudge, and none needed: once the viewBox bounds what is
     actually drawn, centring the box centres the INK - 0.05px off the
     wordmark's own ink centre. The old translateY was compensating for a
     viewBox with all its slack on one side. The dial's own foot cannot help
     here: standing it on either visible baseline throws it 10px clear of the
     block at one end or 2.5px past it at the other, and the midpoint between
     them is a construction line nobody can see. */
  background: none; border: 0; padding: 3px; margin: -3px; cursor: pointer;
  border-radius: 8px; transition: transform .28s cubic-bezier(.3,1.2,.5,1), background-color .2s ease;
}
.wm-glyph:hover { background: color-mix(in oklch, var(--ink) 6%, transparent); transform: scale(1.06); }
.wm-glyph:active { transform: scale(0.97); }
.wm-glyph:focus-visible { outline: 2px solid var(--accent, var(--ink-3)); outline-offset: 2px; }

/* ---------- the dial, wound back ---------- */
/* Paper, not a lightbox: this is a printed instrument being demonstrated, so
   the backdrop is the page's own stock rather than a black scrim. */
.dl-backdrop {
  position: fixed; inset: 0; z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background: color-mix(in oklch, var(--surface) 88%, transparent);
  backdrop-filter: blur(7px) saturate(1.05);
  animation: dl-in .3s ease both;
}
@keyframes dl-in { from { opacity: 0 } to { opacity: 1 } }
.dl-shell {
  position: relative; width: min(560px, 100%); max-height: 100%;
  display: flex; flex-direction: column; gap: 18px;
  padding: 30px 30px 24px; border-radius: 16px;
  background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 30px 80px -30px color-mix(in oklch, var(--ink) 40%, transparent);
  transform-origin: center center;
}
.dl-close {
  position: absolute; top: 10px; right: 12px; width: 30px; height: 30px;
  border: 0; background: none; color: var(--ink-3); cursor: pointer;
  font: 400 24px/1 var(--sans); border-radius: 8px;
}
.dl-close:hover { color: var(--ink); background: var(--surface-2); }

.dl-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.dl-svg { width: min(420px, 94%); height: auto; overflow: visible; display: block; }
.dl-arc { fill: none; stroke-width: 1.4; opacity: 0.5; transition: none; }
.dl-bar { stroke-width: 3.4; stroke-linecap: butt; }
.dl-read-party {
  font-family: var(--sans); font-size: 2.15px; font-weight: 800;
  letter-spacing: 0.10em; opacity: 0.95;
}
.dl-read-val {
  font-family: var(--sans); font-size: 3.3px; font-weight: 700; fill: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.dl-needle { stroke-width: 1.7; stroke-linecap: round; }
/* a bearing, not a blob – the solid grey disc sat heavier than the needle */
.dl-pivot { fill: var(--surface); stroke: var(--ink-3); stroke-width: 0.7; }
.dl-trail { stroke: var(--ink-3); stroke-width: 1.1; stroke-linecap: round; }
/* everywhere the needle has been so far – the term's swing, accumulated */
.dl-envelope { fill: none; stroke: var(--ink-faint); stroke-width: 0.75; opacity: 0.5; }
.dl-envelope line { stroke: var(--ink-faint); stroke-width: 0.75; }
/* the event line above the dial – fixed height so it never shifts layout */
.dl-event {
  height: 20px; display: flex; align-items: center; justify-content: center;
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em; color: var(--ink-2);
}
.dl-event span { display: inline-flex; align-items: center; gap: 7px; }
.dl-event-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); }

.dl-cap { text-align: center; }
.dl-month {
  font-family: var(--serif, var(--sans)); font-size: 25px; font-weight: 500; color: var(--ink);
  letter-spacing: -0.01em; display: flex; align-items: baseline; justify-content: center; gap: 9px;
}
.dl-tag {
  font-family: var(--sans); font-size: 9.5px; font-weight: 700;
  color: var(--ink-3); border: 1px solid var(--line);
  border-radius: 999px; padding: 2px 7px;
}
.dl-contest {
  margin-top: 5px; font-family: var(--sans); font-size: 15px; font-weight: 700;
  font-variant-numeric: tabular-nums; display: flex; gap: 9px; justify-content: center;
}
.dl-v { color: var(--ink-3); font-weight: 500; font-style: italic; }
.dl-note { margin-top: 5px; font-size: 12px; color: var(--ink-3); }

/* The timeline is a line graph now (see DialTrack), so it needs real height -
   at 26px a 2PP range of a few points had nowhere to go. */
.dl-track { position: relative; height: 62px; cursor: default; touch-action: none; }
.dl-track:not(.playing) { cursor: ew-resize; }
.dl-track:focus-visible { outline: 2px solid var(--accent, var(--ink-3)); outline-offset: 3px; border-radius: 6px; }
.dl-spark { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dl-spark-50 {
  stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 4; opacity: 0.8;
}
.dl-spark-ghost {
  fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round;
}
.dl-spark-run {
  fill: none; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round;
}
.dl-tick {
  position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink-faint);
  opacity: 0.5; transform: translateX(-0.5px);
}
.dl-tick.on { opacity: 0.9; background: var(--ink-3); }
/* the playhead reads on the line, not beside it: a hairline for the month and
   a dot at the value, carrying that month's challenger colour */
.dl-head-rule {
  position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink);
  opacity: 0.28; transform: translateX(-0.5px);
}
.dl-head {
  position: absolute; width: 9px; height: 9px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--surface);
  transform: translate(-50%, -50%);
  box-shadow: 0 1px 4px color-mix(in oklch, var(--ink) 30%, transparent);
}
@media (prefers-reduced-motion: no-preference) {
  .dl-track:not(.playing) .dl-head,
  .dl-track:not(.playing) .dl-head-rule { transition: left .12s ease, top .12s ease; }
}

.dl-foot { display: flex; align-items: flex-end; gap: 16px; }
.dl-legend { flex: 1; font-size: 11.5px; line-height: 1.5; color: var(--ink-3); }
.dl-replay {
  flex: none; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 6px 14px; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer;
}
.dl-replay:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-3); }
.dl-replay:disabled { opacity: 0.5; cursor: default; }

@media (max-width: 560px) {
  .dl-shell { padding: 26px 18px 18px; }
  .dl-svg { width: 96%; }
  .dl-month { font-size: 21px; }
  .dl-foot { flex-direction: column; align-items: stretch; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  .dl-backdrop { animation: none; }
  .wm-glyph, .wm-glyph:hover, .wm-glyph:active { transition: none; transform: none; }
}
.wordmark.stacked .wm-glyph { align-self: center; }
.wm-dial { display: block; overflow: visible; }
.wm-arc { fill: none; stroke-width: 1.4; opacity: 0.5; }
.wm-pivot { fill: var(--ink-3); }
.wm-needle-g { transition: transform .75s cubic-bezier(.34,1.3,.5,1); }
/* settles alongside the needle; no overshoot, since a graduation running past
   its own value and back reads as an error rather than as momentum */
.wm-bar { transition: stroke-dasharray .75s cubic-bezier(.22,.9,.24,1); }
@media (prefers-reduced-motion: reduce) { .wm-needle-g, .wm-bar { transition: none; } }
.tagline {
  margin: 7px 0 0; font-family: var(--serif);
  font-size: 15px; color: var(--ink-3); text-wrap: balance;
}
/* compact freshness line – only surfaced on small screens, where the full
   meta block is hidden (see the 560px breakpoint) */
.head-meta-compact { display: none; }
.head-right { display: flex; align-items: center; gap: 18px; }
.head-meta { display: flex; align-items: center; gap: 18px; }
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-k { font-size: 11px; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.meta-v { font-size: 14px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.fresh-dot {
  display: inline-block; vertical-align: middle; position: relative; top: -1px;
  width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
}
.fresh-dot.fresh { background: var(--mood-pos); }
.fresh-dot.aging { background: var(--ink-3); }
.fresh-dot.stale { background: var(--mood-neg); }
.fresh-rel { margin-left: 6px; color: var(--ink-3); font-weight: 500; }
.meta-divide { width: 1px; height: 30px; background: var(--line); }
.theme-cell {
  padding: 7px 10px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3);
}
.theme-cell:hover { color: var(--ink-2); }
.theme-cell.active { color: var(--ink); }
.theme-cell svg { display: block; }

/* ---------- accessibility: keyboard focus ---------- */
/* single shared focus ring for every interactive control. mouse/touch users
   never see it (:focus-visible); keyboard users always get a clear path. */
:focus { outline: none; }
:focus-visible,
.seg-btn:focus-visible, .tt-opt:focus-visible, .theme-cell:focus-visible,
.legend-chip:focus-visible, .ap-popbtn:focus-visible, .ap-check:focus-visible, .exp-btn:focus-visible,
.poll-row:focus-visible, th.sortable:focus-visible, a:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.poll-row:focus-visible { outline-offset: -2.5px; } /* inset so the ring shows inside the table */

/* ---------- accessibility: 44px tap targets ---------- */
/* keep the tight editorial sizing visually, but extend the *hit* area to a
   44px-tall invisible overlay so the controls are comfortable on touch. */
.tt-opt, .theme-cell, .legend-chip, .seg-btn,
.cyc-chip, .ap-popbtn, .tab-score, .cyc-showall, .ap-clear { position: relative; }
.tt-opt::after, .theme-cell::after, .legend-chip::after, .seg-btn::after,
.cyc-chip::after, .ap-popbtn::after, .tab-score::after,
.cyc-showall::after, .ap-clear::after {
  content: ""; position: absolute; left: 0; right: 0;
  top: 50%; transform: translateY(-50%);
  height: 44px;
}
/* the search-clear × lives inside the input – inflate more conservatively so
   it can't steal caret-placement taps at the field's right end */
.ap-search-x::after {
  content: ""; position: absolute; left: -4px; right: -4px;
  top: 50%; transform: translateY(-50%); height: 36px;
}

/* ---------- layout ---------- */
.content { display: flex; flex-direction: column; gap: 22px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

/* ---------- leadership pair: expand one side to full width ----------
   grid-template-columns is animatable, so collapsing a column to 0fr gives a
   real expansion rather than a swap: both panels stay mounted and the survivor
   grows into the space. min-width:0 is what lets a grid child shrink below its
   content, and overflow:hidden stops the collapsing panel spilling out. */
/* Flex rather than grid, deliberately. Collapsing a grid track means animating
   `grid-template-columns` from 1fr to 0fr, and an `fr` inside minmax() does not
   interpolate here – the transition holds the start value and the panel never
   moves. `flex-grow` is a plain number, so 1 → 0 animates everywhere. */
.lead-grid {
  display: flex; align-items: flex-start;
  grid-template-columns: none;      /* drop the .two-col grid tracks */
}
.lead-grid > * {
  flex: 1 1 0; min-width: 0;
  transition: flex-grow .42s cubic-bezier(.4, 0, .2, 1),
              opacity .22s ease,
              visibility 0s linear .22s;
}
.lead-grid.lg-ppm  > :last-child,
.lead-grid.lg-appr > :first-child {
  flex-grow: 0; overflow: hidden; opacity: 0; pointer-events: none;
  /* delayed to the end of the fade, then instant on the way back – this is
     what takes the collapsed panel out of the tab order and the accessibility
     tree, which opacity alone does not */
  visibility: hidden;
}
/* the collapsed side keeps no gap, so the survivor really is full-bleed */
.lead-grid.lg-ppm, .lead-grid.lg-appr { gap: 0; }

.card-head-tools { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.pz-group { display: flex; gap: 2px; }
.pz-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border-radius: 6px;
  background: transparent; border: 1px solid transparent;
  color: var(--ink-3); cursor: pointer;
  transition: color .15s ease, background-color .15s ease, border-color .15s ease;
}
.pz-btn:hover { color: var(--ink); background: var(--surface-2); border-color: var(--line); }
.pz-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .lead-grid, .lead-grid > * { transition: none; }
}
/* Below the two-column breakpoint the panels are already full width, so there
   is nothing to expand INTO – but minimise and swap stay, otherwise anyone who
   expands on a wide screen and then narrows the window is stranded. */
@media (max-width: 1200px) {
  .pz-expand { display: none; }
  /* the .two-col grid rule can't stack a flex row, so say it directly */
  .lead-grid { flex-direction: column; }
  .lead-grid > * { flex: 0 0 auto; width: 100%; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px 20px;
  transition: background-color .35s ease, border-color .35s ease;
}
.card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px; flex-wrap: wrap; margin-bottom: 14px;
}
.card-title { font-family: var(--serif); font-weight: 540; font-size: 22px; margin: 0; letter-spacing: -0.01em; color: var(--ink); line-height: 1.15; }
.card-sub { margin: 3px 0 0; font-size: 13px; color: var(--ink-3); text-wrap: pretty; }

/* ---------- segmented control ---------- */
.segmented {
  display: inline-flex; gap: 3px; padding: 3px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px;
}
.seg-btn {
  border: 0; background: transparent; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-3);
  padding: 6px 13px; border-radius: 7px; transition: all .15s ease; white-space: nowrap;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn.active {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.12); border: 1px solid var(--line-2);
}
.segmented-sm .seg-btn { padding: 5px 10px; font-size: 12px; }

/* ---------- text toggle (editorial control) ---------- */
.text-toggle { display: inline-flex; align-items: baseline; gap: 11px; }
.tt-opt {
  border: 0; background: transparent; cursor: pointer; padding: 2px 0;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  color: var(--ink-3); letter-spacing: -0.005em;
  border-bottom: 1.5px solid transparent; transition: color .15s ease; white-space: nowrap;
}
.tt-opt:hover { color: var(--ink-2); }
.tt-opt.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.tt-div { width: 1px; height: 13px; background: var(--line); align-self: center; }
.tt-dots { display: inline-flex; gap: 2.5px; margin-right: 6px; vertical-align: middle; position: relative; top: -1px; }
.tt-dot { width: 6px; height: 6px; border-radius: 50%; }
/* flanking dots: left dot keys to the first party, right dot to the second –
   mirrors the sticky scoreboard's "• ALP … L/NP •" heraldic layout.
   inline-block so width/height apply even though .tt-opt is display:block. */
.tt-dot-l, .tt-dot-r { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; }
.tt-dot-l { margin-right: 7px; position: relative; top: -1px; }
.tt-dot-r { margin-left: 7px; position: relative; top: -1px; }
.tt-opt:not(.active) .tt-dot-l,
.tt-opt:not(.active) .tt-dot-r { opacity: 0.78; }
/* shared party-token vocabulary – used by the matchup selector AND the sticky
   scoreboard so "ALP" / "L/NP" read as the same tracked-caps token everywhere. */
.party-tok { letter-spacing: 0.04em; font-weight: 600; }
.tt-opt.active .party-tok { font-weight: 700; }
.tt-vs { font-style: italic; font-weight: 400; color: var(--ink-3); margin: 0 4px; }
.tt-opt:not(.active) .tt-dots { opacity: 0.78; }
.tt-caps .tt-opt {
  font-size: 12px; font-weight: 600;
  color: var(--ink-3);
}
.tt-caps .tt-opt.active { color: var(--ink); font-weight: 700; }
.tt-caps .tt-div { height: 10px; }

/* ---------- hero ---------- */
.hero { padding: 26px 28px 22px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 6px; }
.hero-readout { display: flex; align-items: baseline; gap: 16px; }
.ro-party { display: flex; align-items: baseline; gap: 11px; }
.ro-dot { width: 13px; height: 13px; border-radius: 50%; align-self: center; }
.ro-name { font-size: 17px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.01em; white-space: nowrap; }
.ro-num { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; color: var(--ink); }
.alp-side .ro-num { color: var(--alp-text); }
.lnp-side .ro-num { color: var(--lnp-text); }
.ro-sep { width: 2px; height: 44px; border-radius: 1px; background: var(--line); align-self: center; }

/* ---- rolling figures ----
   Each digit is a reel of 0-9 in a one-em window, moved by transform alone, so
   the whole headline animates on the compositor however large the type is.
   Tabular figures keep the columns from breathing as they pass through 1 and
   7, and `.roll-anchor` is a zero-width invisible line of text that hands the
   flex row an ordinary text baseline - without it the clipped digit boxes
   would report their bottom edge as the baseline and drop the party name by a
   fifth of a 62px em. */
.roll { display: inline-flex; align-items: flex-start; line-height: 1; font-variant-numeric: tabular-nums; }
.roll-anchor { display: block; width: 0; height: 1em; line-height: 1em; visibility: hidden; }
.roll-d { display: block; height: 1em; overflow: hidden; }
.roll-reel {
  display: block;
  transform: translateY(calc(var(--d) * -1em));
  /* the same curve and duration MORPH_EASE samples in views.jsx – digits,
     colour, lines and dots all move as one thing or they look like four */
  transition: transform .32s cubic-bezier(.4, .1, .25, 1);
}
.roll-reel > span, .roll-sep { display: block; height: 1em; line-height: 1em; }
/* The reel is nine digits the reader never sees, and aria-hidden keeps them out
   of the accessibility tree – but a SELECTION doesn't consult aria, so without
   this, copying "Labor leads by 7.6 pts" would paste every digit on every reel.
   The value is carried by the .sr-only span, which stays selectable, so the
   line copies as the sentence it looks like. */
.roll-d, .roll-sep, .roll-anchor { -webkit-user-select: none; user-select: none; }
.hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.lead-tag { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.hero-sub-note { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
/* The interval sits directly under the headline pair, quieter than the numbers
   but above the lead/delta line – it qualifies the figure, so it reads before
   the movement does. */
/* the hero's subhead now matches the other panels; the method label that used
   to sit beside it in small caps has moved down to the interval line, where it
   reads as the first clause of how the figure was made and how well it is known */
.hero-title { margin-bottom: 12px; }
.hero-interval { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hi-method { font-size: 13px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
/* Separators hang off the END of each clause, not the start of the next: as
   a ::before they belonged to the following flex item, so a wrap carried the
   dot down to open the next line on its own. */
.hero-interval > *:not(:last-child)::after {
  content: "·"; color: var(--ink-3); font-weight: 400; margin-left: 8px;
}
@media (max-width: 620px) {
  /* give the note its own line rather than letting it break mid-clause, and
     drop the dot that would then be left dangling at the end of the first */
  .hi-note { flex-basis: 100%; margin-top: 1px; }
  .hero-interval > .hi-range:not(:last-child)::after { content: none; }
}
.hi-range { font-size: 14px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hi-note { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
/* Movement smaller than its own interval – stated, not colour-coded, so it
   reads as a qualification rather than a warning. */
.hero-caveat { color: var(--ink-3); font-style: italic; }
.hero-controls { display: flex; flex-direction: column; gap: 14px; align-items: flex-end; }

.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
/* wraps: the interval swatch made this a four-item legend, which runs off
   the right edge of a phone if the items are held on one line */
.hero-legend { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.hl-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.hl-line { width: 18px; height: 3px; border-radius: 2px; }
.hl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); opacity: 0.6; }
/* party swatch as a dot, for a matchup drawn as readings with no trend line */
.hl-swatch-dot { width: 9px; height: 9px; border-radius: 50%; opacity: 0.75; }
/* the interval ribbon: both party bands at the opacity they are drawn with,
   stacked, so the swatch shows the overlap the chart is asking to be read */
/* The interval ribbon. Dark needs more of it: a 13% tint of a light party
   colour reads on paper and disappears against the dark ground. */
.ci-band { opacity: 0.13; }
body.dark .ci-band { opacity: 0.22; }
.hl-band { width: 18px; height: 11px; border-radius: 2px;
  background: linear-gradient(to bottom,
    color-mix(in oklch, var(--alp) 13%, transparent) 0 55%,
    color-mix(in oklch, var(--lnp) 13%, transparent) 45% 100%); }
/* "limited data" caveat inside the hero eyebrow – same size, quieter weight,
   so it reads as a qualifier on the method rather than a separate label */
.eyebrow-warn { color: var(--ink-3); font-weight: 600; }
.hero-caption { margin: 0; font-size: 12.5px; color: var(--ink-3); }

/* the contests that are not on the chart, each carrying its own figure. A
   button, not a tab: pressing one makes it the headline and morphs the chart. */
.hero-alt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.ha-lab { font-size: 10.5px; font-weight: 700;
  color: var(--ink-3); }
.ha-chip { display: inline-flex; align-items: baseline; gap: 8px; cursor: pointer;
  background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px;
  font: inherit; color: var(--ink-2); transition: border-color 120ms ease, background 120ms ease; }
.ha-chip:hover { border-color: var(--line-2); background: var(--surface-2, transparent); }
.ha-vs { font-size: 11.5px; font-weight: 600; }
.ha-fig { font-family: var(--serif); font-size: 16px; font-weight: 600;
  font-variant-numeric: tabular-nums; }
.ha-dash { color: var(--ink-3); margin: 0 3px; }
.ha-ci { font-size: 10.5px; color: var(--ink-3); }

/* ---------- delta ---------- */
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.delta-sm { font-size: 12px; }
.delta-arrow { font-size: 9px; }
/* movement is non-partisan: direction is carried by the arrow + sign, not
   by a party colour, so a falling Labor figure no longer renders in Labor red */
.delta.up { color: var(--ink-2); }
.delta.down { color: var(--ink-2); }
.delta.flat { color: var(--ink-3); font-weight: 600; }

/* ---------- chart ---------- */
.chart { position: relative; width: 100%; margin-top: 4px; }
/* pan-y keeps vertical page scrolling with the browser while horizontal drags
   belong to the chart, so scrubbing the guide on a phone never fights the page.
   The chart is a tab stop (arrow keys step the guide), so it needs the ring —
   inset, because overflow:visible would push an offset ring under the card edge. */
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; touch-action: pan-y; }
.chart-svg:focus-visible { outline: 2.5px solid var(--accent); outline-offset: -3px; border-radius: 4px; }
.grid { stroke: var(--line-2); stroke-width: 1; }
.refline { stroke-width: 1.4; stroke-dasharray: 2 5; opacity: 0.85; }
.refline-label {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
}
.guide {
  stroke: var(--ink-faint); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0.7;
  pointer-events: none;
  transition: transform .15s cubic-bezier(.3,.7,.3,1), opacity .18s ease;
}
/* direct end-of-line labels (cycle years) – party-coloured, paper halo */
.end-label {
  font-family: var(--sans); font-weight: 700;
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
  transition: opacity .2s ease;
}
/* key-event markers (wide charts only – gated in TrendChart by measured px) */
.evt-line { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.5; }
/* The elbow that ties a label to its own line. Solid where the reference line
   is dashed, so it reads as a connector rather than more grid – it is the only
   thing making a displaced label legible in a tight cluster. */
.evt-conn { stroke: var(--ink-faint); stroke-width: 1; opacity: 0.55; }
/* `.on` is the annotation the chart has actually opened – the pick happens on
   the svg root, so :hover alone would light a label the pointer is over
   without the panel that goes with it, and miss the one it has just opened
   from a few px away. Both are kept: they agree, and :hover still answers the
   moment the pointer crosses the rule. */
.evt:hover .evt-conn, .evt.on .evt-conn { opacity: 0.95; }
.evt-label {
  font-family: var(--sans); font-weight: 600; fill: var(--ink-3);
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
}
/* invisible, generous hover target over the hairline rule */
.evt-hit { stroke: transparent; stroke-width: 9; }
.evt { cursor: default; }
.evt:hover .evt-line, .evt.on .evt-line { opacity: 0.9; }
.evt:hover .evt-label, .evt.on .evt-label { fill: var(--ink); }
.hover-marker {
  pointer-events: none;
  transition: transform .15s cubic-bezier(.3,.7,.3,1), opacity .14s ease;
}
.axis-label { font-family: var(--sans); fill: var(--ink-3); font-size: 13.5px; transition: fill .35s ease; }
.axis-label.y { text-anchor: end; font-weight: 500; }
.axis-label.x { font-weight: 500; }
.scatter-dot { transition: r .12s ease, opacity .12s ease, fill .35s ease; cursor: pointer; }
.series-line { transition: opacity .2s ease, stroke .35s ease; }
.grid, .refline { transition: stroke .35s ease; }

/* tooltip */
.tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--tip-shadow);
  padding: 9px 11px; min-width: 116px;
  transform: translate(-50%, 10px);
  transition: left .15s cubic-bezier(.3,.7,.3,1), top .15s cubic-bezier(.3,.7,.3,1);
  animation: tip-in .16s ease;
}
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
/* both hover readouts float over the plot → frosted glass (shared recipe with
   the pill toggles + pinned nav). The blur plus the bold ink figures keep every
   row legible; falls back to the opaque surface above where unsupported. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tip {
    background: var(--glass-bg); border-color: var(--glass-border);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
  /* the guide readout sits right on the plot, so make it MORE see-through than
     the shared glass – a thin tint + light blur lets the actual trend lines
     read through it; the bold ink figures still carry over the softened lines */
  .tip.tip-guide {
    background: color-mix(in oklch, var(--surface) 38%, transparent);
    -webkit-backdrop-filter: blur(3px) saturate(1.15);
    backdrop-filter: blur(3px) saturate(1.15);
  }
}
.tip.tip-dot { transform: translate(-50%, calc(-100% - 14px)); }
.tip-title { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 6px; letter-spacing: -0.01em; white-space: nowrap; }
.tip-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 1px 0; white-space: nowrap; }
.tip-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tip-label { color: var(--ink-3); }
.tip-val { margin-left: auto; font-weight: 700; color: var(--ink); padding-left: 10px; }
/* event readout: the date sits under the name in the serif, the description
   below it as prose — an annotation is a sentence, not a table of figures */
/* the dot readout says what a click will do – an affordance nobody can see
   is not one, and the cursor alone only shows up once you are already on it */
.tip-hint { margin-top: 5px; font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; }
/* width: max-content sizes the panel by its content alone. Shrink-to-fit
   measures against the space right of the anchor (the centering translate is
   invisible to layout), so the right-edge clamp squeezed the panel narrower
   than every other event's; pinned, the clamp shifts it left at full width. */
.tip-evt { width: max-content; max-width: 240px; min-width: 0; }
/* A guide readout's title is a short label ("Dec 2025") that must not wrap, so
   .tip-title is nowrap. An EVENT's title is a sentence - "Angus Taylor becomes
   Liberal leader" - and nowrap made it run straight out of the 240px panel,
   past a border that does not clip, so the last letters simply sat on the
   chart. Let it wrap, and break a word that is somehow longer than the panel
   rather than let anything escape again. */
.tip-evt .tip-title { white-space: normal; overflow-wrap: anywhere; }
.tip-date {
  font-family: var(--sans); font-size: 11px; font-weight: 600;
  color: var(--ink-3);
  margin-top: 2px;
}
.tip-desc {
  margin-top: 6px; font-size: 12px; line-height: 1.45; color: var(--ink-2);
  text-wrap: pretty;
}
.tip-sub { font-size: 11px; color: var(--ink-3); margin-top: 5px; }

/* ---------- docked 2PP score (lives in the sticky tab bar) ---------- */
/* absolutely seated on the underline at the row's right edge – it occupies no
   flex space, so its arrival never relayouts the tab row; it simply fades into
   the area the scaling tab set vacates */
.tab-score {
  position: absolute; right: 1px; bottom: 0; z-index: 1;
  display: inline-flex; align-items: baseline; gap: 9px;
  border: 0; background: none; cursor: pointer; font-family: var(--sans);
  padding: 0 1px 10px; white-space: nowrap;
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity .26s ease, transform .34s cubic-bezier(.22, 1, .36, 1);
}
.tabs.pinned .tab-score { opacity: 1; transform: none; pointer-events: auto; }
.ts-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); margin-right: 2px;
}
.ts-party { display: inline-flex; align-items: baseline; gap: 5px; }
.ts-abbr {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3);
}
.ts-num {
  font-family: var(--serif); font-weight: 560; font-size: 16px; line-height: 1;
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.ts-sep { width: 1.5px; height: 13px; background: var(--line-2); align-self: center; flex: none; position: relative; top: 1px; }
/* narrow: tighten the resting tabs so everything sits comfortably */
@media (max-width: 640px) {
  .tabs-set { gap: 18px; }
  .tab-label { font-size: 14.5px; line-height: 18px; }
  body.editorial .tab-label { font-size: 16.5px; line-height: 20px; }
  .ts-eyebrow { display: none; }
  .tab-score { gap: 7px; }
  .ts-num { font-size: 15.5px; }
}
@media (max-width: 400px) {
  .ts-abbr { display: none; }
}

/* ---------- legend (primary) ---------- */
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend-chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; cursor: pointer;
  font-family: var(--sans); transition: all .15s ease; white-space: nowrap;
}
.legend-chip:hover { border-color: var(--ink-faint); }
.legend-chip.off { opacity: 0.4; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.legend-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.legend-val { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.legend-chip.off .legend-val { color: var(--ink-3); }

/* residual aggregate ("Others / Ind.") – not a party. Its swatch becomes a
   dashed rule echoing the dashed chart line, and the label is dimmed so it
   reads as a remainder rather than a fourth contender. */
.legend-chip.residual .legend-swatch {
  height: 0; border-radius: 0;
  background: transparent !important;
  border-top: 2px dashed var(--oth);
  align-self: center;
}
.legend-chip.residual .legend-name { color: var(--ink-3); font-weight: 500; }
.legend-chip.residual .legend-val { color: var(--ink-3); font-weight: 600; }

/* ---------- leadership section (shared selector + two panels) ---------- */
.leadership { display: flex; flex-direction: column; gap: 4px; }
.leadership-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px 28px; flex-wrap: wrap;
}
/* section header – a true PEER of the other top-level section titles
   (Primary vote / National direction), so it reads as the PARENT of the two
   cards below rather than a smaller sibling. */
.section-h {
  font-family: var(--serif); font-weight: 540; font-size: 22px;
  letter-spacing: -0.01em; color: var(--ink); margin: 0; line-height: 1.15;
}
body.editorial .section-h { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
.leadership-note {
  margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3);
  font-family: var(--serif); font-style: italic;
}
.leadership-note strong { font-style: normal; font-weight: 700; color: var(--ink-2); }
.leadership .two-col { margin-top: 20px; }
/* the two panel titles SETTLE DOWN a level below the section header – clearly
   subheadings, not peers of "Leadership". Out-specifies the editorial bump. */
.leadership .card-title,
body.editorial .leadership .card-title { font-size: 20px; font-weight: 560; letter-spacing: -0.012em; white-space: nowrap; }

/* Preferred PM shows two contests at once: one line each, the pair of tiles
   doing the naming and the row doing the grouping. The rule at the head of the
   row is the legend the chart has no room for - solid is the contest against
   the opposition leader, dashed the head-to-head - and the figure at the end
   is the margin, which is the only thing two contests side by side are for and
   the only thing the tiles don't say. */
/* The box the readout travels inside. Position only - it exists so a tile
   put back where it was, and a ghost left where one used to be, are placed
   against the readout rather than against the page. */
.ppm-readout { position: relative; }
/* A still copy of a tile that has no counterpart in the other question, left
   at its old spot to fade. Out of the layout and out of the way of every
   pointer, since the thing it is a picture of no longer exists. */
.ppm-ghost {
  position: absolute; pointer-events: none; opacity: 1;
  transition: opacity .32s cubic-bezier(.4, .1, .25, 1);
}
@media (prefers-reduced-motion: reduce) { .ppm-ghost { display: none; } }
.ppm-pairs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.ppm-pair { display: flex; align-items: center; gap: 12px; }
.ppm-rule { width: 16px; border-top: 2px solid var(--ink-faint); flex: none; }
.ppm-pair.dashed .ppm-rule { border-top: 2px dashed var(--ink-faint); }
/* takes the row's spare width, or its container query reads the shrunken box
   and stacks every tile's change chip under its figure */
.ppm-pair .leader-readout { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
/* the margin wears the leader's own ink, so it needs no name to say whose.

   The reserved WIDTH is what keeps the two rows in step. Each row's readout is
   its own container, sized by what this label leaves it, so a two-digit margin
   took ten pixels off one row and not the other - enough, at a 402px phone, to
   put one readout at 300.4 and the other at 289.9 either side of the handover
   below, and the two rows laid their chips out differently. A common minimum
   makes both readouts the same width, so they hand over together whatever the
   figures happen to be. 2.9em also covers "level". */
.ppm-lead {
  margin-left: auto; padding-left: 10px;
  min-width: 2.9em; text-align: right;
  font-size: clamp(13px, 4.6cqi, 15px); font-weight: 800;
  font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-3);
}
/* The two-way figures were a step smaller than the three-way's, on the grounds
   that four figures in two rows would crowd the chart. Measured, that step buys
   11px of card height - and the two-way row had MORE room to spare than the
   three-way it was deferring to, 215px against 161px, because two tiles in a
   row is a looser fit than three whatever the row count. So they match now.

   The coefficient is LARGER rather than equal, and that is the point. cqi
   measures the readout, and the two-way's readout is narrower than the
   three-way's - 260px against 343px on a phone - because the rule and the
   margin figure take their share of the row. Handing both the same 9cqi would
   still have left the two-way smaller, 25px against 30px, which is the thing
   being fixed. 11.5cqi reaches the same 30px ceiling from the narrower box.

   Sized off the readout, NOT off .ppm-pairs - which is the tempting shortcut,
   since that block is the same width as the three-way's container. The tiles
   live in the readout, so pricing them off the wider block sizes them for room
   they do not have: tried, and they wrapped at 320px. The 21px floor stays, so
   below about 350px the figures go on shrinking for the reason that is real. */
.ppm-pairs .leader-num { font-size: clamp(21px, 11.5cqi, 30px); }
/* A pair is TWO tiles where the three-way readout has three, so it keeps the
   chip beside the figure much further down than the 480px handover the wider
   readout needs – on a phone that is the difference between two rows and four.

   250, not 300: the pair inherited the three-tile threshold, and it is far too
   cautious for two. Measured with the chip forced beside the figure, the pair
   wants 213px of the 300 it has at a 402px viewport, and still fits at 320px
   with room to spare. 300 was buying nothing and costing the phone layout. */
@container (min-width: 250px) {
  .ppm-pairs .leader { display: flex; align-items: center; }
  .ppm-pairs .leader-readout .delta { grid-column: auto; grid-row: auto; margin-top: 0; }
}

/* ---------- leaders ---------- */
/* The readout carries two leaders in the two-way question and THREE in the
   three-way one, so its widest case is 50% more content in the same column.
   At fixed sizes the third leader wrapped onto its own line on a phone: three
   125px items plus two 20px gaps wanted 415px of a 343px column, and the
   figures stopped reading as one comparison.

   Everything contributing to an item's width is therefore sized off the
   READOUT'S OWN WIDTH, via cqi, rather than off the viewport. The distinction
   matters: this panel sits in a column, so at a 1280px viewport the readout is
   532px - 42% of it - and vw units would be pricing space the row does not
   have. The ceilings are the original desktop values, so nothing changes where
   there was already room.

   flex-wrap stays on as a safety net: something unforeseen should drop to a
   second line rather than overflow the card. */
.leader-readout {
  container-type: inline-size;
  display: flex; align-items: center; margin-bottom: 6px; flex-wrap: wrap;
  gap: clamp(9px, 3.8cqi, 20px);
}
.leader { display: flex; align-items: center; gap: clamp(4px, 1.7cqi, 9px); min-width: 0; }
.leader-dot {
  width: clamp(7px, 2.1cqi, 11px); height: clamp(7px, 2.1cqi, 11px);
  border-radius: 50%; flex: none;
}
/* the NAME sets the column width here, not the figure - "Albanese" at 13px is
   wider than "39%" at 30px - so it has to scale too or the rest is wasted */
.leader-name { font-size: clamp(11px, 4cqi, 13px); font-weight: 600; color: var(--ink-2); }
.leader-num {
  font-size: clamp(25px, 9cqi, 30px);
  font-weight: 800; letter-spacing: -0.02em; color: var(--ink);
}
.leader-num .pct { font-size: clamp(14px, 4.8cqi, 16px); font-weight: 700; color: var(--ink-3); margin-left: 1px; }
/* the change chip is a third of an item's width at full size; it keeps its
   place beside the figure, just proportionally smaller */
.leader-readout .delta { font-size: clamp(10px, 3.5cqi, 12px); gap: clamp(2px, 1cqi, 4px); }
.leader-readout .delta-arrow { font-size: clamp(8px, 2.6cqi, 9px); }

/* Where the row is genuinely too narrow for three items with the chip beside
   the figure, the chip drops beneath the figure it belongs to. That takes it
   out of the width calculation - an item is then as wide as its NAME - which
   is what buys room for a third leader and for a longer surname than today's
   (the opposition slot is an office, not a person).

   Grid, not flex-wrap: giving the chip flex-basis:100% did move it to its own
   line, but a flex item's max-content contribution is computed FROM its
   flex-basis, so each item then reported itself full-width and the three still
   did not fit - 103px where the content needed 63. Two auto columns size to
   their contents. */
/* 480, not 430: at a 438px container the side-by-side layout fitted with 7px
   to spare, which is not a margin, it is a coincidence. Hand over only once
   the wider layout has real room. */
@container (max-width: 480px) {
  .leader {
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    justify-content: start;
    row-gap: 0;
  }
  .leader-dot  { grid-column: 1; grid-row: 1; }
  .leader-vals { grid-column: 2; grid-row: 1; }
  .leader-readout .delta { grid-column: 2; grid-row: 2; justify-self: start; margin-top: -1px; }
}
.leader-num.muted { color: var(--ink-3); }

.approval-readout { display: flex; flex-direction: column; gap: 11px; margin-bottom: 12px; }
.appr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.appr-top .leader-name { font-size: 13.5px; }
.net { margin-left: auto; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  /* Approval and favourability are the same three people answering a
     different question, so the toggle is a rearrangement and the figure rolls
     to its new value. The COLOUR was the one part still swapping: Hanson is -6
     on one and 0 on the other, and the red became green in a single frame
     while her digits were still turning. Same curve and duration as the reel,
     so the number and its verdict arrive together. */
  transition: color .32s cubic-bezier(.4, .1, .25, 1); }
.net.pos { color: var(--grn-text); }
.net.neg { color: var(--alp-text); }
.appr-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; font-size: 11.5px; font-weight: 700; }
/* inline figures use full-strength ink so they stay legible on the pale
   approve/disapprove tints in both light and dark themes (the bar colour
   and the net value at right already carry the green/red coding) */
.appr-app { background: var(--appr-app-bg); color: var(--ink); display: flex; align-items: center; padding-left: 7px; }
.appr-dis { background: var(--appr-dis-bg); color: var(--ink); display: flex; align-items: center; padding-left: 7px; }
.appr-dk  { background: transparent; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
/* compact split bar inside the poll-detail blocks */
.pd-appr-bar { height: 16px; font-size: 10px; border: 1px solid var(--line-2); }
/* favourability marker – flags nets that are positive−negative, a different
   question from approval and not directly comparable */
.fav-mark {
  font-size: 8px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-3); vertical-align: super; margin-left: 3px; cursor: help;
}
/* change indicator vs the pollster's previous poll – neutral ink, direction by
   the ▲/▼ glyph (no good/bad colour). Sits quietly after the figure. */
.chg {
  margin-left: 5px; font-size: 10.5px; font-weight: 700; color: var(--ink-3);
  font-variant-numeric: tabular-nums; white-space: nowrap; cursor: help;
  letter-spacing: -0.01em;
}
.chg.flat { color: var(--ink-3); opacity: 0.7; }

/* diverging net bar – the live source publishes nets only (no approve /
   disapprove split), so the snapshot readout shows net vs the "even" midline */
.appr-netbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.anb-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ink-faint); opacity: 0.6; }
/* Reshapes rather than redraws, on the shared curve at the shared duration -
   the same move the chart lines make when the question changes. Width only:
   a bar that crosses zero swaps which side of the midline it hangs from, and
   at that moment it has no width to see the swap happen in. */
.anb-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px;
  transition: width .32s cubic-bezier(.4, .1, .25, 1); }
/* Side and colour belong to the ELEMENT, not to the reading: a bar that had to
   change both mid-transition showed the wrong colour on the wrong side of the
   midline for as long as the contraction lasted. */
.anb-pos { left: 50%; background: var(--mood-pos); }
.anb-neg { right: 50%; background: var(--mood-neg); }
@media (prefers-reduced-motion: reduce) { .anb-fill { transition: none; } }

/* a reading older than the latest month carries a quiet month tag */
.stale-tag { color: var(--ink-3); font-weight: 500; font-size: 0.85em; }

/* archive leadership cells – net figure with a micro approve / don't-know /
   disapprove split beneath, same coding as the snapshot approval bars but at
   table scale (solid chips; the pale tints vanish at this height) */
.arch-appr { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.arch-appr-bar {
  display: flex; height: 4px; width: 52px; border-radius: 2px; overflow: hidden;
  background: var(--surface-2);
}
.arch-appr-app { background: oklch(0.62 0.10 150 / 0.85); }
.arch-appr-dk  { background: transparent; }
.arch-appr-dis { background: oklch(0.60 0.13 28 / 0.75); }
/* national direction reuses the approval bar's geometry, but takes the mood
   tokens so it reads as the same measure as the panel above the table */
.arch-dir-right { background: var(--mood-pos); opacity: 0.85; }
.arch-dir-wrong { background: var(--mood-neg); opacity: 0.85; }

/* ---------- national direction ---------- */
.dir-net { display: flex; align-items: center; gap: 9px; }
.dir-net-label { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.dir-net-val { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dir-net-val.pos { color: var(--mood-pos); }
.dir-net-val.neg { color: var(--mood-neg); }
.dir-readout { display: flex; align-items: flex-end; gap: 16px; margin: 4px 0 14px; }
.dir-side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.dir-side.ta-r { text-align: right; margin-left: auto; }
/* labels never wrap onto their own value, and the bar yields width instead –
   keeps the right/wrong readout collision-proof at every width */
.dir-k { font-size: 13px; font-weight: 700; white-space: nowrap; }
.dir-v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.dir-v .pct { font-size: 15px; font-weight: 700; color: var(--ink-3); margin-left: 1px; }
.dir-bar { flex: 1; min-width: 60px; display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); align-self: center; }
.dir-pos { background: var(--mood-pos); }
.dir-neg { background: var(--mood-neg); }
.dir-uns { background: transparent; }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.poll-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.poll-table th {
  text-align: center; font-weight: 600; font-size: 11px;
  color: var(--ink-3); padding: 0 12px 10px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.poll-table th.ta-l, .poll-table td.ta-l { text-align: left; }
.poll-table td { padding: 13px 12px; border-bottom: 1px solid var(--line-2); text-align: center; }
.poll-table tr:last-child td { border-bottom: 0; }
.poll-table tbody tr:hover { background: var(--surface-2); }
.pollster-cell { line-height: 1.25; }
.pollster-name { display: block; font-weight: 700; color: var(--ink); font-size: 14px; }

/* A linked pollster name reads as the name first and a link second: no blue,
   no permanent underline. The ↗ is the standing signal that it leaves the
   page; the underline arrives on hover/focus. */
a.pollster-link { text-decoration: none; cursor: pointer; }
a.pollster-link:hover, a.pollster-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.pollster-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
.plink-mark {
  /* the only standing cue that the name is a link, so it has to clear the
     text-contrast bar rather than sit in the decorative faint tier */
  font-size: 9px; font-weight: 700; margin-left: 3px; vertical-align: 1.5px;
  color: var(--ink-3); transition: color .15s ease;
}
a.pollster-link:hover .plink-mark, a.pollster-link:focus-visible .plink-mark { color: var(--ink-2); }

/* data-content tags: at-a-glance chips showing what a poll measures. Kept
   neutral monochrome on purpose – the party palette (red/blue/orange) is
   reserved for parties, so it must not leak onto data-type labels. They read
   as type by their TEXT, and light up solid ink only when their filter is on */
.poll-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.ptag {
  font-family: var(--sans); font-size: 9px; font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 1px 4px; border-radius: 3px; line-height: 1.5;
  background: var(--surface-2); color: var(--ink-3); white-space: nowrap;
  border: 1px solid var(--line-2);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.ptag.hit { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pollster-mode { display: block; margin-top: 1px; font-size: 11.5px; color: var(--ink-3); }
.released-pill {
  display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* a fallback date: the last day of fieldwork standing in for a publication
   date nobody recorded. Dashed, so the column doesn't pass it off as the
   thing its heading promises. */
.released-pill.est { font-weight: 600; color: var(--ink-3); border-style: dashed; background: none; }
.poll-table .muted { color: var(--ink-3); }
.poll-table .num { font-weight: 600; font-variant-numeric: tabular-nums; }

/* sortable headers */
.poll-table th.sortable { cursor: pointer; user-select: none; transition: color .15s ease; }
.poll-table th.sortable:hover { color: var(--ink-2); }
.poll-table th.sorted { color: var(--ink); }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.poll-table th.ta-l .th-in { justify-content: flex-start; }
.caret { font-size: 9px; line-height: 1; opacity: .9; }
.poll-table th.sortable:not(.sorted) .caret { opacity: 0; transition: opacity .15s ease; }
.poll-table th.sortable:hover .caret { opacity: .45; }

/* expand affordance + clickable rows */
.exp-col { width: 30px; padding-left: 4px !important; padding-right: 0 !important; }
.poll-row { cursor: pointer; }
.exp-btn {
  border: 0; background: transparent; cursor: pointer; color: var(--ink-3);
  font-size: 12px; line-height: 1; padding: 4px; border-radius: 5px;
  transition: transform .18s ease, color .15s ease;
  position: relative;
}
.exp-btn::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 44px; height: 44px; transform: translate(-50%, -50%);
}
.poll-row:hover .exp-btn { color: var(--ink-2); }
.exp-btn.open { transform: rotate(90deg); color: var(--ink); }
.poll-row.open { background: var(--surface-2); }

/* share column – arity-agnostic bar + keys */
.share-col { min-width: 210px; }
.poll-table td.share-col { vertical-align: middle; }
.share { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.sbar {
  display: flex; height: 8px; border-radius: 5px; overflow: hidden;
  background: var(--line-2); gap: 1.5px;
}
.sbar-seg { min-width: 2px; }
.share-keys {
  display: flex; flex-wrap: wrap; gap: 4px 11px;
  font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.skey { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.skey.muted { color: var(--ink-3); }
.skey-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.skey-lab { color: inherit; }
.skey-val { font-weight: 700; color: var(--ink); }
.skey.muted .skey-val { color: var(--ink-3); }
.share-compact .share-keys { font-size: 11px; gap: 3px 9px; }

.facet-flag {
  display: inline-block; font-size: 9.5px; font-weight: 700;
  color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  white-space: nowrap;
}

/* net / direction value */
.netv { font-weight: 800; font-variant-numeric: tabular-nums; }
.netv.pos { color: var(--mood-pos); }
.netv.neg { color: var(--mood-neg); }
.dash { color: var(--ink-3); font-weight: 600; }

/* expanded per-poll breakdown */
.detail-row > td { padding: 0 !important; border-bottom: 1px solid var(--line-2); }
/* the way back to the chart the reader came from */
/* Sits at the end of the detail's own meta line - so it needs no space of its
   own, lands inside the panel's tint rather than on a pale band above it, and
   aligns with the panel's content instead of with the table cell behind it. */
.back-to-chart {
  display: inline-flex; align-items: center; gap: 6px;
  margin-left: auto; align-self: center;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 13px 5px 10px; font-family: var(--sans); font-size: 12px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.back-to-chart:hover { color: var(--ink); border-color: var(--ink-3); background: color-mix(in oklch, var(--ink) 7%, var(--surface)); }
/* Both controls in the line are the same kind of thing - a way out of the row
   - so they read as a pair. Only the first claims the free space; without
   this the second takes its own margin-left:auto and the two split apart. */
.back-to-chart + .pd-report { margin-left: 0; }
.pd-report svg { opacity: 0.75; }
/* the meta line carries text and now a control, so centre what sits in it */
.pd-meta { align-items: center; }
/* a poll arrived at from a chart gets one quiet pulse, so the eye finds it
   after the scroll instead of hunting the row that just opened */
@media (prefers-reduced-motion: no-preference) {
  .arch-row.arrived > td { animation: arrived-flash 1.4s ease-out both; }
  @keyframes arrived-flash {
    from { background: color-mix(in oklch, var(--accent) 22%, transparent); }
    to   { background: transparent; }
  }
}
.detail-row:hover { background: transparent !important; }
.poll-detail { padding: 6px 14px 20px 42px; background: var(--surface-2); text-align: left; }
.pd-meta {
  display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 4px 0 16px;
  margin-bottom: 18px; border-bottom: 1px solid var(--line-2);
  font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.pd-meta-i { white-space: nowrap; }
.pd-meta-k {
  font-size: 10.5px;
  color: var(--ink-3); font-weight: 700; margin-right: 5px;
}
.pd-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 34px;
}
.pd-block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
/* a seat projection is a whole chamber – it needs both columns to read */
.pd-block-wide { grid-column: 1 / -1; }

/* ---------- Seat projection (MRP polls) ---------- */
.seatproj { display: flex; flex-direction: column; gap: 8px; }
.seatbar {
  position: relative; display: flex; height: 26px; border-radius: 5px;
  overflow: hidden; background: var(--surface-2); border: 1px solid var(--line-2);
}
.seatbar-seg { height: 100%; }
/* the majority line is the number that decides government – it sits ON TOP of
   the segments, as a hard notch rather than a colour change */
.seatbar-maj {
  position: absolute; top: -3px; bottom: -3px; width: 2px;
  background: var(--ink); transform: translateX(-1px);
  box-shadow: 0 0 0 1.5px var(--chart-bg);
}
.seatbar-note {
  display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-3);
}
.seat-majlab { font-weight: 600; }
.seat-hung { color: var(--ink-2); font-weight: 600; }
.seat-rows { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 2px; }
.seat-row { display: inline-flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
.seat-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seat-est { font-size: 15px; font-weight: 800; color: var(--ink); }
.seat-range { font-size: 11.5px; color: var(--ink-3); }
/* seat change is vs the last ELECTION, so it takes neutral ink like every
   other change indicator – no good/bad colour in a party-neutral tracker */
.seat-chg { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.seat-chg.flat { color: var(--ink-3); font-weight: 600; }
/* a projection published as a range only: the figure column carries the range
   itself, and a party can note what it is made of */
.seat-est.range { font-variant-numeric: tabular-nums; white-space: nowrap; }
.seat-note { font-size: 11px; color: var(--ink-3); }
.seat-basis { margin: 2px 0 0; font-size: 11px; color: var(--ink-3); text-wrap: pretty; }
@media (max-width: 700px) {
  .seat-rows { gap: 6px 16px; }
  .seat-est { font-size: 14px; }
}
/* leader-approval rows in the detail block – net-only readings from the live
   source, so each row is name left, net right */
.pd-apprs { display: flex; flex-direction: column; gap: 7px; }
.pd-appr-top { display: flex; align-items: center; gap: 7px; }
.pd-appr-name { font-weight: 600; font-size: 13px; }
.pd-appr-net { margin-left: auto; font-variant-numeric: tabular-nums; }
/* the second measure, when a wave published both for one leader – indented and
   quieter than the primary net, so it reads as an addition, not a correction */
.pd-appr-alt {
  display: flex; align-items: baseline; gap: 7px; margin-top: 4px; padding-left: 15px;
  font-variant-numeric: tabular-nums;
}
.pd-appr-alt-k {
  font-size: 11px; color: var(--ink-3); letter-spacing: 0.01em;
}
.pd-appr-alt .netv { margin-left: auto; font-size: 12.5px; opacity: 0.85; }
.pd-wide { grid-column: 1 / -1; max-width: 520px; }
.pd-k {
  font-size: 11px; font-weight: 700;
  color: var(--ink-3);
}
.pd-contests { display: flex; flex-direction: column; gap: 12px; }
.pd-contest { display: flex; flex-direction: column; gap: 6px; }
.pd-contest-lab {
  font-size: 12px; font-weight: 700; color: var(--ink-2);
  font-family: var(--serif); font-style: italic; letter-spacing: 0;
}
/* undecided: one readout per question, because the panel carries two of them
   and they must not read as one measure with two sources */
.und-reads { display: grid; gap: 10px 26px; margin: 2px 2px 14px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.und-read { display: flex; gap: 9px; align-items: flex-start; }
.und-swatch { width: 18px; height: 3px; border-radius: 2px; background: var(--ink-2);
  margin-top: 8px; flex: none; }
.und-swatch.dashed { background: repeating-linear-gradient(to right,
  var(--ink-2) 0 5px, transparent 5px 9px); }
.und-read-body { min-width: 0; }
.und-read-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.und-read-lab { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.und-read-v { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); }
.und-read-note { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-3); }

/* undecided, one line inside a poll's breakdown: the figure, its change, and
   what it means, on the same baseline so it reads as a stated share */
.pd-und { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.pd-und-v { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); }
.pd-und-note { font-size: 12px; color: var(--ink-3); }
.pd-absent { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13.5px; }
/* a fieldwork end standing in for a publication date nobody recorded, marked
   the dashed way the Latest-polls pill marks the same substitution */
.pd-est { border-bottom: 1px dashed var(--line-2); color: var(--ink-3); }
.table-hint { margin: 12px 2px 0; font-size: 12px; color: var(--ink-3); }

/* ---------- how the final polls did (past cycles) ---------- */
/* A row per election on one shared scale, so five elections' worth of error can
   be compared by eye. The track is centred on the RESULT, not on zero polling
   error, because the result is the thing every dot is being measured against. */
/* The row's geometry, defined once. The scale is only a scale while its
   centre label sits over the line every dot is measured from, and that held
   for the left edge (a hardcoded 108px = label + gap) but never the right:
   nothing subtracted the error and house columns, so "result" sat 76px right
   of the line it names. Deriving both edges from the same four numbers is
   what stops that drifting apart again the next time a column is resized. */
.acc-card { margin-top: 22px;
  --acc-gap: 8px; --acc-lab: 100px; --acc-err: 52px; --acc-note: 86px; }
.acc-scale { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline;
  margin: 4px 0 2px; font-size: 11px; font-weight: 600;
  padding-left: calc(var(--acc-lab) + var(--acc-gap));
  padding-right: calc(var(--acc-err) + var(--acc-note) + var(--acc-gap) * 2);
  color: var(--ink-3); }
.acc-scale-c { text-align: center; }
.acc-scale-r { text-align: right; }
.acc-rows { display: flex; flex-direction: column; gap: 2px; }
.acc-row { display: grid; align-items: center;
  grid-template-columns: var(--acc-lab) 1fr var(--acc-err) var(--acc-note);
  gap: var(--acc-gap); padding: 7px 0; border-top: 1px solid var(--line); }
.acc-label { display: flex; flex-direction: column; }
.acc-year { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
.acc-detail { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.acc-track { position: relative; height: 26px; }
.acc-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px;
  background: var(--ink-3); opacity: 0.55; }
.acc-tick { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.acc-dot, .acc-mean { position: absolute; top: 50%; border-radius: 50%;
  transition: transform .12s ease, opacity .12s ease; }
.acc-dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; opacity: 0.5; }
.acc-mean { width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
  box-shadow: 0 0 0 2.5px var(--surface); }
/* A 9px dot is a hard thing to keep a pointer on, and the whole readout hangs
   off doing so, so each dot claims a 24px target it does not draw. */
.acc-dot::before, .acc-mean::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 24px; height: 24px; transform: translate(-50%, -50%);
}
/* the dot answers the pointer before the panel does – on a row of overlapping
   dots, growing is the only cue saying WHICH one the readout is about */
.acc-dot:hover { opacity: 1; transform: scale(1.45); z-index: 3; }
.acc-mean:hover { transform: scale(1.15); z-index: 3; }
/* the chart's readout, seated on the track instead of the plot. It is the same
   .tip panel, so it inherits the frosted glass and the fade; only the width
   (fixed, so the JS can clamp against a known number) and the seat differ. */
.tip.acc-tip {
  width: 184px; max-width: 100%; min-width: 0; top: 50%;
  transform: translate(-50%, calc(-100% - 13px));
}
/* the top row has nothing above it inside the card, so its readout drops */
.tip.acc-tip-below { transform: translate(-50%, 13px); }
.acc-tip .tip-date { margin: -2px 0 5px; }
.acc-tip .tip-sub { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
.acc-err { font-family: var(--serif); font-size: 19px; font-weight: 600; text-align: right;
  font-variant-numeric: tabular-nums; }
.acc-note { font-size: 11px; color: var(--ink-3); display: flex; gap: 6px; align-items: baseline;
  justify-content: flex-end; flex-wrap: wrap; }
.acc-flag { font-weight: 700; font-size: 9.5px;
  color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px; }
.acc-firms { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.acc-firms-h { font-size: 11px; font-weight: 700;
  color: var(--ink-3); margin-bottom: 8px; }
.acc-firms-grid { display: grid; gap: 8px 18px;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.acc-firm { display: flex; flex-direction: column; gap: 1px; }
.acc-firm-n { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.acc-firm-v { font-family: var(--serif); font-size: 17px; color: var(--ink);
  font-variant-numeric: tabular-nums; }
.acc-firm-c { font-size: 11px; color: var(--ink-3); }
@media (max-width: 720px) {
  /* deliberately NOT aligned here: the three labels do not fit between the
     insets at this width, so the scale reads as a legend instead */
  .acc-scale { padding-left: 0; padding-right: 0; }
  .acc-row { grid-template-columns: 74px 1fr 46px; }
  .acc-note { grid-column: 2 / -1; justify-content: flex-start; }
}

@media (max-width: 720px) {
  .pd-grid { grid-template-columns: 1fr; }
  .pd-wide { grid-column: auto; }
  .poll-detail { padding-left: 20px; }
}

/* ---------- method footer ---------- */
.method { margin-top: 6px; padding-top: 24px; border-top: 1px solid var(--line); }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
