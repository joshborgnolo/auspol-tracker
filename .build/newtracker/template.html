.method-h { font-family: var(--serif); font-weight: 540; font-size: 16px; margin: 0 0 7px; color: var(--ink); }
.method p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
.disclaimer {
  margin-top: 22px; padding: 11px 14px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-3); text-align: center;
}

/* ---------- report an error ----------
   The page is static – GitHub Pages serves files and cannot process a POST –
   so the form hands the submission to Formspree and only has to send the
   request.

   Built out of the page's own parts rather than a form's: a rule, tracked
   caps, chips, and fields carrying one hairline underneath instead of a box
   on four sides. A boxed input was the only shape in the document that
   belonged to a form rather than to a page of type, and four of them stacked
   under the method notes turned the quietest part of the page into the
   busiest. Collapsed to a sentence until it is wanted, for the same reason:
   the footer's job is to explain the method, not to solicit. */
.fb { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-2); }
.fb-lede { margin: 0; max-width: 62ch; font-size: 13px; line-height: 1.65; color: var(--ink-3); }
/* The trigger sits INSIDE the sentence rather than beside it: the offer and
   the way to take it up are one thought, and a pill parked at the end of the
   paragraph read as a second one competing with it. */
.fb-link {
  border: 0; border-bottom: 1px solid var(--ink-faint); background: none;
  padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
  transition: border-color .15s ease;
}
.fb-link:hover { border-bottom-color: var(--ink); }

.fb-form { margin: 20px 0 0; max-width: 540px; display: grid; gap: 19px; }
.fb-form, .fb-thanks { animation: fb-in .22s ease both; }
@keyframes fb-in { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .fb-form, .fb-thanks { animation: none; } }

.fb-row { display: grid; gap: 8px; }
.fb-label {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
}
/* the parenthetical half of a label is prose, not a heading */
.fb-label span { font-weight: 400; }

.fb-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.fb-chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 12px; cursor: pointer; white-space: nowrap;
  font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--ink-3);
  transition: color .15s ease, border-color .15s ease;
}
.fb-chip:hover { color: var(--ink-2); border-color: var(--ink-faint); }
.fb-chip.active { color: var(--ink); border-color: var(--ink); font-weight: 600; }

.fb-form input, .fb-form textarea {
  width: 100%; font-family: var(--sans); font-size: 14px; line-height: 1.55;
  color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  padding: 5px 1px; transition: border-color .15s ease;
}
/* No min-height and no drag handle: the box is sized from its own content by
   fbAutosize, so it opens as one line - the same height as the email field
   under it - and grows a line at a time. The cap is about seven lines, past
   which it scrolls instead of pushing the send button off the screen. */
.fb-form textarea { min-height: 0; max-height: 164px; resize: none; overflow-y: hidden; }
.fb-form input::placeholder, .fb-form textarea::placeholder { color: var(--ink-3); opacity: 0.72; }
.fb-form input:focus, .fb-form textarea:focus { outline: none; border-bottom-color: var(--accent); }
/* The theme here is a manual toggle and can disagree with the OS, so pin the
   native furniture (caret, selection, autofill) to the page's own theme
   rather than letting it follow prefers-color-scheme into the wrong one. */
.fb-form { color-scheme: light; }
body.dark .fb-form { color-scheme: dark; }
/* Formspree discards anything arriving with _gotcha filled – a field no human
   sees and every naive bot completes. Off-screen rather than display:none,
   which the same bots know to skip. */
.fb-gotcha { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.fb-actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.fb-send {
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 7px 18px; cursor: pointer; white-space: nowrap;
  font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.fb-send:hover { background: var(--ink); color: var(--bg); }
.fb-send[disabled] { opacity: 0.45; cursor: default; background: transparent; color: var(--ink); }
.fb-note { margin: 0; flex: 1 1 210px; font-size: 12px; line-height: 1.5; color: var(--ink-3); }
.fb-note.is-error { color: var(--mood-neg); }
.fb-thanks { margin: 20px 0 0; max-width: 540px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }

@media (max-width: 560px) { .fb-form, .fb-thanks { max-width: none; } }

/* ---------- responsive ---------- */
/* The leadership pair carries a scatter cloud in each panel now, and ~120 dots
   in a 250px-tall chart need width to stay legible. Side by side is worth
   keeping – comparing a leader's preferred-PM standing with their net approval
   is the point – but only on a screen genuinely wide enough for two of them. */
@media (max-width: 1200px) {
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .method-grid { grid-template-columns: 1fr; }
  .head-meta { gap: 12px; }
  .ro-num { font-size: 48px; }
  /* Never one row of six small targets: at this width the controls have the
     headline's full line to themselves, so the matchup toggle sits above the
     range toggle (the desktop arrangement, left-aligned) and both get real
     touch padding – this is exactly the control a one-handed thumb comes to. */
  .hero-controls { align-items: flex-start; }
  .hero-controls .tt-opt { padding: 11px 4px; }
  .hero-controls .tt-div { height: 16px; }
}
@media (max-width: 560px) {
  .page { padding: 20px 16px 48px; }
  /* tagline now carries the election context, so drop the whole meta block
     (incl. the Next election anchor) on small screens */
  .head-meta { display: none; }
  /* …and surface a single compact freshness line in its place */
  .head-meta-compact {
    display: flex; align-items: center; gap: 8px;
    margin: 9px 0 0; font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .head-meta-compact .fresh-dot { margin-right: 0; width: 6px; height: 6px; top: 0; }
  /* stack header; pin the theme toggle to the top-right corner so it never
     wraps down beside the meta on narrow screens */
  .site-head { flex-direction: column; align-items: flex-start; gap: 13px; }
  /* reserve toggle space on the wordmark row only – not the brand wrapper –
     so the tagline below the (top-pinned) toggle can use the full width */
  .brand { padding-right: 0; }
  .wordmark { padding-right: 92px; }
  /* head-right's own box leaves the flow (meta is hidden, the toggle is
     absolutely pinned) so it can't add phantom column-gap above the rule */
  .head-right { display: contents; }
  .theme-seg { position: absolute; top: 0; right: 0; }
  .hero-readout { flex-direction: column; gap: 6px; align-items: flex-start; }
  .ro-sep { display: none; }
  /* stack the two toggles so the dot-paired matchup control never overflows */
  .hero-controls { flex-direction: column; align-items: flex-start; gap: 12px; }
  .text-toggle { gap: 9px; }
  .tt-opt { font-size: 13px; }
  .tt-dots { margin-right: 5px; }
}

/* ============================================================
   EDITORIAL MODE – broadsheet / ruled layout
   Drops card chrome; separates sections with hairline rules and
   stronger serif headings. Charts breathe edge-to-edge on paper.
   ============================================================ */
body.editorial { --bg: oklch(0.975 0.009 80); --chart-bg: var(--bg); }

body.editorial .content { gap: 0; }

body.editorial .card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  padding: 38px 0 34px;
  border-top: 1px solid var(--line);
}
/* hero keeps no top rule (it's first) and a touch more air */
body.editorial .hero { border-top: 0; padding-top: 10px; }

/* bigger, more authoritative serif section headings */
body.editorial .card-title { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
body.editorial .card-sub { font-size: 14px; margin-top: 5px; }
body.editorial .card-head { margin-bottom: 22px; }

/* leadership is a top-level section – give it the same divider + rhythm as a
   .card so it sits as a peer of Primary vote / National direction */
body.editorial .leadership { border-top: 1px solid var(--line); padding: 38px 0 34px; }

/* two-column becomes two columns split by a VERTICAL rule, no card frames.
   No horizontal top rule – the section divider above "Leadership" already
   marks the boundary; an internal rule here would read as a false section break. */
body.editorial .two-col {
  gap: 0; padding: 0;
}
body.editorial .two-col .card { border-top: 0; padding-top: 0; padding-bottom: 0; }
body.editorial .two-col .card:first-child {
  padding-right: 40px; border-right: 1px solid var(--line);
}
body.editorial .two-col .card:last-child { padding-left: 40px; }
/* the vertical rule and its gutter belong to a SHARED row – once one side is
   collapsed the survivor is full-bleed and must not keep either */
body.editorial .lead-grid.lg-ppm .card:first-child { padding-right: 0; border-right: 0; }
body.editorial .lead-grid.lg-appr .card:last-child { padding-left: 0; }
/* …and the COLLAPSED side must not keep its gutter either: overflow:hidden
   clips content but not padding, which left a 40px sliver of empty card */
body.editorial .lead-grid.lg-ppm .card:last-child,
body.editorial .lead-grid.lg-appr .card:first-child {
  padding-left: 0; padding-right: 0; border-right: 0;
}

/* table reads as ledger: heavier top/bottom rules, airier rows */
body.editorial .poll-table th { border-bottom: 2px solid var(--ink-3); color: var(--ink-2); }
body.editorial .poll-table td { padding-top: 15px; padding-bottom: 15px; }
body.editorial .poll-table tbody tr:hover { background: var(--surface-2); }

/* legend / segmented keep a hairline so controls stay legible without cards */
body.editorial .method { border-top: 2px solid var(--ink-3); margin-top: 8px; padding-top: 30px; }
body.editorial .disclaimer { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 16px 0 0; text-align: left; font-size: 11.5px; color: var(--ink-3); }

.tweak-note {
  margin: -2px 0 4px; font-size: 11.5px; line-height: 1.45;
  color: var(--ink-3); font-family: var(--sans);
}

/* Must track the .two-col grid breakpoint above (1200px): the divider is
   vertical only while the panels sit side by side. Left at 900 it drew a
   vertical rule beside already-stacked cards from 901px to 1200px. */
@media (max-width: 1200px) {
  /* stacked: the two panels are SIBLINGS under Leadership, so their separator
     uses the lighter --line-2 hairline + tighter air – clearly subordinate to
     the full-strength --line section divider that sits above "Leadership". */
  body.editorial .two-col .card:first-child {
    padding-right: 0; border-right: 0; border-bottom: 1px solid var(--line-2); padding-bottom: 24px;
  }
  body.editorial .two-col .card:last-child { padding-left: 0; padding-top: 24px; }
}

/* ============================================================
   TABS – editorial section nav beneath the header
   ============================================================ */
.tabs-sentinel { height: 0; margin: 0; padding: 0; pointer-events: none; }
.tabs {
  position: relative;
  /* flush under the masthead rule: the nav + its underline read as one banded
     unit with the masthead – labels sit equidistant between the two rules */
  margin: -26px -4px 26px;
  padding-inline: 4px;
  background: var(--bg);
}
/* full-bleed backdrop: the sticky bar's paint must reach the viewport edges so
   nothing in the side gutters can poke through beside it once pinned. The
   pseudo sits behind the bar and stretches from screen edge to screen edge. */
.tabs::before {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  background: var(--bg);
  z-index: 0;
}
/* the pinned lift-off shadow lives on its OWN full-bleed layer and fades via
   opacity – compositor-only; animating box-shadow itself repaints every frame */
.tabs::after {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  box-shadow: 0 10px 22px -16px color-mix(in oklch, var(--ink) 55%, transparent);
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none; z-index: 0;
}
/* sticky on every view */
/* Pins below the notch so the labels stay readable, while its backdrop reaches
   up through the notch (see .tabs.pinned::before) - so the strip above the bar
   is the same frosted material rather than a flat band. */
.tabs.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 41; }
/* "caught the top" – lift the bar off the scrolling content.
   NOTE: the pinned state must NEVER change the bar's layout – the bar is
   sticky (in-flow), so any layout delta shifts the page under the scroll
   position and the pin oscillates. Condensing is therefore done ENTIRELY with
   a composited transform on .tabs-set: no reflow per frame (smooth on any
   thread), and no layout change at all (no oscillation risk). */
.tabs.pinned::after { opacity: 1; }
/* position/z-index keep the row painting above the full-bleed backdrop;
   overflow hides the docked score until the bar pins (see .tab-score) */
.tabs-inner {
  position: relative; z-index: 1;
  display: flex; align-items: flex-end;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
/* the tab set condenses as ONE unit – a single transform: scale() seated on
   the underline (origin left bottom), GPU-composited end to end */
.tabs-set {
  display: flex; gap: 30px; align-items: flex-end;
  transform-origin: left bottom;
  transition: transform .38s cubic-bezier(.22, 1, .36, 1);
}
.tabs.pinned .tabs-set { transform: scale(0.844); }   /* 16px → 13.5px */
body.editorial .tabs.pinned .tabs-set { transform: scale(0.79); } /* 19 → 15 */
@media (prefers-reduced-motion: reduce) {
  .tabs-set, .tabs::after, .tab-score { transition: none; }
}
.tab {
  position: relative; border: 0; background: none; cursor: pointer;
  padding: 12px 1px 12px; font-family: var(--sans);
  display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap;
  color: var(--ink-3); transition: color .15s ease;
}
.tab-label {
  font-size: 16px; font-weight: 600; letter-spacing: -0.005em;
  line-height: 19px;
}
.tab-note { font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--ink); }
.tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;
  background: var(--ink); border-radius: 2px 2px 0 0;
  transform: scaleX(0); transform-origin: left center; transition: transform .2s ease;
}
.tab.active::after { transform: scaleX(1); }
body.editorial .tab-label { font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 23px; letter-spacing: -0.01em; }

/* narrow screens condense a touch further so the docked score clears the
   scaled tab set */
@media (max-width: 640px) {
  .tabs.pinned .tabs-set { transform: scale(0.8); }
  body.editorial .tabs.pinned .tabs-set { transform: scale(0.76); }
}

/* ============================================================
   VIEW SCAFFOLD (cycles + all polls)
   ============================================================ */
.view-intro { margin-bottom: 4px; }
.view-lede {
  font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink-2);
  max-width: 64ch; margin: 0 0 18px; text-wrap: pretty;
}
.view-lede strong { color: var(--ink); font-weight: 600; }

/* ---------- Past cycles ---------- */
.cyc-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
/* Download pair. .ap-export carries margin-left:auto for the archive's own
   layout, so it is reset here – inside this group the buttons sit together and
   the GROUP is what gets pushed right. */
.cyc-export { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cyc-export .ap-export { margin-left: 0; }
.cyc-export-label {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  color: var(--ink-3); margin-right: 2px;
}
@media (max-width: 1000px) { .cyc-export { display: none; } }

.cyc-legend { margin: 20px 0 6px; }
.cyc-legend-row { display: flex; flex-wrap: wrap; gap: 7px; }
.cyc-chip {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 13px 6px 11px; cursor: pointer; font-family: var(--sans);
  color: var(--ink-2);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease, opacity .15s ease;
}
.cyc-chip:hover { border-color: var(--ink-faint); }
.cyc-chip .cyc-swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; transition: transform .15s ease; }
/* A swatch borrows the shape of the term's dots when the chart is drawing
   them, so two Coalition terms in the same blue are told apart in the legend
   the same way they are told apart on the chart. clip-path over a second
   element: the swatch keeps one box, one colour and one transition, and the
   circle stays the default nothing has to opt into. The triangle is sized a
   little past the box for the same reason the dot is - inscribed, it reads
   smaller than the circle beside it. */
.cyc-chip .cyc-swatch.sw-triangle { border-radius: 0; width: 12px; height: 12px;
  clip-path: polygon(50% 2%, 100% 96%, 0 96%); }
.cyc-chip .cyc-swatch.sw-diamond { border-radius: 0; width: 12px; height: 12px;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.cyc-chip .cyc-year { font-size: 13.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.cyc-chip .cyc-lead { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.cyc-chip.off { opacity: 0.4; }
.cyc-chip.off .cyc-swatch { background: var(--ink-faint) !important; }
.cyc-chip.current {
  border-color: color-mix(in oklch, var(--cyc) 45%, var(--line));
  background: color-mix(in oklch, var(--cyc) 8%, var(--surface));
}
.cyc-chip.current:hover .cyc-swatch,
.cyc-chip:hover .cyc-swatch { transform: scale(1.18); }
.cyc-now {
  font-size: 10px; font-weight: 800;
  color: var(--cyc-text, var(--cyc)); border: 1px solid color-mix(in oklch, var(--cyc) 40%, var(--line));
  border-radius: 4px; padding: 1px 5px;
  /* Its own ground, not the chip's. The chip tints its background 8% toward
     the cycle's party, which on dark cost this badge ~1 point of contrast
     (4.3:1) even though the party colour itself clears the bar on plain
     surface. The badge is small, high-tracked type – it needs the headroom. */
  background: var(--surface);
}
.cyc-showall {
  margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 2px 0;
}
.cyc-showall:hover { text-decoration: underline; }
/* Deliberately quiet: an optional fifth line on one of four charts, off by
   default. It sits under that chart's standfirst rather than in the shared
   controls, because it changes nothing anywhere else on the page. */
.cyc-han {
  display: inline-flex; align-items: center; gap: 6px; margin: 7px 0 0;
  font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; user-select: none;
}
.cyc-han:hover { color: var(--ink-3); }
.cyc-han input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none;
  width: 12px; height: 12px; border: 1px solid var(--ink-faint); border-radius: 3px;
  background: var(--surface); cursor: pointer; position: relative;
}
.cyc-han input:checked { background: var(--onp); border-color: var(--onp); }
.cyc-han input:checked::after {
  content: ""; position: absolute; left: 3.5px; top: 0.5px;
  width: 3px; height: 7px; border: solid var(--chart-bg);
  border-width: 0 2px 2px 0; transform: rotate(42deg);
}
.cyc-han input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cyc-han.on { color: var(--onp-text); }

.cyc-charts { display: flex; flex-direction: column; }
/* title block flexes to fill; the insight wraps below it (not behind it) once
   the two can no longer share a row – the title can never overlap the insight */
.cycle-head { align-items: baseline; }
.cycle-head > div { flex: 1 1 26ch; min-width: 0; }
.cycle-insight {
  font-family: var(--serif); font-size: 14.5px; line-height: 1.5; color: var(--ink-2);
  max-width: 34ch; text-align: right; margin: 0; text-wrap: pretty;
}
.ci-delta { font-weight: 700; font-variant-numeric: tabular-nums; }
.ci-delta.pos { color: var(--mood-pos); }
.ci-delta.neg { color: var(--mood-neg); }
/* "in line with" is not a good or bad reading, so it takes the ink rather than
   the mood colours – emphasised, because it is still the finding */
.ci-delta.level { color: var(--ink); }
.cyc-foot {
  margin: 22px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-3);
  font-family: var(--sans); max-width: 70ch; text-wrap: pretty;
}
/* in editorial mode the cycle charts divide like snapshot panels; first one
   already sits under the legend, so drop its top rule for a cleaner seam */
body.editorial .cyc-charts .cycle-card:first-child { border-top: 0; padding-top: 16px; }

/* ---------- All polls archive ---------- */
.ap-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px; flex-wrap: wrap; margin-bottom: 18px;
}
/* ---------- archive filter bar ---------- */
/* One row at rest. Search stays visible because it cuts across every facet;
   everything else is a button that names its own state and opens a panel of
   options with counts. What's on shows as pills underneath, so the bar never
   has to be read backwards to find out what is being applied. */
.ap-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.ap-bar .ap-search { flex: 1 1 190px; max-width: 300px; }
.ap-bar-end { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; }
.ap-bar .ap-export { margin-left: 0; }
.ap-count { font-family: var(--sans); font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.ap-count strong { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

.ap-search {
  position: relative; display: inline-flex; align-items: center; max-width: 320px;
  color: var(--ink-3);
}
.ap-search svg { position: absolute; left: 12px; pointer-events: none; }
.ap-search input {
  width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 30px 9px 34px; transition: border-color .15s ease;
}
.ap-search input::placeholder { color: var(--ink-3); }
.ap-search input:focus { outline: none; border-color: var(--accent); }
.ap-search-x {
  position: absolute; right: 8px; border: 0; background: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--ink-3); padding: 2px 4px;
}
.ap-search-x:hover { color: var(--ink); }

/* iOS Safari zooms the page IN when a form field is focused whose text is
   under 16px, and having zoomed it does not zoom back out - so tapping the
   search box left the whole site magnified until the reader pinched their way
   back out of it.

   The other way to stop this is maximum-scale=1 / user-scalable=no in the
   viewport tag, and it is the wrong one: it takes pinch-zoom away from
   everybody, permanently, to fix a wobble. This page deliberately does not
   carry it (see the viewport meta). Two points of type on three fields is the
   cheaper thing to give up.

   Keyed on `pointer: coarse`, not a width. The zoom follows the field's font
   size on any touch device at any size, so a phone held in landscape or an
   iPad sits well past a phone-sized breakpoint and would have been missed by
   a max-width query. Placed after both rules it overrides, since it matches
   their specificity exactly and only source order separates them. */
@media (pointer: coarse) {
  .ap-search input,
  .fb-form input,
  .fb-form textarea { font-size: 16px; }
}

.ap-pop { position: relative; }
.ap-popbtn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 8px 12px 8px 14px; font-family: var(--sans); font-size: 13px; font-weight: 600;
  color: var(--ink-3); cursor: pointer; white-space: nowrap;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.ap-popbtn:hover { border-color: var(--ink-faint); color: var(--ink-2); }
.ap-popbtn.open { border-color: var(--ink-3); color: var(--ink); }
.ap-popbtn.on {
  color: var(--ink); border-color: var(--ink-3);
  background: color-mix(in oklch, var(--ink) 7%, var(--surface));
}
.ap-popbtn-val { font-weight: 700; }
.ap-popbtn-val::before { content: "·"; margin-right: 6px; color: var(--ink-faint); font-weight: 600; }
.ap-caret { opacity: 0.55; transition: transform .15s ease; }
.ap-popbtn.open .ap-caret { transform: rotate(180deg); }

.ap-panel {
  position: absolute; top: calc(100% + 7px); left: 0; z-index: 30;
  min-width: 234px; max-width: min(330px, 86vw);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 13px;
  box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 14px 30px -10px rgba(0,0,0,.25);
  padding: 6px;
}
/* a panel that would run off the right edge hangs from its button's right */
.ap-panel.flip { left: auto; right: 0; }
.ap-pop-head {
  display: flex; align-items: baseline; gap: 10px; padding: 6px 9px 7px;
  font-family: var(--sans); font-size: 10.5px; font-weight: 700;
  color: var(--ink-3);
}
.ap-pop-head .ap-clear { margin-left: auto; font-size: 12px; }
.ap-pop-head.bordered { border-top: 1px solid var(--line-2); margin-top: 6px; padding-top: 12px; }
.ap-poplist { max-height: 270px; overflow-y: auto; display: flex; flex-direction: column; }
.ap-pop-foot { margin: 7px 9px 3px; font-size: 11.5px; line-height: 1.4; color: var(--ink-3); }

.ap-check {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  border: 0; background: none; cursor: pointer; border-radius: 8px; padding: 7px 9px;
  font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.ap-check:hover { background: var(--surface-2); }
.ap-check.on { color: var(--ink); }
.ap-tick {
  width: 15px; height: 15px; flex: none; position: relative;
  border: 1.5px solid var(--line-2); border-radius: 4px;
}
.ap-check.radio .ap-tick { border-radius: 50%; }
.ap-check.on .ap-tick { background: var(--accent); border-color: var(--accent); }
.ap-check.on .ap-tick::after {
  content: ""; position: absolute; left: 4.4px; top: 1.2px; width: 3.6px; height: 8px;
  border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(42deg);
}
.ap-check.radio.on .ap-tick::after {
  left: 3.8px; top: 3.8px; width: 5px; height: 5px;
  border: 0; border-radius: 50%; background: var(--bg); transform: none;
}
.ap-check-lab { min-width: 0; }
/* the tag panel explains itself: a data type is only obvious once named */
.ap-check-note {
  display: block; font-weight: 500; font-size: 11px; color: var(--ink-3);
  line-height: 1.35; margin-top: 1px; white-space: normal;
}
.ap-check-n {
  margin-left: auto; padding-left: 10px; font-size: 12px; font-weight: 600;
  color: var(--ink-3); font-variant-numeric: tabular-nums;
}

.ap-active { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 14px; }
.ap-pill {
  display: inline-flex; align-items: center; gap: 3px;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 4px 5px 4px 11px; font-family: var(--sans); font-size: 12.5px;
  font-weight: 600; color: var(--ink-2);
}
/* dashed: the view set this one, not the reader */
.ap-pill.auto { border-style: dashed; background: none; color: var(--ink-3); }
.ap-pill button {
  border: 0; background: none; cursor: pointer; color: var(--ink-3);
  font-size: 15px; line-height: 1; padding: 0 5px 1px; border-radius: 50%;
}
.ap-pill button:hover { color: var(--ink); }
.ap-active .ap-clear { margin-left: 6px; }

.ap-clear {
  border: 0; background: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 0;
}
.ap-clear:hover { text-decoration: underline; }
/* CSV export – desktop only (hidden ≤1000px below) */
.ap-export {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 5px 13px; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap; align-self: center;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.ap-export:hover { color: var(--ink); border-color: var(--ink-3); background: color-mix(in oklch, var(--ink) 7%, var(--surface)); }
.ap-export svg { stroke: currentColor; }

/* ---------- Next expected polls ---------- */
/* A forecast, not a record – so it is deliberately quieter than the tables
   above it: no rules between rows, no numerals competing with real figures. */
.next-polls { }
.np-head { margin-bottom: 16px; }
.np-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
/* A window rather than a day: quieter, because it is a looser claim - but in
   colour only. It used to italicise the "opens in" too, which read as one row
   set in a different face from the rest of the list; the row already says it is
   looser twice over, by printing a span instead of a date and by opening with
   "opens in" rather than "in". */
.np-loose .np-date, .np-loose .np-when { color: var(--ink-3); }
.np-row {
  display: grid;
  grid-template-columns: minmax(120px, 1.1fr) minmax(150px, 1.2fr) minmax(80px, 0.7fr) minmax(150px, 1.4fr);
  align-items: baseline; gap: 12px; padding: 11px 12px; border-radius: 8px;
}
/* the stripe belongs to the ITEM now, not the row: the item is what alternates
   in the list, and an open one carries its detail inside the same tint */
.np-item { border-radius: 8px; }
.np-item:nth-child(odd) { background: color-mix(in oklch, var(--ink) 3.5%, var(--surface)); }
.np-item.open { background: var(--surface-2); }
.np-row { cursor: pointer; }
.np-row:hover .exp-btn { color: var(--ink-2); }
.np-firm { font-family: var(--sans); font-size: 14.5px; font-weight: 700; color: var(--ink);
  display: flex; align-items: baseline; gap: 4px; min-width: 0; }
/* the chevron sits on the text baseline of the name beside it, not on the
   middle of a flex line that a 44px hit area would otherwise stretch */
.np-firm .exp-btn { align-self: center; margin-left: -4px; flex: none; }
a.np-link { color: inherit; text-decoration: none; cursor: pointer; }
a.np-link:hover, a.np-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.np-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
a.np-link:hover .plink-mark, a.np-link:focus-visible .plink-mark { color: var(--ink-2); }

/* ---- the working behind one row ----
   A quieter register than the row above it: this is the evidence, and it reads
   as a note rather than as a second list of forecasts. */
/* Held to a reading width rather than the card's. Stretched across 1100px the
   three columns land at opposite ends of the panel and stop being one line
   about one release. */
.np-detail { padding: 2px 12px 12px 30px; max-width: 620px; animation: np-open .18s ease both; }
@keyframes np-open { from { opacity: 0; transform: translateY(-3px); } }
.npd-h {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 11px; font-weight: 700;
  color: var(--ink-3); padding-bottom: 5px; border-bottom: 1px solid var(--line);
}
.npd-site { margin-left: auto; font-weight: 600;
  color: var(--ink-3); text-decoration: none; }
.npd-site:hover { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }
.npd-list { list-style: none; margin: 0; padding: 0; }
/* Each line is its OWN grid, so any track sized to its contents is sized by
   that line alone. The interval column was `auto`, and the oldest release has
   no interval to report — an empty cell, a zero-width third track, and the two
   fr columns beside it quietly taking the slack, which put the last line's
   publication date 17px right of every other one. A fixed track holds all six
   lines to the same rule: 4.5rem clears both "Interval" and "999 days". */
.npd-row {
  display: grid; grid-template-columns: minmax(96px, 0.8fr) minmax(150px, 1.4fr) 4.5rem;
  gap: 12px; align-items: baseline; padding: 5px 0;
  font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.npd-list .npd-row + .npd-row { border-top: 1px solid var(--line-2); }
/* the column heads: the quietest thing in the panel, since they are read once */
.npd-cols { padding: 6px 0 3px; font-size: 10px; font-weight: 700;
  color: var(--ink-faint); }
.npd-cols span:last-child { margin-left: auto; }
/* the fieldwork end is what the interval beside it is measured between, so it
   leads; the publication date is the one carrying a weekday and an hour */
.npd-field { color: var(--ink-2); }
/* a jump INSIDE the page, so it takes an arrow rather than the ↗ that means
   leaving – and stays a button, since it is not a URL anyone can open */
button.npd-field-link {
  border: 0; background: none; padding: 0; margin: 0; font: inherit;
  font-variant-numeric: tabular-nums; text-align: left; cursor: pointer;
  color: var(--ink-2); transition: color .15s ease;
}
button.npd-field-link:hover, button.npd-field-link:focus-visible {
  color: var(--ink); text-decoration: underline; text-underline-offset: 2px;
}
button.npd-field-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
button.npd-field-link .plink-mark { font-size: 10px; vertical-align: 0; }
button.npd-field-link:hover .plink-mark, button.npd-field-link:focus-visible .plink-mark { color: var(--ink-2); }
.npd-pub { color: var(--ink); font-weight: 600; }
a.npd-pub-link { text-decoration: none; cursor: pointer; }
a.npd-pub-link:hover, a.npd-pub-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.npd-pub-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
a.npd-pub-link:hover .plink-mark, a.npd-pub-link:focus-visible .plink-mark { color: var(--ink-2); }
.npd-pub.none { color: var(--ink-faint); font-weight: 500; }
.npd-gap { margin-left: auto; color: var(--ink-3); white-space: nowrap; }
.npd-foot { margin: 8px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--ink-3); max-width: 62ch; }
@media (prefers-reduced-motion: reduce) { .np-detail { animation: none; } }
.np-date { font-family: var(--sans); font-size: 14.5px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
/* the hour reads as part of the date, one step quieter than it */
.np-time { color: var(--ink-2); }
.np-pm { color: var(--ink-3); font-size: 12.5px; font-weight: 500; }
.np-when { font-family: var(--sans); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.np-cadence { font-family: var(--sans); font-size: 12.5px; color: var(--ink-3); }
.np-missed { color: var(--mood-neg); }
.np-foot {
  margin-top: 14px; font-size: 12.5px; line-height: 1.55; color: var(--ink-3);
  max-width: 74ch;
}
@media (max-width: 720px) {
  .np-row { grid-template-columns: 1fr auto; row-gap: 3px; padding: 10px; }
  .np-firm { grid-column: 1; }
  /* the "when" text must be allowed to fold under itself rather than hold
     its line: on a 360px phone "in 3 days (or yesterday)" nowrap, beside a
     date that is also nowrap, forces the row's minimum past the row's width
     and the overdue text butts against the screen's right edge. The column
     still hugs the right, so where the full line fits nothing changes. */
  .np-when { grid-column: 2; text-align: right; white-space: normal; }
  .np-date { grid-column: 1; }
  .np-cadence { grid-column: 1 / -1; }
  .np-detail { padding: 0 10px 10px 26px; }
  /* the publication date drops under the fieldwork end rather than squeezing
     three columns into a phone's width, and the interval keeps the right-hand
     edge across both lines. Placed by AREA, not by auto-flow: two children
     carrying a column hint and a third carrying margin-left:auto put the dates
     in the wrong order and the hour on a line of its own. */
  .npd-row { grid-template-columns: 1fr 4.5rem; grid-template-areas: "field gap" "pub gap"; row-gap: 1px; }
  .npd-field { grid-area: field; }
  .npd-pub { grid-area: pub; }
  .npd-gap { grid-area: gap; align-self: center; }
  /* three labels over two stacked columns names the wrong thing – the rows
     read plainly enough at this width without them */
  .npd-cols { display: none; }
}

/* ---------- Poll disagreement (variance) panel ---------- */
/* sits below the archive table, so it takes air ABOVE and a single top rule –
   a closing section wants no trailing border under it */
.ap-var {
  border-top: 1px solid var(--line);
  padding: 24px 0 0; margin: 30px 0 0;
}
.ap-var-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px 24px; flex-wrap: wrap; margin-bottom: 10px;
}
.ap-var-head .card-sub { max-width: 52ch; }
.ap-var-title {
  font-family: var(--serif); font-weight: 540; font-size: 17px; margin: 0;
  letter-spacing: -0.01em; color: var(--ink); line-height: 1.2;
}
/* The ratio, not the spread, is the number that carries the verdict, so it is
   the one that takes colour – on a cool → neutral → warm ramp matching the
   underlying axis (tighter than chance → normal → spread out). Deliberately
   NOT party colours: a verdict on the L/NP row must not render in Coalition
   blue, or it reads as branding rather than a finding. */
.legend-val.vr-herded { color: var(--accent); }
.legend-val.vr-chance { color: var(--ink-3); }
.legend-val.vr-mild   { color: var(--ink-2); }
.legend-val.vr-wide   { color: var(--mood-neg); }

.ap-var-read {
  display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 14px;
}
.vr-tile {
  display: grid; grid-template-columns: auto auto; align-items: baseline;
  gap: 2px 10px; transition: opacity .15s ease;
}
.vr-tile.off { opacity: 0.35; }
.vr-name {
  font-size: 11.5px; font-weight: 700;
  grid-column: 1 / -1;
}
.vr-sigma {
  font-family: var(--serif); font-size: 24px; font-weight: 540; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.vr-sigma em { font-style: normal; font-size: 13px; color: var(--ink-3); margin-left: 1px; }
.vr-pill {
  justify-self: start; align-self: center;
  font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  border-radius: 999px; padding: 3px 9px; white-space: nowrap;
  border: 1px solid currentColor;
}
.vr-pill.vr-herded { color: var(--accent);   background: color-mix(in oklch, var(--accent) 11%, transparent); }
.vr-pill.vr-chance { color: var(--ink-3);    background: color-mix(in oklch, var(--ink) 6%, transparent); }
.vr-pill.vr-mild   { color: var(--ink-2);    background: color-mix(in oklch, var(--ink) 9%, transparent); }
.vr-pill.vr-wide   { color: var(--mood-neg); background: color-mix(in oklch, var(--mood-neg) 11%, transparent); }
.vr-sub {
  grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.ap-var-note { margin-top: 14px; }
/* tooltip secondary value (the ratio, beside each series' spread) */
.tip-note {
  font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
@media (max-width: 700px) {
  .ap-var-read { gap: 14px 20px; }
  .vr-sigma { font-size: 21px; }
}

/* archive ledger flows with the page; header pins just below the tab bar.
   overflow must stay visible here – any overflow on the wrapper turns it into
   the sticky containing block and the thead can never pin to the viewport. */
.ap-wrap { border-bottom: 1px solid var(--line-2); overflow: visible; }
.poll-table.archive { font-size: 13.5px; }
.poll-table.archive thead th {
  position: sticky; top: 39px; z-index: 2; background: var(--bg);
  /* generous topside padding – the th background paints this gap, so the
     pinned header keeps clear air below the tab bar without rows peeking
     through */
  padding-top: 20px; padding-bottom: 10px;
  box-shadow: 0 1px 0 var(--line);
}
/* header short-labels: full text by default, compact at narrow widths */
.poll-table.archive .lbl-s { display: none; }

/* narrow screens: rather than wrapping the table in a horizontal scroller
   (which breaks viewport-sticky and forces laggy JS pinning), slim the table
   to FIT the viewport: drop the secondary columns (.hide-md – sample, inline
   bars, OTH). The expandable row detail still carries everything. The header
   keeps native CSS sticky – buttery on every thread. */
@media (max-width: 1000px) {
  .poll-table.archive .hide-md { display: none; }
  .poll-table.archive .lbl-l { display: none; }
  .poll-table.archive .lbl-s { display: inline; }
  .poll-table.archive { font-size: 12.5px; }
  .ap-export { display: none; }   /* CSV export is a big-screen affordance */
  .poll-table.archive th, .poll-table.archive td { padding-left: 6px; padding-right: 6px; }
  .poll-table.archive .pollster-cell { white-space: normal; }
}
body.editorial .poll-table.archive thead th { background: var(--bg); }
/* the latest-polls ledger sits inside a card – when its header pins it must
   paint the card surface, not the page, or the header flashes a different
   paper colour against the card around it */
.card .poll-table.archive thead th { background: var(--surface); }
body.editorial .card .poll-table.archive thead th { background: var(--bg); }
.poll-table.archive td { padding-top: 11px; padding-bottom: 11px; }
.two-pp-col { min-width: 180px; }
.poll-table.archive td.two-pp-col { vertical-align: middle; }

/* archive "as published" – plain dot-coded numerals; the figures are the
   record, so no bar ink (65 near-identical 53/47 bars carry nothing) */
.apub {
  display: inline-flex; align-items: center; gap: 12px;
  font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; color: var(--ink);
}
.apub-seg { display: inline-flex; align-items: center; gap: 5px; }
.apub-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.apub-col { min-width: 150px; }

/* archive lead – diverging bar from the 50–50 line, ALP left / L/NP right
   (mirrors the topline meter), zoomed so ±14 pts fills a half-bar */
.arch-lead { display: inline-flex; align-items: center; gap: 9px; }
.arch-lead-bar {
  position: relative; width: 92px; height: 8px; border-radius: 3px;
  background: var(--surface-2); overflow: hidden; flex: none;
}
.arch-lead-fill { position: absolute; top: 0; bottom: 0; }
.arch-lead-mid {
  position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1.5px;
  background: var(--bg); transform: translateX(-50%);
}
.arch-lead-val {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  min-width: 38px; text-align: right;
}
.arch-lean { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.arch-lean.alp { color: var(--alp-text); }
.arch-lean.lnp { color: var(--lnp-text); }
.arch-lean.flat { color: var(--ink-3); font-weight: 600; }
.arch-empty td {
  text-align: center !important; color: var(--ink-3); padding: 40px 12px !important;
  font-family: var(--sans); font-size: 14px;
}
.arch-empty:hover { background: transparent !important; }

@media (max-width: 760px) {
  .tabs-inner { gap: 22px; }
  .cycle-insight { display: none; }
  .view-lede { font-size: 15.5px; }
}

/* ============================================================
   MOTION – view transitions & micro-interactions
   All entrance motion is FROM-hidden over a visible base state,
   and fully gated on prefers-reduced-motion.
   ============================================================ */

/* tab views rise in gently when switched */
@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: view-in .32s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes view-in {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }

  /* charts crossfade in when their window / matchup / leader set changes */
  .chart { animation: chart-in .3s ease both; }
  @keyframes chart-in { from { opacity: 0; } to { opacity: 1; } }
  .end-cap { transition: opacity .25s ease, fill .35s ease; }

  /* expanded poll breakdown settles in */
  .poll-detail { animation: detail-in .26s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  /* hero readout crossfades when the matchup changes */
  .hero-readout, .hero-sub { animation: readout-in .3s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes readout-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* quiet press acknowledgement on chip-like controls */
  .legend-chip, .cyc-chip, .ap-popbtn, .seg-btn { transition-property: color, border-color, background-color, opacity, transform; }
  .legend-chip:active, .cyc-chip:active, .ap-popbtn:active,
  .seg-btn:active, .exp-btn:active { transform: scale(0.965); }
  .exp-btn.open:active { transform: rotate(90deg) scale(0.965); }
}
@media (prefers-reduced-motion: reduce) {
  .guide, .hover-marker, .tip { transition: none; animation: none; }
  .acc-dot, .acc-mean { transition: none; }
  .roll-reel, .net { transition: none; }
}

/* The theme flip crossfades as ONE composited picture – see applyChrome() in
   views.jsx, which runs the class change inside document.startViewTransition().
   What used to be here was `body.theme-xfade *`: a colour transition on every
   element on the page, which on the archive tab is 3,300 of them and repainted
   the lot on every frame. The browser now animates two snapshots instead, so
   the only thing left to say is how long it should take. */
::view-transition-old(root),
::view-transition-new(root) { animation-duration: .34s; animation-timing-function: ease; }

/* ---------- shared frosted glass across the floating chrome ----------
   One material for every interactive pill toggle and the pinned nav, matching
   the hover readouts. Placed LAST so it overrides each control's opaque base
   background (same specificity → later wins); active/selected states carry
   higher specificity and keep their own solid fills. On flat paper the frost
   is near-invisible (nothing behind to blur); it comes alive where a control
   sits over content – above all the pinned tab bar as the page scrolls under. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .segmented, .legend-chip, .cyc-chip, .ap-popbtn, .ap-export {
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
}

/* The pinned bar is OPAQUE, and deliberately so. It used to frost the page
   scrolling under it, which looked right on its own but not in place: on iOS
   the strip immediately above it is Safari's status-bar chrome, which no CSS
   can reach and which cannot be translucent outside standalone mode. A frosted
   bar under a flat band reads as a seam - the eye goes to the join rather than
   to either surface. Opaque, and with theme-color set to the same value (see
   build.mjs), the status bar, the bar and the page are one continuous colour
   and there is no join to notice.

   The frosted-glass recipe above still applies to the floating pill controls,
   which sit over content and have nothing above them to disagree with. */
.tabs.pinned::before {
  /* Up through the notch, for standalone mode where the page does own that
     strip. Only while pinned: unpinned, this pseudo sits mid-page under the
     masthead and an overhang would paint over it. Safe to switch on .pinned
     because the pseudo is absolutely positioned - it changes paint, never
     layout, so it cannot reintroduce the sticky oscillation the bar avoids. */
  top: calc(-1 * env(safe-area-inset-top, 0px));
}

/* ---------- archive ledger at phone widths ----------
   The wrapper cannot scroll: .ap-wrap keeps overflow visible on purpose, so the
   sticky thead can pin to the VIEWPORT rather than to a scroll container. That
   trade is fine until the table is wider than the screen, at which point the
   rightmost column is simply clipped and unreachable - there is no scrollbar to
   reach it with. The ledger already sheds columns at 1000px; below ~480px the
   lead column's 180px floor alone is half the viewport, so give the bar and the
   cells a narrow-screen size instead of letting the table overflow. */
/* One tier below .hide-md, on the same principle: the table has to FIT, because
   .ap-wrap cannot scroll without becoming the sticky thead's containing block.
   .hide-md got it down to five columns, which fits at 375px exactly - and then
   stops. Below ~350px the five have no compression left and the rightmost is
   simply clipped, with no scrollbar to reach it: I verified the 375px case and
   wrongly took it for the whole range. (Not a font question - measured at 33px
   over with Public Sans and 29px with a humanist alternative.)

   Poll lean (and its new neighbour House effect) is the one to drop. It is a
   derived comparison rather than something the pollster published, and the
   row detail here prints "Poll lean +0.3 vs aggregate" one tap away - so
   nothing is actually lost, which is the same bargain .hide-md already
   strikes. */
@media (max-width: 430px) {
  .poll-table.archive .hide-sm { display: none; }
}

@media (max-width: 480px) {
  .two-pp-col { min-width: 118px; }
  .arch-lead { gap: 6px; }
  .arch-lead-bar { width: 58px; }
  .arch-lead-val { min-width: 32px; font-size: 12.5px; }
  .arch-lean { font-size: 12.5px; }
  .poll-table.archive { font-size: 12px; }
  .poll-table.archive th, .poll-table.archive td { padding-left: 4px; padding-right: 4px; }
}

</style>
