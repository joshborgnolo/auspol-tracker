  <style>/* ============================================================
   auspol — design tokens & styles
   ============================================================ */
:root {
  /* surfaces — warm paper */
  --bg:        oklch(0.970 0.008 78);
  --surface:   oklch(0.992 0.004 85);
  --surface-2: oklch(0.980 0.006 80);

  /* ink — warm near-black */
  --ink:       oklch(0.27 0.012 55);
  --ink-2:     oklch(0.44 0.012 55);
  /* --ink-3 is the lightest ink that still carries TEXT (card subtitles, muted
     table cells), so it is pinned to 4.5:1 on --bg. --ink-faint sits below the
     text threshold by design and is for rules, ticks and glyphs only. */
  --ink-3:     oklch(0.54 0.010 58);
  --ink-faint: oklch(0.70 0.008 65);

  /* hairlines */
  --line:   oklch(0.895 0.008 75);
  --line-2: oklch(0.935 0.006 78);

  /* party colours — muted, shared chroma family */
  --alp: oklch(0.55 0.150 27);   /* Labor red    */
  --lnp: oklch(0.50 0.095 250);  /* Coalition blue */
  --grn: oklch(0.60 0.120 150);  /* Greens       */
  --onp: oklch(0.66 0.130 58);   /* One Nation orange */
  --oth: oklch(0.64 0.018 70);   /* Others grey  */

  --accent: oklch(0.50 0.070 205);

  /* backdrop the charts actually sit on — used as the halo behind reference
     labels. Card surface in panelled mode, page paper in editorial. */
  --chart-bg: var(--surface);

  /* national-mood colours — distinct from party palette.
     mood-neg is a muted brick/clay (darker + duller than One Nation's
     bright orange, browner than Labor red) so the right/wrong-track axis
     never reads as a party hue. */
  --mood-pos: oklch(0.52 0.085 200);
  --mood-neg: oklch(0.505 0.092 36);

  /* past-cycle overlay lines — neutral graphite so the metric (not the party)
     leads; the current cycle and any highlighted cycle override with party hue */
  --cycle-line:  oklch(0.55 0.012 60 / 0.42);
  --cycle-faint: oklch(0.60 0.010 60 / 0.15);

  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --radius: 14px;
  --shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05), 0 6px 20px oklch(0.4 0.02 60 / 0.05);
  --maxw: 1200px;

  /* approval bar tints (theme-aware) */
  --appr-app-bg: oklch(0.62 0.10 150 / 0.22);
  --appr-dis-bg: oklch(0.60 0.13 28 / 0.18);
  --tip-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.05), 0 6px 20px oklch(0.4 0.02 60 / 0.05);
  /* shared frosted-glass material — one recipe for every floating readout,
     pill toggle and the pinned nav, so translucency reads as one language.
     Only visible over content (charts, scrolled page); inert on flat paper. */
  --glass-bg: color-mix(in oklch, var(--surface) 58%, transparent);
  --glass-border: color-mix(in oklch, var(--line) 60%, transparent);
  --glass-blur: blur(9px) saturate(1.2);
}

/* cool paper (light) — accent tone shift, party colours untouched */
body.cool {
  --bg:        oklch(0.972 0.006 235);
  --surface:   oklch(0.993 0.003 235);
  --surface-2: oklch(0.982 0.005 235);
  --line:      oklch(0.892 0.009 235);
  --line-2:    oklch(0.934 0.006 235);
}

/* ============================================================
   DARK MODE — warm near-black "newsprint at night"
   ============================================================ */
body.dark {
  --bg:        oklch(0.215 0.010 65);
  --surface:   oklch(0.252 0.011 66);
  --surface-2: oklch(0.292 0.012 66);

  --ink:       oklch(0.940 0.008 80);
  --ink-2:     oklch(0.800 0.009 78);
  --ink-3:     oklch(0.670 0.009 72);
  --ink-faint: oklch(0.545 0.009 68);

  --line:   oklch(0.355 0.011 66);
  --line-2: oklch(0.312 0.010 66);

  /* party colours — lifted for luminance on dark, same hues */
  --alp: oklch(0.660 0.165 28);
  --lnp: oklch(0.680 0.130 252);
  --grn: oklch(0.720 0.135 152);
  --onp: oklch(0.760 0.135 64);
  --oth: oklch(0.700 0.018 72);

  --accent: oklch(0.70 0.080 205);

  /* national-mood colours — lifted for dark (brick stays browner/duller than ON) */
  --mood-pos: oklch(0.70 0.105 200);
  --mood-neg: oklch(0.685 0.105 38);

  --cycle-line:  oklch(0.74 0.012 72 / 0.42);
  --cycle-faint: oklch(0.70 0.010 72 / 0.15);

  --shadow: 0 1px 2px oklch(0 0 0 / 0.30), 0 8px 28px oklch(0 0 0 / 0.40);
  --tip-shadow: 0 1px 2px oklch(0 0 0 / 0.35), 0 10px 30px oklch(0 0 0 / 0.50);
  --appr-app-bg: oklch(0.72 0.13 152 / 0.26);
  --appr-dis-bg: oklch(0.66 0.16 28 / 0.24);
  /* dark glass: a touch more opaque + more saturation so lines read through it */
  --glass-bg: color-mix(in oklch, var(--surface) 62%, transparent);
  --glass-border: color-mix(in oklch, var(--line) 65%, transparent);
  --glass-blur: blur(10px) saturate(1.35);
}

/* dark + cool — shift the warmth toward slate */
body.dark.cool {
  --bg:        oklch(0.210 0.012 248);
  --surface:   oklch(0.248 0.013 248);
  --surface-2: oklch(0.288 0.014 248);
  --line:      oklch(0.352 0.013 248);
  --line-2:    oklch(0.310 0.012 248);
}

/* editorial dark: paper tint already handled by body.dark vars */
body.dark.editorial { --bg: oklch(0.205 0.010 65); }
body.dark.editorial.cool { --bg: oklch(0.200 0.012 248); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  /* re-declare at body level so it resolves against the THEME's surface —
     custom properties substitute where they're defined, and .dark/.editorial
     live on body, not :root */
  --chart-bg: var(--surface);
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  transition: background-color .35s ease, color .35s ease;
  font-feature-settings: "tnum" 1, "ss01" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.45;
}

/* ---------- boot / no-JS states ---------- */
.boot {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  opacity: 0; animation: boot-in .4s ease .25s forwards;
}
@keyframes boot-in { to { opacity: 1; } }
.boot-bars { display: inline-flex; align-items: flex-end; gap: 4px; height: 30px; }
.boot-bars i {
  width: 7px; border-radius: 2px; background: var(--ink-faint);
  animation: boot-bounce 1.05s ease-in-out infinite;
}
.boot-bars i:nth-child(1) { height: 14px; background: var(--alp); animation-delay: 0s; }
.boot-bars i:nth-child(2) { height: 26px; background: var(--lnp); animation-delay: .12s; }
.boot-bars i:nth-child(3) { height: 18px; background: var(--grn); animation-delay: .24s; }
.boot-bars i:nth-child(4) { height: 10px; background: var(--onp); animation-delay: .36s; }
@keyframes boot-bounce { 0%, 100% { transform: scaleY(0.55); opacity: .55; } 50% { transform: scaleY(1); opacity: 1; } }
.boot-bars i { transform-origin: bottom; }
.boot-text { font-family: var(--sans); font-size: 13px; color: var(--ink-faint); letter-spacing: .02em; margin: 0; }
@media (prefers-reduced-motion: reduce) {
  .boot { animation: none; opacity: 1; }
  .boot-bars i { animation: none; }
}
.boot-noscript {
  max-width: 540px; margin: 12vh auto; padding: 22px 26px;
  font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink-2);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.boot-noscript strong { color: var(--ink); }
.legend-val, .appr-bar span, .tip-val { font-variant-numeric: tabular-nums; }

.page { max-width: var(--maxw); margin: 0 auto; padding: 28px 28px 64px; }

/* ---------- header ---------- */
.site-head {
  position: relative;
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 28px; flex-wrap: wrap;
  padding-bottom: 16px; margin-bottom: 26px;
  border-bottom: 1px solid var(--line);
}
.wordmark {
  display: inline-flex; align-items: center; gap: 3px;
  font-weight: 800; font-size: 30px; letter-spacing: -0.025em; line-height: 1;
  margin: 0;
}
/* visually-hidden expansion of the wordmark for screen readers / document outline */
.wm-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.wordmark.stacked { flex-direction: row; align-items: center; gap: 7px; }
.wm-textcol { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.wm-top { display: inline-flex; align-items: center; gap: 9px; }
.wm-name {
  display: inline-flex; font-weight: 800; font-size: 30px;
  letter-spacing: -0.025em; line-height: 1;
}
.wm-aus { color: var(--ink-3); }
.wm-poll { color: var(--ink); }
.wordmark.stacked .wm-track {
  align-self: flex-start; margin-left: 0; padding-bottom: 0;
  display: inline-block; text-indent: 0.23em;
  font-size: 12px; font-weight: 600; letter-spacing: 0.46em;
  text-transform: uppercase; color: var(--ink-3);
}
.wm-track {
  align-self: flex-end; margin-left: 9px; padding-bottom: 3px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.34em;
  text-transform: uppercase; color: var(--ink-3);
}
/* glyph = one dial: live primary-vote columns as radial graduations on a
   two-tone 2PP swing arc, needle from the shared pivot */
.wm-glyph { display: inline-flex; align-items: center; margin-left: 0; align-self: center; transform: translateY(4px); }
.wordmark.stacked .wm-glyph { align-self: center; }
.wm-dial { display: block; overflow: visible; }
.wm-arc { fill: none; stroke-width: 1.4; opacity: 0.5; }
.wm-pivot { fill: var(--ink-3); }
.wm-needle-g { transition: transform .75s cubic-bezier(.34,1.3,.5,1); }
@media (prefers-reduced-motion: reduce) { .wm-needle-g { transition: none; } }
.tagline {
  margin: 7px 0 0; font-family: var(--serif); font-style: italic;
  font-size: 15px; color: var(--ink-3); text-wrap: balance;
}
/* compact freshness line — only surfaced on small screens, where the full
   meta block is hidden (see the 560px breakpoint) */
.head-meta-compact { display: none; }
.head-right { display: flex; align-items: center; gap: 18px; }
.head-meta { display: flex; align-items: center; gap: 18px; }
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); font-weight: 600; white-space: nowrap; }
.meta-v { font-size: 14px; color: var(--ink); font-weight: 600; white-space: nowrap; }
.fresh-dot {
  display: inline-block; vertical-align: middle; position: relative; top: -1px;
  width: 7px; height: 7px; border-radius: 50%; margin-right: 7px;
}
.fresh-dot.fresh { background: var(--mood-pos); }
.fresh-dot.aging { background: var(--ink-3); }
.fresh-dot.stale { background: var(--mood-neg); }
.fresh-rel { margin-left: 6px; color: var(--ink-faint); font-weight: 500; }
.meta-divide { width: 1px; height: 30px; background: var(--line); }
.theme-cell {
  padding: 7px 10px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-faint);
}
.theme-cell:hover { color: var(--ink-2); }
.theme-cell.active { color: var(--ink); }
.theme-cell svg { display: block; }

/* ---------- accessibility: keyboard focus ---------- */
/* single shared focus ring for every interactive control. mouse/touch users
   never see it (:focus-visible); keyboard users always get a clear path. */
:focus { outline: none; }
:focus-visible,
.seg-btn:focus-visible, .tt-opt:focus-visible, .theme-cell:focus-visible,
.legend-chip:focus-visible, .ls-chip:focus-visible, .exp-btn:focus-visible,
.poll-row:focus-visible, th.sortable:focus-visible, a:focus-visible {
  outline: 2.5px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
.poll-row:focus-visible { outline-offset: -2.5px; } /* inset so the ring shows inside the table */

/* ---------- accessibility: 44px tap targets ---------- */
/* keep the tight editorial sizing visually, but extend the *hit* area to a
   44px-tall invisible overlay so the controls are comfortable on touch. */
.tt-opt, .theme-cell, .legend-chip, .seg-btn,
.ls-chip, .cyc-chip, .ap-chip, .tab-score, .cyc-showall, .ap-clear { position: relative; }
.tt-opt::after, .theme-cell::after, .legend-chip::after, .seg-btn::after,
.ls-chip::after, .cyc-chip::after, .ap-chip::after, .tab-score::after,
.cyc-showall::after, .ap-clear::after {
  content: ""; position: absolute; left: 0; right: 0;
  top: 50%; transform: translateY(-50%);
  height: 44px;
}
/* the search-clear × lives inside the input — inflate more conservatively so
   it can't steal caret-placement taps at the field's right end */
.ap-search-x::after {
  content: ""; position: absolute; left: -4px; right: -4px;
  top: 50%; transform: translateY(-50%); height: 36px;
}

/* ---------- layout ---------- */
.content { display: flex; flex-direction: column; gap: 22px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

/* ---------- leadership pair: expand one side to full width ----------
   grid-template-columns is animatable, so collapsing a column to 0fr gives a
   real expansion rather than a swap: both panels stay mounted and the survivor
   grows into the space. min-width:0 is what lets a grid child shrink below its
   content, and overflow:hidden stops the collapsing panel spilling out. */
/* Flex rather than grid, deliberately. Collapsing a grid track means animating
   `grid-template-columns` from 1fr to 0fr, and an `fr` inside minmax() does not
   interpolate here — the transition holds the start value and the panel never
   moves. `flex-grow` is a plain number, so 1 → 0 animates everywhere. */
.lead-grid {
  display: flex; align-items: flex-start;
  grid-template-columns: none;      /* drop the .two-col grid tracks */
}
.lead-grid > * {
  flex: 1 1 0; min-width: 0;
  transition: flex-grow .42s cubic-bezier(.4, 0, .2, 1),
              opacity .22s ease,
              visibility 0s linear .22s;
}
.lead-grid.lg-ppm  > :last-child,
.lead-grid.lg-appr > :first-child {
  flex-grow: 0; overflow: hidden; opacity: 0; pointer-events: none;
  /* delayed to the end of the fade, then instant on the way back — this is
     what takes the collapsed panel out of the tab order and the accessibility
     tree, which opacity alone does not */
  visibility: hidden;
}
/* the collapsed side keeps no gap, so the survivor really is full-bleed */
.lead-grid.lg-ppm, .lead-grid.lg-appr { gap: 0; }

.card-head-tools { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.pz-group { display: flex; gap: 2px; }
.pz-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; border-radius: 6px;
  background: transparent; border: 1px solid transparent;
  color: var(--ink-3); cursor: pointer;
  transition: color .15s ease, background-color .15s ease, border-color .15s ease;
}
.pz-btn:hover { color: var(--ink); background: var(--surface-2); border-color: var(--line); }
.pz-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .lead-grid, .lead-grid > * { transition: none; }
}
/* Below the two-column breakpoint the panels are already full width, so there
   is nothing to expand INTO — but minimise and swap stay, otherwise anyone who
   expands on a wide screen and then narrows the window is stranded. */
@media (max-width: 1200px) {
  .pz-expand { display: none; }
  /* the .two-col grid rule can't stack a flex row, so say it directly */
  .lead-grid { flex-direction: column; }
  .lead-grid > * { flex: 0 0 auto; width: 100%; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 22px 24px 20px;
  transition: background-color .35s ease, border-color .35s ease;
}
.card-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px; flex-wrap: wrap; margin-bottom: 14px;
}
.card-title { font-family: var(--serif); font-weight: 540; font-size: 22px; margin: 0; letter-spacing: -0.01em; color: var(--ink); line-height: 1.15; }
.card-sub { margin: 3px 0 0; font-size: 13px; color: var(--ink-3); text-wrap: pretty; }

/* ---------- segmented control ---------- */
.segmented {
  display: inline-flex; gap: 3px; padding: 3px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px;
}
.seg-btn {
  border: 0; background: transparent; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-3);
  padding: 6px 13px; border-radius: 7px; transition: all .15s ease; white-space: nowrap;
}
.seg-btn:hover { color: var(--ink); }
.seg-btn.active {
  background: var(--surface); color: var(--ink);
  box-shadow: 0 1px 2px oklch(0.4 0.02 60 / 0.12); border: 1px solid var(--line-2);
}
.segmented-sm .seg-btn { padding: 5px 10px; font-size: 12px; }

/* ---------- text toggle (editorial control) ---------- */
.text-toggle { display: inline-flex; align-items: baseline; gap: 11px; }
.tt-opt {
  border: 0; background: transparent; cursor: pointer; padding: 2px 0;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  color: var(--ink-faint); letter-spacing: -0.005em;
  border-bottom: 1.5px solid transparent; transition: color .15s ease; white-space: nowrap;
}
.tt-opt:hover { color: var(--ink-2); }
.tt-opt.active { color: var(--ink); font-weight: 700; border-bottom-color: var(--ink); }
.tt-div { width: 1px; height: 13px; background: var(--line); align-self: center; }
.tt-dots { display: inline-flex; gap: 2.5px; margin-right: 6px; vertical-align: middle; position: relative; top: -1px; }
.tt-dot { width: 6px; height: 6px; border-radius: 50%; }
/* flanking dots: left dot keys to the first party, right dot to the second —
   mirrors the sticky scoreboard's "• ALP … L/NP •" heraldic layout.
   inline-block so width/height apply even though .tt-opt is display:block. */
.tt-dot-l, .tt-dot-r { display: inline-block; width: 6px; height: 6px; border-radius: 50%; vertical-align: middle; }
.tt-dot-l { margin-right: 7px; position: relative; top: -1px; }
.tt-dot-r { margin-left: 7px; position: relative; top: -1px; }
.tt-opt:not(.active) .tt-dot-l,
.tt-opt:not(.active) .tt-dot-r { opacity: 0.78; }
/* shared party-token vocabulary — used by the matchup selector AND the sticky
   scoreboard so "ALP" / "L/NP" read as the same tracked-caps token everywhere. */
.party-tok { letter-spacing: 0.04em; font-weight: 600; }
.tt-opt.active .party-tok { font-weight: 700; }
.tt-vs { font-style: italic; font-weight: 400; color: var(--ink-faint); margin: 0 4px; }
.tt-opt:not(.active) .tt-dots { opacity: 0.78; }
.tt-caps .tt-opt {
  font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-faint);
}
.tt-caps .tt-opt.active { color: var(--ink); font-weight: 700; }
.tt-caps .tt-div { height: 10px; }

/* ---------- hero ---------- */
.hero { padding: 26px 28px 22px; }
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; flex-wrap: wrap; margin-bottom: 6px; }
.hero-eyebrow {
  font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-faint); font-weight: 700; margin: 0 0 10px;
}
.hero-readout { display: flex; align-items: baseline; gap: 16px; }
.ro-party { display: flex; align-items: baseline; gap: 11px; }
.ro-dot { width: 13px; height: 13px; border-radius: 50%; align-self: center; }
.ro-name { font-size: 17px; font-weight: 700; color: var(--ink-2); letter-spacing: -0.01em; white-space: nowrap; }
.ro-num { font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; color: var(--ink); }
.alp-side .ro-num { color: var(--alp); }
.lnp-side .ro-num { color: var(--lnp); }
.ro-sep { width: 2px; height: 44px; border-radius: 1px; background: var(--line); align-self: center; }
.hero-sub { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
.lead-tag { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.hero-sub-note { font-size: 13px; color: var(--ink-faint); white-space: nowrap; }
/* The interval sits directly under the headline pair, quieter than the numbers
   but above the lead/delta line — it qualifies the figure, so it reads before
   the movement does. */
.hero-interval { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.hi-range { font-size: 14px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hi-note { font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
/* Movement smaller than its own interval — stated, not colour-coded, so it
   reads as a qualification rather than a warning. */
.hero-caveat { color: var(--ink-faint); font-style: italic; }
.hero-hypo {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--onp); border: 1px solid var(--onp); border-radius: 999px; padding: 3px 9px;
  opacity: 0.9;
}
.hero-controls { display: flex; flex-direction: column; gap: 14px; align-items: flex-end; }

.hero-foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: 6px; flex-wrap: wrap; }
.hero-legend { display: flex; gap: 18px; }
.hl-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; white-space: nowrap; }
.hl-line { width: 18px; height: 3px; border-radius: 2px; }
.hl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-faint); opacity: 0.6; }
/* party swatch as a dot, for a matchup drawn as readings with no trend line */
.hl-swatch-dot { width: 9px; height: 9px; border-radius: 50%; opacity: 0.75; }
/* "limited data" caveat inside the hero eyebrow — same size, quieter weight,
   so it reads as a qualifier on the method rather than a separate label */
.eyebrow-warn { color: var(--ink-faint); font-weight: 600; }
.hero-caption { margin: 0; font-size: 12.5px; color: var(--ink-faint); }

/* ---------- delta ---------- */
.delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.delta-sm { font-size: 12px; }
.delta-arrow { font-size: 9px; }
/* movement is non-partisan: direction is carried by the arrow + sign, not
   by a party colour, so a falling Labor figure no longer renders in Labor red */
.delta.up { color: var(--ink-2); }
.delta.down { color: var(--ink-2); }
.delta.flat { color: var(--ink-faint); font-weight: 600; }

/* ---------- chart ---------- */
.chart { position: relative; width: 100%; margin-top: 4px; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.grid { stroke: var(--line-2); stroke-width: 1; }
.refline { stroke-width: 1.4; stroke-dasharray: 2 5; opacity: 0.85; }
.refline-label {
  font-family: var(--sans); font-size: 12px; font-weight: 600;
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
}
.guide {
  stroke: var(--ink-faint); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: 0.7;
  pointer-events: none;
  transition: transform .15s cubic-bezier(.3,.7,.3,1), opacity .18s ease;
}
/* direct end-of-line labels (cycle years) — party-coloured, paper halo */
.end-label {
  font-family: var(--sans); font-weight: 700;
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
  transition: opacity .2s ease;
}
/* key-event markers (wide charts only — gated in TrendChart by measured px) */
.evt-line { stroke: var(--ink-faint); stroke-width: 1; stroke-dasharray: 2 5; opacity: 0.5; }
.evt-label {
  font-family: var(--sans); font-weight: 600; fill: var(--ink-3);
  paint-order: stroke; stroke: var(--chart-bg);
  stroke-linejoin: round; stroke-linecap: round;
}
.evt:hover .evt-line { opacity: 0.9; }
.evt:hover .evt-label { fill: var(--ink); }
.hover-marker {
  pointer-events: none;
  transition: transform .15s cubic-bezier(.3,.7,.3,1), opacity .14s ease;
}
.axis-label { font-family: var(--sans); fill: var(--ink-3); font-size: 13.5px; transition: fill .35s ease; }
.axis-label.y { text-anchor: end; font-weight: 500; }
.axis-label.x { font-weight: 500; }
.scatter-dot { transition: r .12s ease, opacity .12s ease, fill .35s ease; cursor: pointer; }
.series-line { transition: opacity .2s ease, stroke .35s ease; }
.grid, .refline { transition: stroke .35s ease; }

/* tooltip */
.tip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--tip-shadow);
  padding: 9px 11px; min-width: 116px;
  transform: translate(-50%, 10px);
  transition: left .15s cubic-bezier(.3,.7,.3,1), top .15s cubic-bezier(.3,.7,.3,1);
  animation: tip-in .16s ease;
}
@keyframes tip-in { from { opacity: 0; } to { opacity: 1; } }
/* both hover readouts float over the plot → frosted glass (shared recipe with
   the pill toggles + pinned nav). The blur plus the bold ink figures keep every
   row legible; falls back to the opaque surface above where unsupported. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .tip {
    background: var(--glass-bg); border-color: var(--glass-border);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
  /* the guide readout sits right on the plot, so make it MORE see-through than
     the shared glass — a thin tint + light blur lets the actual trend lines
     read through it; the bold ink figures still carry over the softened lines */
  .tip.tip-guide {
    background: color-mix(in oklch, var(--surface) 38%, transparent);
    -webkit-backdrop-filter: blur(3px) saturate(1.15);
    backdrop-filter: blur(3px) saturate(1.15);
  }
}
.tip.tip-dot { transform: translate(-50%, calc(-100% - 14px)); }
.tip-title { font-size: 12px; font-weight: 700; color: var(--ink); margin-bottom: 6px; letter-spacing: -0.01em; white-space: nowrap; }
.tip-row { display: flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 1px 0; white-space: nowrap; }
.tip-swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tip-label { color: var(--ink-3); }
.tip-val { margin-left: auto; font-weight: 700; color: var(--ink); padding-left: 10px; }
.tip-sub { font-size: 11px; color: var(--ink-faint); margin-top: 5px; }

/* ---------- docked 2PP score (lives in the sticky tab bar) ---------- */
/* absolutely seated on the underline at the row's right edge — it occupies no
   flex space, so its arrival never relayouts the tab row; it simply fades into
   the area the scaling tab set vacates */
.tab-score {
  position: absolute; right: 1px; bottom: 0; z-index: 1;
  display: inline-flex; align-items: baseline; gap: 9px;
  border: 0; background: none; cursor: pointer; font-family: var(--sans);
  padding: 0 1px 10px; white-space: nowrap;
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity .26s ease, transform .34s cubic-bezier(.22, 1, .36, 1);
}
.tabs.pinned .tab-score { opacity: 1; transform: none; pointer-events: auto; }
.ts-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-faint); margin-right: 2px;
}
.ts-party { display: inline-flex; align-items: baseline; gap: 5px; }
.ts-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; align-self: center; }
.ts-abbr {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3);
}
.ts-num {
  font-family: var(--serif); font-weight: 560; font-size: 16px; line-height: 1;
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.ts-sep { width: 1.5px; height: 13px; background: var(--line-2); align-self: center; flex: none; position: relative; top: 1px; }
/* narrow: tighten the resting tabs so everything sits comfortably */
@media (max-width: 640px) {
  .tabs-set { gap: 18px; }
  .tab-label { font-size: 14.5px; line-height: 18px; }
  body.editorial .tab-label { font-size: 16.5px; line-height: 20px; }
  .ts-eyebrow { display: none; }
  .tab-score { gap: 7px; }
  .ts-num { font-size: 15.5px; }
}
@media (max-width: 400px) {
  .ts-abbr { display: none; }
}

/* ---------- legend (primary) ---------- */
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend-chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; cursor: pointer;
  font-family: var(--sans); transition: all .15s ease; white-space: nowrap;
}
.legend-chip:hover { border-color: var(--ink-faint); }
.legend-chip.off { opacity: 0.4; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.legend-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.legend-val { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.legend-chip.off .legend-val { color: var(--ink-faint); }

/* residual aggregate ("Others / Ind.") — not a party. Its swatch becomes a
   dashed rule echoing the dashed chart line, and the label is dimmed so it
   reads as a remainder rather than a fourth contender. */
.legend-chip.residual .legend-swatch {
  height: 0; border-radius: 0;
  background: transparent !important;
  border-top: 2px dashed var(--oth);
  align-self: center;
}
.legend-chip.residual .legend-name { color: var(--ink-faint); font-weight: 500; }
.legend-chip.residual .legend-val { color: var(--ink-3); font-weight: 600; }

/* ---------- leadership section (shared selector + two panels) ---------- */
.leadership { display: flex; flex-direction: column; gap: 4px; }
.leadership-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px 28px; flex-wrap: wrap;
}
/* section header — a true PEER of the other top-level section titles
   (Primary vote / National direction), so it reads as the PARENT of the two
   cards below rather than a smaller sibling. */
.section-h {
  font-family: var(--serif); font-weight: 540; font-size: 22px;
  letter-spacing: -0.01em; color: var(--ink); margin: 0; line-height: 1.15;
}
body.editorial .section-h { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
.leadership-note {
  margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3);
  font-family: var(--serif); font-style: italic;
}
.leadership-note strong { font-style: normal; font-weight: 700; color: var(--ink-2); }
.leadership .two-col { margin-top: 20px; }
/* the two panel titles SETTLE DOWN a level below the section header — clearly
   subheadings, not peers of "Leadership". Out-specifies the editorial bump. */
.leadership .card-title,
body.editorial .leadership .card-title { font-size: 20px; font-weight: 560; letter-spacing: -0.012em; white-space: nowrap; }

.leader-select { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ls-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-faint); font-weight: 700; white-space: nowrap;
}
.ls-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ls-chip {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 5px 12px 5px 10px; cursor: pointer;
  font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink-3);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease, opacity .15s ease;
}
.ls-chip:hover:not(:disabled) { border-color: var(--ink-faint); color: var(--ink-2); }
.ls-chip.on {
  color: var(--ink); border-color: var(--chip, var(--ink-faint));
  background: color-mix(in oklch, var(--chip, var(--ink)) 9%, var(--surface));
}
.ls-chip:not(.on) { opacity: 0.62; }
.ls-chip:not(.on) .ls-dot { opacity: 0.4; }
.ls-chip:disabled { cursor: default; }
.ls-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.ls-cur { color: var(--ink-faint); font-weight: 600; }
.ls-chip.on .ls-cur { color: var(--ink-3); }

/* ---------- leaders ---------- */
.leader-readout { display: flex; align-items: center; gap: 20px; margin-bottom: 6px; flex-wrap: wrap; }
.leader { display: flex; align-items: center; gap: 9px; }
.leader-dot { width: 11px; height: 11px; border-radius: 50%; }
.leader-name { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.leader-num { font-size: 30px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.leader-num .pct { font-size: 16px; font-weight: 700; color: var(--ink-3); margin-left: 1px; }
.leader-num.muted { color: var(--ink-3); }
.leader-vs { font-family: var(--serif); font-style: italic; color: var(--ink-faint); font-size: 15px; }
.leader.undecided { margin-left: auto; text-align: right; flex-direction: column; align-items: flex-end; gap: 0; }

.approval-readout { display: flex; flex-direction: column; gap: 11px; margin-bottom: 12px; }
.appr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.appr-top .leader-name { font-size: 13.5px; }
.net { margin-left: auto; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.net.pos { color: var(--grn); }
.net.neg { color: var(--alp); }
.appr-bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; font-size: 11.5px; font-weight: 700; }
/* inline figures use full-strength ink so they stay legible on the pale
   approve/disapprove tints in both light and dark themes (the bar colour
   and the net value at right already carry the green/red coding) */
.appr-app { background: var(--appr-app-bg); color: var(--ink); display: flex; align-items: center; padding-left: 7px; }
.appr-dis { background: var(--appr-dis-bg); color: var(--ink); display: flex; align-items: center; padding-left: 7px; }
.appr-dk  { background: transparent; color: var(--ink-3); display: flex; align-items: center; justify-content: center; }
/* compact split bar inside the poll-detail blocks */
.pd-appr-bar { height: 16px; font-size: 10px; border: 1px solid var(--line-2); }
/* favourability marker — flags nets that are positive−negative, a different
   question from approval and not directly comparable */
.fav-mark {
  font-size: 8px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-faint); vertical-align: super; margin-left: 3px; cursor: help;
}
/* change indicator vs the pollster's previous poll — neutral ink, direction by
   the ▲/▼ glyph (no good/bad colour). Sits quietly after the figure. */
.chg {
  margin-left: 5px; font-size: 10.5px; font-weight: 700; color: var(--ink-faint);
  font-variant-numeric: tabular-nums; white-space: nowrap; cursor: help;
  letter-spacing: -0.01em;
}
.chg.flat { color: var(--ink-faint); opacity: 0.7; }
.chg .chg-x { font-size: 8px; }

/* diverging net bar — the live source publishes nets only (no approve /
   disapprove split), so the snapshot readout shows net vs the "even" midline */
.appr-netbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.anb-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ink-faint); opacity: 0.6; }
.anb-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }

/* a reading older than the latest month carries a quiet month tag */
.stale-tag { color: var(--ink-faint); font-weight: 500; font-size: 0.85em; }

/* archive leadership cells — net figure with a micro approve / don't-know /
   disapprove split beneath, same coding as the snapshot approval bars but at
   table scale (solid chips; the pale tints vanish at this height) */
.arch-appr { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.arch-appr-bar {
  display: flex; height: 4px; width: 52px; border-radius: 2px; overflow: hidden;
  background: var(--surface-2);
}
.arch-appr-app { background: oklch(0.62 0.10 150 / 0.85); }
.arch-appr-dk  { background: transparent; }
.arch-appr-dis { background: oklch(0.60 0.13 28 / 0.75); }
/* national direction reuses the approval bar's geometry, but takes the mood
   tokens so it reads as the same measure as the panel above the table */
.arch-dir-right { background: var(--mood-pos); opacity: 0.85; }
.arch-dir-wrong { background: var(--mood-neg); opacity: 0.85; }

/* ---------- national direction ---------- */
.dir-net { display: flex; align-items: center; gap: 9px; }
.dir-net-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-faint); font-weight: 700; }
.dir-net-val { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dir-net-val.pos { color: var(--mood-pos); }
.dir-net-val.neg { color: var(--mood-neg); }
.dir-readout { display: flex; align-items: flex-end; gap: 16px; margin: 4px 0 14px; }
.dir-side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.dir-side.ta-r { text-align: right; margin-left: auto; }
/* labels never wrap onto their own value, and the bar yields width instead —
   keeps the right/wrong readout collision-proof at every width */
.dir-k { font-size: 13px; font-weight: 700; white-space: nowrap; }
.dir-v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.dir-v .pct { font-size: 15px; font-weight: 700; color: var(--ink-3); margin-left: 1px; }
.dir-bar { flex: 1; min-width: 60px; display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); align-self: center; }
.dir-pos { background: var(--mood-pos); }
.dir-neg { background: var(--mood-neg); }
.dir-uns { background: transparent; }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.poll-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.poll-table th {
  text-align: center; font-weight: 600; font-size: 11px; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--ink-faint); padding: 0 12px 10px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
.poll-table th.ta-l, .poll-table td.ta-l { text-align: left; }
.poll-table td { padding: 13px 12px; border-bottom: 1px solid var(--line-2); text-align: center; }
.poll-table tr:last-child td { border-bottom: 0; }
.poll-table tbody tr:hover { background: var(--surface-2); }
.pollster-cell { line-height: 1.25; }
.pollster-name { display: block; font-weight: 700; color: var(--ink); font-size: 14px; }

/* A linked pollster name reads as the name first and a link second: no blue,
   no permanent underline. The ↗ is the standing signal that it leaves the
   page; the underline arrives on hover/focus. */
a.pollster-link { text-decoration: none; cursor: pointer; }
a.pollster-link:hover, a.pollster-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.pollster-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
.plink-mark {
  /* the only standing cue that the name is a link, so it has to clear the
     text-contrast bar rather than sit in the decorative faint tier */
  font-size: 9px; font-weight: 700; margin-left: 3px; vertical-align: 1.5px;
  color: var(--ink-3); transition: color .15s ease;
}
a.pollster-link:hover .plink-mark, a.pollster-link:focus-visible .plink-mark { color: var(--ink-2); }

/* data-content tags: at-a-glance chips showing what a poll measures. Kept
   neutral monochrome on purpose — the party palette (red/blue/orange) is
   reserved for parties, so it must not leak onto data-type labels. They read
   as type by their TEXT, and light up solid ink only when their filter is on */
.poll-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.ptag {
  font-family: var(--sans); font-size: 9px; font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 1px 4px; border-radius: 3px; line-height: 1.5;
  background: var(--surface-2); color: var(--ink-3); white-space: nowrap;
  border: 1px solid var(--line-2);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.ptag.hit { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* the "Contains" filter chips reuse .ap-chip; just tighten to a tag look */
.ptag-chip { text-transform: uppercase; letter-spacing: 0.03em; font-size: 11px; font-weight: 700; padding: 5px 11px; }
.pollster-mode { display: block; margin-top: 1px; font-size: 11.5px; color: var(--ink-3); }
.released-pill {
  display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
.poll-table .muted { color: var(--ink-3); }
.poll-table .num { font-weight: 600; font-variant-numeric: tabular-nums; }

/* sortable headers */
.poll-table th.sortable { cursor: pointer; user-select: none; transition: color .15s ease; }
.poll-table th.sortable:hover { color: var(--ink-2); }
.poll-table th.sorted { color: var(--ink); }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.poll-table th.ta-l .th-in { justify-content: flex-start; }
.caret { font-size: 9px; line-height: 1; opacity: .9; }
.poll-table th.sortable:not(.sorted) .caret { opacity: 0; transition: opacity .15s ease; }
.poll-table th.sortable:hover .caret { opacity: .45; }

/* expand affordance + clickable rows */
.exp-col { width: 30px; padding-left: 4px !important; padding-right: 0 !important; }
.poll-row { cursor: pointer; }
.exp-btn {
  border: 0; background: transparent; cursor: pointer; color: var(--ink-3);
  font-size: 12px; line-height: 1; padding: 4px; border-radius: 5px;
  transition: transform .18s ease, color .15s ease;
  position: relative;
}
.exp-btn::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 44px; height: 44px; transform: translate(-50%, -50%);
}
.poll-row:hover .exp-btn { color: var(--ink-2); }
.exp-btn.open { transform: rotate(90deg); color: var(--ink); }
.poll-row.open { background: var(--surface-2); }

/* share column — arity-agnostic bar + keys */
.share-col { min-width: 210px; }
.poll-table td.share-col { vertical-align: middle; }
.share { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.sbar {
  display: flex; height: 8px; border-radius: 5px; overflow: hidden;
  background: var(--line-2); gap: 1.5px;
}
.sbar-seg { min-width: 2px; }
.share-keys {
  display: flex; flex-wrap: wrap; gap: 4px 11px;
  font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.skey { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.skey.muted { color: var(--ink-faint); }
.skey-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.skey-lab { color: inherit; }
.skey-val { font-weight: 700; color: var(--ink); }
.skey.muted .skey-val { color: var(--ink-3); }
.share-compact .share-keys { font-size: 11px; gap: 3px 9px; }

.facet-flag {
  display: inline-block; font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  white-space: nowrap;
}

/* 2PP column falling back to first preferences. The bar keeps full-strength
   colour (the data is good, just a different measure) at slightly reduced
   opacity; the dashed flag carries the substitution. No leading rule — it read
   as a stray grey sliver at the start of every bar. */
.tpp-fallback .sbar { opacity: 0.82; }
.tpp-fallback .facet-flag {
  border-style: dashed; color: var(--ink-3);
}

/* ---------- House effect (systematic pollster lean) ---------- */
.hfx {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  color: var(--ink-2); white-space: nowrap;
}
.hfx.flat { color: var(--ink-faint); font-weight: 600; }
/* which side the lean runs toward — smaller and quieter than the figure */
.hfx-who {
  margin-left: 3px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.04em;
  opacity: 0.75; text-transform: uppercase;
}
/* the per-party / per-leader variant, tucked under the figure it modifies */
.hfx-sub { display: block; margin-top: 1px; line-height: 1.2; }
.hfx-sub .hfx { font-size: 10px; font-weight: 600; color: var(--ink-faint); }
.hfx-sub .dash { font-size: 10px; }
/* names the matchup a secondary house effect belongs to, e.g. "v ON" */
.hfx-tag {
  font-size: 9px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-faint); margin-right: 4px; opacity: 0.8;
}
/* a secondary lean keeps its party tint but stays quieter than the headline one */
.hfx-sub .hfx-who { font-size: 9px; }

/* net / direction value */
.netv { font-weight: 800; font-variant-numeric: tabular-nums; }
.netv.pos { color: var(--mood-pos); }
.netv.neg { color: var(--mood-neg); }
.dash { color: var(--ink-faint); font-weight: 600; }

/* expanded per-poll breakdown */
.detail-row > td { padding: 0 !important; border-bottom: 1px solid var(--line-2); }
.detail-row:hover { background: transparent !important; }
.poll-detail { padding: 6px 14px 20px 42px; background: var(--surface-2); text-align: left; }
.pd-meta {
  display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 4px 0 16px;
  margin-bottom: 18px; border-bottom: 1px solid var(--line-2);
  font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.pd-meta-i { white-space: nowrap; }
.pd-meta-k {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-faint); font-weight: 700; margin-right: 5px;
}
.pd-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 34px;
}
.pd-block { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
/* a seat projection is a whole chamber — it needs both columns to read */
.pd-block-wide { grid-column: 1 / -1; }

/* ---------- Seat projection (MRP polls) ---------- */
.seatproj { display: flex; flex-direction: column; gap: 8px; }
.seatbar {
  position: relative; display: flex; height: 26px; border-radius: 5px;
  overflow: hidden; background: var(--surface-2); border: 1px solid var(--line-2);
}
.seatbar-seg { height: 100%; }
/* the majority line is the number that decides government — it sits ON TOP of
   the segments, as a hard notch rather than a colour change */
.seatbar-maj {
  position: absolute; top: -3px; bottom: -3px; width: 2px;
  background: var(--ink); transform: translateX(-1px);
  box-shadow: 0 0 0 1.5px var(--chart-bg);
}
.seatbar-note {
  display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-faint);
}
.seat-majlab { font-weight: 600; }
.seat-hung { color: var(--ink-2); font-weight: 600; }
.seat-rows { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 2px; }
.seat-row { display: inline-flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
.seat-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seat-est { font-size: 15px; font-weight: 800; color: var(--ink); }
.seat-range { font-size: 11.5px; color: var(--ink-faint); }
/* seat change is vs the last ELECTION, so it takes neutral ink like every
   other change indicator — no good/bad colour in a party-neutral tracker */
.seat-chg { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.seat-chg.flat { color: var(--ink-faint); font-weight: 600; }
.seat-basis { margin: 2px 0 0; font-size: 11px; color: var(--ink-faint); text-wrap: pretty; }
@media (max-width: 700px) {
  .seat-rows { gap: 6px 16px; }
  .seat-est { font-size: 14px; }
}
/* leader-approval rows in the detail block — net-only readings from the live
   source, so each row is name left, net right */
.pd-apprs { display: flex; flex-direction: column; gap: 7px; }
.pd-appr-top { display: flex; align-items: center; gap: 7px; }
.pd-appr-name { font-weight: 600; font-size: 13px; }
.pd-appr-net { margin-left: auto; font-variant-numeric: tabular-nums; }
/* the second measure, when a wave published both for one leader — indented and
   quieter than the primary net, so it reads as an addition, not a correction */
.pd-appr-alt {
  display: flex; align-items: baseline; gap: 7px; margin-top: 4px; padding-left: 15px;
  font-variant-numeric: tabular-nums;
}
.pd-appr-alt-k {
  font-size: 11px; color: var(--ink-faint); letter-spacing: 0.01em;
}
.pd-appr-alt .netv { margin-left: auto; font-size: 12.5px; opacity: 0.85; }
.pd-wide { grid-column: 1 / -1; max-width: 520px; }
.pd-k {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-faint);
}
.pd-leaders { display: flex; gap: 22px; flex-wrap: wrap; }
.pd-lead { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.pd-contests { display: flex; flex-direction: column; gap: 12px; }
.pd-contest { display: flex; flex-direction: column; gap: 6px; }
.pd-contest-lab {
  font-size: 12px; font-weight: 700; color: var(--ink-2);
  font-family: var(--serif); font-style: italic; letter-spacing: 0;
}
.pd-absent { font-family: var(--serif); font-style: italic; color: var(--ink-faint); font-size: 13.5px; }
.table-hint { margin: 12px 2px 0; font-size: 12px; color: var(--ink-3); }

@media (max-width: 720px) {
  .pd-grid { grid-template-columns: 1fr; }
  .pd-wide { grid-column: auto; }
  .poll-detail { padding-left: 20px; }
}

/* ---------- method footer ---------- */
.method { margin-top: 6px; padding-top: 24px; border-top: 1px solid var(--line); }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.method-h { font-family: var(--serif); font-weight: 540; font-size: 16px; margin: 0 0 7px; color: var(--ink); }
.method p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
.disclaimer {
  margin-top: 22px; padding: 11px 14px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-3); text-align: center;
}
/* ---------- responsive ---------- */
/* The leadership pair carries a scatter cloud in each panel now, and ~120 dots
   in a 250px-tall chart need width to stay legible. Side by side is worth
   keeping — comparing a leader's preferred-PM standing with their net approval
   is the point — but only on a screen genuinely wide enough for two of them. */
@media (max-width: 1200px) {
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .method-grid { grid-template-columns: 1fr; }
  .head-meta { gap: 12px; }
  .ro-num { font-size: 48px; }
  .hero-controls { align-items: flex-start; flex-direction: row; }
}
@media (max-width: 560px) {
  .page { padding: 20px 16px 48px; }
  /* tagline now carries the election context, so drop the whole meta block
     (incl. the Next election anchor) on small screens */
  .head-meta { display: none; }
  /* …and surface a single compact freshness line in its place */
  .head-meta-compact {
    display: flex; align-items: center; gap: 8px;
    margin: 9px 0 0; font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .head-meta-compact .fresh-dot { margin-right: 0; width: 6px; height: 6px; top: 0; }
  /* stack header; pin the theme toggle to the top-right corner so it never
     wraps down beside the meta on narrow screens */
  .site-head { flex-direction: column; align-items: flex-start; gap: 13px; }
  /* reserve toggle space on the wordmark row only — not the brand wrapper —
     so the tagline below the (top-pinned) toggle can use the full width */
  .brand { padding-right: 0; }
  .wordmark { padding-right: 92px; }
  /* head-right's own box leaves the flow (meta is hidden, the toggle is
     absolutely pinned) so it can't add phantom column-gap above the rule */
  .head-right { display: contents; }
  .theme-seg { position: absolute; top: 0; right: 0; }
  .hero-readout { flex-direction: column; gap: 6px; align-items: flex-start; }
  .ro-sep { display: none; }
  /* stack the two toggles so the dot-paired matchup control never overflows */
  .hero-controls { flex-direction: column; align-items: flex-start; gap: 12px; }
  .text-toggle { gap: 9px; }
  .tt-opt { font-size: 13px; }
  .tt-dots { margin-right: 5px; }
}

/* ============================================================
   EDITORIAL MODE — broadsheet / ruled layout
   Drops card chrome; separates sections with hairline rules and
   stronger serif headings. Charts breathe edge-to-edge on paper.
   ============================================================ */
body.editorial { --bg: oklch(0.975 0.009 80); --chart-bg: var(--bg); }

body.editorial .content { gap: 0; }

body.editorial .card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  padding: 38px 0 34px;
  border-top: 1px solid var(--line);
}
/* hero keeps no top rule (it's first) and a touch more air */
body.editorial .hero { border-top: 0; padding-top: 10px; }

/* bigger, more authoritative serif section headings */
body.editorial .card-title { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
body.editorial .card-sub { font-size: 14px; margin-top: 5px; }
body.editorial .card-head { margin-bottom: 22px; }

/* leadership is a top-level section — give it the same divider + rhythm as a
   .card so it sits as a peer of Primary vote / National direction */
body.editorial .leadership { border-top: 1px solid var(--line); padding: 38px 0 34px; }

/* two-column becomes two columns split by a VERTICAL rule, no card frames.
   No horizontal top rule — the section divider above "Leadership" already
   marks the boundary; an internal rule here would read as a false section break. */
body.editorial .two-col {
  gap: 0; padding: 0;
}
body.editorial .two-col .card { border-top: 0; padding-top: 0; padding-bottom: 0; }
body.editorial .two-col .card:first-child {
  padding-right: 40px; border-right: 1px solid var(--line);
}
body.editorial .two-col .card:last-child { padding-left: 40px; }
/* the vertical rule and its gutter belong to a SHARED row — once one side is
   collapsed the survivor is full-bleed and must not keep either */
body.editorial .lead-grid.lg-ppm .card:first-child { padding-right: 0; border-right: 0; }
body.editorial .lead-grid.lg-appr .card:last-child { padding-left: 0; }
/* …and the COLLAPSED side must not keep its gutter either: overflow:hidden
   clips content but not padding, which left a 40px sliver of empty card */
body.editorial .lead-grid.lg-ppm .card:last-child,
body.editorial .lead-grid.lg-appr .card:first-child {
  padding-left: 0; padding-right: 0; border-right: 0;
}

/* table reads as ledger: heavier top/bottom rules, airier rows */
body.editorial .poll-table th { border-bottom: 2px solid var(--ink-3); color: var(--ink-2); }
body.editorial .poll-table td { padding-top: 15px; padding-bottom: 15px; }
body.editorial .poll-table tbody tr:hover { background: var(--surface-2); }

/* legend / segmented keep a hairline so controls stay legible without cards */
body.editorial .method { border-top: 2px solid var(--ink-3); margin-top: 8px; padding-top: 30px; }
body.editorial .disclaimer { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 16px 0 0; text-align: left; font-size: 11.5px; color: var(--ink-faint); }

/* hero readout gets a hair more presence in editorial */
body.editorial .hero-eyebrow { color: var(--ink-3); }

.tweak-note {
  margin: -2px 0 4px; font-size: 11.5px; line-height: 1.45;
  color: var(--ink-faint); font-family: var(--sans);
}

/* Must track the .two-col grid breakpoint above (1200px): the divider is
   vertical only while the panels sit side by side. Left at 900 it drew a
   vertical rule beside already-stacked cards from 901px to 1200px. */
@media (max-width: 1200px) {
  /* stacked: the two panels are SIBLINGS under Leadership, so their separator
     uses the lighter --line-2 hairline + tighter air — clearly subordinate to
     the full-strength --line section divider that sits above "Leadership". */
  body.editorial .two-col .card:first-child {
    padding-right: 0; border-right: 0; border-bottom: 1px solid var(--line-2); padding-bottom: 24px;
  }
  body.editorial .two-col .card:last-child { padding-left: 0; padding-top: 24px; }
}

/* ============================================================
   TABS — editorial section nav beneath the header
   ============================================================ */
.tabs-sentinel { height: 0; margin: 0; padding: 0; pointer-events: none; }
.tabs {
  position: relative;
  /* flush under the masthead rule: the nav + its underline read as one banded
     unit with the masthead — labels sit equidistant between the two rules */
  margin: -26px -4px 26px;
  padding-inline: 4px;
  background: var(--bg);
}
/* full-bleed backdrop: the sticky bar's paint must reach the viewport edges so
   nothing in the side gutters can poke through beside it once pinned. The
   pseudo sits behind the bar and stretches from screen edge to screen edge. */
.tabs::before {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  background: var(--bg);
  z-index: 0;
}
/* the pinned lift-off shadow lives on its OWN full-bleed layer and fades via
   opacity — compositor-only; animating box-shadow itself repaints every frame */
.tabs::after {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  box-shadow: 0 10px 22px -16px color-mix(in oklch, var(--ink) 55%, transparent);
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none; z-index: 0;
}
/* keep the tab row painting above the full-bleed backdrop */
.tabs-inner { position: relative; z-index: 1; }
/* sticky on every view */
.tabs.sticky { position: sticky; top: 0; z-index: 41; }
/* "caught the top" — lift the bar off the scrolling content.
   NOTE: the pinned state must NEVER change the bar's layout — the bar is
   sticky (in-flow), so any layout delta shifts the page under the scroll
   position and the pin oscillates. Condensing is therefore done ENTIRELY with
   a composited transform on .tabs-set: no reflow per frame (smooth on any
   thread), and no layout change at all (no oscillation risk). */
.tabs.pinned::after { opacity: 1; }
.tabs-inner {
  display: flex; align-items: flex-end;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
/* the tab set condenses as ONE unit — a single transform: scale() seated on
   the underline (origin left bottom), GPU-composited end to end */
.tabs-set {
  display: flex; gap: 30px; align-items: flex-end;
  transform-origin: left bottom;
  transition: transform .38s cubic-bezier(.22, 1, .36, 1);
}
.tabs.pinned .tabs-set { transform: scale(0.844); }   /* 16px → 13.5px */
body.editorial .tabs.pinned .tabs-set { transform: scale(0.79); } /* 19 → 15 */
@media (prefers-reduced-motion: reduce) {
  .tabs-set, .tabs::after, .tab-score { transition: none; }
}
.tabs-inner::-webkit-scrollbar { display: none; }
.tab {
  position: relative; border: 0; background: none; cursor: pointer;
  padding: 12px 1px 12px; font-family: var(--sans);
  display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap;
  color: var(--ink-3); transition: color .15s ease;
}
.tab-label {
  font-size: 16px; font-weight: 600; letter-spacing: -0.005em;
  line-height: 19px;
}
.tab-note { font-size: 12px; font-weight: 600; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--ink); }
.tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;
  background: var(--ink); border-radius: 2px 2px 0 0;
  transform: scaleX(0); transform-origin: left center; transition: transform .2s ease;
}
.tab.active::after { transform: scaleX(1); }
body.editorial .tab-label { font-family: var(--serif); font-weight: 500; font-size: 19px; line-height: 23px; letter-spacing: -0.01em; }

/* narrow screens condense a touch further so the docked score clears the
   scaled tab set */
@media (max-width: 640px) {
  .tabs.pinned .tabs-set { transform: scale(0.8); }
  body.editorial .tabs.pinned .tabs-set { transform: scale(0.76); }
}

/* ============================================================
   VIEW SCAFFOLD (cycles + all polls)
   ============================================================ */
.view-intro { margin-bottom: 4px; }
.view-lede {
  font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink-2);
  max-width: 64ch; margin: 0 0 18px; text-wrap: pretty;
}
.view-lede strong { color: var(--ink); font-weight: 600; }

/* ---------- Past cycles ---------- */
.cyc-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

.cyc-legend { margin: 20px 0 6px; }
.cyc-legend-row { display: flex; flex-wrap: wrap; gap: 7px; }
.cyc-chip {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 13px 6px 11px; cursor: pointer; font-family: var(--sans);
  color: var(--ink-2);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease, opacity .15s ease;
}
.cyc-chip:hover { border-color: var(--ink-faint); }
.cyc-chip .cyc-swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; transition: transform .15s ease; }
.cyc-chip .cyc-year { font-size: 13.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.cyc-chip .cyc-lead { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.cyc-chip.off { opacity: 0.4; }
.cyc-chip.off .cyc-swatch { background: var(--ink-faint) !important; }
.cyc-chip.current {
  border-color: color-mix(in oklch, var(--cyc) 45%, var(--line));
  background: color-mix(in oklch, var(--cyc) 8%, var(--surface));
}
.cyc-chip.current:hover .cyc-swatch,
.cyc-chip:hover .cyc-swatch { transform: scale(1.18); }
.cyc-now {
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--cyc); border: 1px solid color-mix(in oklch, var(--cyc) 40%, var(--line));
  border-radius: 4px; padding: 1px 5px;
}
.cyc-showall {
  margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 2px 0;
}
.cyc-showall:hover { text-decoration: underline; }

.cyc-charts { display: flex; flex-direction: column; }
/* title block flexes to fill; the insight wraps below it (not behind it) once
   the two can no longer share a row — the title can never overlap the insight */
.cycle-head { align-items: baseline; }
.cycle-head > div { flex: 1 1 26ch; min-width: 0; }
.cycle-insight {
  font-family: var(--serif); font-size: 14.5px; line-height: 1.5; color: var(--ink-2);
  max-width: 34ch; text-align: right; margin: 0; text-wrap: pretty;
}
.ci-delta { font-weight: 700; font-variant-numeric: tabular-nums; }
.ci-delta.pos { color: var(--mood-pos); }
.ci-delta.neg { color: var(--mood-neg); }
.cyc-foot {
  margin: 22px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint);
  font-family: var(--sans); max-width: 70ch; text-wrap: pretty;
}
/* in editorial mode the cycle charts divide like snapshot panels; first one
   already sits under the legend, so drop its top rule for a cleaner seam */
body.editorial .cyc-charts .cycle-card:first-child { border-top: 0; padding-top: 16px; }

/* ---------- All polls archive ---------- */
.ap-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px; flex-wrap: wrap; margin-bottom: 18px;
}
.ap-filters { display: flex; flex-direction: column; gap: 14px; margin-bottom: 16px; }

.ap-search {
  position: relative; display: inline-flex; align-items: center; max-width: 320px;
  color: var(--ink-faint);
}
.ap-search svg { position: absolute; left: 12px; pointer-events: none; }
.ap-search input {
  width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 9px 30px 9px 34px; transition: border-color .15s ease;
}
.ap-search input::placeholder { color: var(--ink-faint); }
.ap-search input:focus { outline: none; border-color: var(--accent); }
.ap-search-x {
  position: absolute; right: 8px; border: 0; background: none; cursor: pointer;
  font-size: 18px; line-height: 1; color: var(--ink-faint); padding: 2px 4px;
}
.ap-search-x:hover { color: var(--ink); }

.ap-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ap-chip {
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 6px 13px; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink-3); cursor: pointer; white-space: nowrap;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.ap-chip:hover { border-color: var(--ink-faint); color: var(--ink-2); }
.ap-chip.on {
  color: var(--ink); border-color: var(--ink-3);
  background: color-mix(in oklch, var(--ink) 7%, var(--surface));
}

.ap-segs { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
.ap-seg-group { display: inline-flex; align-items: center; gap: 9px; flex-wrap: wrap; }
/* the lead group reads as one sentence: Lead [matchup] held by [leader] */
.ap-seg-join { font-size: 11.5px; color: var(--ink-faint); white-space: nowrap; }
.ap-resultnote { color: var(--ink-faint); font-weight: 400; }
.ap-seg-label {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-faint);
}

.ap-resultline {
  display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px;
  font-family: var(--sans); font-size: 13px; color: var(--ink-3);
}
.ap-resultline strong { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.ap-clear {
  border: 0; background: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 0;
}
.ap-clear:hover { text-decoration: underline; }
/* CSV export — pushed to the right, desktop only (hidden ≤1000px below) */
.ap-export {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 5px 13px; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap; align-self: center;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.ap-export:hover { color: var(--ink); border-color: var(--ink-3); background: color-mix(in oklch, var(--ink) 7%, var(--surface)); }
.ap-export svg { stroke: currentColor; }

/* ---------- Poll disagreement (variance) panel ---------- */
/* sits below the archive table, so it takes air ABOVE and a single top rule —
   a closing section wants no trailing border under it */
.ap-var {
  border-top: 1px solid var(--line);
  padding: 24px 0 0; margin: 30px 0 0;
}
.ap-var-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px 24px; flex-wrap: wrap; margin-bottom: 10px;
}
.ap-var-head .card-sub { max-width: 52ch; }
.ap-var-title {
  font-family: var(--serif); font-weight: 540; font-size: 17px; margin: 0;
  letter-spacing: -0.01em; color: var(--ink); line-height: 1.2;
}
/* The ratio, not the spread, is the number that carries the verdict, so it is
   the one that takes colour — on a cool → neutral → warm ramp matching the
   underlying axis (tighter than chance → normal → spread out). Deliberately
   NOT party colours: a verdict on the L/NP row must not render in Coalition
   blue, or it reads as branding rather than a finding. */
.legend-val.vr-herded { color: var(--accent); }
.legend-val.vr-chance { color: var(--ink-3); }
.legend-val.vr-mild   { color: var(--ink-2); }
.legend-val.vr-wide   { color: var(--mood-neg); }

.ap-var-read {
  display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 14px;
}
.vr-tile {
  display: grid; grid-template-columns: auto auto; align-items: baseline;
  gap: 2px 10px; transition: opacity .15s ease;
}
.vr-tile.off { opacity: 0.35; }
.vr-name {
  font-size: 11.5px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; grid-column: 1 / -1;
}
.vr-sigma {
  font-family: var(--serif); font-size: 24px; font-weight: 540; color: var(--ink);
  font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
}
.vr-sigma em { font-style: normal; font-size: 13px; color: var(--ink-faint); margin-left: 1px; }
.vr-pill {
  justify-self: start; align-self: center;
  font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
  border-radius: 999px; padding: 3px 9px; white-space: nowrap;
  border: 1px solid currentColor;
}
.vr-pill.vr-herded { color: var(--accent);   background: color-mix(in oklch, var(--accent) 11%, transparent); }
.vr-pill.vr-chance { color: var(--ink-3);    background: color-mix(in oklch, var(--ink) 6%, transparent); }
.vr-pill.vr-mild   { color: var(--ink-2);    background: color-mix(in oklch, var(--ink) 9%, transparent); }
.vr-pill.vr-wide   { color: var(--mood-neg); background: color-mix(in oklch, var(--mood-neg) 11%, transparent); }
.vr-sub {
  grid-column: 1 / -1; font-size: 11.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.ap-var-note { margin-top: 14px; }
/* tooltip secondary value (the ratio, beside each series' spread) */
.tip-note {
  font-size: 11px; color: var(--ink-faint); font-variant-numeric: tabular-nums;
}
@media (max-width: 700px) {
  .ap-var-read { gap: 14px 20px; }
  .vr-sigma { font-size: 21px; }
}

/* archive ledger flows with the page; header pins just below the tab bar.
   overflow must stay visible here — any overflow on the wrapper turns it into
   the sticky containing block and the thead can never pin to the viewport. */
.ap-wrap { border-bottom: 1px solid var(--line-2); overflow: visible; }
.poll-table.archive { font-size: 13.5px; }
.poll-table.archive thead th {
  position: sticky; top: 39px; z-index: 2; background: var(--bg);
  /* generous topside padding — the th background paints this gap, so the
     pinned header keeps clear air below the tab bar without rows peeking
     through */
  padding-top: 20px; padding-bottom: 10px;
  box-shadow: 0 1px 0 var(--line);
}
/* header short-labels: full text by default, compact at narrow widths */
.poll-table.archive .lbl-s { display: none; }

/* narrow screens: rather than wrapping the table in a horizontal scroller
   (which breaks viewport-sticky and forces laggy JS pinning), slim the table
   to FIT the viewport: drop the secondary columns (.hide-md — sample, inline
   bars, OTH). The expandable row detail still carries everything. The header
   keeps native CSS sticky — buttery on every thread. */
@media (max-width: 1000px) {
  .poll-table.archive .hide-md { display: none; }
  .poll-table.archive .lbl-l { display: none; }
  .poll-table.archive .lbl-s { display: inline; }
  .poll-table.archive { font-size: 12.5px; }
  .ap-export { display: none; }   /* CSV export is a big-screen affordance */
  .poll-table.archive th, .poll-table.archive td { padding-left: 6px; padding-right: 6px; }
  .poll-table.archive .pollster-cell { white-space: normal; }
}
body.editorial .poll-table.archive thead th { background: var(--bg); }
.poll-table.archive td { padding-top: 11px; padding-bottom: 11px; }
.two-pp-col { min-width: 180px; }
.poll-table.archive td.two-pp-col { vertical-align: middle; }

/* archive "as published" — plain dot-coded numerals; the figures are the
   record, so no bar ink (65 near-identical 53/47 bars carry nothing) */
.apub {
  display: inline-flex; align-items: center; gap: 12px;
  font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; color: var(--ink);
}
.apub-seg { display: inline-flex; align-items: center; gap: 5px; }
.apub-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.apub-col { min-width: 150px; }

/* archive lead — diverging bar from the 50–50 line, ALP left / L/NP right
   (mirrors the topline meter), zoomed so ±14 pts fills a half-bar */
.arch-lead { display: inline-flex; align-items: center; gap: 9px; }
.arch-lead-bar {
  position: relative; width: 92px; height: 8px; border-radius: 3px;
  background: var(--surface-2); overflow: hidden; flex: none;
}
.arch-lead-fill { position: absolute; top: 0; bottom: 0; }
.arch-lead-mid {
  position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1.5px;
  background: var(--bg); transform: translateX(-50%);
}
.arch-lead-val {
  font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px;
  min-width: 38px; text-align: right;
}
.arch-lean { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; }
.arch-lean.alp { color: var(--alp); }
.arch-lean.lnp { color: var(--lnp); }
.arch-lean.flat { color: var(--ink-faint); font-weight: 600; }
.arch-empty td {
  text-align: center !important; color: var(--ink-3); padding: 40px 12px !important;
  font-family: var(--sans); font-size: 14px;
}
.arch-empty:hover { background: transparent !important; }

@media (max-width: 760px) {
  .tabs-inner { gap: 22px; }
  .cycle-insight { display: none; }
  .view-lede { font-size: 15.5px; }
  .ap-segs { gap: 12px 18px; }
}

/* ============================================================
   MOTION — view transitions & micro-interactions
   All entrance motion is FROM-hidden over a visible base state,
   and fully gated on prefers-reduced-motion.
   ============================================================ */

/* tab views rise in gently when switched */
@media (prefers-reduced-motion: no-preference) {
  .view-enter { animation: view-in .32s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes view-in {
    from { opacity: 0; transform: translateY(7px); }
    to   { opacity: 1; transform: none; }
  }

  /* charts crossfade in when their window / matchup / leader set changes */
  .chart { animation: chart-in .3s ease both; }
  @keyframes chart-in { from { opacity: 0; } to { opacity: 1; } }
  .end-cap { transition: opacity .25s ease, fill .35s ease; }

  /* expanded poll breakdown settles in */
  .poll-detail { animation: detail-in .26s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }

  /* hero readout crossfades when the matchup changes */
  .hero-readout, .hero-sub { animation: readout-in .3s cubic-bezier(.25,.6,.3,1) both; }
  @keyframes readout-in {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: none; }
  }

  /* quiet press acknowledgement on chip-like controls */
  .legend-chip, .ls-chip, .cyc-chip, .ap-chip, .seg-btn { transition-property: color, border-color, background-color, opacity, transform; }
  .legend-chip:active, .ls-chip:active, .cyc-chip:active, .ap-chip:active,
  .seg-btn:active, .exp-btn:active { transform: scale(0.965); }
  .exp-btn.open:active { transform: rotate(90deg) scale(0.965); }
}
@media (prefers-reduced-motion: reduce) {
  .guide, .hover-marker, .tip { transition: none; animation: none; }
}

/* one-shot, whole-page colour crossfade while the theme flips — the class is
   added just before the body theme class changes and removed ~450ms later */
@media (prefers-reduced-motion: no-preference) {
  body.theme-xfade, body.theme-xfade *,
  body.theme-xfade *::before, body.theme-xfade *::after {
    transition: background-color .38s ease, color .38s ease, border-color .38s ease,
                fill .38s ease, stroke .38s ease, box-shadow .38s ease, opacity .38s ease !important;
  }
}

/* ---------- shared frosted glass across the floating chrome ----------
   One material for every interactive pill toggle and the pinned nav, matching
   the hover readouts. Placed LAST so it overrides each control's opaque base
   background (same specificity → later wins); active/selected states carry
   higher specificity and keep their own solid fills. On flat paper the frost
   is near-invisible (nothing behind to blur); it comes alive where a control
   sits over content — above all the pinned tab bar as the page scrolls under. */
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .segmented, .legend-chip, .ls-chip, .cyc-chip, .ap-chip, .ap-export {
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
  /* pinned bar goes transparent so its full-bleed backdrop can frost the page
     scrolling beneath it (an opaque bar would leave the blur nothing to see) */
  .tabs.pinned { background: transparent; }
  .tabs.pinned::before {
    background: var(--glass-bg);
    -webkit-backdrop-filter: var(--glass-blur);
    backdrop-filter: var(--glass-blur);
  }
}
