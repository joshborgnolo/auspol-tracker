   .show-score gate as .tab-score with the same timing pair, so the dial
   fading out and the score fading in are one move. Phone only: at ≥640px a
   pinned bar with the hero on screen has plenty of room for its tabs alone,
   and decorative by nature - never interactive, never in the tab order. */
.tab-glyph {
  position: absolute; right: 5px; bottom: 9px; z-index: 1;
  display: none; pointer-events: none;
  opacity: 0; transform: translateY(4px);
  transition: opacity .26s ease, transform .34s cubic-bezier(.22, 1, .36, 1);
}
@media (max-width: 640px) {
  .tab-glyph { display: block; }
  .tabs.pinned:not(.show-score) .tab-glyph { opacity: 1; transform: none; }
}
.ts-eyebrow {
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-3); margin-right: 2px;
}
.ts-party { display: inline-flex; align-items: baseline; gap: 5px; }
.ts-abbr {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-3);
}
.ts-num {
  font-family: var(--serif); font-weight: 560; font-size: 16px; line-height: 1;
  letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
}
.ts-sep { width: 1.5px; height: 13px; background: var(--line-2); align-self: center; flex: none; position: relative; top: 1px; }
/* narrow: tighten the resting tabs so everything sits comfortably */
@media (max-width: 640px) {
  .ts-eyebrow { display: none; }
  .tab-score { gap: 7px; }
  .ts-num { font-size: 15.5px; }
}
@media (max-width: 400px) {
  .ts-abbr { display: none; }
}

/* ---------- legend (primary) ---------- */
.legend { display: flex; gap: 6px; flex-wrap: wrap; }
.legend-chip {
  display: inline-flex; align-items: center; gap: 7px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 10px; cursor: pointer;
  font-family: var(--sans); transition: all .15s ease; white-space: nowrap;
}
.legend-chip:hover { border-color: var(--ink-faint); }
.legend-chip.off { opacity: 0.4; }
.legend-swatch { width: 9px; height: 9px; border-radius: 2px; }
.legend-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.legend-val { font-size: 12.5px; font-weight: 700; color: var(--ink); }
.legend-chip.off .legend-val { color: var(--ink-3); }

/* residual aggregate ("Others / Ind.") – not a party. Its swatch becomes a
   dashed rule echoing the dashed chart line, and the label is dimmed so it
   reads as a remainder rather than a fourth contender. */
.legend-chip.residual .legend-swatch {
  height: 0; border-radius: 0;
  background: transparent !important;
  border-top: 2px dashed var(--oth);
  align-self: center;
}
.legend-chip.residual .legend-name { color: var(--ink-3); font-weight: 500; }
.legend-chip.residual .legend-val { color: var(--ink-3); font-weight: 600; }

/* ---------- leadership section (shared selector + two panels) ---------- */
.leadership { display: flex; flex-direction: column; gap: 4px; }
.leadership-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px 28px; flex-wrap: wrap;
}
/* section header – a true PEER of the other top-level section titles
   (Primary vote / National direction), so it reads as the PARENT of the two
   cards below rather than a smaller sibling. */
.section-h {
  font-family: var(--serif); font-weight: 540; font-size: 22px;
  letter-spacing: -0.01em; color: var(--ink); margin: 0; line-height: 1.15;
}
body.editorial .section-h { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
.leadership-note {
  margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3);
  font-family: var(--serif); font-style: italic;
}
.leadership-note strong { font-style: normal; font-weight: 700; color: var(--ink-2); }
.leadership .two-col { margin-top: 20px; }
/* the two panel titles SETTLE DOWN a level below the section header – clearly
   subheadings, not peers of "Leadership". Out-specifies the editorial bump. */
.leadership .card-title,
body.editorial .leadership .card-title { font-size: 20px; font-weight: 560; letter-spacing: -0.012em; white-space: nowrap; }

/* Preferred PM shows two contests at once: one line each, the pair of tiles
   doing the naming and the row doing the grouping. The rule at the head of the
   row is the legend the chart has no room for - solid is the contest against
   the opposition leader, dashed the head-to-head - and the figure at the end
   is the margin, which is the only thing two contests side by side are for and
   the only thing the tiles don't say. */
/* The box the readout travels inside. Position only - it exists so a tile
   put back where it was, and a ghost left where one used to be, are placed
   against the readout rather than against the page. */
.ppm-readout { position: relative; }
/* A still copy of a tile that has no counterpart in the other question, left
   at its old spot to fade. Out of the layout and out of the way of every
   pointer, since the thing it is a picture of no longer exists. */
.ppm-ghost {
  position: absolute; pointer-events: none; opacity: 1;
  transition: opacity .32s cubic-bezier(.4, .1, .25, 1);
}
@media (prefers-reduced-motion: reduce) { .ppm-ghost { display: none; } }
.ppm-pairs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.ppm-pair { display: flex; align-items: center; gap: 12px; }
.ppm-rule { width: 16px; border-top: 2px solid var(--ink-faint); flex: none; }
.ppm-pair.dashed .ppm-rule { border-top: 2px dashed var(--ink-faint); }
/* takes the row's spare width, or its container query reads the shrunken box
   and stacks every tile's change chip under its figure */
.ppm-pair .leader-readout { margin-bottom: 0; flex: 1 1 auto; min-width: 0; }
/* the margin wears the leader's own ink, so it needs no name to say whose.

   The reserved WIDTH is what keeps the two rows in step. Each row's readout is
   its own container, sized by what this label leaves it, so a two-digit margin
   took ten pixels off one row and not the other - enough, at a 402px phone, to
   put one readout at 300.4 and the other at 289.9 either side of the handover
   below, and the two rows laid their chips out differently. A common minimum
   makes both readouts the same width, so they hand over together whatever the
   figures happen to be. 2.9em also covers "level". */
.ppm-lead {
  margin-left: auto; padding-left: 10px;
  min-width: 2.9em; text-align: right;
  font-size: clamp(13px, 4.6cqi, 15px); font-weight: 800;
  font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-3);
}
/* The two-way figures were a step smaller than the three-way's, on the grounds
   that four figures in two rows would crowd the chart. Measured, that step buys
   11px of card height - and the two-way row had MORE room to spare than the
   three-way it was deferring to, 215px against 161px, because two tiles in a
   row is a looser fit than three whatever the row count. So they match now.

   The coefficient is LARGER rather than equal, and that is the point. cqi
   measures the readout, and the two-way's readout is narrower than the
   three-way's - 260px against 343px on a phone - because the rule and the
   margin figure take their share of the row. Handing both the same 9cqi would
   still have left the two-way smaller, 25px against 30px, which is the thing
   being fixed. 11.5cqi reaches the same 30px ceiling from the narrower box.

   Sized off the readout, NOT off .ppm-pairs - which is the tempting shortcut,
   since that block is the same width as the three-way's container. The tiles
   live in the readout, so pricing them off the wider block sizes them for room
   they do not have: tried, and they wrapped at 320px. The 21px floor stays, so
   below about 350px the figures go on shrinking for the reason that is real. */
.ppm-pairs .leader-num { font-size: clamp(21px, 11.5cqi, 30px); }
/* A pair is TWO tiles where the three-way readout has three, so it keeps the
   chip beside the figure much further down than the 480px handover the wider
   readout needs – on a phone that is the difference between two rows and four.

   250, not 300: the pair inherited the three-tile threshold, and it is far too
   cautious for two. Measured with the chip forced beside the figure, the pair
   wants 213px of the 300 it has at a 402px viewport, and still fits at 320px
   with room to spare. 300 was buying nothing and costing the phone layout. */
@container (min-width: 250px) {
  .ppm-pairs .leader { display: flex; align-items: center; }
  .ppm-pairs .leader-readout .delta { grid-column: auto; grid-row: auto; margin-top: 0; }
}

/* ---------- leaders ---------- */
/* The readout carries two leaders in the two-way question and THREE in the
   three-way one, so its widest case is 50% more content in the same column.
   At fixed sizes the third leader wrapped onto its own line on a phone: three
   125px items plus two 20px gaps wanted 415px of a 343px column, and the
   figures stopped reading as one comparison.

   Everything contributing to an item's width is therefore sized off the
   READOUT'S OWN WIDTH, via cqi, rather than off the viewport. The distinction
   matters: this panel sits in a column, so at a 1280px viewport the readout is
   532px - 42% of it - and vw units would be pricing space the row does not
   have. The ceilings are the original desktop values, so nothing changes where
   there was already room.

   flex-wrap stays on as a safety net: something unforeseen should drop to a
   second line rather than overflow the card. */
.leader-readout {
  container-type: inline-size;
  display: flex; align-items: center; margin-bottom: 6px; flex-wrap: wrap;
  gap: clamp(9px, 3.8cqi, 20px);
}
.leader { display: flex; align-items: center; gap: clamp(4px, 1.7cqi, 9px); min-width: 0; }
.leader-dot {
  width: clamp(7px, 2.1cqi, 11px); height: clamp(7px, 2.1cqi, 11px);
  border-radius: 50%; flex: none;
}
/* the NAME sets the column width here, not the figure - "Albanese" at 13px is
   wider than "39%" at 30px - so it has to scale too or the rest is wasted */
.leader-name { font-size: clamp(11px, 4cqi, 13px); font-weight: 600; color: var(--ink-2); }
.leader-num {
  font-size: clamp(25px, 9cqi, 30px);
  font-weight: 800; letter-spacing: -0.02em; color: var(--ink);
}
.leader-num .pct { font-size: clamp(14px, 4.8cqi, 16px); font-weight: 700; color: var(--ink-3); margin-left: 1px; }
/* the change chip is a third of an item's width at full size; it keeps its
   place beside the figure, just proportionally smaller */
.leader-readout .delta { font-size: clamp(10px, 3.5cqi, 12px); gap: clamp(2px, 1cqi, 4px); }
.leader-readout .delta-arrow { font-size: clamp(8px, 2.6cqi, 9px); }

/* Where the row is genuinely too narrow for three items with the chip beside
   the figure, the chip drops beneath the figure it belongs to. That takes it
   out of the width calculation - an item is then as wide as its NAME - which
   is what buys room for a third leader and for a longer surname than today's
   (the opposition slot is an office, not a person).

   Grid, not flex-wrap: giving the chip flex-basis:100% did move it to its own
   line, but a flex item's max-content contribution is computed FROM its
   flex-basis, so each item then reported itself full-width and the three still
   did not fit - 103px where the content needed 63. Two auto columns size to
   their contents. */
/* 480, not 430: at a 438px container the side-by-side layout fitted with 7px
   to spare, which is not a margin, it is a coincidence. Hand over only once
   the wider layout has real room. */
@container (max-width: 480px) {
  .leader {
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    justify-content: start;
    row-gap: 0;
  }
  .leader-dot  { grid-column: 1; grid-row: 1; }
  .leader-vals { grid-column: 2; grid-row: 1; }
  .leader-readout .delta { grid-column: 2; grid-row: 2; justify-self: start; margin-top: -1px; }
}
.leader-num.muted { color: var(--ink-3); }

.approval-readout { display: flex; flex-direction: column; gap: 11px; margin-bottom: 12px; }
.appr-top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
.appr-top .leader-name { font-size: 13.5px; }
.net { margin-left: auto; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums;
  /* Approval and favourability are the same three people answering a
     different question, so the toggle is a rearrangement and the figure rolls
     to its new value. The COLOUR was the one part still swapping: Hanson is -6
     on one and 0 on the other, and the red became green in a single frame
     while her digits were still turning. Same curve and duration as the reel,
     so the number and its verdict arrive together. */
  transition: color .32s cubic-bezier(.4, .1, .25, 1); }
.net.pos { color: var(--grn-text); }
.net.neg { color: var(--alp-text); }
/* favourability marker – flags nets that are positive−negative, a different
   question from approval and not directly comparable */
.fav-mark {
  font-size: 8px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase;
  color: var(--ink-3); vertical-align: super; margin-left: 3px; cursor: help;
}
/* change indicator vs the pollster's previous poll – neutral ink, direction by
   the ▲/▼ glyph (no good/bad colour). Sits quietly after the figure. */
.chg {
  margin-left: 5px; font-size: 10.5px; font-weight: 700; color: var(--ink-3);
  font-variant-numeric: tabular-nums; white-space: nowrap; cursor: help;
  letter-spacing: -0.01em;
}
.chg.flat { color: var(--ink-3); opacity: 0.7; }

/* diverging net bar – the live source publishes nets only (no approve /
   disapprove split), so the snapshot readout shows net vs the "even" midline */
.appr-netbar { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.anb-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--ink-faint); opacity: 0.6; }
/* Reshapes rather than redraws, on the shared curve at the shared duration -
   the same move the chart lines make when the question changes. Width only:
   a bar that crosses zero swaps which side of the midline it hangs from, and
   at that moment it has no width to see the swap happen in. */
.anb-fill { position: absolute; top: 0; bottom: 0; border-radius: 4px;
  transition: width .32s cubic-bezier(.4, .1, .25, 1); }
/* Side and colour belong to the ELEMENT, not to the reading: a bar that had to
   change both mid-transition showed the wrong colour on the wrong side of the
   midline for as long as the contraction lasted. */
.anb-pos { left: 50%; background: var(--mood-pos); }
.anb-neg { right: 50%; background: var(--mood-neg); }
@media (prefers-reduced-motion: reduce) { .anb-fill { transition: none; } }

/* a reading older than the latest month carries a quiet month tag */
.stale-tag { color: var(--ink-3); font-weight: 500; font-size: 0.85em; }

/* archive leadership cells – net figure with a micro approve / don't-know /
   disapprove split beneath, same coding as the snapshot approval bars but at
   table scale (solid chips; the pale tints vanish at this height) */
.arch-appr { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.arch-appr-bar {
  display: flex; height: 4px; width: 52px; border-radius: 2px; overflow: hidden;
  background: var(--surface-2);
}
.arch-appr-app { background: oklch(0.62 0.10 150 / 0.85); }
.arch-appr-dk  { background: transparent; }
.arch-appr-dis { background: oklch(0.60 0.13 28 / 0.75); }
/* national direction reuses the approval bar's geometry, but takes the mood
   tokens so it reads as the same measure as the panel above the table */
.arch-dir-right { background: var(--mood-pos); opacity: 0.85; }
.arch-dir-wrong { background: var(--mood-neg); opacity: 0.85; }

/* ---------- national direction ---------- */
.dir-net { display: flex; align-items: center; gap: 9px; }
.dir-net-label { font-size: 11px; color: var(--ink-3); font-weight: 700; }
.dir-net-val { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.dir-net-val.pos { color: var(--mood-pos); }
.dir-net-val.neg { color: var(--mood-neg); }
.dir-readout { display: flex; align-items: flex-end; gap: 16px; margin: 4px 0 14px; }
.dir-side { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.dir-side.ta-r { text-align: right; margin-left: auto; }
/* labels never wrap onto their own value, and the bar yields width instead –
   keeps the right/wrong readout collision-proof at every width */
.dir-k { font-size: 13px; font-weight: 700; white-space: nowrap; }
.dir-v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.dir-v .pct { font-size: 15px; font-weight: 700; color: var(--ink-3); margin-left: 1px; }
.dir-bar { flex: 1; min-width: 60px; display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); align-self: center; }
.dir-pos { background: var(--mood-pos); }
.dir-neg { background: var(--mood-neg); }
.dir-uns { background: transparent; }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
.poll-table { width: 100%; border-collapse: collapse; font-size: 16px; }
.poll-table th {
  text-align: center; font-weight: 600; font-size: 13px;
  color: var(--ink-3); padding: 0 12px 10px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
  /* the same 13px semibold ink-3 label as .meta-k: track them alike */
  letter-spacing: 0.02em;
}
.poll-table th.ta-l, .poll-table td.ta-l { text-align: left; }
.poll-table td { padding: 13px 12px; border-bottom: 1px solid var(--line-2); text-align: center; }
.poll-table tr:last-child td { border-bottom: 0; }
.poll-table tbody tr:hover { background: var(--surface-2); }
.pollster-cell { line-height: 1.25; }
.pollster-name { display: block; font-weight: 700; color: var(--ink); font-size: 16px; }

/* A linked pollster name reads as the name first and a link second: no blue,
   no permanent underline. The ↗ is the standing signal that it leaves the
   page; the underline arrives on hover/focus. fit-content pins the hit lane
   to the text - a block anchor otherwise spans the cell's full width and
   swallows taps meant for the row's expand toggle. */
a.pollster-link { text-decoration: none; cursor: pointer; width: fit-content; }
a.pollster-link:hover, a.pollster-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.pollster-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
.plink-mark {
  /* the only standing cue that the name is a link, so it has to clear the
     text-contrast bar rather than sit in the decorative faint tier */
  font-size: 9px; font-weight: 700; margin-left: 3px; vertical-align: 1.5px;
  color: var(--ink-3); transition: color .15s ease;
}
a.pollster-link:hover .plink-mark, a.pollster-link:focus-visible .plink-mark { color: var(--ink-2); }

/* data-content tags: at-a-glance chips showing what a poll measures. Kept
   neutral monochrome on purpose – the party palette (red/blue/orange) is
   reserved for parties, so it must not leak onto data-type labels. They read
   as type by their TEXT, and light up solid ink only when their filter is on */
.poll-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.ptag {
  font-family: var(--sans); font-size: 9px; font-weight: 800; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 1px 4px; border-radius: 3px; line-height: 1.5;
  background: var(--surface-2); color: var(--ink-3); white-space: nowrap;
  border: 1px solid var(--line-2);
  transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.ptag.hit { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.pollster-mode { display: block; margin-top: 1px; font-size: 12px; color: var(--ink-3); }
/* the wave's APC methodology-statement link (YouGov/Newspoll rows only) –
   a quiet sub-line under the pollster name, same "name first, link second"
   treatment as a.pollster-link, and the same fit-content hit lane so the
   empty right half of the cell stays row-toggle, not link */
.pollster-method { display: block; width: fit-content; margin-top: 1px; font-size: 11px; color: var(--ink-3); text-decoration: none; cursor: pointer; }
a.pollster-method:hover, a.pollster-method:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.pollster-method:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
a.pollster-method:hover .plink-mark, a.pollster-method:focus-visible .plink-mark { color: var(--ink-2); }
.released-pill {
  display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 2px 9px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* a fallback date: the last day of fieldwork standing in for a publication
   date nobody recorded. Dashed, so the column doesn't pass it off as the
   thing its heading promises. */
.released-pill.est { font-weight: 600; color: var(--ink-3); border-style: dashed; background: none; }
.poll-table .muted { color: var(--ink-3); }
.poll-table .num { font-weight: 600; font-variant-numeric: tabular-nums; }

/* sortable headers */
.poll-table th.sortable { cursor: pointer; user-select: none; transition: color .15s ease; }
.poll-table th.sortable:hover { color: var(--ink-2); }
.poll-table th.sorted { color: var(--ink); }
.th-in { display: inline-flex; align-items: center; gap: 5px; }
.poll-table th.ta-l .th-in { justify-content: flex-start; }
.caret { font-size: 9px; line-height: 1; opacity: .9; }
.poll-table th.sortable:not(.sorted) .caret { opacity: 0; transition: opacity .15s ease; }
.poll-table th.sortable:hover .caret { opacity: .45; }

/* expand affordance + clickable rows */
.exp-col { width: 30px; padding-left: 4px !important; padding-right: 0 !important; }
.poll-row { cursor: pointer; }
.exp-btn {
  border: 0; background: transparent; cursor: pointer; color: var(--ink-3);
  font-size: 12px; line-height: 1; padding: 4px; border-radius: 5px;
  transition: transform .18s ease, color .15s ease;
  position: relative;
}
.exp-btn::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 44px; height: 44px; transform: translate(-50%, -50%);
}
.poll-row:hover .exp-btn { color: var(--ink-2); }
.exp-btn.open { transform: rotate(90deg); color: var(--ink); }
.poll-row.open { background: var(--surface-2); }

/* share column – arity-agnostic bar + keys */
.share-col { min-width: 210px; }
.poll-table td.share-col { vertical-align: middle; }
.share { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.sbar {
  display: flex; height: 8px; border-radius: 5px; overflow: hidden;
  background: var(--line-2); gap: 1.5px;
}
.sbar-seg { min-width: 2px; }
.share-keys {
  display: flex; flex-wrap: wrap; gap: 4px 11px;
  font-size: 11.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.skey { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.skey.muted { color: var(--ink-3); }
.skey-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.skey-lab { color: inherit; }
.skey-val { font-weight: 700; color: var(--ink); }
.skey.muted .skey-val { color: var(--ink-3); }
.share-compact .share-keys { font-size: 12.5px; gap: 4px 10px; }

.facet-flag {
  display: inline-block; font-size: 9.5px; font-weight: 700;
  color: var(--ink-3);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  white-space: nowrap;
}

/* net / direction value */
.netv { font-weight: 800; font-variant-numeric: tabular-nums; }
.netv.pos { color: var(--mood-pos); }
.netv.neg { color: var(--mood-neg); }
.dash { color: var(--ink-3); font-weight: 600; }

/* expanded per-poll breakdown */
.detail-row > td { padding: 0 !important; border-bottom: 1px solid var(--line-2); }
/* the way back to the chart the reader came from */
/* Sits at the end of the detail's own meta line - so it needs no space of its
   own, lands inside the panel's tint rather than on a pale band above it, and
   aligns with the panel's content instead of with the table cell behind it. */
/* ---- Info: the glossary --------------------------------------------------
   One paragraph per term, the term bolded and its definition running straight
   on from it. A printed glossary's shape rather than a table's, because these
   are sentences and not fields - and a measure narrower than the page, because
   they are read rather than scanned. */
.info { max-width: 66ch; }
.info-term { margin: 0 0 20px; font-size: 15px; line-height: 1.62;
  color: var(--ink-2); text-wrap: pretty; }
.info-t { color: var(--ink); font-weight: 700; }
/* The entry a link landed on, marked so the reader can see WHICH one answered
   them - the scroll puts it mid-screen, where nothing else says "this one". */
.info-term.lit {
  border-left: 2px solid var(--accent);
  padding-left: 15px; margin-left: -17px;
}
/* the way back rides the end of the sentence it belongs to, not a band above */
.info-back { margin-left: 10px; vertical-align: baseline; }
/* the preference-flows history chart, embedded mid-entry in its definition */
.info-chart { display: block; margin: 12px 0 10px; }
.info-chart svg { width: 100%; height: auto; display: block; }
.info-chart .fc-grid { stroke: var(--line-2); stroke-width: 1; }
.info-chart .fc-unit, .info-chart .fc-tick { font-size: 9.5px; fill: var(--ink-2); }
.info-chart .fc-end { font-size: 10.5px; font-weight: 700; }

.back-to-chart {
  display: inline-flex; align-items: center; gap: 6px;
  align-self: center; flex: none;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 13px 5px 10px; font-family: var(--sans); font-size: 12px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.back-to-chart:hover { color: var(--ink); border-color: var(--ink-3); background: color-mix(in oklch, var(--ink) 7%, var(--surface)); }
/* Both controls in the line are the same kind of thing - a way out of the row
   - so they read as a pair, docked together at the band's right edge. */
.pd-report svg { opacity: 0.75; }
/* but the report button is not a peer of the way back - it exists for the
   reader who already doubts a figure, not as a call to action - so it wears
   the pill shape at a lower voice */
.pd-report { font-size: 11.5px; font-weight: 500; color: var(--ink-3); padding: 4px 11px 4px 9px; }
.pd-report:hover { color: var(--ink); }
/* the meta line carries text and now a control, so centre what sits in it */
.pd-meta { align-items: center; }
/* The band's split: the metadata occupies the left region and wraps on
   itself; the controls are docked to the band's top-right corner - report at
   the right edge, the way back where it is present beside it - and they stay
   on the first line, beside published and sample, however many lines the
   metadata runs to. Chained on .pd-meta because the base .pd-meta block sits
   LATER in this sheet and would otherwise retake flex-wrap: wrap - at 500px
   the items region fills the row and the controls drop to the band's bottom
   left. (The Latest-polls band keeps the plain wrapping-inline rule: no
   controls ever ride in it.) */
.pd-meta.pd-meta-split { flex-wrap: nowrap; align-items: flex-start; }
.pd-meta-split .pd-meta-items {
  display: flex; flex-wrap: wrap; gap: 6px 26px;
  flex: 1 1 auto; min-width: 0;
}
.pd-meta-tail {
  display: inline-flex; align-items: center; gap: 10px;
  flex-wrap: nowrap; min-width: 0;
  flex: 0 0 auto;
}
/* Below this the label will not fit beside the figures it sits with - the
   archive's own band runs 742px of items at 796px wide, and the labelled
   button needs 133 more - so it drops to the icon, which fits. Measured on
   the widest meta line the archive produces (published, sample, poll lean,
   house effect); a poll with fewer items would have fitted the label a little
   narrower, and shows the icon slightly sooner than it strictly must. */
@container pdmeta (max-width: 900px) {
  .pd-report .pd-report-lbl { display: none; }
  .pd-report { padding: 4px 9px; gap: 0; }
}
/* a poll arrived at from a chart gets one quiet pulse, so the eye finds it
   after the scroll instead of hunting the row that just opened */
@media (prefers-reduced-motion: no-preference) {
  .arch-row.arrived > td { animation: arrived-flash 1.4s ease-out both; }
  @keyframes arrived-flash {
    from { background: color-mix(in oklch, var(--accent) 22%, transparent); }
    to   { background: transparent; }
  }
}
.detail-row:hover { background: transparent !important; }
.poll-detail { padding: 6px 14px 20px 42px; background: var(--surface-2); text-align: left; }
/* the meta line is part of the one detail container, not a band of its own:
   no dividing rule, and the gap to the first ledger section is the ledger's
   own rhythm rather than a header's clearance */
.pd-meta {
  container-type: inline-size; container-name: pdmeta;
  display: flex; flex-wrap: wrap; gap: 6px 26px; padding: 4px 0 0;
  margin-bottom: 13px;
  font-size: 12.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.pd-meta-i { white-space: nowrap; }
.pd-meta-k {
  font-size: 10.5px;
  color: var(--ink-3); font-weight: 700; margin-right: 5px;
}
/* the meta band is the expansion's fact line: fieldwork, published, sample
   and effective sample print at every width in both tables – fieldwork and
   sample repeat their row columns so the open panel stands alone, and what
   no column ever prints (the archive's client, the published DATE) rides
   the same line untagged */

/* ---------- the breakdown: plain headed text lines ----------
   Everything a poll published, set as running text: a small-kicker heading,
   then one wrap-anywhere line per measure with its figures bold. No grid,
   no figures-only colour code – the lines read like sentences. */
.pd-simple { display: flex; flex-direction: column; gap: 13px; }
.pd-simple .pd-k { margin-bottom: 3px; }
.pd-s {
  margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-2);
  font-variant-numeric: tabular-nums; text-wrap: pretty;
}
.pd-s b { font-weight: 700; color: var(--ink); }
/* the expanded view's numbers are the poll's data: set them in Archivo
   (figures in summary lines, signed nets, moves, seat estimates) */
.poll-detail b, .poll-detail .netv, .poll-detail .chg, .poll-detail .seat-est {
  font-family: var(--figures, var(--sans));
}
.poll-detail .chg { font-size: 11px; }
.pd-s-chg .chg { margin-left: 1px; }
.pd-s-note { color: var(--ink-3); }
/* no colour of its own -> UA link blue, illegible on the dark paper; the
   house treatment is text first, link second (cf. a.pollster-link/a.tn-link) */
a.pd-release { color: inherit; text-decoration: none; cursor: pointer; }
a.pd-release:hover, a.pd-release:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.pd-release:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
a.pd-release:hover .plink-mark, a.pd-release:focus-visible .plink-mark { color: var(--ink-2); }
/* the residual – undecided, don't know, unsure. ONE treatment everywhere, and
   never the bar's own track colour: it used to be var(--line-2), which is
   exactly .sbar's background, so nineteen points of a preferred-PM bar were
   data drawn as empty track. */
.sbar-resid, .skey-dot.resid {
  background: repeating-linear-gradient(135deg, var(--line) 0 2px, var(--surface) 2px 5px);
}
.skey-dot.resid { border-radius: 2px; }

/* ---------- Seat projection (MRP polls) ----------
   Seats as figures: one row per party, the majority line said in words, and
   the basis of the estimate as a footnote. No chamber bar. */
.seatproj { display: flex; flex-direction: column; gap: 8px; }
.seat-majline {
  display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap;
  font-size: 11.5px; color: var(--ink-3);
}
.seat-majlab { font-weight: 600; }
.seat-hung { color: var(--ink-2); font-weight: 600; }
.seat-rows { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 2px; }
.seat-row { display: inline-flex; align-items: baseline; gap: 7px; font-variant-numeric: tabular-nums; }
.seat-name { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.seat-est { font-size: 15px; font-weight: 800; color: var(--ink); }
.seat-range { font-size: 11.5px; color: var(--ink-3); }
/* seat change is vs the last ELECTION, so it takes neutral ink like every
   other change indicator – no good/bad colour in a party-neutral tracker */
.seat-chg { font-size: 11.5px; font-weight: 700; color: var(--ink-3); }
.seat-chg.flat { color: var(--ink-3); font-weight: 600; }
/* a projection published as a range only: the figure column carries the range
   itself, and a party can note what it is made of */
.seat-est.range { font-variant-numeric: tabular-nums; white-space: nowrap; }
.seat-note { font-size: 11px; color: var(--ink-3); }
.seat-basis { margin: 2px 0 0; font-size: 11px; color: var(--ink-3); text-wrap: pretty; }
@media (max-width: 700px) {
  .seat-rows { gap: 6px 16px; }
  .seat-est { font-size: 14px; }
}
.pd-k {
  font-size: 11px; font-weight: 700;
  color: var(--ink-3);
}
/* undecided: one readout per question, because the panel carries two of them
   and they must not read as one measure with two sources */
.und-reads { display: grid; gap: 10px 26px; margin: 2px 2px 14px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.und-read { display: flex; gap: 9px; align-items: flex-start; }
.und-swatch { width: 18px; height: 3px; border-radius: 2px; background: var(--ink-2);
  margin-top: 8px; flex: none; }
.und-swatch.dashed { background: repeating-linear-gradient(to right,
  var(--ink-2) 0 5px, transparent 5px 9px); }
.und-swatch.dotted { background: repeating-linear-gradient(to right,
  var(--ink-2) 0 2px, transparent 2px 7px); }
.und-read-body { min-width: 0; }
.und-read-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.und-read-lab { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.und-read-v { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--ink); }
.und-read-note { margin: 1px 0 0; font-size: 11.5px; color: var(--ink-3); }

.pd-absent { font-family: var(--serif); font-style: italic; color: var(--ink-3); font-size: 13.5px; }
/* inside the breakdown an absent section reads as just another plain line –
   the serif italic is for empty states elsewhere (eg National direction) */
.pd-sec .pd-absent { font-family: inherit; font-style: normal; font-size: 13px; margin: 0; }
/* a fieldwork end standing in for a publication date nobody recorded, marked
   the dashed way the Latest-polls pill marks the same substitution */
.pd-est { border-bottom: 1px dashed var(--line-2); color: var(--ink-3); }
.table-hint { margin: 12px 2px 0; font-size: 12px; color: var(--ink-3); }

/* ---------- how the final polls did (past cycles) ---------- */
/* A row per election on one shared scale, so eleven elections' worth of error can
   be compared by eye. The track is centred on the RESULT, not on zero polling
   error, because the result is the thing every dot is being measured against. */
/* The row's geometry, defined once. The scale is only a scale while its
   centre label sits over the line every dot is measured from, and that held
   for the left edge (a hardcoded 108px = label + gap) but never the right:
   nothing subtracted the error and house columns, so "result" sat 76px right
   of the line it names. Deriving both edges from the same four numbers is
   what stops that drifting apart again the next time a column is resized. */
.acc-card { margin-top: 22px;
  --acc-gap: 8px; --acc-lab: 100px; --acc-err: 52px; --acc-note: 86px; }
.acc-scale { display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline;
  margin: 4px 0 2px; font-size: 11px; font-weight: 600;
  padding-left: calc(var(--acc-lab) + var(--acc-gap));
  padding-right: calc(var(--acc-err) + var(--acc-note) + var(--acc-gap) * 2);
  color: var(--ink-3); }
.acc-scale-c { text-align: center; }
.acc-scale-r { text-align: right; }
.acc-rows { display: flex; flex-direction: column; gap: 2px; }
.acc-row { display: grid; align-items: center;
  grid-template-columns: var(--acc-lab) 1fr var(--acc-err) var(--acc-note);
  gap: var(--acc-gap); padding: 7px 0; border-top: 1px solid var(--line); }
.acc-label { display: flex; flex-direction: column; }
.acc-year { font-family: var(--serif); font-size: 19px; font-weight: 600; color: var(--ink); }
.acc-detail { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.acc-track { position: relative; height: 26px; }
.acc-zero { position: absolute; left: 50%; top: 0; bottom: 0; width: 1.5px;
  background: var(--ink-3); opacity: 0.55; }
.acc-tick { position: absolute; top: 6px; bottom: 6px; width: 1px; background: var(--line-2); }
.acc-dot, .acc-mean { position: absolute; top: 50%; border-radius: 50%;
  transition: transform .12s ease, opacity .12s ease, top .18s ease; }
.acc-dot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; opacity: 0.5; }
/* The control that steps colliding dots into lanes. A dot's place on the
   SCALE never changes - only which lane it sits in - so the row can be read
   against the others exactly as before. */
/* The -4px here used to pull the button down onto the scale row, so it read
   as attached to the chart rather than sitting above it. */
.acc-tools { display: flex; justify-content: flex-end; margin: 12px 0 18px; }
.acc-spread {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px 5px 9px; font-family: var(--sans); font-size: 11.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap;
  /* named rather than shorthand: the shared control rule sets
     transition-property earlier in the file, and a `transition:` here would
     win and drop box-shadow and transform back out of it */
  transition-property: color, border-color, background-color, box-shadow, transform;
  transition-duration: .19s; transition-timing-function: ease;
}
.acc-spread:hover { color: var(--ink); border-color: var(--ink-3); }
button.acc-spread[aria-pressed="true"] {
  color: var(--ink); border-color: var(--ink-3); border-bottom-color: var(--ink-3);
  background: color-mix(in oklch, var(--ink) 7%, var(--surface));
}
.acc-spread svg { opacity: 0.75; }
.acc-track { transition: height .18s ease; }
/* separated dots are the ones being aimed at, so they come up in weight and
   size - a 9px dot at half opacity is not a target */
.acc-spread-on .acc-dot { width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; opacity: 0.75; }
@media (prefers-reduced-motion: reduce) {
  .acc-dot, .acc-mean, .acc-track { transition: none; }
}
.acc-mean { width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
  box-shadow: 0 0 0 2.5px var(--surface); }
/* A 9px dot is a hard thing to keep a pointer on, and the whole readout hangs
   off doing so, so each dot claims a 24px target it does not draw. */
.acc-dot::before, .acc-mean::before {
  content: ""; position: absolute; left: 50%; top: 50%;
  width: 24px; height: 24px; transform: translate(-50%, -50%);
}
/* the dot answers the pointer before the panel does – on a row of overlapping
   dots, growing is the only cue saying WHICH one the readout is about */
.acc-dot:hover { opacity: 1; transform: scale(1.45); z-index: 3; }
.acc-mean:hover { transform: scale(1.15); z-index: 3; }
/* the chart's readout, seated on the track instead of the plot. It is the same
   .tip panel, so it inherits the frosted glass and the fade; only the width
   (fixed, so the JS can clamp against a known number) and the seat differ. */
.tip.acc-tip {
  width: 184px; max-width: 100%; min-width: 0; top: 50%;
  transform: translate(-50%, calc(-100% - 13px));
}
/* the top row has nothing above it inside the card, so its readout drops */
.tip.acc-tip-below { transform: translate(-50%, 13px); }
.acc-tip .tip-date { margin: -2px 0 5px; }
.acc-tip .tip-sub { margin-top: 6px; padding-top: 5px; border-top: 1px solid var(--line); }
.acc-err { font-family: var(--serif); font-size: 19px; font-weight: 600; text-align: right;
  font-variant-numeric: tabular-nums; }
.acc-note { font-size: 11px; color: var(--ink-3); display: flex; gap: 6px; align-items: baseline;
  justify-content: flex-end; flex-wrap: wrap; }
.acc-flag { font-weight: 700; font-size: 9.5px;
  color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 1px 4px; }
.acc-firms { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.acc-firms-h { font-size: 11px; font-weight: 700;
  color: var(--ink-3); margin-bottom: 8px; }
.acc-firms-grid { display: grid; gap: 8px 18px;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.acc-firm { display: flex; flex-direction: column; gap: 1px; }
.acc-firm-n { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.acc-firm-v { font-family: var(--serif); font-size: 17px; color: var(--ink);
  font-variant-numeric: tabular-nums; }
.acc-firm-c { font-size: 11px; color: var(--ink-3); }
@media (max-width: 720px) {
  /* deliberately NOT aligned here: the three labels do not fit between the
     insets at this width, so the scale reads as a legend instead */
  .acc-scale { padding-left: 0; padding-right: 0; }
  .acc-row { grid-template-columns: 74px 1fr 46px; }
  .acc-note { grid-column: 2 / -1; justify-content: flex-start; }
}

@media (max-width: 720px) {
  .poll-detail { padding-left: 20px; }
}

/* ---------- method footer ---------- */
.method { margin-top: 6px; padding-top: 24px; border-top: 1px solid var(--line); }
.method-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.method-h { font-family: var(--serif); font-weight: 540; font-size: 16px; margin: 0 0 7px; color: var(--ink); }
.method p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
.method a { color: var(--ink-2); }
.disclaimer {
  margin-top: 22px; padding: 11px 14px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; color: var(--ink-3); text-align: center;
}

/* ---------- report an error ----------
   The page is static – GitHub Pages serves files and cannot process a POST –
   so the form hands the submission to Formspree and only has to send the
   request.

   Built out of the page's own parts rather than a form's: a rule, tracked
   caps, chips, and fields carrying one hairline underneath instead of a box
   on four sides. A boxed input was the only shape in the document that
   belonged to a form rather than to a page of type, and four of them stacked
   under the method notes turned the quietest part of the page into the
   busiest. Collapsed to a sentence until it is wanted, for the same reason:
   the footer's job is to explain the method, not to solicit. */
.fb { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line-2); }
.fb-lede { margin: 0; max-width: 62ch; font-size: 13px; line-height: 1.65; color: var(--ink-3); }
/* The trigger sits INSIDE the sentence rather than beside it: the offer and
   the way to take it up are one thought, and a pill parked at the end of the
   paragraph read as a second one competing with it. */
.fb-link {
  border: 0; border-bottom: 1px solid var(--ink-faint); background: none;
  padding: 0; font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
  transition: border-color .15s ease;
}
.fb-link:hover { border-bottom-color: var(--ink); }

.fb-form { margin: 20px 0 0; max-width: 540px; display: grid; gap: 19px; }
.fb-form, .fb-thanks { animation: fb-in .22s ease both; }
@keyframes fb-in { from { opacity: 0; transform: translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { .fb-form, .fb-thanks { animation: none; } }

.fb-row { display: grid; gap: 8px; }
.fb-label {
  font-size: 11px; font-weight: 600; color: var(--ink-3);
}
/* the parenthetical half of a label is prose, not a heading */
.fb-label span { font-weight: 400; }

.fb-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.fb-chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 5px 12px; cursor: pointer; white-space: nowrap;
  font-family: var(--sans); font-size: 12.5px; font-weight: 500; color: var(--ink-3);
  transition: color .15s ease, border-color .15s ease;
}
.fb-chip:hover { color: var(--ink-2); border-color: var(--ink-faint); }
.fb-chip.active { color: var(--ink); border-color: var(--ink); font-weight: 600; }

.fb-form input, .fb-form textarea {
  width: 100%; font-family: var(--sans); font-size: 14px; line-height: 1.55;
  color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
  padding: 5px 1px; transition: border-color .15s ease;
}
/* No min-height and no drag handle: the box is sized from its own content by
   fbAutosize, so it opens as one line - the same height as the email field
   under it - and grows a line at a time. The cap is about seven lines, past
   which it scrolls instead of pushing the send button off the screen. */
.fb-form textarea { min-height: 0; max-height: 164px; resize: none; overflow-y: hidden; }
.fb-form input::placeholder, .fb-form textarea::placeholder { color: var(--ink-3); opacity: 0.72; }
.fb-form input:focus, .fb-form textarea:focus { outline: none; border-bottom-color: var(--accent); }
/* The theme here is a manual toggle and can disagree with the OS, so pin the
   native furniture (caret, selection, autofill) to the page's own theme
   rather than letting it follow prefers-color-scheme into the wrong one. */
.fb-form { color-scheme: light; }
body.dark .fb-form { color-scheme: dark; }
/* Formspree discards anything arriving with _gotcha filled – a field no human
   sees and every naive bot completes. Off-screen rather than display:none,
   which the same bots know to skip. */
.fb-gotcha { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.fb-actions { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
.fb-send {
  border: 1px solid var(--ink); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 7px 18px; cursor: pointer; white-space: nowrap;
  font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  transition: background-color .15s ease, color .15s ease, opacity .15s ease;
}
.fb-send:hover { background: var(--ink); color: var(--bg); }
.fb-send[disabled] { opacity: 0.45; cursor: default; background: transparent; color: var(--ink); }
.fb-note { margin: 0; flex: 1 1 210px; font-size: 12px; line-height: 1.5; color: var(--ink-3); }
.fb-note.is-error { color: var(--mood-neg); }
.fb-thanks { margin: 20px 0 0; max-width: 540px; font-size: 13px; line-height: 1.65; color: var(--ink-2); }

@media (max-width: 560px) { .fb-form, .fb-thanks { max-width: none; } }

/* ---------- responsive ---------- */
/* The leadership pair carries a scatter cloud in each panel now, and ~120 dots
   in a 250px-tall chart need width to stay legible. Side by side is worth
   keeping – comparing a leader's preferred-PM standing with their net approval
   is the point – but only on a screen genuinely wide enough for two of them. */
@media (max-width: 1200px) {
  .two-col { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .method-grid { grid-template-columns: 1fr; }
  .head-meta { gap: 12px; }
  .ro-num { font-size: 52px; }
  /* Never one row of six small targets: at this width the toggles' home is
     the chartbar row above the chart (laptop arrangement) or still the
     strip, and either way real touch padding is the point - this is exactly
     the control a one-handed thumb comes to. */
  .hero-controls { align-items: flex-start; }
  /* …but the chartbar stacked pair stays over on the right, and so does the
     Switch-2PP pill strip, now ordered last in the column */
  .hero-controls .hero-chartbar, .hero-controls .hero-alt { align-self: flex-end; }
  .hero-controls .tt-opt, .hero-chartbar .tt-opt { padding: 11px 4px; }
  .hero-controls .tt-div, .hero-chartbar .tt-div { height: 16px; }
}
@media (max-width: 560px) {
  .page { padding: 20px 16px 48px; }
  /* tagline now carries the election context, so drop the whole meta block
     (incl. the Next election anchor) on small screens */
  .head-meta { display: none; }
  /* the tagline keeps its forced break on phone: with the meta gone it wraps
     right after "next", and the desktop break after "Australian" is the
     nicer clause split */
  /* …and surface a single compact freshness line in its place */
  .head-meta-compact {
    display: flex; align-items: center; gap: 8px;
    margin: 9px 0 0; font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .head-meta-compact .fresh-dot { margin-right: 0; width: 6px; height: 6px; top: 0; }
  /* stack header; pin the theme toggle to the top-right corner so it never
     wraps down beside the meta on narrow screens */
  .site-head { flex-direction: column; align-items: flex-start; gap: 13px; }
  /* reserve toggle space on the wordmark row only – not the brand wrapper –
     so the tagline below the (top-pinned) toggle can use the full width */
  .brand { padding-right: 0; }
  .wordmark { padding-right: 92px; }
  /* head-right's own box leaves the flow (meta is hidden, the toggle is
     absolutely pinned) so it can't add phantom column-gap above the rule */
  .head-right { display: contents; }
  .theme-seg { position: absolute; top: 0; right: 0; }
  /* The desktop pair is heraldic: it mirrors around the rule, so Labor reads
     outward to the left and the Coalition outward to the right. What a phone
     cannot take is the STACK - "Labor 52.0" over "48.0 Coalition" put the two
     figures 76px apart on different baselines, and the mirror stopped meaning
     anything the moment its axis lay down: a face-off needs the rule upright.

     So the pair does not stack. It keeps the desktop arrangement and just
     unstacks the columns: each side turns its own figure and label into two
     rows, the rule stays vertical between them, and the figures sit either
     side of it on ONE baseline. The sides still face each other - Labor's
     dot outward left, the Coalition's outward right - so this is the same
     design the desktop is, at a smaller size, rather than a second one.

     It is also about 28px shorter than the stack it replaces, which on this
     screen goes straight to the chart below. */
  /* 20px, not 14: the ink-to-ink gap between the two figures is set by these
     two gaps plus the rule, and it does NOT scale with the type. At 48px a
     30px channel was comfortable; at 54 the figures crowded the rule and it
     stopped reading as an axis with room around it. 20 puts the channel back
     to 42px, which is the same breathing space at the larger size. */
  .hero-readout { display: flex; align-items: center; gap: 20px; }
  /* each side becomes its own two-row column: the figure claims a full row
     (order pulls Labor's out in front of its dot - the Coalition's already
     leads, being the mirrored one), the dot and name flow onto the next */
  .ro-party { display: flex; flex-wrap: wrap; align-items: center;
              gap: 5px 8px; flex: 1 1 0; min-width: 0; }
  .alp-side { justify-content: flex-end; }
  .lnp-side { justify-content: flex-start; }
  /* 54, eased down from the 58 this block first took: the phone pair read a
     touch large next to the chart. At ~90px of ink inside a 164px column the
     42px channel the 20px gaps set still has room around the rule, so the
     axis look survives the trim. Scoped HERE rather than at the 900px rule,
     which also covers 560-900 where the desktop mirror is the layout and
     this change would not be the same one. */
  .ro-num { order: -1; flex: 0 0 100%; font-size: 54px; }
  /* .roll is an inline-flex, so the figure is positioned by justify-content
     inside its own box - text-align has nothing to act on */
  .alp-side .ro-num { justify-content: flex-end; }
  .lnp-side .ro-num { justify-content: flex-start; }
  /* the rule stays what it is on the desktop - an upright axis, not a divider
     - and grows to the height of the pair it stands between */
  .ro-sep { width: 2px; height: auto; align-self: stretch;
            min-height: 66px; margin: 0; }
  .ro-name { font-size: 16px; }

  /* Four full-width control rows used to stand between the headline and the
     chart, which put the chart under the fold on a 390x844 screen - the reader
     scrolls past every control before seeing the thing they came for. The two
     chip groups are small enough to share a line, so they do. */
  .hero-controls { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  /* the laptop row above the chart trades places with the strip copies:
     this home shows on the phone, that one on the laptop, never both */
  .hero-chartbar { display: none; }
  .hero-controls > .text-toggle { display: inline-flex; }
  /* phone carries the matchup only as the Switch-2PP pill, so it leads the
     control row and the range window follows: the laptop order that sinks
     it to the column foot is outranked here, and with it the laptop
     margin-top:auto (in a wrap row an auto top margin would shove the
     pill to a line of its own instead of leading the chips). The
     right-alignment the ≤900px block lends it hands back to the wrap
     row's centring */
  .hero-controls .hero-alt { order: -1; align-self: center; margin-top: 0; }
  /* …and the same fold pressure halves the wrap gap between the headline
     stack and that control strip: the desktop 24px is one row-gap among
     similar ones; on a phone it was the biggest void on the wire to the
     chart */
  .hero-top { row-gap: 12px; }
  .text-toggle { gap: 9px; }
  .tt-opt { font-size: 13px; }
  .tt-dots { margin-right: 5px; }
  /* The "Switch 2PP" pill is the only matchup switcher on every width,
     phone included: it names the alternative AND carries its figure, so a
     bare matchup toggle heading the strip would only duplicate it. The
     strip's one TextToggle is the range window. */
  /* …and the Compare-implied switch leaves the strip too. On the phone it
     belongs with the chart it annotates, so its second copy (.pg-phone)
     shows just under the legend - directly below the "95% interval" entries
     it explains - instead of riding the chip line. The .hero ancestor is
     load-bearing: the base .pg-check.pg-phone{display:none} sits later in
     the file at equal specificity, so this rule must be one class stronger
     to win */
  .hero-controls .pg-check { display: none; }
  .hero .pg-check.pg-phone { display: inline-flex; margin-top: 14px; }
}

/* ============================================================
   EDITORIAL MODE – broadsheet / ruled layout
   Drops card chrome; separates sections with hairline rules and
   stronger serif headings. Charts breathe edge-to-edge on paper.
   ============================================================ */
/* The page colour. Editorial and cool are both element+class, so this wins on
   source order over body.cool's own --bg - which is why one value here sets
   the light page for warm AND cool paper. */
body.editorial { --bg: oklch(0.975 0.009 80); --chart-bg: var(--bg); }

body.editorial .content { gap: 0; }

body.editorial .card {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  padding: 38px 0 34px;
  border-top: 1px solid var(--line);
}
/* hero keeps no top rule (it's first) and a touch more air */
body.editorial .hero { border-top: 0; padding-top: 10px; }
/* nor does Info: a one-card page, where the separator has nothing to separate –
   and its lone card leads its page, so it takes the hero's lead-card padding */
body.editorial .info { border-top: 0; padding-top: 10px; }

/* bigger, more authoritative serif section headings */
body.editorial .card-title { font-size: 30px; font-weight: 500; letter-spacing: -0.018em; }
body.editorial .card-sub { font-size: 14px; margin-top: 5px; }
body.editorial .card-head { margin-bottom: 22px; }

/* leadership is a top-level section – give it the same divider + rhythm as a
   .card so it sits as a peer of Primary vote / National direction */
body.editorial .leadership { border-top: 1px solid var(--line); padding: 38px 0 34px; }

/* two-column becomes two columns split by a VERTICAL rule, no card frames.
   No horizontal top rule – the section divider above "Leadership" already
   marks the boundary; an internal rule here would read as a false section break. */
body.editorial .two-col {
  gap: 0; padding: 0;
}
body.editorial .two-col .card { border-top: 0; padding-top: 0; padding-bottom: 0; }
body.editorial .two-col .card:first-child {
  padding-right: 40px; border-right: 1px solid var(--line);
}
body.editorial .two-col .card:last-child { padding-left: 40px; }
/* the vertical rule and its gutter belong to a SHARED row – once one side is
   collapsed the survivor is full-bleed and must not keep either */
body.editorial .lead-grid.lg-ppm .card:first-child { padding-right: 0; border-right: 0; }
body.editorial .lead-grid.lg-appr .card:last-child { padding-left: 0; }
/* …and the COLLAPSED side must not keep its gutter either: overflow:hidden
   clips content but not padding, which left a 40px sliver of empty card */
body.editorial .lead-grid.lg-ppm .card:last-child,
body.editorial .lead-grid.lg-appr .card:first-child {
  padding-left: 0; padding-right: 0; border-right: 0;
}

/* table reads as ledger: heavier top/bottom rules, airier rows */
body.editorial .poll-table th { border-bottom: 2px solid var(--ink-3); color: var(--ink-2); }
body.editorial .poll-table td { padding-top: 15px; padding-bottom: 15px; }
body.editorial .poll-table tbody tr:hover { background: var(--surface-2); }

/* legend / segmented keep a hairline so controls stay legible without cards */
body.editorial .method { border-top: 2px solid var(--ink-3); margin-top: 8px; padding-top: 30px; }
body.editorial .disclaimer { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 16px 0 0; text-align: left; font-size: 11.5px; color: var(--ink-3); }

.tweak-note {
  margin: -2px 0 4px; font-size: 11.5px; line-height: 1.45;
  color: var(--ink-3); font-family: var(--sans);
}

/* Must track the .two-col grid breakpoint above (1200px): the divider is
   vertical only while the panels sit side by side. Left at 900 it drew a
   vertical rule beside already-stacked cards from 901px to 1200px. */
@media (max-width: 1200px) {
  /* stacked: the two panels are SIBLINGS under Leadership, so their separator
     uses the lighter --line-2 hairline + tighter air – clearly subordinate to
     the full-strength --line section divider that sits above "Leadership". */
  body.editorial .two-col .card:first-child {
    padding-right: 0; border-right: 0; border-bottom: 1px solid var(--line-2); padding-bottom: 24px;
  }
  body.editorial .two-col .card:last-child { padding-left: 0; padding-top: 24px; }
}

/* ============================================================
   TABS – editorial section nav beneath the header
   ============================================================ */
/* Only a phone bar is too narrow to pin the full tab set around the docked
   2PP score, so only there does Info yield its place (the score clicks home,
   where the unpinned bar holds it) – and only once the score HAS docked: the
   hide rides .show-score, not the pin, so a pinned bar with the hero still on
   screen keeps its Info tab until the 2PP readout actually arrives to take
   the seat. A wide bar has room for the set AND the score, and nothing hides.
   Hiding applies even when Info is the ACTIVE tab: an active tab can never be
   clicked, and with the score docked it crowds the line into an overlap –
   better that the bar carry only the tabs that do something. The reader is
   undisturbed: the Info panel stays on screen, and a scroll back up restores
   the unpinned bar with its tab. */
@media (max-width: 640px) {
  .tabs.show-score .tab-pinhide { display: none; }
}
/* ---- the next-poll countdown in the tab bar ------------------------------
   Wide screens only. The countdown is absolutely seated in BOTH bar states
   so it can GLIDE between them: it docks to the right end (left:100% +
   translateX(-100%) - the same edge the flex row gave it) until the docked
   2PP score owns that end, then slides to the bar's centre. Score-in and
   ticker-to-centre are ONE swap, both gated on .show-score (the hero's 2PP
   block fully scrolled off - see Tabs in views.jsx), never on the pin: a
   pinned bar with the hero still on screen is unchanged, tabs left and
   countdown right. The glide is a SINGLE transition property: left stays
   100% and only the transform interpolates (-100% of itself -> -50% of
   itself - 50% of the container, cqw via .tabs-inner). An earlier
   left+transform pair put left on the layout thread and transform on the
   compositor, which raced in probes and jittered the first ~150ms; one
   transform interpolant keeps every frame on one clock. Out of flow in both
   seats, so the swap relayouts nothing. */
.tab-next { display: none; }
@media (min-width: 1100px) {
  .tab-next {
    display: inline-flex; align-items: baseline; gap: 14px;
    position: absolute; bottom: 0; left: 100%;
    transform: translateX(-100%);
    padding-bottom: 11px;
    font-family: var(--sans); font-size: 12px; white-space: nowrap;
    color: var(--ink-3);
    transition: transform .38s cubic-bezier(.22, 1, .36, 1);
  }
  .tabs.show-score .tab-next { transform: translateX(calc(-50% - 50cqw)); }
  /* an item past the measured budget parks rather than wraps: out of flow
     and hidden, but still rendered (and measurable), so the fit pass can
     bring it straight back the moment the bar has room for it again. The
     number of items on the bar is whatever fits, decided live. */
  .tn-item.tn-park { position: absolute; visibility: hidden; }
}
.tn-lab { font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--ink-faint); }
/* the label is also the jump down to the full panel on the snapshot - keep
   the label's quiet look, except the pointer and an underline on invite */
button.tn-jump { appearance: none; background: none; border: 0; margin: 0; padding: 0;
  font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer }
button.tn-jump:hover, button.tn-jump:focus-visible { text-decoration: underline;
  text-underline-offset: 2px; }
button.tn-jump:focus-visible { outline: 2px solid var(--accent, currentColor);
  outline-offset: 2px; border-radius: 2px; }
.tn-item { display: inline-flex; align-items: baseline; gap: 6px; }
.tn-firm { font-weight: 700; color: var(--ink-2); }
.tn-when { font-variant-numeric: tabular-nums; }
/* an unrecorded wave past its tolerance reads in the same alarm the panel's
   missed row carries */
.tn-overdue { color: var(--mood-neg); }
/* the name doubles as the out-link to where the house publishes - the same
   link the panel puts on the pollster name; the ↗ is the standing cue, as
   elsewhere */
a.tn-link { color: inherit; text-decoration: none; cursor: pointer; }
a.tn-link:hover, a.tn-link:focus-visible { text-decoration: underline; text-underline-offset: 2px; }
a.tn-link:focus-visible { outline: 2px solid var(--accent, currentColor); outline-offset: 2px; border-radius: 2px; }
a.tn-link:hover .plink-mark, a.tn-link:focus-visible .plink-mark { color: var(--ink-2); }
/* the hedge is quieter than the figure it qualifies, not the same weight */
.tn-maybe { color: var(--ink-faint); }

.tabs-sentinel { height: 0; margin: 0; padding: 0; pointer-events: none; }
.tabs {
  position: relative;
  /* flush under the masthead rule: the nav + its underline read as one banded
     unit with the masthead – labels sit equidistant between the two rules */
  margin: -26px -4px 26px;
  padding-inline: 4px;
  background: var(--bg);
}
/* full-bleed backdrop: the sticky bar's paint must reach the viewport edges so
   nothing in the side gutters can poke through beside it once pinned. The
   pseudo sits behind the bar and stretches from screen edge to screen edge. */
.tabs::before {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  background: var(--bg);
  z-index: 0;
}
/* the pinned lift-off shadow lives on its OWN full-bleed layer and fades via
   opacity – compositor-only; animating box-shadow itself repaints every frame */
.tabs::after {
  content: "";
  position: absolute; top: 0; bottom: 0;
  left: calc(-50vw + 50%); right: calc(-50vw + 50%);
  box-shadow: 0 10px 22px -16px color-mix(in oklch, var(--ink) 55%, transparent);
  opacity: 0; transition: opacity .3s ease;
  pointer-events: none; z-index: 0;
}
/* sticky on every view */
/* Pins below the notch so the labels stay readable, while its backdrop reaches
   up through the notch (see .tabs.pinned::before) - so the strip above the bar
   is the same frosted material rather than a flat band. */
.tabs.sticky { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 41; }
/* "caught the top" – lift the bar off the scrolling content.
   NOTE: the pinned state must NEVER change the bar's layout – the bar is
   sticky (in-flow), so any layout delta shifts the page under the scroll
   position and the pin oscillates. Condensing is therefore done ENTIRELY with
   a composited transform on .tabs-set: no reflow per frame (smooth on any
   thread), and no layout change at all (no oscillation risk). */
.tabs.pinned::after { opacity: 1; }
/* position/z-index keep the row painting above the full-bleed backdrop;
   overflow hides the docked score and its phone placeholder until they
   join (see .tab-score, .tab-glyph);
   container-type gives the next-poll countdown a cqw yardstick (see
   .tab-next) - the row's inline size is parent-set, so containment is free */
.tabs-inner {
  position: relative; z-index: 1;
  display: flex; align-items: flex-end;
  border-bottom: 1px solid var(--line);
  overflow: hidden;
  container-type: inline-size;
}
/* the tab set condenses as ONE unit – a single transform: scale() seated on
   the underline (origin left bottom), GPU-composited end to end */
.tabs-set {
  display: flex; gap: 30px; align-items: flex-end;
  transform-origin: left bottom;
  transition: transform .38s cubic-bezier(.22, 1, .36, 1);
}
.tabs.pinned .tabs-set { transform: scale(0.844); }   /* 16px → 13.5px */
body.editorial .tabs.pinned .tabs-set { transform: scale(0.789); } /* 19 → 15 */
@media (prefers-reduced-motion: reduce) {
  .tabs-set, .tabs::after, .tab-score, .tab-next, .tab-glyph { transition: none; }
}
.tab {
  position: relative; border: 0; background: none; cursor: pointer;
  padding: 12px 1px 12px; font-family: var(--sans);
  display: inline-flex; align-items: baseline; gap: 7px; white-space: nowrap;
  color: var(--ink-3); transition: color .15s ease;
}
.tab-label {
  font-family: "Crimson Text", var(--serif);
  font-size: 16px; font-weight: 600; letter-spacing: -0.005em;
  line-height: 19.5px;
}
.tab-note { font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tab:hover { color: var(--ink-2); }
.tab.active { color: var(--ink); }
.tab::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;
  background: var(--ink); border-radius: 2px 2px 0 0;
  transform: scaleX(0); transform-origin: left center; transition: transform .2s ease;
}
.tab.active::after { transform: scaleX(1); }
body.editorial .tab-label { font-family: var(--heads, var(--serif)); font-weight: 600; font-size: 19px; line-height: 23.5px; letter-spacing: -0.01em; }

/* narrow screens condense a touch further so the docked score clears the
   scaled tab set. The gap (and the shrunk phone bar below) lives HERE, after
   the base rules above - an earlier-authored copy of this rule lost that
   cascade and sat dead (so did the .tab-label sizes now revived here). The
   shrink is RESTING-ONLY: the stuck bar must keep its former size, and since
   .pinned may only ever re-scale (never re-lay out; see the .tabs.pinned
   note above), the pinned scales below are adjusted to cancel the resting
   base - 14.5 × 0.879 ≈ the old 16 × 0.8, 16 × 0.903 ≈ the old 19 × 0.76. */
@media (max-width: 640px) {
  .tabs { margin: -18px -4px 18px; }
  .tab { padding-block: 9px; }
  .tab-label { font-size: 14.5px; line-height: 18px; }
  body.editorial .tab-label { font-size: 16px; line-height: 19.5px; }
  .tabs-set { gap: 14px; }
  .tabs.pinned .tabs-set { transform: scale(0.879); }
  body.editorial .tabs.pinned .tabs-set { transform: scale(0.903); }
}

/* ============================================================
   VIEW SCAFFOLD (cycles + all polls)
   ============================================================ */
.view-intro { margin-bottom: 4px; }
.view-lede {
  font-family: var(--serif); font-size: 17px; line-height: 1.55; color: var(--ink-2);
  max-width: 64ch; margin: 0 0 18px; text-wrap: pretty;
}
.view-lede strong { color: var(--ink); font-weight: 600; }

/* ---------- Past cycles ---------- */
.cyc-controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
/* Download pair. .ap-export carries margin-left:auto for the archive's own
   layout, so it is reset here – inside this group the buttons sit together and
   the GROUP is what gets pushed right. */
.cyc-export { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.cyc-export .ap-export { margin-left: 0; }
.cyc-export-label {
  font-family: var(--sans); font-size: 11px; font-weight: 700;
  color: var(--ink-3); margin-right: 2px;
}
@media (max-width: 1000px) { .cyc-export { display: none; } }

.cyc-legend { margin: 20px 0 6px; }
.cyc-legend-row { display: flex; flex-wrap: wrap; gap: 7px; }
.cyc-chip {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 13px 6px 11px; cursor: pointer; font-family: var(--sans);
  color: var(--ink-2);
  transition: color .15s ease, border-color .15s ease, background-color .15s ease, opacity .15s ease;
}
.cyc-chip:hover { border-color: var(--ink-faint); }
.cyc-chip .cyc-swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; transition: transform .15s ease; }
/* A swatch borrows the shape of the term's dots when the chart is drawing
   them, so two Coalition terms in the same blue are told apart in the legend
   the same way they are told apart on the chart. clip-path over a second
   element: the swatch keeps one box, one colour and one transition, and the
   circle stays the default nothing has to opt into. The triangle is sized a
   little past the box for the same reason the dot is - inscribed, it reads
   smaller than the circle beside it. */
.cyc-chip .cyc-swatch.sw-triangle { border-radius: 0; width: 12px; height: 12px;
  clip-path: polygon(50% 2%, 100% 96%, 0 96%); }
.cyc-chip .cyc-swatch.sw-diamond { border-radius: 0; width: 12px; height: 12px;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
.cyc-chip .cyc-year { font-size: 13.5px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.cyc-chip .cyc-lead { font-size: 13px; font-weight: 500; color: var(--ink-3); }
.cyc-chip.off { opacity: 0.4; }
.cyc-chip.off .cyc-swatch { background: var(--ink-faint) !important; }
.cyc-chip.current {
  border-color: color-mix(in oklch, var(--cyc) 45%, var(--line));
  background: color-mix(in oklch, var(--cyc) 8%, var(--surface));
}
.cyc-chip.current:hover .cyc-swatch,
.cyc-chip:hover .cyc-swatch { transform: scale(1.18); }
.cyc-now {
  font-size: 10px; font-weight: 800;
  color: var(--cyc-text, var(--cyc)); border: 1px solid color-mix(in oklch, var(--cyc) 40%, var(--line));
  border-radius: 4px; padding: 1px 5px;
  /* Its own ground, not the chip's. The chip tints its background 8% toward
     the cycle's party, which on dark cost this badge ~1 point of contrast
     (4.3:1) even though the party colour itself clears the bar on plain
     surface. The badge is small, high-tracked type – it needs the headroom. */
  background: var(--surface);
}
.cyc-showall {
  margin-top: 10px; border: 0; background: none; cursor: pointer; font-family: var(--sans);
  font-size: 12.5px; font-weight: 600; color: var(--accent); padding: 2px 0;
}
.cyc-showall:hover { text-decoration: underline; }
/* One shared checkbox style for every optional overlay toggle: the hero's
   implied-2PP diagnostic and the past-cycles Hanson/One Nation lines. A
   page should never show two checkbox designs side by side. Deliberately
   quiet – an extra line on a chart, off by default. */
.pg-check {
  display: inline-flex; align-items: center; gap: 6px; margin: 7px 12px 0 0;
  font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--ink-3);
  cursor: pointer; user-select: none;
}
.pg-check:hover { color: var(--ink-3); }
/* the hero's Compare-implied switch renders a second copy under the chart
   legend for the phone (see the <=560px block, which shows this one and
   hides the copy inside the control strip). Everywhere else it is off */
.pg-check.pg-phone { display: none; }
.pg-check input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none;
  width: 13px; height: 13px; border: 1px solid var(--ink-faint); border-radius: 4px;
  background: var(--surface); cursor: pointer; position: relative;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.pg-check input:checked {
  background: linear-gradient(to bottom,
    color-mix(in oklch, white 15%, var(--accent)), var(--accent));
  border-color: color-mix(in oklch, black 14%, var(--accent));
}
/* Was two rotated borders — the only square-ended, mitred glyph on a site whose
   every other mark is a round-capped stroke. Now the site's own tick, masked so
   the shape is drawn once and the colour stays per-control. At this size its
   2.2 stroke lands at ~1.7px, the weight the border version was tuned to, so
   this changes the ends and the join and not the heft. */
.pg-check input:checked::after,
.ap-check.on .ap-tick::after {
  content: ""; position: absolute; inset: 0;
  -webkit-mask: var(--tick-glyph) center / 100% 100% no-repeat;
          mask: var(--tick-glyph) center / 100% 100% no-repeat;
}
.pg-check input:checked::after { background-color: var(--chart-bg); }
.pg-check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* cycle-chart checkboxes colour their label to the party once switched on;
   the hero diagnostic leaves its label neutral */
.cyc-han.on, .cyc-onp.on { color: var(--onp-text); }

.cyc-charts { display: flex; flex-direction: column; }
/* title block flexes to fill; the insight wraps below it (not behind it) once
   the two can no longer share a row – the title can never overlap the insight */
.cycle-head { align-items: baseline; }
.cycle-head > div { flex: 1 1 26ch; min-width: 0; }
.cycle-insight {
  font-family: var(--serif); font-size: 16.5px; font-weight: 600; line-height: 1.4;
  letter-spacing: -0.005em; color: var(--ink);
  max-width: 34ch; text-align: right; margin: 0; text-wrap: pretty;
}
.ci-delta { font-weight: 700; font-variant-numeric: tabular-nums; }
.ci-delta.pos { color: var(--mood-pos); }
.ci-delta.neg { color: var(--mood-neg); }
/* "in line with" is not a good or bad reading, so it takes the ink rather than
   the mood colours – emphasised, because it is still the finding */
.ci-delta.level { color: var(--ink); }
.cyc-foot {
  margin: 22px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--ink-3);
  font-family: var(--sans); max-width: 70ch; text-wrap: pretty;
}
/* in editorial mode the cycle charts divide like snapshot panels; first one
   already sits under the legend, so drop its top rule for a cleaner seam */
body.editorial .cyc-charts .cycle-card:first-child { border-top: 0; padding-top: 16px; }

/* ---------- All polls archive ---------- */
.ap-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 18px; flex-wrap: wrap; margin-bottom: 18px;
}
/* On a phone the facet tally rides up beside the view switch, where it reads
   as part of the heading; wider screens keep it down at the bar's end. */
.ap-head-side { display: inline-flex; align-items: center; gap: 14px; }
.ap-head-side .ap-count { display: none; }
@media (max-width: 560px) {
  .ap-head-side { width: 100%; }                 /* fill its line, so the tally can park at the far edge */
  .ap-head-side .ap-count { display: inline; margin-left: auto; }
  .ap-bar-end .ap-count { display: none; }
}
/* Jump-to links above the archive table: carry the visitor past the rows
   to the two diagnostic panels below it. The pill repeats .ap-export's
   shape on a separate class because export goes display:none ≤1000px (a
   desktop affordance) – the jumps matter most on a phone's long page. */
.ap-jumps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.ap-jump {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px;
  padding: 5px 13px; font-family: var(--sans); font-size: 12.5px; font-weight: 600;
  color: var(--ink-2); cursor: pointer; white-space: nowrap; align-self: center;
  transition: color .15s ease, border-color .15s ease, background-color .15s ease;
}
.ap-jump:hover { color: var(--ink); border-color: var(--ink-3); background: color-mix(in oklch, var(--ink) 7%, var(--surface)); }
.ap-jump svg { stroke: currentColor; }
/* jump targets get .next-polls' 72px clearance so the sticky tabs never
   swallow a panel title */
.ap-var, .ap-lean { scroll-margin-top: 72px; }
/* ---------- archive filter bar ---------- */
/* One row at rest. Search stays visible because it cuts across every facet;
   everything else is a button that names its own state and opens a panel of
   options with counts. What's on shows as pills underneath, so the bar never
   has to be read backwards to find out what is being applied. */
.ap-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.ap-bar .ap-search { flex: 1 1 190px; max-width: 300px; }
.ap-bar-end { margin-left: auto; display: inline-flex; align-items: center; gap: 14px; }
.ap-bar .ap-export { margin-left: 0; }
.ap-count { font-family: var(--sans); font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.ap-count strong { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }

/* 2PP's own pair: the lead control and the view's "With a 2PP" scope pill
   share one wrapper, but the wrapper never takes a box of its own – at
   every width it unfolds (display: contents) so the lead toggle flows in
   the bar's flex row right after Contains, wrapping onto the next line
   with the rest of the toggles on a phone. */
.ap-bar .ap-2line { display: contents; }

.ap-search {
  position: relative; display: inline-flex; align-items: center; max-width: 320px;
  color: var(--ink-3);
}
.ap-search svg { position: absolute; left: 12px; pointer-events: none; }
.ap-search input {
  width: 100%; font-family: var(--sans); font-size: 14px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
  padding: 9px 30px 9px 34px; transition: border-color .15s ease;
}
