<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2236"/>
      <stop offset="1" stop-color="#0b1d2c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <!-- The 1200x630 card sits in the vertical middle (y 285..915) so a centred
       1200x630 crop lands exactly on it. -->
  <g transform="translate(0,285)">
    <circle cx="120" cy="60" r="380" fill="#b08d39" opacity="0.07"/>
    <circle cx="1120" cy="120" r="300" fill="#a8252a" opacity="0.06"/>

    <text x="90" y="150" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="7" font-weight="700" fill="#c8a44f">AUSPOL&#160;TRACKER</text>

    <text x="86" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f6f1e8">The federal</text>
    <text x="86" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#f6f1e8">polling record</text>

    <text x="90" y="432" font-family="Georgia, serif" font-style="italic" font-size="29" fill="#c4cdd6">A continuing archive of Australian federal voting&#8211;intention</text>
    <text x="90" y="471" font-family="Georgia, serif" font-style="italic" font-size="29" fill="#c4cdd6">and leadership polling, cycle by cycle.</text>

    <rect x="90"  y="524" width="150" height="14" rx="3" fill="#d62828"/>
    <rect x="252" y="524" width="120" height="14" rx="3" fill="#1d3b73"/>
    <rect x="384" y="524" width="96"  height="14" rx="3" fill="#2c8a3a"/>
    <rect x="492" y="524" width="84"  height="14" rx="3" fill="#ec7a08"/>
    <text x="90" y="586" font-family="Helvetica, Arial, sans-serif" font-size="21" letter-spacing="2" fill="#8c98a4">Primary vote &#183; Two&#8211;party preferred &#183; Leadership &#183; Six elections</text>
  </g>
</svg>
