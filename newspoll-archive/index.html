  --bg: oklch(0.975 0.009 80);
  --ink: oklch(0.27 0.012 55);

  :root {
    --bg: oklch(0.205 0.010 65);

  background: var(--bg); color: var(--ink);

<script>

  ? "/archives/acnielsen/"
  : "/archives/newspoll/";
location.replace(dest);
